<!DOCTYPE html>
<html>
<head>
  <title>Time Sheet Login</title>
  <style>
    body {
      font-family: Arial;
      background: #8f9691;
      padding: 20px;
      margin: 0;
      color: #1f2a24;
    }

    .logo-wrap {
      max-width: 347px;
      margin: 0 auto 2px;
      text-align: center;
    }

    .logo-wrap img {
      width: 100%;
      max-width: 347px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    h2 {
      max-width: 460px;
      margin: 0 auto 5px;
      text-align: center;
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    .card {
      max-width: 460px;
      background: #fbfcf9;
      padding: 15px;
      margin: 0 auto 12px;
      border-radius: 8px;
      border-top: 4px solid #3f7d4d;
      box-shadow: 0 3px 10px rgba(0,0,0,0.18);
    }

    h3 {
      margin-top: 0;
      margin-bottom: 10px;
      color: #2f6f3c;
    }

    input, button {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      margin-bottom: 8px;
      box-sizing: border-box;
    }

    input {
      background: #f7f9f4;
      border: 1px solid #b8c2b2;
      border-radius: 5px;
    }

    input:focus {
      border-color: #3f7d4d;
      outline: 2px solid #d9ead5;
    }

    button {
      background: #3f7d4d;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      font-weight: bold;
    }

    button:hover {
      background: #315f3c;
    }
  </style>
</head>

<body>

<div class="logo-wrap">
  <img src="logo.png" alt="John Gordon Construction" />
</div>

<h2>Construction Time Sheet</h2>

<div class="card">
  <h3>Worker Login</h3>
  <input id="workerName" placeholder="Enter full name" onkeydown="submitOnEnter(event)" />
  <button type="button" onclick="signIn()">Sign In</button>
</div>

<script>
if (localStorage.getItem("currentWorker")) {
  window.location.href = "index.html";
}

function signIn() {
  const name = document.getElementById("workerName").value.trim();

  if (!name) {
    alert("Enter a name first");
    return;
  }

  localStorage.setItem("currentWorker", name);
  window.location.href = "index.html";
}

function submitOnEnter(event) {
  if (event.key === "Enter") {
    signIn();
  }
}
</script>

</body>
</html>
