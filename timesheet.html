<!DOCTYPE html>
<html>
<head>
  <title>Time Sheet App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: Arial;
      background: #8f9691;
      padding: 20px;
      margin: 0;
      color: #1f2a24;
    }

    .card {
      background: #fbfcf9;
      padding: 15px;
      margin-bottom: 12px;
      border-radius: 8px;
      border-top: 4px solid #3f7d4d;
      box-shadow: 0 3px 10px rgba(0,0,0,0.18);
    }

    .page-title,
    .form-card {
      max-width: 460px;
      margin-left: auto;
      margin-right: auto;
    }

    .logo-wrap {
      max-width: 347px;
      margin: 0 auto 2px;
      text-align: center;
    }

    .logo-wrap img {
      width: 100%;
      max-width: 347px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .entries-card {
      max-width: 1100px;
      margin-left: auto;
      margin-right: auto;
    }

    .user-bar {
      max-width: 460px;
      margin: 0 auto 12px;
      color: #ffffff;
      text-align: center;
      font-size: 13px;
      font-weight: bold;
      text-shadow: 0 1px 2px rgba(0,0,0,0.25);
    }

    .sign-out {
      width: auto;
      padding: 5px 10px;
      margin-left: 8px;
      margin-bottom: 0;
      background: #5f6a62;
      font-size: 12px;
    }

    .sign-out:hover {
      background: #48514a;
    }

    .home-button {
      width: auto;
      padding: 5px 10px;
      margin-left: 8px;
      margin-bottom: 0;
      background: #5f6a62;
      font-size: 12px;
    }

    .home-button:hover {
      background: #48514a;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 5px;
      text-align: center;
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    h3 {
      margin-top: 0;
      margin-bottom: 10px;
      color: #2f6f3c;
    }

    label {
      font-size: 13px;
      font-weight: bold;
    }

    input, button, select {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      margin-bottom: 8px;
      box-sizing: border-box;
    }

    input, select {
      background: #f7f9f4;
      border: 1px solid #b8c2b2;
      border-radius: 5px;
    }

    input:focus, select:focus {
      border-color: #3f7d4d;
      outline: 2px solid #d9ead5;
    }

    button {
      background: #3f7d4d;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      font-weight: bold;
    }

    button:hover {
      background: #315f3c;
    }

    .small {
      font-size: 12px;
      color: #666;
    }

    .status {
      min-height: 18px;
      margin-top: 4px;
      font-size: 13px;
      color: #2f6f3c;
      font-weight: bold;
    }

    .table-wrap {
      overflow-x: auto;
      margin-top: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 860px;
      background: #ffffff;
    }

    th, td {
      border: 1px solid #c5cec1;
      padding: 10px;
      text-align: center;
      vertical-align: middle;
    }

    th {
      background: #dfe9da;
      color: #1f3d28;
      font-weight: bold;
    }

    tbody tr:nth-child(even) {
      background: #f4f7f1;
    }

    td:first-child,
    td:nth-child(2),
    th:first-child,
    th:nth-child(2) {
      text-align: left;
    }

    .empty-cell {
      color: #999;
    }

    .email-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .email-actions button {
      width: auto;
      min-width: 140px;
      margin: 0;
    }

    .email-note {
      font-size: 13px;
      color: #3f4a42;
      font-weight: bold;
    }

    .edit-table-wrap {
      max-width: 360px;
    }

    .edit-table {
      min-width: 0;
      width: 100%;
    }

    .edit-table th,
    .edit-table td {
      padding: 6px;
      font-size: 12px;
    }

    .check-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin: 4px 0 10px;
      font-size: 13px;
      font-weight: bold;
    }

    .check-row input {
      width: auto;
      margin: 0;
    }

    .edit-button {
      width: auto;
      min-width: 72px;
      padding: 6px 10px;
      margin: 0;
      font-size: 12px;
    }

    .cancel-edit {
      display: none;
      background: #5f6a62;
    }

    .tab-buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .tab-buttons button {
      width: auto;
      margin: 0;
      padding: 7px 12px;
      background: #5f6a62;
    }

    .tab-buttons button.active-tab {
      background: #3f7d4d;
    }

    .previous-week {
      margin-top: 14px;
    }

    @media (max-width: 720px) {
      body {
        padding: 10px;
      }

      .card {
        padding: 12px;
      }

      .logo-wrap {
        max-width: 260px;
      }

      h2 {
        font-size: 22px;
      }

      input, button, select {
        min-height: 42px;
        font-size: 16px;
      }

      .sign-out,
      .edit-button {
        min-height: 34px;
        font-size: 13px;
      }

      .tab-buttons,
      .email-actions {
        display: grid;
        grid-template-columns: 1fr;
      }

      .tab-buttons button,
      .email-actions button {
        width: 100%;
      }

      .email-note {
        text-align: center;
      }

      .table-wrap {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      table {
        min-width: 520px;
      }

      th, td {
        padding: 3px;
        font-size: 10px;
      }

      .edit-table-wrap {
        max-width: 360px;
      }

      .edit-table th,
      .edit-table td {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

<div class="logo-wrap">
  <img src="logo.png" alt="John Gordon Construction" />
</div>

<h2 class="page-title">Construction Time Sheet</h2>

<div id="currentUser" class="user-bar"></div>

<div class="card form-card">
  <h3>Submit Time Entry</h3>

  <label>Week Date</label>
  <input
    type="date"
    id="weekStart"
    onchange="validateSunday(this)"
  />

  <div id="weekDisplay" class="small"></div>

  <label>Day of Week</label>
  <select id="day">
    <option value="">Select Day</option>
    <option>Sunday</option>
    <option>Monday</option>
    <option>Tuesday</option>
    <option>Wednesday</option>
    <option>Thursday</option>
    <option>Friday</option>
    <option>Saturday</option>
  </select>

  <input
    id="jobName"
    placeholder="Job Name"
    list="jobNameOptions"
    onchange="fillJobNumberForSelectedJob()"
    oninput="fillJobNumberForSelectedJob()"
  />
  <datalist id="jobNameOptions"></datalist>
  <input id="jobNumber" placeholder="Job Number (optional)" />

  <label>Time In</label>
  <select id="timeIn">
    <option value="">Select Time In</option>
  </select>

  <label class="check-row">
    <input id="tookLunch" type="checkbox" />
    Did you take Lunch? This will subtract 30 minutes from this input only
  </label>

  <label>Time Out</label>
  <select id="timeOut">
    <option value="">Select Time Out</option>
  </select>

  <label class="check-row">
    <input id="nightWork" type="checkbox" />
    Night Work
  </label>

  <button id="submitButton" type="button" onclick="submitTime()">Submit Entry</button>
  <button id="cancelEditButton" class="cancel-edit" type="button" onclick="cancelEdit()">Cancel Edit</button>
  <div id="submitStatus" class="status"></div>
</div>

<div class="card entries-card">
  <h3>Submitted Entries</h3>
  <div class="tab-buttons">
    <button id="currentTabButton" class="active-tab" type="button" onclick="showEntriesTab('current')">Current Week</button>
    <button id="previousTabButton" type="button" onclick="showEntriesTab('previous')">Previous Weeks</button>
  </div>
  <button type="button" onclick="clearEntries()">Clear My Entries</button>
  <button type="button" onclick="loadTimesheetsFromSupabase()">Refresh Entries</button>
  <div id="entries"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://xnrljkkszoimegfivlya.supabase.co";
const SUPABASE_KEY = "sb_publishable_k_m_R-jzMnsnHhNY_OHwJA_cbO1qO58";
const TIMESHEET_EMAIL_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxSW9gOO44n6eMaZyQwB-pXWmkEgbUNeSAxa6jbrTM5c_7ZgSD6RRrbO7YkFuqQl_-4/exec";
const supabaseClient = window.supabase
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
  : null;

let currentUser = normalizeWorkerName(localStorage.getItem("currentWorker"));
let currentUserDisplay = localStorage.getItem("currentWorkerDisplay") || localStorage.getItem("currentWorker");
let memoryTimesheets = [];
let editingEntryId = null;
let entriesTab = "current";
let previousWeeks = [];

if (!currentUser) {
  window.location.href = "index.html";
} else {
  localStorage.setItem("currentWorker", currentUser);
}

function showCurrentUser() {
  document.getElementById("currentUser").innerHTML =
    'Signed in as: ' + escapeHtml(currentUserDisplay || currentUser) +
    ' <button type="button" class="home-button" onclick="goHome()">Home</button>' +
    ' <button type="button" class="sign-out" onclick="signOut()">Sign Out</button>';
}

function goHome() {
  window.location.href = "home.html";
}

function signOut() {
  localStorage.removeItem("currentWorker");
  localStorage.removeItem("currentWorkerDisplay");
  window.location.href = "index.html";
}

function makeLocalDate(dateString) {
  const parts = dateString.split("-");
  return new Date(parts[0], parts[1] - 1, parts[2]);
}

function formatDateValue(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");

  return year + "-" + month + "-" + day;
}

function validateSunday(input) {
  if (!input.value) {
    document.getElementById("weekDisplay").innerText = "";
    updateJobSuggestions();
    return;
  }

  const date = makeLocalDate(input.value);
  const weekStart = new Date(date);
  weekStart.setDate(date.getDate() - date.getDay());
  input.value = formatDateValue(weekStart);

  const weekEnd = new Date(weekStart);
  weekEnd.setDate(weekStart.getDate() + 6);

  document.getElementById("weekDisplay").innerText =
    "Week: " + formatDate(weekStart) + " -> " + formatDate(weekEnd);

  updateJobSuggestions();
  fillJobNumberForSelectedJob();
}

function formatDate(date) {
  return date.toLocaleDateString("en-CA", {
    year: "numeric",
    month: "short",
    day: "numeric"
  });
}

function calculateHours(inTime, outTime, tookLunch) {
  const start = new Date("1970-01-01T" + inTime + ":00");
  const end = new Date("1970-01-01T" + outTime + ":00");

  let diff = (end - start) / 1000 / 60 / 60;

  if (diff < 0) diff += 24;

  if (tookLunch) diff -= 0.5;
  if (diff < 0) diff = 0;

  return diff.toFixed(2);
}

function formatTimeOption(hour, minute) {
  return String(hour).padStart(2, "0") + ":" + String(minute).padStart(2, "0");
}

function fillTimeOptions() {
  const timeInputs = [
    document.getElementById("timeIn"),
    document.getElementById("timeOut")
  ];

  for (let input of timeInputs) {
    const placeholder = input.id === "timeIn" ? "Select Time In" : "Select Time Out";
    let options = '<option value="">' + placeholder + '</option>';

    for (let hour = 0; hour < 24; hour++) {
      options += '<option value="' + formatTimeOption(hour, 0) + '">' + formatTimeOption(hour, 0) + '</option>';
      options += '<option value="' + formatTimeOption(hour, 30) + '">' + formatTimeOption(hour, 30) + '</option>';
    }

    input.innerHTML = options;
  }
}

function isHalfHourTime(time) {
  return /^\d{2}:\d{2}$/.test(time) && (time.endsWith(":00") || time.endsWith(":30"));
}

function loadFallbackTimesheets() {
  try {
    const saved = JSON.parse(localStorage.getItem("timesheets") || "[]");
    if (!Array.isArray(saved)) {
      return [];
    }

    return saved.filter(function(entry) {
      return normalizeWorkerName(entry.user) === normalizeWorkerName(currentUser);
    });
  } catch (error) {
    try {
      localStorage.removeItem("timesheets");
    } catch (removeError) {
      return memoryTimesheets;
    }

    return memoryTimesheets;
  }
}

function saveFallbackTimesheets(entries) {
  try {
    localStorage.setItem("timesheets", JSON.stringify(entries));
  } catch (error) {
    return false;
  }

  return true;
}

function loadTimesheets() {
  return memoryTimesheets.filter(function(entry) {
    return normalizeWorkerName(entry.user) === normalizeWorkerName(currentUser);
  });
}

function setTimesheets(entries) {
  memoryTimesheets = entries;
  saveFallbackTimesheets(mergeFallbackTimesheets(entries));
}

function normalizeWorkerName(name) {
  return String(name || "").trim().toLowerCase();
}

function mergeFallbackTimesheets(currentWorkerEntries) {
  const otherWorkerEntries = loadAllFallbackTimesheets().filter(function(entry) {
    return normalizeWorkerName(entry.user) !== normalizeWorkerName(currentUser);
  });

  return otherWorkerEntries.concat(currentWorkerEntries);
}

function loadAllFallbackTimesheets() {
  try {
    const saved = JSON.parse(localStorage.getItem("timesheets") || "[]");
    return Array.isArray(saved) ? saved : [];
  } catch (error) {
    return [];
  }
}

function rowToEntry(row) {
  return {
    id: row.id,
    user: row.worker_name,
    weekStartValue: row.week_start,
    weekStart: formatDate(makeLocalDate(row.week_start)),
    weekEnd: row.week_end,
    jobName: row.job_name,
    jobNumber: row.job_number,
    day: row.day_of_week,
    timeIn: String(row.time_in).slice(0, 5),
    timeOut: String(row.time_out).slice(0, 5),
    hours: Number(row.hours).toFixed(2),
    tookLunch: Boolean(row.took_lunch),
    nightWork: Boolean(row.night_work)
  };
}

function entryToRow(entry) {
  return {
    worker_name: entry.user,
    week_start: entry.weekStartValue,
    week_end: entry.weekEnd,
    job_name: entry.jobName,
    job_number: entry.jobNumber,
    day_of_week: entry.day,
    time_in: entry.timeIn,
    time_out: entry.timeOut,
    hours: Number(entry.hours),
    took_lunch: Boolean(entry.tookLunch),
    night_work: Boolean(entry.nightWork)
  };
}

async function loadTimesheetsFromSupabase() {
  const status = document.getElementById("submitStatus");

  if (!supabaseClient) {
    setTimesheets(loadFallbackTimesheets());
    status.innerText = "Using browser storage until Supabase loads.";
    render();
    updateJobSuggestions();
    return;
  }

  status.innerText = "Loading saved entries...";

  const { data, error } = await supabaseClient
    .from("timesheet_entries")
    .select("*")
    .eq("worker_name", currentUser)
    .order("created_at", { ascending: true });

  if (error) {
    setTimesheets(loadFallbackTimesheets());
    status.innerText = "Could not reach Supabase. Using browser storage for now.";
    render();
    updateJobSuggestions();
    return;
  }

  setTimesheets((data || []).map(rowToEntry));
  status.innerText = "";
  render();
  updateJobSuggestions();
}

async function loadPreviousWeeksFromSupabase() {
  if (!supabaseClient) {
    previousWeeks = loadFallbackPreviousWeeks();
    render();
    return;
  }

  const { data, error } = await supabaseClient
    .from("previous_timesheet_weeks")
    .select("*")
    .eq("worker_name", currentUser)
    .order("submitted_at", { ascending: false });

  if (error) {
    previousWeeks = loadFallbackPreviousWeeks();
    render();
    return;
  }

  previousWeeks = (data || []).map(function(week) {
    return {
      id: week.id,
      workerName: week.worker_name,
      weekLabel: week.week_label,
      entries: Array.isArray(week.entries) ? week.entries : [],
      totalHours: Number(week.total_hours),
      note: week.note || "",
      submittedAt: week.submitted_at
    };
  }).sort(sortPreviousWeeksByDate).slice(0, 3);

  saveFallbackPreviousWeeks(previousWeeks);
  render();
}

function loadFallbackPreviousWeeks() {
  try {
    const saved = JSON.parse(localStorage.getItem("previousTimesheetWeeks") || "[]");

    if (!Array.isArray(saved)) {
      return [];
    }

    return saved.filter(function(week) {
      return normalizeWorkerName(week.workerName) === normalizeWorkerName(currentUser);
    }).sort(sortPreviousWeeksByDate).slice(0, 3);
  } catch (error) {
    return [];
  }
}

function saveFallbackPreviousWeeks(weeks) {
  const otherWorkers = loadAllFallbackPreviousWeeks().filter(function(week) {
    return normalizeWorkerName(week.workerName) !== normalizeWorkerName(currentUser);
  });
  const currentWorkerWeeks = weeks.slice(0, 3);

  localStorage.setItem("previousTimesheetWeeks", JSON.stringify(otherWorkers.concat(currentWorkerWeeks)));
}

function loadAllFallbackPreviousWeeks() {
  try {
    const saved = JSON.parse(localStorage.getItem("previousTimesheetWeeks") || "[]");
    return Array.isArray(saved) ? saved : [];
  } catch (error) {
    return [];
  }
}

function getPreviousWeekStartTime(week) {
  const firstEntry = week.entries && week.entries[0];
  const dateText = firstEntry && firstEntry.weekStartValue
    ? firstEntry.weekStartValue
    : String(week.weekLabel || "").split(" to ")[0];
  const time = new Date(dateText).getTime();

  return Number.isNaN(time) ? 0 : time;
}

function sortPreviousWeeksByDate(a, b) {
  return getPreviousWeekStartTime(b) - getPreviousWeekStartTime(a);
}

function showEntriesTab(tabName) {
  entriesTab = tabName;
  document.getElementById("currentTabButton").classList.toggle("active-tab", tabName === "current");
  document.getElementById("previousTabButton").classList.toggle("active-tab", tabName === "previous");

  if (tabName === "previous") {
    loadPreviousWeeksFromSupabase();
  } else {
    render();
  }
}

function getSelectedWeekStart() {
  return document.getElementById("weekStart").value;
}

function getJobsForSelectedWeek() {
  const selectedWeekStart = getSelectedWeekStart();

  if (!selectedWeekStart) {
    return [];
  }

  const selectedWeekLabel = formatDate(makeLocalDate(selectedWeekStart));
  const jobs = {};

  for (let entry of loadTimesheets()) {
    const entryWeekStart = entry.weekStartValue || entry.weekStart;

    if (entryWeekStart !== selectedWeekStart && entryWeekStart !== selectedWeekLabel) {
      continue;
    }

    const key = entry.jobName.toLowerCase() + "|" + entry.jobNumber;

    if (!jobs[key]) {
      jobs[key] = {
        jobName: entry.jobName,
        jobNumber: entry.jobNumber
      };
    }
  }

  return Object.values(jobs).sort(function(a, b) {
    return a.jobName.localeCompare(b.jobName);
  });
}

function updateJobSuggestions() {
  const options = getJobsForSelectedWeek().map(function(job) {
    return '<option value="' + escapeHtml(job.jobName) + '" label="#' + escapeHtml(job.jobNumber) + '"></option>';
  }).join("");

  document.getElementById("jobNameOptions").innerHTML = options;
}

function fillJobNumberForSelectedJob() {
  const jobName = document.getElementById("jobName").value.trim().toLowerCase();
  const jobNumberInput = document.getElementById("jobNumber");

  if (!jobName) {
    return;
  }

  const match = getJobsForSelectedWeek().find(function(job) {
    return job.jobName.toLowerCase() === jobName;
  });

  if (match) {
    jobNumberInput.value = match.jobNumber;
  }
}

function resetTimeEntryFields() {
  document.getElementById("jobName").value = "";
  document.getElementById("jobNumber").value = "";
  document.getElementById("day").value = "";
  document.getElementById("timeIn").value = "";
  document.getElementById("timeOut").value = "";
  document.getElementById("tookLunch").checked = false;
  document.getElementById("nightWork").checked = false;
}

function setEditMode(entry) {
  editingEntryId = entry.id;
  document.getElementById("submitButton").innerText = "Update Entry";
  document.getElementById("cancelEditButton").style.display = "block";
  document.getElementById("submitStatus").innerText = "Editing saved entry.";
}

function clearEditMode() {
  editingEntryId = null;
  document.getElementById("submitButton").innerText = "Submit Entry";
  document.getElementById("cancelEditButton").style.display = "none";
}

function cancelEdit() {
  clearEditMode();
  resetTimeEntryFields();
  document.getElementById("submitStatus").innerText = "";
}

function editEntry(entryId) {
  const entry = loadTimesheets().find(function(item) {
    return item.id === entryId;
  });

  if (!entry) {
    alert("Could not find that entry.");
    return;
  }

  document.getElementById("weekStart").value = entry.weekStartValue;
  validateSunday(document.getElementById("weekStart"));
  document.getElementById("day").value = entry.day;
  document.getElementById("jobName").value = entry.jobName;
  document.getElementById("jobNumber").value = entry.jobNumber;
  document.getElementById("timeIn").value = entry.timeIn;
  document.getElementById("timeOut").value = entry.timeOut;
  document.getElementById("tookLunch").checked = Boolean(entry.tookLunch);
  document.getElementById("nightWork").checked = Boolean(entry.nightWork);
  setEditMode(entry);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function replaceStoredEntry(entries, updatedEntry) {
  return entries.map(function(entry) {
    return entry.id === updatedEntry.id ? updatedEntry : entry;
  });
}

async function submitTime() {
  if (!currentUser) {
    alert("You must sign in first");
    return;
  }

  const weekStart = document.getElementById("weekStart").value;
  const jobName = document.getElementById("jobName").value.trim();
  const jobNumber = document.getElementById("jobNumber").value.trim();
  const day = document.getElementById("day").value;
  const timeIn = document.getElementById("timeIn").value;
  const timeOut = document.getElementById("timeOut").value;
  const tookLunch = document.getElementById("tookLunch").checked;
  const nightWork = document.getElementById("nightWork").checked;

  if (!weekStart || !jobName || !day || !timeIn || !timeOut) {
    alert("Fill in all fields");
    return;
  }

  if (!isHalfHourTime(timeIn) || !isHalfHourTime(timeOut)) {
    alert("Time In and Time Out must be in 30 minute intervals.");
    return;
  }

  const startDate = makeLocalDate(weekStart);
  const endDate = new Date(startDate);
  endDate.setDate(startDate.getDate() + 6);

  const entry = {
    user: currentUser,
    weekStartValue: weekStart,
    weekStart: formatDate(startDate),
    weekEnd: formatDate(endDate),
    jobName,
    jobNumber,
    day,
    timeIn,
    timeOut,
    hours: calculateHours(timeIn, timeOut, tookLunch),
    tookLunch,
    nightWork
  };

  const status = document.getElementById("submitStatus");
  let stored = loadTimesheets();
  status.innerText = editingEntryId ? "Updating entry..." : "Saving entry...";

  if (editingEntryId) {
    entry.id = editingEntryId;

    if (supabaseClient) {
      const { data, error } = await supabaseClient
        .from("timesheet_entries")
        .update(entryToRow(entry))
        .eq("id", editingEntryId)
        .eq("worker_name", currentUser)
        .select()
        .single();

      if (error) {
        status.innerText = "Could not update this Supabase entry.";
        return;
      }

      setTimesheets(replaceStoredEntry(stored, rowToEntry(data)));
    } else {
      setTimesheets(replaceStoredEntry(stored, entry));
    }

    clearEditMode();
    resetTimeEntryFields();
    status.innerText = "Entry updated.";
    updateJobSuggestions();
    render();
    return;
  }

  if (supabaseClient) {
    const { data, error } = await supabaseClient
      .from("timesheet_entries")
      .insert(entryToRow(entry))
      .select()
      .single();

    if (error) {
      stored.push(entry);
      saveFallbackTimesheets(mergeFallbackTimesheets(stored));
      status.innerText = "Entry saved in this browser only. Supabase save failed.";
    } else {
      stored.push(rowToEntry(data));
      setTimesheets(stored);
      status.innerText = "Entry submitted.";
    }
  } else {
    stored.push(entry);
    saveFallbackTimesheets(mergeFallbackTimesheets(stored));
    status.innerText = "Entry submitted for this browser session.";
  }

  updateJobSuggestions();
  resetTimeEntryFields();
  render();
}

async function clearEntries() {
  if (!currentUser) {
    alert("You must sign in first");
    return;
  }

  const confirmed = confirm("Clear all entries for " + getDisplayWorkerName() + "?");

  if (!confirmed) {
    return;
  }

  const status = document.getElementById("submitStatus");
  status.innerText = "Clearing your entries...";

  if (supabaseClient) {
    const { error } = await supabaseClient
      .from("timesheet_entries")
      .delete()
      .eq("worker_name", currentUser);

    if (error) {
      status.innerText = "Could not clear your Supabase entries.";
      return;
    }
  }

  memoryTimesheets = [];
  saveFallbackTimesheets(mergeFallbackTimesheets([]));

  try {
    localStorage.setItem("timesheets", JSON.stringify(mergeFallbackTimesheets([])));
  } catch (error) {
  }

  status.innerText = "Your entries were cleared.";
  render();
  updateJobSuggestions();
}

async function emailEntries() {
  const entries = loadTimesheets();

  if (entries.length === 0) {
    alert("No entries to email yet.");
    return;
  }

  const note = prompt("Add a note to your timesheet? Leave blank if no note is needed.", "");

  if (note === null) {
    return;
  }

  const confirmed = confirm("Submit this timesheet? This will save it to Previous Weeks and reset the current week.");

  if (!confirmed) {
    return;
  }

  const weekLabel = getWeekLabel(entries);
  const subject = "Timesheet - " + getDisplayWorkerName() + " - " + weekLabel;
  const totalHours = getTotalHours(entries);
  const body = buildTimesheetEmailBody(entries, weekLabel, totalHours, note.trim());
  const archiveResult = await archiveCurrentEntries(entries, totalHours, weekLabel, note.trim());

  if (archiveResult.warning) {
    alert(archiveResult.warning);
  }

  await sendTimesheetEmail(subject, body, weekLabel);
}

function buildTimesheetEmailBody(entries, weekLabel, totalHours, note) {
  const lines = [
    "Worker: " + getDisplayWorkerName(),
    "Week: " + weekLabel,
    "",
    "Timesheet Entries:",
    ""
  ];

  const dayGroups = getEntriesByEmailDay(entries);

  for (let group of dayGroups) {
    lines.push(group.day);
    lines.push(group.table.header);
    lines.push(group.table.divider);

    for (let row of group.table.rows) {
      lines.push(row);
    }

    lines.push("");
    lines.push("");
  }

  lines.push("Total Hours: " + totalHours.toFixed(2));

  if (note) {
    lines.push("");
    lines.push("Note:");
    lines.push(note);
  }

  return lines.join("\n");
}

async function resubmitPreviousWeek(index) {
  const week = previousWeeks[index];

  if (!week || !Array.isArray(week.entries) || week.entries.length === 0) {
    alert("This previous week has no entries to resubmit.");
    return;
  }

  const confirmed = confirm("Resubmit this saved week by email?");

  if (!confirmed) {
    return;
  }

  const totalHours = Number(week.totalHours || getTotalHours(week.entries));
  const subject = "Timesheet - " + getDisplayWorkerName() + " - " + week.weekLabel;
  const body = buildTimesheetEmailBody(week.entries, week.weekLabel, totalHours, week.note || "");

  await sendTimesheetEmail(subject, body, week.weekLabel);
}

function openTimesheetMailto(subject, body) {
  window.location.href =
    "mailto:zeth@johngordonconstruction.com" +
    "?subject=" + encodeURIComponent(subject) +
    "&body=" + encodeURIComponent(body);
}

async function sendTimesheetEmail(subject, body, weekLabel) {
  const status = document.getElementById("submitStatus");

  if (status) {
    status.innerText = "Sending timesheet email...";
  }

  if (!TIMESHEET_EMAIL_SCRIPT_URL) {
    alert("Automatic email sending is not set up yet. Your email app will open instead.");
    openTimesheetMailto(subject, body);
    return;
  }

  try {
    await fetch(TIMESHEET_EMAIL_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        subject,
        body,
        text: body,
        worker: getDisplayWorkerName(),
        weekLabel
      })
    });

    if (status) {
      status.innerText = "Timesheet email sent.";
    }

    alert("Timesheet email sent.");
  } catch (error) {
    alert("Automatic email could not be sent. Your email app will open instead.");
    openTimesheetMailto(subject, body);
  }
}

async function sendTimesheetEmailWithSupabase(subject, body, weekLabel) {
  if (!supabaseClient) {
    openTimesheetMailto(subject, body);
    return;
  }

  const { error } = await supabaseClient.functions.invoke("send-timesheet-email", {
    body: {
      subject,
      text: body,
      worker: getDisplayWorkerName(),
      weekLabel
    }
  });

  if (error) {
    openTimesheetMailto(subject, body);
  }
}

async function archiveCurrentEntries(entries, totalHours, weekLabel, note) {
  const archiveRecord = {
    workerName: currentUser,
    weekLabel,
    entries,
    totalHours,
    note,
    submittedAt: new Date().toISOString()
  };
  let warning = "";

  if (supabaseClient) {
    const { error: insertError } = await supabaseClient
      .from("previous_timesheet_weeks")
      .insert({
        worker_name: currentUser,
        week_label: weekLabel,
        entries,
        total_hours: totalHours,
        note
      });

    if (insertError) {
      warning = "The email will open, but this week could not be saved online to Previous Weeks. It was saved on this phone/browser only.";
    } else {
      const { data: archives, error: archiveError } = await supabaseClient
        .from("previous_timesheet_weeks")
        .select("id, week_label, entries")
        .eq("worker_name", currentUser);

      if (!archiveError && archives && archives.length > 3) {
        const oldIds = archives.sort(sortPreviousWeeksByDate).slice(3).map(function(archive) {
          return archive.id;
        });

        await supabaseClient
          .from("previous_timesheet_weeks")
          .delete()
          .in("id", oldIds);
      }
    }

    const { error: deleteError } = await supabaseClient
      .from("timesheet_entries")
      .delete()
      .eq("worker_name", currentUser);

    if (deleteError) {
      warning = warning || "The email will open, but the current week could not be reset online. Please refresh and use Clear My Entries if the entries still show.";
    }
  }

  previousWeeks = [archiveRecord].concat(previousWeeks).sort(sortPreviousWeeksByDate).slice(0, 3);
  saveFallbackPreviousWeeks(previousWeeks);
  memoryTimesheets = [];
  saveFallbackTimesheets(mergeFallbackTimesheets([]));
  clearEditMode();
  resetTimeEntryFields();
  entriesTab = "previous";
  document.getElementById("currentTabButton").classList.remove("active-tab");
  document.getElementById("previousTabButton").classList.add("active-tab");
  render();
  updateJobSuggestions();
  return {
    success: true,
    warning
  };
}

function getTotalHours(entries) {
  return entries.reduce(function(total, entry) {
    return total + Number(entry.hours);
  }, 0);
}

function getDisplayWorkerName() {
  return currentUserDisplay || currentUser;
}

function getWeekLabel(entries) {
  const weeks = [];

  for (let entry of entries) {
    const label = entry.weekStart + " to " + entry.weekEnd;

    if (!weeks.includes(label)) {
      weeks.push(label);
    }
  }

  return weeks.length === 1 ? weeks[0] : "Multiple Weeks";
}

function getEmailDayOrder() {
  return ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
}

function sortEntriesForEmail(entries) {
  const dayOrder = getEmailDayOrder();

  return entries.slice().sort(function(a, b) {
    const dayDifference = dayOrder.indexOf(a.day) - dayOrder.indexOf(b.day);

    if (dayDifference !== 0) {
      return dayDifference;
    }

    const jobDifference = a.jobName.localeCompare(b.jobName);

    if (jobDifference !== 0) {
      return jobDifference;
    }

    return a.timeIn.localeCompare(b.timeIn);
  });
}

function getEntriesByEmailDay(entries) {
  const sortedEntries = sortEntriesForEmail(entries);

  return getEmailDayOrder().map(function(day) {
    const dayEntries = sortedEntries.filter(function(entry) {
      return entry.day === day;
    });

    if (dayEntries.length === 0) {
      return null;
    }

    return {
      day,
      entries: dayEntries,
      table: getEmailTableRows(dayEntries)
    };
  }).filter(Boolean);
}

function padCell(value, width) {
  const text = String(value);

  if (text.length > width) {
    return text.slice(0, width - 1) + ".";
  }

  return text + " ".repeat(width - text.length);
}

function getEmailTableRows(entries) {
  const columns = [
    { label: "Job", width: 24 },
    { label: "Job #", width: 10 },
    { label: "Lunch", width: 7 },
    { label: "Night", width: 7 },
    { label: "Time", width: 13 },
    { label: "Hours", width: 6 }
  ];

  const header = columns.map(function(column) {
    return padCell(column.label, column.width);
  }).join(" | ");

  const divider = columns.map(function(column) {
    return "-".repeat(column.width);
  }).join("-+-");

  const rows = entries.map(function(entry) {
    const values = [
      entry.jobName,
      entry.jobNumber,
      entry.tookLunch ? "Yes" : "No",
      entry.nightWork ? "Yes" : "No",
      entry.timeIn + "-" + entry.timeOut,
      Number(entry.hours).toFixed(2)
    ];

    return values.map(function(value, index) {
      return padCell(value, columns[index].width);
    }).join(" | ");
  });

  return {
    header,
    divider,
    rows
  };
}

function renderEditRows(entries) {
  const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

  return entries.slice().sort(function(a, b) {
    const dayDifference = days.indexOf(a.day) - days.indexOf(b.day);

    if (dayDifference !== 0) {
      return dayDifference;
    }

    const jobDifference = a.jobName.localeCompare(b.jobName);

    if (jobDifference !== 0) {
      return jobDifference;
    }

    return a.timeIn.localeCompare(b.timeIn);
  }).map(function(entry) {
    return `
      <tr>
        <td data-label="Day">${escapeHtml(entry.day)}</td>
        <td data-label="Job Name">${escapeHtml(entry.jobName)}</td>
        <td data-label="Job Number">${escapeHtml(entry.jobNumber)}</td>
        <td data-label="Edit"><button type="button" class="edit-button" onclick="editEntry('${escapeHtml(entry.id)}')">Edit</button></td>
      </tr>
    `;
  }).join("");
}

function renderPreviousWeeks() {
  if (previousWeeks.length === 0) {
    document.getElementById("entries").innerHTML =
      '<div class="small">No previous weeks saved yet.</div>';
    return;
  }

  const weeksHtml = previousWeeks.map(function(week) {
    const weekIndex = previousWeeks.indexOf(week);
    const groups = getEntriesByEmailDay(week.entries || []);
    const groupHtml = groups.map(function(group) {
      const rows = group.entries.map(function(entry) {
        return `
          <tr>
            <td data-label="Job Name">${escapeHtml(entry.jobName)}</td>
            <td data-label="Job Number">${escapeHtml(entry.jobNumber)}</td>
            <td data-label="Lunch"><input type="checkbox" disabled ${entry.tookLunch ? "checked" : ""} /></td>
            <td data-label="Night Work"><input type="checkbox" disabled ${entry.nightWork ? "checked" : ""} /></td>
            <td data-label="Time">${escapeHtml(entry.timeIn)}-${escapeHtml(entry.timeOut)}</td>
            <td data-label="Hours"><b>${Number(entry.hours).toFixed(2)}</b></td>
          </tr>
        `;
      }).join("");

      return `
        <h3>${escapeHtml(group.day)}</h3>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Job Name</th>
                <th>Job Number</th>
                <th>Lunch</th>
                <th>Night Work</th>
                <th>Time</th>
                <th>Hours</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }).join("");

    return `
      <div class="previous-week">
        <div class="email-actions">
          <h3>${escapeHtml(week.weekLabel)}</h3>
          <button type="button" onclick="resubmitPreviousWeek(${weekIndex})">Resubmit This Week</button>
        </div>
        ${groupHtml}
        ${week.note ? '<div class="small"><b>Note:</b> ' + escapeHtml(week.note) + '</div>' : ''}
        <div class="small"><b>Total Hours:</b> ${Number(week.totalHours).toFixed(2)}</div>
      </div>
    `;
  }).join("");

  document.getElementById("entries").innerHTML = weeksHtml;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, function(character) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[character];
  });
}

function render() {
  if (entriesTab === "previous") {
    renderPreviousWeeks();
    return;
  }

  const entries = loadTimesheets();
  const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

  if (entries.length === 0) {
    document.getElementById("entries").innerHTML =
      '<div class="small">No entries submitted yet.</div>';
    return;
  }

  const jobs = {};

  for (let entry of entries) {
    const key = entry.jobName + "|" + entry.jobNumber;

    if (!jobs[key]) {
      jobs[key] = {
        jobName: entry.jobName,
        jobNumber: entry.jobNumber,
        nightWork: false,
        firstDayIndex: days.length,
        days: {}
      };

      for (let day of days) {
        jobs[key].days[day] = 0;
      }
    }

    jobs[key].days[entry.day] += Number(entry.hours);
    jobs[key].nightWork = jobs[key].nightWork || Boolean(entry.nightWork);
    jobs[key].firstDayIndex = Math.min(jobs[key].firstDayIndex, days.indexOf(entry.day));
  }

  const rows = Object.values(jobs).sort(function(a, b) {
    if (a.firstDayIndex !== b.firstDayIndex) {
      return a.firstDayIndex - b.firstDayIndex;
    }

    return a.jobName.localeCompare(b.jobName);
  }).map(function(job) {
    const dayCells = days.map(function(day) {
      const hours = job.days[day];

      if (!hours) {
        return '<td data-label="' + day + '" class="empty-cell">-</td>';
      }

      return '<td data-label="' + day + '"><b>' + hours.toFixed(2) + "</b></td>";
    }).join("");

    return `
      <tr>
        <td data-label="Job Name">${escapeHtml(job.jobName)}</td>
        <td data-label="Job Number">${escapeHtml(job.jobNumber)}</td>
        <td data-label="Night Work"><input type="checkbox" disabled ${job.nightWork ? "checked" : ""} /></td>
        ${dayCells}
      </tr>
    `;
  }).join("");

  document.getElementById("entries").innerHTML = `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Job Name</th>
            <th>Job Number</th>
            <th>Night Work</th>
            <th>Sunday</th>
            <th>Monday</th>
            <th>Tuesday</th>
            <th>Wednesday</th>
            <th>Thursday</th>
            <th>Friday</th>
            <th>Saturday</th>
          </tr>
        </thead>
        <tbody>
          ${rows}
        </tbody>
      </table>
    </div>
    <h3>Edit Entries</h3>
    <div class="table-wrap edit-table-wrap">
      <table class="edit-table">
        <thead>
          <tr>
            <th>Day</th>
            <th>Job Name</th>
            <th>Job Number</th>
            <th>Edit</th>
          </tr>
        </thead>
        <tbody>
          ${renderEditRows(entries)}
        </tbody>
      </table>
    </div>
    <div class="email-actions">
      <button type="button" onclick="emailEntries()">Submit & Email</button>
      <span class="email-note">please send email at end of day Friday</span>
    </div>
  `;
}

if (currentUser) {
  showCurrentUser();
  fillTimeOptions();
  setTimesheets(loadFallbackTimesheets());
  render();
  loadTimesheetsFromSupabase();
}
</script>
