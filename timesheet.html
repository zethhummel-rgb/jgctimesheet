<!DOCTYPE html>
<html>
<head>
  <title>Time Sheet App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css?v=2" />
  <style>
    body {
      font-family: Arial;
      background: #8f9691;
      padding: 20px;
      margin: 0;
      color: #1f2a24;
    }

    .card {
      background: #fbfcf9;
      padding: 15px;
      margin-bottom: 12px;
      border-radius: 8px;
      border-top: 4px solid #3f7d4d;
      box-shadow: 0 3px 10px rgba(0,0,0,0.18);
    }

    .page-title,
    .form-card {
      max-width: 460px;
      margin-left: auto;
      margin-right: auto;
    }

    .logo-wrap {
      max-width: 347px;
      margin: 0 auto 2px;
      text-align: center;
    }

    .logo-wrap img {
      width: 100%;
      max-width: 347px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .entries-card {
      max-width: 1100px;
      margin-left: auto;
      margin-right: auto;
    }

    .user-bar {
      max-width: 460px;
      margin: 0 auto 12px;
      color: #ffffff;
      text-align: center;
      font-size: 13px;
      font-weight: bold;
      text-shadow: 0 1px 2px rgba(0,0,0,0.25);
    }

    .sign-out {
      width: auto;
      padding: 5px 10px;
      margin-left: 8px;
      margin-bottom: 0;
      background: #5f6a62;
      font-size: 12px;
    }

    .sign-out:hover {
      background: #48514a;
    }

    .home-button {
      width: auto;
      padding: 5px 10px;
      margin-left: 8px;
      margin-bottom: 0;
      background: #5f6a62;
      font-size: 12px;
    }

    .home-button:hover {
      background: #48514a;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 5px;
      text-align: center;
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    h3 {
      margin-top: 0;
      margin-bottom: 10px;
      color: #2f6f3c;
    }

    label {
      font-size: 13px;
      font-weight: bold;
    }

    input, button, select {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      margin-bottom: 8px;
      box-sizing: border-box;
    }

    input, select {
      background: #f7f9f4;
      border: 1px solid #b8c2b2;
      border-radius: 5px;
    }

    input:focus, select:focus {
      border-color: #3f7d4d;
      outline: 2px solid #d9ead5;
    }

    button {
      background: #3f7d4d;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      font-weight: bold;
    }

    button:hover {
      background: #315f3c;
    }

    .small {
      font-size: 12px;
      color: #666;
    }

    .status {
      min-height: 18px;
      margin-top: 4px;
      font-size: 13px;
      color: #2f6f3c;
      font-weight: bold;
    }

    .table-wrap {
      overflow-x: auto;
      margin-top: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 860px;
      background: #ffffff;
    }

    th, td {
      border: 1px solid #c5cec1;
      padding: 10px;
      text-align: center;
      vertical-align: middle;
    }

    th {
      background: #dfe9da;
      color: #1f3d28;
      font-weight: bold;
    }

    tbody tr:nth-child(even) {
      background: #f4f7f1;
    }

    td:first-child,
    td:nth-child(2),
    th:first-child,
    th:nth-child(2) {
      text-align: left;
    }

    .empty-cell {
      color: #999;
    }

    .email-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .email-actions button {
      width: auto;
      min-width: 140px;
      margin: 0;
    }

    .email-note {
      font-size: 13px;
      color: #3f4a42;
      font-weight: bold;
    }

    .edit-table-wrap {
      max-width: 360px;
    }

    .edit-table {
      min-width: 0;
      width: 100%;
    }

    .edit-table th,
    .edit-table td {
      padding: 6px;
      font-size: 12px;
    }

    .check-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin: 4px 0 10px;
      font-size: 13px;
      font-weight: bold;
    }

    .check-row input {
      width: auto;
      margin: 0;
    }

    .edit-button {
      width: auto;
      min-width: 72px;
      padding: 6px 10px;
      margin: 0;
      font-size: 12px;
    }

    .edit-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .delete-entry-button {
      width: auto;
      min-width: 72px;
      padding: 6px 10px;
      margin: 0;
      font-size: 12px;
      background: #8b2e2e;
    }

    .delete-entry-button:hover {
      background: #692222;
    }

    .cancel-edit {
      display: none;
      background: #5f6a62;
    }

    .field-hidden {
      display: none !important;
    }

    .tab-buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .tab-buttons button {
      width: auto;
      margin: 0;
      padding: 7px 12px;
      background: #5f6a62;
    }

    .tab-buttons button.active-tab {
      background: #3f7d4d;
    }

    .previous-week {
      margin-top: 14px;
    }

    .calendar-card {
      max-width: 720px;
      margin-left: auto;
      margin-right: auto;
    }

    .timesheet-calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .timesheet-calendar-header button {
      width: auto;
      min-width: 92px;
      margin: 0;
      background: #5f6a62;
    }

    .timesheet-calendar-title {
      font-weight: bold;
      color: #2f6f3c;
      text-align: center;
      font-size: 18px;
    }

    .timesheet-calendar-quick {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 8px 0 10px;
    }

    .timesheet-calendar-quick button {
      width: auto;
      min-width: 110px;
      margin: 0;
      padding: 7px 12px;
      background: #3f7d4d;
    }

    .timesheet-calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 4px;
    }

    .calendar-day-name {
      padding: 6px 4px;
      text-align: center;
      font-size: 12px;
      font-weight: bold;
      color: #365540;
    }

    .timesheet-day {
      min-height: 72px;
      border: 1px solid #c5cec1;
      border-radius: 6px;
      background: #ffffff;
      color: #1f2a24;
      padding: 6px;
      text-align: left;
      cursor: pointer;
    }

    .timesheet-day:hover {
      border-color: #3f7d4d;
      box-shadow: inset 0 0 0 2px #d9ead5;
    }

    .timesheet-day.outside-month {
      opacity: 0.38;
    }

    .timesheet-day.current-week {
      background: #edf7ea;
      border-color: #9bc596;
    }

    .timesheet-day.today-day {
      box-shadow: inset 0 0 0 2px #8ed26f;
    }

    .timesheet-day.has-current-entry {
      border-color: #3f7d4d;
    }

    .timesheet-day.has-previous-submission {
      background: #eef6fa;
      border-color: #4f86a0;
    }

    .timesheet-day.selected-day {
      background: #3f7d4d;
      color: #ffffff;
      border-color: #2f6f3c;
    }

    .timesheet-day.selected-day .calendar-pill {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    .timesheet-day-number {
      font-weight: bold;
      font-size: 15px;
    }

    .timesheet-day-meta {
      margin-top: 8px;
      font-size: 11px;
      font-weight: bold;
    }

    .calendar-pill {
      display: inline-block;
      margin-top: 4px;
      padding: 2px 5px;
      border-radius: 999px;
      font-size: 10px;
      line-height: 1.25;
    }

    .draft-pill {
      background: #dfeeda;
      color: #245832;
    }

    .submitted-pill {
      background: #dceaf1;
      color: #24516b;
    }

    @media (max-width: 720px) {
      body {
        padding: 10px;
      }

      .card {
        padding: 12px;
      }

      .logo-wrap {
        max-width: 260px;
      }

      h2 {
        font-size: 22px;
      }

      input, button, select {
        min-height: 42px;
        font-size: 16px;
      }

      .sign-out,
      .edit-button,
      .delete-entry-button {
        min-height: 34px;
        font-size: 13px;
      }

      .tab-buttons,
      .email-actions,
      .timesheet-calendar-header {
        display: grid;
        grid-template-columns: 1fr;
      }

      .tab-buttons button,
      .email-actions button {
        width: 100%;
      }

      .email-note {
        text-align: center;
      }

      .table-wrap {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      table {
        min-width: 520px;
      }

      th, td {
        padding: 3px;
        font-size: 10px;
      }

      .table-wrap td input[type="checkbox"][disabled] {
        width: 18px !important;
        height: 18px !important;
        min-width: 18px !important;
        min-height: 18px !important;
        transform: none !important;
        margin: 0 auto;
        display: block;
      }

      .edit-table-wrap {
        max-width: 360px;
      }

      .edit-table th,
      .edit-table td {
        font-size: 14px;
      }

      .timesheet-day {
        min-height: 58px;
        padding: 5px;
      }

      .timesheet-day-number {
        font-size: 13px;
      }

      .timesheet-day-meta {
        font-size: 10px;
      }

      .calendar-pill {
        font-size: 9px;
        padding: 2px 4px;
      }
    }
  </style>
</head>

<body>

<div class="logo-wrap">
  <img src="logo.png" alt="John Gordon Construction" />
</div>

<h2 class="page-title">Construction Time Sheet</h2>

<div id="currentUser" class="user-bar"></div>

<div class="card calendar-card">
  <div class="timesheet-calendar-header">
    <button type="button" onclick="changeCalendarMonth(-1)">Previous</button>
    <div id="timesheetCalendarTitle" class="timesheet-calendar-title"></div>
    <button type="button" onclick="changeCalendarMonth(1)">Next</button>
  </div>
  <div class="timesheet-calendar-quick">
    <button type="button" onclick="selectThisWeek()">This Week</button>
    <button type="button" onclick="selectLastWeek()">Last Week</button>
  </div>
  <div id="timesheetCalendar" class="timesheet-calendar-grid"></div>
  <div class="small">Pick a date to start an entry for that day. Soft green shows the selected week and blue marks submitted weeks.</div>
</div>

<div class="card form-card">
  <h3>Submit Time Entry</h3>

  <label>Week Date</label>
  <input
    type="date"
    id="weekStart"
    onchange="validateSunday(this)"
  />

  <div id="weekDisplay" class="small"></div>

  <label>Day of Week</label>
  <select id="day">
    <option value="">Select Day</option>
    <option>Sunday</option>
    <option>Monday</option>
    <option>Tuesday</option>
    <option>Wednesday</option>
    <option>Thursday</option>
    <option>Friday</option>
    <option>Saturday</option>
  </select>

  <label>Entry Type</label>
  <select id="entryType" onchange="updateEntryTypeFields()">
    <option value="work">Work</option>
    <option value="sick">Sick Day</option>
    <option value="vacation">Vacation Day</option>
    <option value="civic_holiday">Civic Holiday</option>
  </select>

  <div id="workEntryFields">
    <label>Job Name</label>
    <input
      id="jobName"
      placeholder="Search jobs or type job name"
      list="jobNameOptions"
      onchange="fillJobNumberForSelectedJob()"
      oninput="fillJobNumberForSelectedJob()"
    />
    <datalist id="jobNameOptions"></datalist>
    <label>Job Number</label>
    <input
      id="jobNumber"
      type="text"
      placeholder="Job number if available"
      oninput="markManualJobNumber()"
    />
    <div id="jobStatus" class="small">Loading active jobs. You can still type a job manually.</div>

    <label>Time In</label>
    <select id="timeIn">
      <option value="">Select Time In</option>
    </select>

    <label class="check-row">
      <input id="tookLunch" type="checkbox" />
      Did you take Lunch? This will subtract 30 minutes from this input only
    </label>

    <label>Time Out</label>
    <select id="timeOut">
      <option value="">Select Time Out</option>
    </select>

    <label class="check-row">
      <input id="nightWork" type="checkbox" />
      Night Work
    </label>
  </div>

  <div id="leaveEntryFields" class="field-hidden">
    <label id="leaveTypeLabel">Day Type</label>
    <select id="leaveType" onchange="updateEntryTypeFields()">
      <option value="">Select Type</option>
      <option value="paid">Paid</option>
      <option value="unpaid">Unpaid</option>
      <option value="half_day">Half Day</option>
    </select>

    <div id="vacationHalfDayFields" class="field-hidden">
      <label>Vacation Time Start</label>
      <select id="vacationTimeIn">
        <option value="">Select Start</option>
      </select>

      <label>Vacation Time End</label>
      <select id="vacationTimeOut">
        <option value="">Select End</option>
      </select>
    </div>

    <label id="leaveNoteLabel">Note / Reason</label>
    <textarea id="leaveNote" rows="3" placeholder="Add reason or note"></textarea>
  </div>

  <button id="submitButton" type="button" onclick="submitTime()">Submit Entry</button>
  <button id="cancelEditButton" class="cancel-edit" type="button" onclick="cancelEdit()">Cancel Edit</button>
  <div id="submitStatus" class="status"></div>
</div>

<div class="card entries-card">
  <h3>Submitted Entries</h3>
  <div class="tab-buttons">
    <button id="currentTabButton" class="active-tab" type="button" onclick="showEntriesTab('current')">Current Week</button>
    <button id="previousTabButton" type="button" onclick="showEntriesTab('previous')">Last 2 Months</button>
    <button id="editEntriesTabButton" type="button" onclick="showEntriesTab('edit')">Edit Entries</button>
  </div>
  <button type="button" onclick="clearEntries()">Clear My Entries</button>
  <button type="button" onclick="loadTimesheetsFromSupabase()">Refresh Entries</button>
  <div id="entries"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="common.js?v=2"></script>
<script>
const TIMESHEET_EMAIL_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxSW9gOO44n6eMaZyQwB-pXWmkEgbUNeSAxa6jbrTM5c_7ZgSD6RRrbO7YkFuqQl_-4/exec";
const supabaseClient = createJgcSupabaseClient();

let currentUser = normalizeWorkerName(localStorage.getItem("currentWorker"));
let currentUserDisplay = localStorage.getItem("currentWorkerDisplay") || localStorage.getItem("currentWorker");
let memoryTimesheets = [];
let editingEntryId = null;
let entriesTab = "current";
let previousWeeks = [];
let calendarMonth = new Date();
let selectedCalendarDate = new Date();
let activeJobs = [];
const PREVIOUS_TIMESHEET_RETENTION_MONTHS = 2;

if (!currentUser) {
  window.location.href = "index.html";
} else {
  localStorage.setItem("currentWorker", currentUser);
}

function showCurrentUser() {
  document.getElementById("currentUser").innerHTML =
    'Signed in as: ' + escapeHtml(currentUserDisplay || currentUser) +
    ' <button type="button" class="home-button" onclick="goHome()">Home</button>' +
    ' <button type="button" class="sign-out" onclick="signOut()">Sign Out</button>';
}

function goHome() {
  window.location.href = "home.html";
}

async function signOut() {
  await signOutJgc(supabaseClient);
}

function makeLocalDate(dateString) {
  const parts = dateString.split("-");
  return new Date(parts[0], parts[1] - 1, parts[2]);
}

function formatDateValue(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");

  return year + "-" + month + "-" + day;
}

function getDayNames() {
  return ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
}

function getWeekStartDate(date) {
  const weekStart = new Date(date);
  weekStart.setHours(0, 0, 0, 0);
  weekStart.setDate(date.getDate() - date.getDay());
  return weekStart;
}

function getDateForEntry(entry) {
  const weekStartText = entry.weekStartValue || entry.week_start || entry.weekStart;

  if (!weekStartText || !entry.day) {
    return null;
  }

  const dayIndex = getDayNames().indexOf(entry.day);

  if (dayIndex < 0) {
    return null;
  }

  const date = /^\d{4}-\d{2}-\d{2}$/.test(weekStartText)
    ? makeLocalDate(weekStartText)
    : new Date(weekStartText);

  if (Number.isNaN(date.getTime())) {
    return null;
  }

  date.setDate(date.getDate() + dayIndex);
  return date;
}

function getHoursForDate(date) {
  const targetValue = formatDateValue(date);

  return loadTimesheets().reduce(function(total, entry) {
    const entryDate = getDateForEntry(entry);

    if (!entryDate || formatDateValue(entryDate) !== targetValue) {
      return total;
    }

    return total + Number(entry.hours || 0);
  }, 0);
}

function getEntriesForDate(date) {
  const targetValue = formatDateValue(date);

  return loadTimesheets().filter(function(entry) {
    const entryDate = getDateForEntry(entry);
    return entryDate && formatDateValue(entryDate) === targetValue;
  });
}

function getCurrentStatusForDate(date) {
  const entries = getEntriesForDate(date);
  const leaveEntry = entries.find(function(entry) {
    return isLeaveEntry(entry);
  });
  const hours = entries.reduce(function(total, entry) {
    return total + Number(entry.hours || 0);
  }, 0);

  if (leaveEntry) {
    return {
      label: getEntryTypeLabel(leaveEntry) + (getEntryLeaveNote(leaveEntry) ? ": " + getEntryLeaveNote(leaveEntry) : ""),
      isLeave: true
    };
  }

  if (hours) {
    return {
      label: hours.toFixed(2) + " draft",
      isLeave: false
    };
  }

  return null;
}

function getPreviousSubmissionForDate(date) {
  const targetValue = formatDateValue(date);

  for (let week of previousWeeks) {
    const entries = Array.isArray(week.entries) ? week.entries : [];
    const matchingEntries = entries.filter(function(entry) {
      const entryDate = getDateForEntry(entry);
      return entryDate && formatDateValue(entryDate) === targetValue;
    });

    if (matchingEntries.length > 0) {
      const leaveEntry = matchingEntries.find(function(entry) {
        return isLeaveEntry(entry);
      });

      return {
        week: week,
        label: leaveEntry ? getEntryTypeLabel(leaveEntry) : "",
        hours: matchingEntries.reduce(function(total, entry) {
          return total + Number(entry.hours || 0);
        }, 0)
      };
    }
  }

  return null;
}

function changeCalendarMonth(offset) {
  calendarMonth = new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() + offset, 1);
  renderTimesheetCalendar();
}

function selectThisWeek() {
  selectCalendarDate(formatDateValue(new Date()));
}

function selectLastWeek() {
  const date = new Date();
  date.setDate(date.getDate() - 7);
  selectCalendarDate(formatDateValue(date));
}

function selectCalendarDate(dateValue) {
  const date = makeLocalDate(dateValue);
  selectedCalendarDate = date;
  calendarMonth = new Date(date.getFullYear(), date.getMonth(), 1);

  const weekStartInput = document.getElementById("weekStart");
  weekStartInput.value = dateValue;
  validateSunday(weekStartInput);
  document.getElementById("day").value = getDayNames()[date.getDay()];
  renderTimesheetCalendar();

  document.querySelector(".form-card").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

function getCalendarSelectedWeekStart() {
  const inputValue = document.getElementById("weekStart").value;

  if (inputValue) {
    return makeLocalDate(inputValue);
  }

  return getWeekStartDate(selectedCalendarDate);
}

function renderTimesheetCalendar() {
  const calendar = document.getElementById("timesheetCalendar");
  const title = document.getElementById("timesheetCalendarTitle");

  if (!calendar || !title) {
    return;
  }

  const year = calendarMonth.getFullYear();
  const month = calendarMonth.getMonth();
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const selectedWeekStart = getCalendarSelectedWeekStart();
  const selectedWeekEnd = new Date(selectedWeekStart);
  selectedWeekEnd.setDate(selectedWeekStart.getDate() + 6);
  const selectedValue = formatDateValue(selectedCalendarDate);
  const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const cells = [];

  title.innerText = firstDay.toLocaleDateString("en-CA", {
    month: "long",
    year: "numeric"
  });

  for (let name of dayNames) {
    cells.push('<div class="calendar-day-name">' + name + '</div>');
  }

  for (let i = 0; i < firstDay.getDay(); i++) {
    const date = new Date(year, month, 1 - firstDay.getDay() + i);
    cells.push(getCalendarDayHtml(date, month, selectedWeekStart, selectedWeekEnd, selectedValue));
  }

  for (let day = 1; day <= lastDay.getDate(); day++) {
    const date = new Date(year, month, day);
    cells.push(getCalendarDayHtml(date, month, selectedWeekStart, selectedWeekEnd, selectedValue));
  }

  while ((cells.length - 7) % 7 !== 0) {
    const date = new Date(year, month, lastDay.getDate() + ((cells.length - 7) % 7) + 1);
    cells.push(getCalendarDayHtml(date, month, selectedWeekStart, selectedWeekEnd, selectedValue));
  }

  calendar.innerHTML = cells.join("");
}

function getCalendarDayHtml(date, visibleMonth, selectedWeekStart, selectedWeekEnd, selectedValue) {
  const dateValue = formatDateValue(date);
  const currentStatus = getCurrentStatusForDate(date);
  const previousSubmission = getPreviousSubmissionForDate(date);
  const todayValue = formatDateValue(new Date());
  const classes = ["timesheet-day"];
  const metaItems = [];

  if (date.getMonth() !== visibleMonth) {
    classes.push("outside-month");
  }

  if (selectedWeekStart.getTime() <= date.getTime() && date.getTime() <= selectedWeekEnd.getTime()) {
    classes.push("current-week");
  }

  if (dateValue === todayValue) {
    classes.push("today-day");
  }

  if (currentStatus) {
    classes.push("has-current-entry");
    metaItems.push('<span class="calendar-pill draft-pill">' + escapeHtml(currentStatus.label) + '</span>');
  }

  if (previousSubmission) {
    classes.push("has-previous-submission");
    const submittedText = previousSubmission.label || (previousSubmission.hours
      ? previousSubmission.hours.toFixed(2) + " submitted"
      : "Submitted");
    metaItems.push('<span class="calendar-pill submitted-pill">' + submittedText + '</span>');
  }

  if (dateValue === selectedValue) {
    classes.push("selected-day");
  }

  return `
    <button type="button" class="${classes.join(" ")}" onclick="selectCalendarDate('${dateValue}')">
      <div class="timesheet-day-number">${date.getDate()}</div>
      <div class="timesheet-day-meta">${metaItems.join("")}</div>
    </button>
  `;
}

function validateSunday(input) {
  if (!input.value) {
    document.getElementById("weekDisplay").innerText = "";
    updateJobSuggestions();
    renderTimesheetCalendar();
    return;
  }

  const date = makeLocalDate(input.value);
  selectedCalendarDate = date;
  calendarMonth = new Date(date.getFullYear(), date.getMonth(), 1);
  const weekStart = getWeekStartDate(date);
  input.value = formatDateValue(weekStart);

  const weekEnd = new Date(weekStart);
  weekEnd.setDate(weekStart.getDate() + 6);

  document.getElementById("weekDisplay").innerText =
    "Week: " + formatDate(weekStart) + " -> " + formatDate(weekEnd);

  updateJobSuggestions();
  fillJobNumberForSelectedJob();
  renderTimesheetCalendar();
}

function formatDate(date) {
  return date.toLocaleDateString("en-CA", {
    year: "numeric",
    month: "short",
    day: "numeric"
  });
}

function calculateHours(inTime, outTime, tookLunch) {
  const start = getTimeMinutes(inTime);
  let end = getTimeMinutes(outTime);

  if (start === null || end === null) {
    return "0.00";
  }

  if (end < start) end += 24 * 60;

  let diff = (end - start) / 60;

  if (tookLunch) diff -= 0.5;
  if (diff < 0) diff = 0;

  return diff.toFixed(2);
}

function formatTimeOption(hour, minute) {
  return String(hour).padStart(2, "0") + ":" + String(minute).padStart(2, "0");
}

function normalizeTimeForStorage(time) {
  return String(time || "").replace(/^next-/, "");
}

function getTimeMinutes(time) {
  const raw = String(time || "");
  const isNextDay = raw.startsWith("next-");
  const clockTime = normalizeTimeForStorage(raw);
  const parts = clockTime.split(":").map(Number);

  if (parts.length !== 2 || parts.some((part) => Number.isNaN(part))) {
    return null;
  }

  return (isNextDay ? 24 * 60 : 0) + (parts[0] * 60) + parts[1];
}

function formatTimeLabel(hour, minute) {
  const suffix = hour >= 12 ? "PM" : "AM";
  const displayHour = hour % 12 || 12;
  return displayHour + ":" + String(minute).padStart(2, "0") + " " + suffix;
}

function buildTimeOptions(startHour, endHour, valuePrefix, labelSuffix, includeEndHalfHour) {
  let options = "";

  for (let hour = startHour; hour <= endHour; hour++) {
    const minuteOptions = hour === endHour && !includeEndHalfHour ? [0] : [0, 30];

    minuteOptions.forEach(function(minute) {
      const value = formatTimeOption(hour, minute);
      options += '<option value="' + valuePrefix + value + '">' + formatTimeLabel(hour, minute) + labelSuffix + '</option>';
    });
  }

  return options;
}

function fillTimeOptions() {
  const timeInputs = [
    document.getElementById("timeIn"),
    document.getElementById("timeOut"),
    document.getElementById("vacationTimeIn"),
    document.getElementById("vacationTimeOut")
  ];

  for (let input of timeInputs) {
    const placeholder = input.id === "timeIn" || input.id === "vacationTimeIn" ? "Select Time In" : "Select Time Out";
    let options = '<option value="">' + placeholder + '</option>';

    if (input.id === "timeOut") {
      options += '<optgroup label="Same Day">';
      options += buildTimeOptions(0, 23, "", "", true);
      options += '</optgroup>';
      options += '<optgroup label="Next Morning">';
      options += buildTimeOptions(0, 7, "next-", " Next Day", false);
      options += '</optgroup>';
    } else {
      options += buildTimeOptions(0, 23, "", "", true);
    }

    input.innerHTML = options;
  }
}

function isHalfHourTime(time) {
  const clockTime = normalizeTimeForStorage(time);
  return /^\d{2}:\d{2}$/.test(clockTime) && (clockTime.endsWith(":00") || clockTime.endsWith(":30"));
}

function loadFallbackTimesheets() {
  try {
    const saved = JSON.parse(localStorage.getItem("timesheets") || "[]");
    if (!Array.isArray(saved)) {
      return [];
    }

    return saved.filter(function(entry) {
      return normalizeWorkerName(entry.user) === normalizeWorkerName(currentUser);
    });
  } catch (error) {
    try {
      localStorage.removeItem("timesheets");
    } catch (removeError) {
      return memoryTimesheets;
    }

    return memoryTimesheets;
  }
}

function saveFallbackTimesheets(entries) {
  try {
    localStorage.setItem("timesheets", JSON.stringify(entries));
  } catch (error) {
    return false;
  }

  return true;
}

function loadTimesheets() {
  return memoryTimesheets.filter(function(entry) {
    return normalizeWorkerName(entry.user) === normalizeWorkerName(currentUser);
  }).map(function(entry) {
    return {
      ...entry,
      jobName: cleanRepeatedJobName(entry.jobName)
    };

}

function setTimesheets(entries) {

  saveFallbackTimesheets(mergeFallbackTimesheets(entries));
}

function normalizeWorkerName(name) {

}

function mergeFallbackTimesheets(currentWorkerEntries) {
  const otherWorkerEntries = loadAllFallbackTimesheets().filter(function(entry) {
    return normalizeWorkerName(entry.user) !== normalizeWorkerName(currentUser);
  });

  return otherWorkerEntries.concat(currentWorkerEntries);
}

function loadAllFallbackTimesheets() {
  try {
    const saved = JSON.parse(localStorage.getItem("timesheets") || "[]");
    return Array.isArray(saved) ? saved : [];
  } catch (error) {

}

function rowToEntry(row) {
  const inferredEntryType = row.entry_type || (String(row.job_name || "").toLowerCase().includes("sick day")
    ? "sick"
    : String(row.job_name || "").toLowerCase().includes("vacation day")

      : String(row.job_name || "").toLowerCase().includes("holiday")
        ? "civic_holiday"
        : "work");

  return {

    user: row.worker_name,
    weekStartValue: row.week_start,
    weekStart: formatDate(makeLocalDate(row.week_start)),
    weekEnd: row.week_end,
    jobName: cleanRepeatedJobName(row.job_name),
    jobNumber: row.job_number,
    day: row.day_of_week,
    timeIn: String(row.time_in).slice(0, 5),
    timeOut: String(row.time_out).slice(0, 5),
    hours: Number(row.hours).toFixed(2),
    tookLunch: Boolean(row.took_lunch),
    nightWork: Boolean(row.night_work),
    entryType: inferredEntryType,
    leaveType: row.leave_type || "",
    leaveNote: row.leave_note || ""
  };
}

function entryToRow(entry) {
  return {
    worker_name: entry.user,
    week_start: entry.weekStartValue,
    week_end: entry.weekEnd,
    job_name: entry.jobName,
    job_number: entry.jobNumber,
    day_of_week: entry.day,
    time_in: entry.timeIn,
    time_out: entry.timeOut,
    hours: Number(entry.hours),
    took_lunch: Boolean(entry.tookLunch),
    night_work: Boolean(entry.nightWork),
    entry_type: getEntryType(entry),
    leave_type: entry.leaveType || "",
    leave_note: entry.leaveNote || ""
  };
}

async function loadTimesheetsFromSupabase() {
  const status = document.getElementById("submitStatus");

  if (!supabaseClient) {
    setTimesheets(loadFallbackTimesheets());
    status.innerText = "Using browser storage until Supabase loads.";
    render();
    updateJobSuggestions();
    return;
  }

  status.innerText = "Loading saved entries...";

  const { data, error } = await supabaseClient
    .from("timesheet_entries")
    .select("*")
    .eq("worker_name", currentUser)
    .order("created_at", { ascending: true });

  if (error) {
    setTimesheets(loadFallbackTimesheets());
    status.innerText = "Could not reach Supabase. Using browser storage for now.";
    render();
    updateJobSuggestions();
    return;
  }

  const onlineEntries = (data || []).map(rowToEntry);
  const mergedEntries = onlineEntries.slice();

  loadFallbackTimesheets().forEach(function(localEntry) {
    const existsOnline = mergedEntries.some(function(onlineEntry) {
      return onlineEntry.id === localEntry.id;
    });

    if (!existsOnline && String(localEntry.id || "").startsWith("local-")) {
      mergedEntries.push(localEntry);
    }
  });

  setTimesheets(mergedEntries);
  status.innerText = "";
  render();
  updateJobSuggestions();
}

async function loadPreviousWeeksFromSupabase(options) {
  const shouldRender = !options || options.render !== false;

  if (!supabaseClient) {
    previousWeeks = loadFallbackPreviousWeeks();
    if (shouldRender) {
      render();
    }
    return;
  }

  const { data, error } = await supabaseClient
    .from("previous_timesheet_weeks")
    .select("*")
    .eq("worker_name", currentUser)
    .gte("submitted_at", getPreviousTimesheetCutoffIso())
    .order("submitted_at", { ascending: false });

  if (error) {
    previousWeeks = loadFallbackPreviousWeeks();
    if (shouldRender) {
      render();
    }
    return;
  }

  previousWeeks = (data || []).map(function(week) {
    return {
      id: week.id,
      workerName: week.worker_name,
      weekLabel: week.week_label,
      entries: Array.isArray(week.entries) ? week.entries : [],
      totalHours: Number(week.total_hours),
      note: week.note || "",
      submittedAt: week.submitted_at
    };
  }).sort(sortPreviousWeeksByDate);
  previousWeeks = filterPreviousWeeksForRetention(previousWeeks);

  saveFallbackPreviousWeeks(previousWeeks);
  if (shouldRender) {
    render();
  }
}

function loadFallbackPreviousWeeks() {
  try {
    const saved = JSON.parse(localStorage.getItem("previousTimesheetWeeks") || "[]");

    if (!Array.isArray(saved)) {
      return [];
    }

    const workerWeeks = saved.filter(function(week) {
      return normalizeWorkerName(week.workerName) === normalizeWorkerName(currentUser);
    });

    return filterPreviousWeeksForRetention(workerWeeks).sort(sortPreviousWeeksByDate);
  } catch (error) {
    return [];
  }
}

function saveFallbackPreviousWeeks(weeks) {
  const otherWorkers = loadAllFallbackPreviousWeeks().filter(function(week) {
    return normalizeWorkerName(week.workerName) !== normalizeWorkerName(currentUser);
  });
  const currentWorkerWeeks = filterPreviousWeeksForRetention(weeks).sort(sortPreviousWeeksByDate);

  localStorage.setItem("previousTimesheetWeeks", JSON.stringify(otherWorkers.concat(currentWorkerWeeks)));
}

function loadAllFallbackPreviousWeeks() {
  try {
    const saved = JSON.parse(localStorage.getItem("previousTimesheetWeeks") || "[]");
    return Array.isArray(saved) ? saved : [];
  } catch (error) {
    return [];
  }
}

function getPreviousWeekStartTime(week) {
  const firstEntry = week.entries && week.entries[0];
  const dateText = firstEntry && firstEntry.weekStartValue
    ? firstEntry.weekStartValue
    : String(week.weekLabel || "").split(" to ")[0];
  const time = new Date(dateText).getTime();

  return Number.isNaN(time) ? 0 : time;
}

function sortPreviousWeeksByDate(a, b) {
  return getPreviousWeekStartTime(b) - getPreviousWeekStartTime(a);
}

function getPreviousTimesheetCutoffTime() {
  const cutoff = new Date();
  cutoff.setMonth(cutoff.getMonth() - PREVIOUS_TIMESHEET_RETENTION_MONTHS);
  cutoff.setHours(0, 0, 0, 0);
  return cutoff.getTime();
}

function getPreviousTimesheetCutoffIso() {
  return new Date(getPreviousTimesheetCutoffTime()).toISOString();
}

function getPreviousWeekSavedTime(week) {
  const submittedTime = week && week.submittedAt ? new Date(week.submittedAt).getTime() : 0;
  return Number.isNaN(submittedTime) || !submittedTime ? getPreviousWeekStartTime(week) : submittedTime;
}

function filterPreviousWeeksForRetention(weeks) {
  const cutoffTime = getPreviousTimesheetCutoffTime();
  return weeks.filter(function(week) {
    return getPreviousWeekSavedTime(week) >= cutoffTime;
  });
}

function showEntriesTab(tabName) {

function getSelectedWeekStart() {

function cleanRepeatedJobName(value) {
  const text = String(value || "").replace(/\s+/g, " ").trim();
  const words = text.split(" ").filter(Boolean);

  if (words.length < 2) {
    return text;
  }

  for (let size = 1; size <= Math.floor(words.length / 2); size++) {
    if (words.length % size !== 0) {
      continue;
    }

    const pattern = words.slice(0, size).join(" ");
    let repeated = true;

    for (let index = size; index < words.length; index += size) {
      if (words.slice(index, index + size).join(" ").toLowerCase() !== pattern.toLowerCase()) {
        repeated = false;
        break;
      }
    }

    if (repeated) {
      return pattern;
    }
  }

  return text;
}

function getJobDisplay(job) {
  const jobNumber = String(job.job_number || "").trim();
  const jobName = cleanRepeatedJobName(job.job_name);
  return jobNumber ? jobNumber + " - " + jobName : jobName;
}

function sortJobsByNumber(a, b) {
  return String(a.job_number || "").localeCompare(String(b.job_number || ""), undefined, { numeric: true });
}

function findSelectedActiveJob() {
  const selectedValue = document.getElementById("jobName").value.trim().toLowerCase();
  const selectedJobNumber = document.getElementById("jobNumber").value.trim().toLowerCase();

  if (!selectedValue && !selectedJobNumber) {
    return null;
  }

  return activeJobs.find(function(job) {
    const jobName = cleanRepeatedJobName(job.job_name).toLowerCase();
    const jobNumber = String(job.job_number || "").trim().toLowerCase();
    const display = getJobDisplay(job).toLowerCase();

    return display === selectedValue ||
      (jobName && jobName === selectedValue) ||
      (selectedJobNumber && jobNumber && jobNumber === selectedJobNumber);
  }) || null;
}

function updateJobSuggestions() {
  const options = activeJobs
    .slice()
    .sort(sortJobsByNumber)
    .map(function(job) {
      const display = getJobDisplay(job);
      return '<option value="' + escapeHtml(display) + '"></option>';
    }).join("");

  document.getElementById("jobNameOptions").innerHTML = options;

  const jobStatus = document.getElementById("jobStatus");

  if (jobStatus) {
    jobStatus.textContent = activeJobs.length
      ? activeJobs.length + " active jobs available. You can also type a job manually."
      : "No active jobs available yet. You can still type a job manually.";
  }
}

function markManualJobNumber() {
  const jobNumberInput = document.getElementById("jobNumber");
  jobNumberInput.dataset.autoJobNumber = "false";
}

function fillJobNumberForSelectedJob() {
  const jobNameInput = document.getElementById("jobName");
  const jobNumberInput = document.getElementById("jobNumber");
  const match = findSelectedActiveJob();

  if (match) {
    const display = getJobDisplay(match);
    const jobName = cleanRepeatedJobName(match.job_name);
    const jobNumber = String(match.job_number || "").trim();

    if (!jobNumberInput.value || jobNumberInput.dataset.autoJobNumber === "true" || jobNumberInput.value === jobNumber) {
      jobNumberInput.value = jobNumber;
      jobNumberInput.dataset.autoJobNumber = "true";
    }

    if (jobNameInput.value.trim() === display) {
      jobNameInput.value = jobName;
    }

    return;
  }

  if (jobNumberInput.dataset.autoJobNumber === "true") {
    jobNumberInput.value = "";
    jobNumberInput.dataset.autoJobNumber = "false";
  }
}

async function loadActiveJobs() {
  const jobStatus = document.getElementById("jobStatus");

  if (!supabaseClient) {
    if (jobStatus) {
      jobStatus.textContent = "Jobs could not be loaded because Supabase is unavailable.";
    }
    updateJobSuggestions();
    return;
  }

  if (jobStatus) {
    jobStatus.textContent = "Loading active jobs...";
  }

  const { data, error } = await supabaseClient
    .from("jobs")
    .select("id, job_number, job_name, active")
    .eq("active", true)
    .order("job_number", { ascending: true });

  if (error) {
    activeJobs = [];
    if (jobStatus) {
      jobStatus.textContent = "Active jobs could not be loaded.";
    }
    updateJobSuggestions();
    return;
  }

  activeJobs = data || [];
  updateJobSuggestions();
}

  document.getElementById("vacationTimeIn").value = "";
  document.getElementById("vacationTimeOut").value = "";
  document.getElementById("jobName").value = "";
  document.getElementById("jobNumber").value = "";

  document.getElementById("day").value = "";
  document.getElementById("timeIn").value = "";
  document.getElementById("timeOut").value = "";

function updateEntryTypeFields() {
  const entryType = document.getElementById("entryType").value;
  const isWork = entryType === "work";
  const workFields = document.getElementById("workEntryFields");
  const leaveFields = document.getElementById("leaveEntryFields");

  document.getElementById("submitStatus").innerText = "Editing saved entry.";
}

function clearEditMode() {

}

}

async function deleteEntry(entryId) {
  const entry = loadTimesheets().find(function(item) {
    return item.id === entryId;
  });

  if (!entry) {
    alert("This entry could not be found.");
    return;
  }

  const confirmed = confirm("Delete this entry for " + entry.day + " - " + entry.jobName + "?");

  if (!confirmed) {
    return;
  }

  const status = document.getElementById("submitStatus");
  status.innerText = "Deleting entry...";

  if (supabaseClient) {
    const { error } = await supabaseClient
      .from("timesheet_entries")
      .delete()
      .eq("id", entryId)
      .eq("worker_name", currentUser);

}

  });
}

async function submitTime() {
  if (!currentUser) {
    alert("You must sign in first");
    return;
  }

  const rawWeekStart = document.getElementById("weekStart").value;
  const normalizedWeekStartDate = rawWeekStart ? getWeekStartDate(makeLocalDate(rawWeekStart)) : null;
  const weekStart = normalizedWeekStartDate ? formatDateValue(normalizedWeekStartDate) : "";
  const entryType = document.getElementById("entryType").value || "work";
  const leaveType = document.getElementById("leaveType").value || "";
  const leaveNote = document.getElementById("leaveNote").value.trim();
  const vacationTimeIn = document.getElementById("vacationTimeIn").value;
  const rawVacationTimeOut = document.getElementById("vacationTimeOut").value;
  const vacationTimeOut = normalizeTimeForStorage(rawVacationTimeOut);
  const isWorkEntry = entryType === "work";
  const selectedJob = findSelectedActiveJob();
  const typedJobName = document.getElementById("jobName").value.trim();
  const typedJobNumber = document.getElementById("jobNumber").value.trim();
  const selectedDisplay = selectedJob ? getJobDisplay(selectedJob) : "";
  const jobName = cleanRepeatedJobName(
    selectedJob && typedJobName.toLowerCase() === selectedDisplay.toLowerCase()
      ? selectedJob.job_name
      : typedJobName
  );
  const jobNumber = typedJobNumber || (selectedJob ? String(selectedJob.job_number || "").trim() : "");
  const day = document.getElementById("day").value;
  const timeIn = document.getElementById("timeIn").value;
  const rawTimeOut = document.getElementById("timeOut").value;
  const timeOut = normalizeTimeForStorage(rawTimeOut);
  const tookLunch = document.getElementById("tookLunch").checked;
  const nightWork = document.getElementById("nightWork").checked;

  if (!weekStart || !day) {
    alert("Fill in all fields");
    return;
  }

  if (entryType === "sick" && !leaveNote) {
    alert("Please add a reason for the sick day.");
    return;
  }

  if (entryType === "vacation" && !leaveType) {
    alert("Please choose Paid or Unpaid for the vacation day.");
    return;
  }

  if (entryType === "vacation" && leaveType === "half_day" && (!vacationTimeIn || !rawVacationTimeOut)) {
    alert("Please choose the time for the half vacation day.");
    return;
  }

  if (entryType === "vacation" && leaveType === "half_day" && (!isHalfHourTime(vacationTimeIn) || !isHalfHourTime(rawVacationTimeOut))) {
    alert("Half day vacation time must be in 30 minute intervals.");
    return;
  }

  if (isWorkEntry && (!typedJobName || !timeIn || !rawTimeOut)) {
    alert("Fill in all work entry fields");
    return;
  }

  if (isWorkEntry && (!isHalfHourTime(timeIn) || !isHalfHourTime(rawTimeOut))) {
    alert("Time In and Time Out must be in 30 minute intervals.");
    return;
  }

  const startDate = makeLocalDate(weekStart);
  const endDate = new Date(startDate);
  endDate.setDate(startDate.getDate() + 6);

  const entry = {
    id: editingEntryId || "local-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8),
    user: currentUser,
    weekStartValue: weekStart,
    weekStart: formatDate(startDate),
    weekEnd: formatDate(endDate),
    jobName: isWorkEntry ? jobName : getSpecialEntryJobName(entryType, leaveType),
    jobNumber: isWorkEntry ? jobNumber : "",
    day,
    timeIn: isWorkEntry ? timeIn : (entryType === "vacation" && leaveType === "half_day" ? vacationTimeIn : "00:00"),
    timeOut: isWorkEntry ? timeOut : (entryType === "vacation" && leaveType === "half_day" ? vacationTimeOut : "00:00"),
    hours: isWorkEntry ? calculateHours(timeIn, rawTimeOut, tookLunch) : (entryType === "vacation" && leaveType === "half_day" ? calculateHours(vacationTimeIn, rawVacationTimeOut, false) : 0),
    tookLunch: isWorkEntry ? tookLunch : false,
    nightWork: isWorkEntry ? nightWork : false,
    entryType,
    leaveType: entryType === "vacation" ? leaveType : "",
    leaveNote
  };

  const status = document.getElementById("submitStatus");
  let stored = loadTimesheets();
  status.innerText = editingEntryId ? "Updating entry..." : "Saving entry...";

  if (editingEntryId) {
    entry.id = editingEntryId;

    if (supabaseClient) {
      const { data, error } = await supabaseClient
        .from("timesheet_entries")
        .update(entryToRow(entry))
        .eq("id", editingEntryId)
        .eq("worker_name", currentUser)
        .select()
        .single();

      if (error) {
        status.innerText = "Could not update this Supabase entry.";
        return;
      }

      setTimesheets(replaceStoredEntry(stored, rowToEntry(data)));
    } else {
      setTimesheets(replaceStoredEntry(stored, entry));
    }

    clearEditMode();
    resetTimeEntryFields();
    status.innerText = "Entry updated.";
    updateJobSuggestions();
    render();
    return;
  }

  stored.push(entry);
  setTimesheets(stored);
  status.innerText = supabaseClient ? "Entry submitted." : "Entry submitted for this browser session.";

  if (supabaseClient) {
    const { data, error } = await supabaseClient
      .from("timesheet_entries")
      .insert(entryToRow(entry))
      .select()
      .single();

    if (error) {
      status.innerText = "Entry saved in this browser only. Supabase save failed.";
    } else if (data) {
      try {
        const savedEntry = rowToEntry(data);
        setTimesheets(loadTimesheets().map(function(item) {
          return item.id === entry.id ? savedEntry : item;
        }));
      } catch (error) {
        status.innerText = "Entry submitted. It may refresh from Supabase on reload.";
      }
    }
  }

  const holidayCount = await addOntarioHolidayEntriesForWeek(weekStart, day);

  if (holidayCount) {
    status.innerText += " Ontario holiday added automatically.";
  }

  updateJobSuggestions();
  resetTimeEntryFields();
  render();
  status.innerText += " Current entries shown: " + loadTimesheets().length + ".";
}

async function clearEntries() {
  if (!currentUser) {
    alert("You must sign in first");
    return;
  }

  const confirmed = confirm("Clear all entries for " + getDisplayWorkerName() + "?");

  if (!confirmed) {
    return;
  }

  const status = document.getElementById("submitStatus");
  status.innerText = "Clearing your entries...";

  if (supabaseClient) {
    const { error } = await supabaseClient
      .from("timesheet_entries")
      .delete()
      .eq("worker_name", currentUser);

    if (error) {
      status.innerText = "Could not clear your Supabase entries.";
      return;
    }
  }

  memoryTimesheets = [];
  saveFallbackTimesheets(mergeFallbackTimesheets([]));

  try {
    localStorage.setItem("timesheets", JSON.stringify(mergeFallbackTimesheets([])));
  } catch (error) {
  }

  status.innerText = "Your entries were cleared.";

}

async function emailEntries() {
  const entries = loadTimesheets();

  if (entries.length === 0) {
    alert("No entries to email yet.");
    return;
  }

  const missingWeekdays = getMissingMandatoryWeekdays(entries);

  if (missingWeekdays.length) {
    alert("Please account for every weekday before submitting. Missing: " + missingWeekdays.join(", ") + ".");
    return;
  }

  const note = prompt("Add a note to your timesheet? Leave blank if no note is needed.", "");

  if (note === null) {
    return;
  }

  const confirmed = confirm("Submit this timesheet? This will save it to Previous Weeks and reset the current week.");

  if (!confirmed) {
    return;
  }

  const weekLabel = getWeekLabel(entries);
  const subject = "Timesheet - " + getDisplayWorkerName() + " - " + weekLabel;
  const totalHours = getTotalHours(entries);
  const body = buildTimesheetEmailBody(entries, weekLabel, totalHours, note.trim());
  const pdfHtml = buildTimesheetPdfHtml(entries, weekLabel, totalHours, note.trim());
  const archiveResult = await archiveCurrentEntries(entries, totalHours, weekLabel, note.trim());

  if (archiveResult.warning) {
    alert(archiveResult.warning);
  }

  await sendTimesheetEmail(subject, body, weekLabel, pdfHtml);
}

function buildTimesheetEmailBody(entries, weekLabel, totalHours, note) {
  const lines = [
    "Worker: " + getDisplayWorkerName(),
    "Week: " + weekLabel,
    "",
    "Timesheet Entries:",
    ""
  ];

  const dayGroups = getEntriesByEmailDay(entries);

  for (let group of dayGroups) {
    lines.push(group.heading);
    lines.push(group.table.header);
    lines.push(group.table.divider);

    for (let row of group.table.rows) {
      lines.push(row);
    }

    lines.push("");
    lines.push("");
  }

  lines.push("Total Hours: " + totalHours.toFixed(2));

  if (note) {
    lines.push("");
    lines.push("Note:");
    lines.push(note);
  }

  return lines.join("\n");
}

function buildTimesheetPdfHtml(entries, weekLabel, totalHours, note) {
  const groups = getEntriesByEmailDay(entries);
  const groupHtml = groups.map(function(group) {
    const rows = group.entries.map(function(entry) {
      return `
        <tr>
          <td>${escapeHtml(entry.jobName)}</td>
          <td>${escapeHtml(entry.jobNumber || "")}</td>
          <td>${escapeHtml(getEntryTypeLabel(entry))}</td>
          <td>${escapeHtml(getEntryLeaveNote(entry))}</td>
          <td>${entry.tookLunch ? "Yes" : "No"}</td>
          <td>${entry.nightWork ? "Yes" : "No"}</td>
          <td>${isLeaveEntry(entry) && entry.leaveType !== "half_day" ? "" : escapeHtml(entry.timeIn) + "-" + escapeHtml(entry.timeOut)}</td>
          <td>${Number(entry.hours).toFixed(2)}</td>
        </tr>
      `;
    }).join("");

    return `
      <h2>${escapeHtml(group.heading)}</h2>
      <table>
        <thead>
          <tr>
            <th>Job Name</th>
            <th>Job #</th>
            <th>Type</th>
            <th>Note</th>
            <th>Lunch</th>
            <th>Night Work</th>
            <th>Time</th>
            <th>Hours</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }).join("");

  return `
    <!doctype html>
    <html>
    <head>
      <meta charset="UTF-8">
      <style>
        body { font-family: Arial, sans-serif; color: #1f2a24; }
        h1 { color: #2f6f3c; margin-bottom: 4px; }
        h2 { margin-top: 22px; margin-bottom: 8px; color: #2f6f3c; }
        .meta { margin-bottom: 14px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
        th, td { border: 1px solid #999; padding: 6px; font-size: 11px; text-align: left; }
        th { background: #e6ece6; }
        .total { margin-top: 18px; font-size: 14px; font-weight: bold; }
        .note { margin-top: 12px; padding: 8px; border: 1px solid #999; }
      </style>
    </head>
    <body>
      <h1>John Gordon Construction Timesheet</h1>
      <div class="meta">
        <div><b>Worker:</b> ${escapeHtml(getDisplayWorkerName())}</div>
        <div><b>Week:</b> ${escapeHtml(weekLabel)}</div>
      </div>
      ${groupHtml}
      <div class="total">Total Hours: ${totalHours.toFixed(2)}</div>
      ${note ? '<div class="note"><b>Note:</b><br>' + escapeHtml(note) + '</div>' : ''}
    </body>
    </html>
  `;
}

async function resubmitPreviousWeek(index) {
  const week = previousWeeks[index];

  if (!week || !Array.isArray(week.entries) || week.entries.length === 0) {
    alert("This previous week has no entries to resubmit.");
    return;
  }

  const confirmed = confirm("Resubmit this saved week by email?");

  if (!confirmed) {
    return;
  }

  const totalHours = Number(week.totalHours || getTotalHours(week.entries));
  const subject = "Timesheet - " + getDisplayWorkerName() + " - " + week.weekLabel;
  const body = buildTimesheetEmailBody(week.entries, week.weekLabel, totalHours, week.note || "");
  const pdfHtml = buildTimesheetPdfHtml(week.entries, week.weekLabel, totalHours, week.note || "");

  await sendTimesheetEmail(subject, body, week.weekLabel, pdfHtml);
}

function openTimesheetMailto(subject, body) {
  window.location.href =
    "mailto:zeth@johngordonconstruction.com" +
    "?subject=" + encodeURIComponent(subject) +
    "&body=" + encodeURIComponent(body);
}

async function sendTimesheetEmail(subject, body, weekLabel, pdfHtml) {
  const status = document.getElementById("submitStatus");

  if (status) {
    status.innerText = "Sending timesheet email...";
  }

  if (!TIMESHEET_EMAIL_SCRIPT_URL) {
    alert("Automatic email sending is not set up yet. Your email app will open instead.");
    openTimesheetMailto(subject, body);
    return;
  }

  try {
    await fetch(TIMESHEET_EMAIL_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        subject,
        body,
        text: body,
        pdfHtml,
        pdfFileName: "timesheet-" + makeSafeEmailFileName(getDisplayWorkerName() + "-" + weekLabel) + ".pdf",
        worker: getDisplayWorkerName(),
        weekLabel
      })
    });

    if (status) {
      status.innerText = "Timesheet email sent.";
    }

    alert("Timesheet email sent.");
  } catch (error) {
    alert("Automatic email could not be sent. Your email app will open instead.");
    openTimesheetMailto(subject, body);
  }
}

function makeSafeEmailFileName(value) {
  return String(value || "timesheet")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-|-$/g, "");
}

async function sendTimesheetEmailWithSupabase(subject, body, weekLabel) {
  if (!supabaseClient) {
    openTimesheetMailto(subject, body);
    return;
  }

  const { error } = await supabaseClient.functions.invoke("send-timesheet-email", {
    body: {
      subject,
      text: body,
      worker: getDisplayWorkerName(),
      weekLabel
    }
  });

  if (error) {
    openTimesheetMailto(subject, body);
  }
}

async function archiveCurrentEntries(entries, totalHours, weekLabel, note) {
  const archiveRecord = {
    workerName: currentUser,
    weekLabel,
    entries,
    totalHours,
    note,
    submittedAt: new Date().toISOString()
  };
  let warning = "";

  if (supabaseClient) {
    const { error: insertError } = await supabaseClient
      .from("previous_timesheet_weeks")
      .insert({
        worker_name: currentUser,
        week_label: weekLabel,
        entries,
        total_hours: totalHours,
        note
      });

    if (insertError) {
      warning = "The email will open, but this week could not be saved online to Previous Weeks. It was saved on this phone/browser only.";
    } else {
      const { data: archives, error: archiveError } = await supabaseClient
        .from("previous_timesheet_weeks")
        .select("id, week_label, entries, submitted_at")
        .eq("worker_name", currentUser);

      if (!archiveError && archives) {
        const cutoffTime = getPreviousTimesheetCutoffTime();
        const oldIds = archives.filter(function(archive) {
          const archiveRecord = {
            weekLabel: archive.week_label,
            entries: Array.isArray(archive.entries) ? archive.entries : [],
            submittedAt: archive.submitted_at
          };

          return getPreviousWeekSavedTime(archiveRecord) < cutoffTime;
        }).map(function(archive) {
          return archive.id;
        });

        if (oldIds.length) {
          await supabaseClient
            .from("previous_timesheet_weeks")
            .delete()
            .in("id", oldIds);
        }
      }
    }

    const { error: deleteError } = await supabaseClient
      .from("timesheet_entries")
      .delete()
      .eq("worker_name", currentUser);

    if (deleteError) {
      warning = warning || "The email will open, but the current week could not be reset online. Please refresh and use Clear My Entries if the entries still show.";
    }
  }

  previousWeeks = filterPreviousWeeksForRetention([archiveRecord].concat(previousWeeks)).sort(sortPreviousWeeksByDate);
  saveFallbackPreviousWeeks(previousWeeks);
  memoryTimesheets = [];
  saveFallbackTimesheets(mergeFallbackTimesheets([]));
  clearEditMode();
  resetTimeEntryFields();
  entriesTab = "previous";
  document.getElementById("currentTabButton").classList.remove("active-tab");
  document.getElementById("previousTabButton").classList.add("active-tab");
  render();
  updateJobSuggestions();
  return {
    success: true,
    warning
  };
}

function getTotalHours(entries) {
  return entries.reduce(function(total, entry) {
    return total + Number(entry.hours);
  }, 0);
}

function getDisplayWorkerName() {
  return currentUserDisplay || currentUser;
}

function getWeekdayNames() {
  return ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
}

function getEntryType(entry) {
  const explicitType = entry && (entry.entryType || entry.entry_type);
  const jobName = String((entry && (entry.jobName || entry.job_name)) || "").toLowerCase();

  if (explicitType) {
    return explicitType;
  }

  if (jobName.includes("sick day")) {
    return "sick";
  }

  if (jobName.includes("vacation day")) {
    return "vacation";
  }

  if (jobName.includes("civic holiday") || jobName.includes("holiday")) {
    return "civic_holiday";
  }

  return "work";
}

function getEntryTypeLabel(entry) {
  const type = getEntryType(entry);
  const rawLeaveType = entry && (entry.leaveType || entry.leave_type);
  const leaveTypeLabel = rawLeaveType === "half_day" ? "Half Day" : capitalizeWords(rawLeaveType);
  const leaveType = rawLeaveType ? " - " + leaveTypeLabel : "";

  if (type === "sick") {
    return "Sick Day";
  }

  if (type === "vacation") {
    return "Vacation Day" + leaveType;
  }

  if (type === "civic_holiday") {
    return "Civic Holiday";
  }

  return "Work";
}

function getEntryLeaveNote(entry) {
  return (entry && (entry.leaveNote || entry.leave_note)) || "";
}

function isLeaveEntry(entry) {
  return getEntryType(entry) !== "work";
}

function capitalizeWords(value) {
  return String(value || "")
    .replace(/_/g, " ")
    .replace(/\b\w/g, function(letter) {
      return letter.toUpperCase();
    });
}

function getSpecialEntryJobName(entryType, leaveType) {
  if (entryType === "sick") {
    return "Sick Day";
  }

  if (entryType === "vacation") {
    return "Vacation Day" + (leaveType ? " - " + capitalizeWords(leaveType) : "");
  }

  if (entryType === "civic_holiday") {
    return "Civic Holiday";
  }

  return "";
}

function getNthWeekdayOfMonth(year, monthIndex, weekday, nth) {
  const date = new Date(year, monthIndex, 1);
  const offset = (weekday - date.getDay() + 7) % 7;
  date.setDate(1 + offset + ((nth - 1) * 7));
  return date;
}

function getLastWeekdayOfMonth(year, monthIndex, weekday) {
  const date = new Date(year, monthIndex + 1, 0);
  const offset = (date.getDay() - weekday + 7) % 7;
  date.setDate(date.getDate() - offset);
  return date;
}

function getEasterSunday(year) {
  const a = year % 19;
  const b = Math.floor(year / 100);
  const c = year % 100;
  const d = Math.floor(b / 4);
  const e = b % 4;
  const f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4);
  const k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31);
  const day = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(year, month - 1, day);
}

function observedWeekdayHoliday(year, monthIndex, day) {
  const date = new Date(year, monthIndex, day);

  if (date.getDay() === 6) {
    date.setDate(date.getDate() + 2);
  } else if (date.getDay() === 0) {
    date.setDate(date.getDate() + 1);
  }

  return date;
}

function getVictoriaDay(year) {
  const date = new Date(year, 4, 24);
  date.setDate(date.getDate() - ((date.getDay() + 6) % 7));
  return date;
}

function getChristmasAndBoxingDay(year) {
  const christmas = observedWeekdayHoliday(year, 11, 25);
  const boxingDay = observedWeekdayHoliday(year, 11, 26);

  if (formatDateValue(christmas) === formatDateValue(boxingDay)) {
    boxingDay.setDate(boxingDay.getDate() + 1);
  }

  return [
    { name: "Christmas Day", date: christmas },
    { name: "Boxing Day", date: boxingDay }
  ];
}

function getOntarioHolidaysForYear(year) {
  const easter = getEasterSunday(year);
  const goodFriday = new Date(easter);
  goodFriday.setDate(easter.getDate() - 2);

  return [
    { name: "New Year's Day", date: observedWeekdayHoliday(year, 0, 1) },
    { name: "Family Day", date: getNthWeekdayOfMonth(year, 1, 1, 3) },
    { name: "Good Friday", date: goodFriday },
    { name: "Victoria Day", date: getVictoriaDay(year) },
    { name: "Canada Day", date: observedWeekdayHoliday(year, 6, 1) },
    { name: "Civic Holiday", date: getNthWeekdayOfMonth(year, 7, 1, 1) },
    { name: "Labour Day", date: getNthWeekdayOfMonth(year, 8, 1, 1) },
    { name: "Thanksgiving Day", date: getNthWeekdayOfMonth(year, 9, 1, 2) }
  ].concat(getChristmasAndBoxingDay(year));
}

function getOntarioHolidayEntriesForWeek(weekStart, selectedDate) {
  const weekEnd = new Date(weekStart);
  weekEnd.setDate(weekStart.getDate() + 6);
  const years = [...new Set([weekStart.getFullYear(), weekEnd.getFullYear()])];
  const existingDays = new Set(loadTimesheets().map(function(entry) {
    return entry.day;
  }));

  return years.flatMap(getOntarioHolidaysForYear).filter(function(holiday) {
    const holidayTime = holiday.date.getTime();

    return holiday.date.getDay() >= 1 &&
      holiday.date.getDay() <= 5 &&
      holidayTime >= weekStart.getTime() &&
      holidayTime <= weekEnd.getTime() &&
      holidayTime < selectedDate.getTime() &&
      !existingDays.has(getDayNames()[holiday.date.getDay()]);
  });
}

async function addOntarioHolidayEntriesForWeek(weekStartValue, selectedDay) {
  const weekStart = makeLocalDate(weekStartValue);
  const selectedDate = new Date(weekStart);
  const selectedDayIndex = getDayNames().indexOf(selectedDay);

  if (selectedDayIndex < 0) {
    return 0;
  }

  selectedDate.setDate(weekStart.getDate() + selectedDayIndex);

  const holidays = getOntarioHolidayEntriesForWeek(weekStart, selectedDate);

  if (!holidays.length) {
    return 0;
  }

  const weekEnd = new Date(weekStart);
  weekEnd.setDate(weekStart.getDate() + 6);
  let stored = loadTimesheets();
  let addedCount = 0;

  for (let holiday of holidays) {
    const holidayEntry = {
      id: "holiday-" + formatDateValue(holiday.date) + "-" + Math.random().toString(36).slice(2, 8),
      user: currentUser,
      weekStartValue,
      weekStart: formatDate(weekStart),
      weekEnd: formatDate(weekEnd),
      jobName: "Civic Holiday",
      jobNumber: "",
      day: getDayNames()[holiday.date.getDay()],
      timeIn: "00:00",
      timeOut: "00:00",
      hours: 0,
      tookLunch: false,
      nightWork: false,
      entryType: "civic_holiday",
      leaveType: "",
      leaveNote: holiday.name
    };

    if (supabaseClient) {
      const { data, error } = await supabaseClient
        .from("timesheet_entries")
        .insert(entryToRow(holidayEntry))
        .select()
        .single();

      if (!error && data) {
        stored.push(rowToEntry(data));
        addedCount++;
      }
    } else {
      stored.push(holidayEntry);
      addedCount++;
    }
  }

  if (addedCount) {
    setTimesheets(stored);
  }

  return addedCount;
}

function getMissingMandatoryWeekdays(entries) {
  const coveredDays = new Set(
    entries
      .filter(function(entry) {
        return getWeekdayNames().includes(entry.day);
      })
      .map(function(entry) {
        return entry.day;
      })
  );

  return getWeekdayNames().filter(function(day) {
    return !coveredDays.has(day);
  });
}

function getWeekLabel(entries) {
  const weeks = [];

  for (let entry of entries) {
    const label = entry.weekStart + " to " + entry.weekEnd;

    if (!weeks.includes(label)) {
      weeks.push(label);
    }
  }

  return weeks.length === 1 ? weeks[0] : "Multiple Weeks";
}

function getEmailDayOrder() {
  return ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
}

function sortEntriesForEmail(entries) {
  const dayOrder = getEmailDayOrder();

  return entries.slice().sort(function(a, b) {
    const dayDifference = dayOrder.indexOf(a.day) - dayOrder.indexOf(b.day);

    if (dayDifference !== 0) {
      return dayDifference;
    }

    const jobDifference = a.jobName.localeCompare(b.jobName);

    if (jobDifference !== 0) {
      return jobDifference;
    }

    return a.timeIn.localeCompare(b.timeIn);
  });
}

function getEntriesByEmailDay(entries) {
  const sortedEntries = sortEntriesForEmail(entries);

  return getEmailDayOrder().map(function(day) {
    const dayEntries = sortedEntries.filter(function(entry) {
      return entry.day === day;
    });

    if (dayEntries.length === 0) {
      return null;
    }

    return {
      day,
      heading: getEmailDayHeading(day, dayEntries),
      entries: dayEntries,
      table: getEmailTableRows(dayEntries)
    };
  }).filter(Boolean);
}

function getEmailDayHeading(day, entries) {
  const entryDate = entries.length ? getDateForEntry(entries[0]) : null;

  if (!entryDate) {
    return day;
  }

  return day + " - " + formatDate(entryDate);
}

function padCell(value, width) {
  const text = String(value);

  if (text.length > width) {
    return text.slice(0, width - 1) + ".";
  }

  return text + " ".repeat(width - text.length);
}

function getEmailTableRows(entries) {
  const columns = [
    { label: "Job / Day", width: 22 },
    { label: "Job #", width: 8 },
    { label: "Type", width: 16 },
    { label: "Note", width: 18 },
    { label: "Lunch", width: 7 },
    { label: "Night", width: 7 },
    { label: "Time", width: 13 },
    { label: "Hours", width: 6 }
  ];

  const header = columns.map(function(column) {
    return padCell(column.label, column.width);
  }).join(" | ");

  const divider = columns.map(function(column) {
    return "-".repeat(column.width);
  }).join("-+-");

  const rows = entries.map(function(entry) {
    const values = [
      entry.jobName,
      entry.jobNumber,
      getEntryTypeLabel(entry),
      getEntryLeaveNote(entry),
      entry.tookLunch ? "Yes" : "No",
      entry.nightWork ? "Yes" : "No",
      isLeaveEntry(entry) && entry.leaveType !== "half_day" ? "" : entry.timeIn + "-" + entry.timeOut,
      Number(entry.hours).toFixed(2)
    ];

    return values.map(function(value, index) {
      return padCell(value, columns[index].width);
    }).join(" | ");
  });

  return {
    header,
    divider,
    rows
  };
}

function renderEditRows(entries) {
  const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

  return entries.slice().sort(function(a, b) {
    const dayDifference = days.indexOf(a.day) - days.indexOf(b.day);

    if (dayDifference !== 0) {
      return dayDifference;
    }

    const jobDifference = a.jobName.localeCompare(b.jobName);

    if (jobDifference !== 0) {
      return jobDifference;
    }

    return a.timeIn.localeCompare(b.timeIn);
  }).map(function(entry) {
    return `
      <tr>
        <td data-label="Day">${escapeHtml(entry.day)}</td>
        <td data-label="Type">${escapeHtml(getEntryTypeLabel(entry))}</td>
        <td data-label="Job Name">${escapeHtml(entry.jobName)}</td>
        <td data-label="Job Number">${escapeHtml(entry.jobNumber)}</td>
        <td data-label="Actions">
          <div class="edit-actions">
            <button type="button" class="edit-button" onclick="editEntry('${escapeHtml(entry.id)}')">Edit</button>
            <button type="button" class="delete-entry-button" onclick="deleteEntry('${escapeHtml(entry.id)}')">Delete</button>
          </div>
        </td>
      </tr>
    `;
  }).join("");
}

function renderEditEntriesTab(entries) {
  if (entries.length === 0) {
    document.getElementById("entries").innerHTML =
      '<div class="small">No entries available to edit yet.</div>';
    return;
  }

  document.getElementById("entries").innerHTML = `
    <h3>Edit Entries</h3>
    <div class="table-wrap edit-table-wrap">
      <table class="edit-table">
        <thead>
          <tr>
            <th>Day</th>
            <th>Type</th>
            <th>Job Name</th>
            <th>Job Number</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          ${renderEditRows(entries)}
        </tbody>
      </table>
    </div>
  `;
}

function renderPreviousWeeks() {
  if (previousWeeks.length === 0) {
    document.getElementById("entries").innerHTML =
      '<div class="small">No previous timesheets saved in the last 2 months.</div>';
    return;
  }

  const retentionNote = '<div class="small" style="margin-bottom:12px;">Showing submitted timesheets from the last 2 months.</div>';
  const weeksHtml = previousWeeks.map(function(week) {
    const weekIndex = previousWeeks.indexOf(week);
    const groups = getEntriesByEmailDay(week.entries || []);
    const groupHtml = groups.map(function(group) {
      const rows = group.entries.map(function(entry) {
        return `
          <tr>
            <td data-label="Job Name">${escapeHtml(entry.jobName)}</td>
            <td data-label="Job Number">${escapeHtml(entry.jobNumber)}</td>
            <td data-label="Type">${escapeHtml(getEntryTypeLabel(entry))}</td>
            <td data-label="Note">${escapeHtml(getEntryLeaveNote(entry))}</td>
            <td data-label="Lunch"><input type="checkbox" disabled ${entry.tookLunch ? "checked" : ""} /></td>
            <td data-label="Night Work"><input type="checkbox" disabled ${entry.nightWork ? "checked" : ""} /></td>
            <td data-label="Time">${isLeaveEntry(entry) && entry.leaveType !== "half_day" ? "" : escapeHtml(entry.timeIn) + "-" + escapeHtml(entry.timeOut)}</td>
            <td data-label="Hours"><b>${Number(entry.hours).toFixed(2)}</b></td>
          </tr>
        `;
      }).join("");

      return `
        <h3>${escapeHtml(group.day)}</h3>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Job Name</th>
                <th>Job Number</th>
                <th>Type</th>
                <th>Note</th>
                <th>Lunch</th>
                <th>Night Work</th>
                <th>Time</th>
                <th>Hours</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }).join("");

    return `
      <div class="previous-week">
        <div class="email-actions">
          <h3>${escapeHtml(week.weekLabel)}</h3>
          <button type="button" onclick="resubmitPreviousWeek(${weekIndex})">Resubmit This Week</button>
        </div>
        ${groupHtml}
        ${week.note ? '<div class="small"><b>Note:</b> ' + escapeHtml(week.note) + '</div>' : ''}
        <div class="small"><b>Total Hours:</b> ${Number(week.totalHours).toFixed(2)}</div>
      </div>
    `;
  }).join("");

  document.getElementById("entries").innerHTML = retentionNote + weeksHtml;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, function(character) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[character];
  });
}

function render() {
  renderTimesheetCalendar();

  if (entriesTab === "previous") {
    renderPreviousWeeks();
    return;
  }

  const entries = loadTimesheets();
  const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

  if (entriesTab === "edit") {
    renderEditEntriesTab(entries);
    return;
  }

  if (entries.length === 0) {
    document.getElementById("entries").innerHTML =
      '<div class="small">No entries submitted yet.</div>';
    return;
  }

  const sortedEntries = entries.slice().sort(function(a, b) {
    const dayDifference = days.indexOf(a.day) - days.indexOf(b.day);

    if (dayDifference !== 0) {
      return dayDifference;
    }

    return String(a.jobName || "").localeCompare(String(b.jobName || ""));
  });

  const dailyRows = sortedEntries.map(function(entry) {
    const isLeave = isLeaveEntry(entry);
    const note = getEntryLeaveNote(entry);
    const timeText = isLeave && entry.leaveType !== "half_day" ? "" : escapeHtml(entry.timeIn) + "-" + escapeHtml(entry.timeOut);

    return `
      <tr>
        <td>${escapeHtml(entry.day || "")}</td>
        <td>${escapeHtml(isLeave ? getEntryTypeLabel(entry) : entry.jobName)}</td>
        <td>${escapeHtml(isLeave ? note : entry.jobNumber)}</td>
        <td>${timeText}</td>
        <td>${Number(entry.hours || 0).toFixed(2)}</td>
      </tr>
    `;
  }).join("");

  const rows = sortedEntries.map(function(entry) {
    const dayCells = days.map(function(day) {
      if (entry.day !== day) {
        return '<td data-label="' + day + '" class="empty-cell">-</td>';
      }

      if (isLeaveEntry(entry)) {
        const note = getEntryLeaveNote(entry);
        const timeText = entry.leaveType === "half_day" ? '<div class="small">' + escapeHtml(entry.timeIn) + '-' + escapeHtml(entry.timeOut) + '</div>' : "";
        return '<td data-label="' + day + '"><b>' + escapeHtml(getEntryTypeLabel(entry)) + '</b>' + timeText + (note ? '<div class="small">' + escapeHtml(note) + '</div>' : "") + '</td>';
      }

      return '<td data-label="' + day + '"><b>' + Number(entry.hours || 0).toFixed(2) + "</b></td>";
    }).join("");

    return `
      <tr>
        <td data-label="Job Name">${escapeHtml(isLeaveEntry(entry) ? getEntryTypeLabel(entry) : entry.jobName)}</td>
        <td data-label="Job Number">${escapeHtml(isLeaveEntry(entry) ? "" : entry.jobNumber)}</td>
        <td data-label="Night Work"><input type="checkbox" disabled ${entry.nightWork ? "checked" : ""} /></td>
        ${dayCells}
      </tr>
    `;
  }).join("");

  document.getElementById("entries").innerHTML = `
    <h3>Daily Entries</h3>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Day</th>
            <th>Entry</th>
            <th>Job # / Note</th>
            <th>Time</th>
            <th>Hours</th>
          </tr>
        </thead>
        <tbody>
          ${dailyRows}
        </tbody>
      </table>
    </div>
    <h3>Weekly Summary</h3>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Job Name</th>
            <th>Job Number</th>
            <th>Night Work</th>
            <th>Sunday</th>
            <th>Monday</th>
            <th>Tuesday</th>
            <th>Wednesday</th>
            <th>Thursday</th>
            <th>Friday</th>
            <th>Saturday</th>
          </tr>
        </thead>
        <tbody>
          ${rows}
        </tbody>
      </table>
    </div>
    <div class="email-actions">
      <button type="button" onclick="emailEntries()">Submit & Email</button>
      <span class="email-note">please send email at end of day Friday</span>
    </div>
  `;
}

if (currentUser) {
  showCurrentUser();
  fillTimeOptions();
  updateEntryTypeFields();
  setTimesheets(loadFallbackTimesheets());
  previousWeeks = loadFallbackPreviousWeeks();
  selectedCalendarDate = new Date();
  calendarMonth = new Date(selectedCalendarDate.getFullYear(), selectedCalendarDate.getMonth(), 1);
  render();
  loadActiveJobs();
  loadTimesheetsFromSupabase();
  loadPreviousWeeksFromSupabase({ render: false }).then(function() {
    renderTimesheetCalendar();
  });
}
</script>

</body>
</html>
