<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="googlebot" content="noindex, nofollow, noarchive" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JGC Job Safety Analysis</title>
<link rel="stylesheet" href="styles.css?v=2">

<style>
body {
    font-family: Arial, sans-serif;
    background: #8f9691;
    margin: 0;
    padding: 20px;
    color: #1f2a24;
}

.logo-wrap {
    max-width: 347px;
    margin: 0 auto 8px;
    text-align: center;
}

.logo-wrap img {
    width: 100%;
    max-width: 347px;
    height: auto;
    display: block;
    margin: 0 auto;
}

.container {
    max-width: 1200px;
    margin: auto;
    background: #fbfcf9;
    padding: 20px;
    border-radius: 8px;
    border-top: 4px solid #3f7d4d;
    box-shadow: 0 3px 10px rgba(0,0,0,.18);
}

h1 {
    text-align: center;
    margin-bottom: 5px;
    color: #2f6f3c;
}

.subtitle {
    text-align: center;
    font-weight: bold;
    margin-bottom: 20px;
}

.user-bar {
    max-width: 1200px;
    margin: 0 auto 12px;
    color: #ffffff;
    text-align: center;
    font-size: 13px;
    font-weight: bold;
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 15px;
}

.field {
    display: flex;
    flex-direction: column;
}

label {
    font-weight: bold;
    margin-bottom: 4px;
}

input[type=text],
input[type=date],
select,
textarea {
    padding: 8px;
    border: 1px solid #b8c2b2;
    border-radius: 5px;
    background: #f7f9f4;
    box-sizing: border-box;
}

input:focus,
select:focus,
textarea:focus {
    border-color: #3f7d4d;
    outline: 2px solid #d9ead5;
}

.checklist {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 8px;
    margin: 20px 0;
}

.checklist label {
    font-weight: normal;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
    background: #ffffff;
}

table th,
table td {
    border: 1px solid #c5cec1;
    padding: 6px;
    vertical-align: top;
}

table th {
    background: #dfe9da;
    color: #1f3d28;
}

table textarea {
    width: 100%;
    min-height: 60px;
    resize: vertical;
    border: none;
    background: #ffffff;
}

button {
    padding: 10px 15px;
    border: none;
    background: #3f7d4d;
    color: white;
    cursor: pointer;
    border-radius: 5px;
    font-weight: bold;
}

button:hover {
    background: #315f3c;
}

.secondary {
    background: #5f6a62;
}

.secondary:hover {
    background: #48514a;
}

.danger {
    background: #9a3f3f;
}

.danger:hover {
    background: #7e3030;
}

.actions {
    margin-top: 15px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.signoff {
    margin-top: 20px;
}

.signoff textarea {
    width: 100%;
    min-height: 100px;
}

.crew-picker-grid {
    display: grid;
    grid-template-columns: minmax(220px, 1fr) auto;
    gap: 10px;
    align-items: end;
    margin-bottom: 10px;
}

.manual-crew-grid {
    grid-template-columns: minmax(220px, 420px) auto;
    max-width: 580px;
}

.manual-crew-grid input {
    width: 100%;
}

.crew-selected-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 8px 0 12px;
    min-height: 32px;
}

.crew-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 9px;
    border-radius: 6px;
    background: #dfe9da;
    color: #1f3d28;
    font-weight: bold;
}

.crew-pill button {
    padding: 2px 7px;
    min-height: 0;
    background: #9a3f3f;
}

.crew-help {
    margin: 5px 0 8px;
    font-size: 12px;
    color: #4f5c54;
}

.crew-status {
    margin-top: 4px;
    font-size: 12px;
    color: #4f5c54;
}

.signoff textarea[readonly] {
    background: #eef3ec;
    color: #1f2a24;
}

.post-save-qr {
    margin-top: 18px;
    padding: 16px;
    border: 1px solid #b8cbb4;
    border-radius: 6px;
    background: #ffffff;
    color: #1f2a24;
}

.post-save-qr[hidden] {
    display: none;
}

.post-save-qr h2 {
    margin-top: 0;
    color: #2f6f3c;
}

.post-save-qr p {
    color: #1f2a24;
}

.post-save-qr strong {
    color: #123d22;
}

.post-save-qr .qr-wrap {
    margin-top: 12px;
}

.post-save-qr canvas {
    display: block;
    max-width: 100%;
    height: auto;
    margin-top: 8px;
    border: 1px solid #d4ded1;
}

.post-save-qr .small,
.post-save-qr a {
    color: #123d22;
    font-weight: 600;
}

@media(max-width: 768px) {
    body {
        padding: 10px;
    }

    .logo-wrap {
        max-width: 260px;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .actions {
        display: grid;
        grid-template-columns: 1fr;
    }

    .crew-picker-grid {
        grid-template-columns: 1fr;
    }

    button {
        width: 100%;
        min-height: 42px;
    }

    .crew-pill button {
        width: auto;
        min-height: 0;
    }

    table {
        min-width: 760px;
    }

    .table-wrap {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
    }
}

@media print {
    body {
        background: #ffffff;
        padding: 0;
    }

    .logo-wrap,
    .user-bar,
    .actions,
    .crew-picker-grid,
    .crew-selected-list,
    .crew-help,
    .crew-status,
    .delete-column,
    .delete-cell {
        display: none;
    }

    .container {
        box-shadow: none;
        border: none;
        max-width: none;
    }
}
</style>
</head>

<body>

<div class="logo-wrap">
    <img src="logo.png" alt="John Gordon Construction">
</div>

<div id="currentUser" class="user-bar"></div>

<div class="container">

<h1>John Gordon Construction</h1>
<div class="subtitle">Job Safety Analysis Form - Must be Filled Out Daily</div>

<div class="grid">
    <div class="field">
        <label>Contractor</label>
        <input type="text" value="John Gordon Construction">
    </div>

    <div class="field">
        <label>Project / Job</label>
        <input type="text" data-jgc-project-job placeholder="Select project/job or type manually">
    </div>

    <div class="field">
        <label>Location</label>
        <input type="text">
    </div>

    <div class="field">
        <label>Date</label>
        <input type="date">
    </div>

    <div class="field">
        <label>Contractor Supervisor</label>
        <input type="text">
    </div>

    <div class="field">
        <label>Reviewed By</label>
        <input type="text">
    </div>

    <div class="field">
        <label>Page</label>
        <input type="text">
    </div>

    <div class="field">
        <label>Of</label>
        <input type="text">
    </div>
</div>

<div class="checklist">
    <label><input type="checkbox"> Lockout / Tag Out</label>
    <label><input type="checkbox"> Hot Work</label>
    <label><input type="checkbox"> Confined Space</label>
    <label><input type="checkbox"> Elevated Work</label>
    <label><input type="checkbox"> Excavation</label>
    <label><input type="checkbox"> Crane / Hoisting / Rigging</label>
    <label><input type="checkbox"> Other</label>
    <label><input type="checkbox"> Other</label>
</div>

<div class="signoff">
    <label>Crew Sign Off</label>
    <div class="crew-picker-grid">
        <div>
            <label for="approvedCrewSelect">Approved Employee</label>
            <select id="approvedCrewSelect" data-inspection-skip="true">
                <option value="">Loading approved employees...</option>
            </select>
            <div id="approvedCrewStatus" class="crew-status"></div>
        </div>
        <button type="button" onclick="addApprovedCrewMember()">Add Employee</button>
    </div>
    <div id="selectedCrewList" class="crew-selected-list"></div>
    <label for="manualCrewInput">Manual Entry</label>
    <div class="crew-help">Use one person per line. For subcontractors or visitors, use Name - Company.</div>
    <div class="crew-picker-grid manual-crew-grid">
        <input id="manualCrewInput" type="text" data-inspection-skip="true" placeholder="Example: Stanley Square - ABC Concrete" onkeydown="handleManualCrewKey(event)">
        <button type="button" onclick="addManualCrewMember()">Add Employee</button>
    </div>
    <div id="manualCrewList" class="crew-selected-list"></div>
    <label for="crewSignOffCombined">Crew Sign Off (Print Names)</label>
    <textarea id="crewSignOffCombined" readonly placeholder="Approved employees and manual entries will appear here."></textarea>
</div>

<div class="table-wrap">
    <table id="jsaTable">
        <thead>
            <tr>
                <th>Sequence of Basic Job Steps</th>
                <th>Potential Hazards</th>
                <th>Required Action or Procedure</th>
                <th class="delete-column">Delete</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr>
                <td><textarea></textarea></td>
                <td><textarea></textarea></td>
                <td><textarea></textarea></td>
                <td class="delete-cell"><button class="danger" onclick="removeRow(this)">X</button></td>
            </tr>
        </tbody>
    </table>
</div>

<div class="actions">
    <button onclick="addRow()">Add Row</button>
    <button onclick="handleInspectionSave('JSA')">Save</button>
    <button class="secondary" onclick="window.location.href='reports.html'">Reports</button>
    <button class="secondary" onclick="window.location.href='home.html'">Home</button>
    <button class="secondary" onclick="signOut()">Sign Out</button>
</div>
<div id="inspectionSaveStatus" class="subtitle"></div>
<div id="jsaPostSaveQrPanel" class="post-save-qr" hidden></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="common.js?v=23"></script>
<script src="safety-acknowledgements.js?v=3"></script>
<script src="inspection-records.js?v=7"></script>
<script>
const currentWorker = localStorage.getItem("currentWorker");
const currentWorkerDisplay = localStorage.getItem("currentWorkerDisplay") || currentWorker;
let approvedCrewWorkers = [];
const selectedCrewMembers = new Map();
const manualCrewMembers = new Map();

if (!currentWorker) {
    window.location.href = "index.html";
}

document.getElementById("currentUser").innerText = "Signed in as: " + currentWorkerDisplay;

function escapeJsaHtml(value) {
    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function getCrewWorkerKey(workerRow) {
    if (workerRow && workerRow.worker_key) {
        return workerRow.worker_key;
    }

    if (typeof normalizeWorkerName === "function") {
        return normalizeWorkerName(workerRow && workerRow.display_name || "");
    }

    return String(workerRow && workerRow.display_name || "").trim().toLowerCase();
}

function setApprovedCrewStatus(message) {
    const status = document.getElementById("approvedCrewStatus");
    if (status) {
        status.textContent = message || "";
    }
}

function renderApprovedCrewSelect() {
    const select = document.getElementById("approvedCrewSelect");

    if (!select) {
        return;
    }

    const availableWorkers = approvedCrewWorkers.filter((workerRow) => !selectedCrewMembers.has(getCrewWorkerKey(workerRow)));

    if (!availableWorkers.length) {
        select.innerHTML = '<option value="">No approved employees available</option>';
        return;
    }

    select.innerHTML = '<option value="">Select approved employee</option>' + availableWorkers.map((workerRow) => {
        const key = getCrewWorkerKey(workerRow);
        const label = workerRow.display_name || key;
        return `<option value="${escapeJsaHtml(key)}">${escapeJsaHtml(label)}</option>`;
    }).join("");
}

function renderSelectedCrewMembers() {
    const list = document.getElementById("selectedCrewList");

    if (!list) {
        return;
    }

    if (!selectedCrewMembers.size) {
        list.innerHTML = '<div class="crew-help">No approved employees selected yet.</div>';
        return;
    }

    list.innerHTML = Array.from(selectedCrewMembers.values()).map((workerRow) => {
        const key = getCrewWorkerKey(workerRow);
        const label = workerRow.display_name || key;
        return `
            <span class="crew-pill">
                ${escapeJsaHtml(label)}
                <button type="button" onclick="removeApprovedCrewMember('${escapeJsaHtml(key)}')" aria-label="Remove ${escapeJsaHtml(label)}">X</button>
            </span>
        `;
    }).join("");
}

function getManualCrewKey(name) {
    return typeof normalizeWorkerName === "function"
        ? normalizeWorkerName(name)
        : String(name || "").trim().toLowerCase();
}

function getManualCrewLines() {
    return Array.from(manualCrewMembers.values());
}

function renderManualCrewMembers() {
    const list = document.getElementById("manualCrewList");

    if (!list) {
        return;
    }

    if (!manualCrewMembers.size) {
        list.innerHTML = '<div class="crew-help">No manual entries added yet.</div>';
        return;
    }

    list.innerHTML = Array.from(manualCrewMembers.entries()).map(([key, name]) => `
        <span class="crew-pill">
            ${escapeJsaHtml(name)}
            <button type="button" onclick="removeManualCrewMember('${escapeJsaHtml(encodeURIComponent(key))}')" aria-label="Remove ${escapeJsaHtml(name)}">X</button>
        </span>
    `).join("");
}

function syncCrewSignOffField() {
    const field = document.getElementById("crewSignOffCombined");

    if (!field) {
        return;
    }

    const seen = new Set();
    const lines = Array.from(selectedCrewMembers.values())
        .map((workerRow) => workerRow.display_name || getCrewWorkerKey(workerRow))
        .concat(getManualCrewLines())
        .filter((line) => {
            const key = typeof normalizeWorkerName === "function" ? normalizeWorkerName(line) : String(line).toLowerCase();

            if (!key || seen.has(key)) {
                return false;
            }

            seen.add(key);
            return true;
        });

    field.value = lines.join("\n");
}

function addApprovedCrewMember() {
    const select = document.getElementById("approvedCrewSelect");
    const key = select ? select.value : "";

    if (!key) {
        return;
    }

    const workerRow = approvedCrewWorkers.find((item) => getCrewWorkerKey(item) === key);

    if (!workerRow) {
        return;
    }

    selectedCrewMembers.set(key, workerRow);
    renderApprovedCrewSelect();
    renderSelectedCrewMembers();
    syncCrewSignOffField();
}

function removeApprovedCrewMember(key) {
    selectedCrewMembers.delete(key);
    renderApprovedCrewSelect();
    renderSelectedCrewMembers();
    syncCrewSignOffField();
}

function addManualCrewMember() {
    const input = document.getElementById("manualCrewInput");
    const name = String(input && input.value || "").trim().replace(/\s+/g, " ");
    const key = getManualCrewKey(name);

    if (!key) {
        return;
    }

    manualCrewMembers.set(key, name);

    if (input) {
        input.value = "";
        input.focus();
    }

    renderManualCrewMembers();
    syncCrewSignOffField();
}

function removeManualCrewMember(encodedKey) {
    manualCrewMembers.delete(decodeURIComponent(encodedKey || ""));
    renderManualCrewMembers();
    syncCrewSignOffField();
}

function handleManualCrewKey(event) {
    if (event && event.key === "Enter") {
        event.preventDefault();
        addManualCrewMember();
    }
}

async function loadApprovedCrewWorkers() {
    if (!inspectionSupabaseClient) {
        setApprovedCrewStatus("Approved employees could not be loaded.");
        renderApprovedCrewSelect();
        renderSelectedCrewMembers();
        return;
    }

    const { data, error } = await inspectionSupabaseClient
        .from("work_order_labour_workers")
        .select("id, profile_id, display_name, worker_key, approved")
        .eq("approved", true)
        .order("display_name", { ascending: true });

    if (error) {
        approvedCrewWorkers = [];
        setApprovedCrewStatus("Approved employee list could not be loaded. Use manual entry if needed.");
        renderApprovedCrewSelect();
        renderSelectedCrewMembers();
        return;
    }

    approvedCrewWorkers = (data || []).filter((workerRow) => workerRow.display_name || workerRow.worker_key);
    setApprovedCrewStatus(approvedCrewWorkers.length ? approvedCrewWorkers.length + " approved employees loaded." : "No approved employees found.");
    renderApprovedCrewSelect();
    renderSelectedCrewMembers();
    syncCrewSignOffField();
}

function addRow() {
    const row = `
    <tr>
        <td><textarea></textarea></td>
        <td><textarea></textarea></td>
        <td><textarea></textarea></td>
        <td class="delete-cell"><button class="danger" onclick="removeRow(this)">X</button></td>
    </tr>`;

    document.getElementById("tableBody").insertAdjacentHTML("beforeend", row);
}

function removeRow(button) {
    button.closest("tr").remove();
}

function showJsaSafetyQrAfterSave(savedRecord, safetyRows) {
    const rows = Array.isArray(safetyRows) ? safetyRows : [];
    const hasManualOrExternal = getManualCrewLines().length > 0 || rows.some((row) =>
        row && (row.attendee_type !== "employee" || !row.matched_employee_email)
    );
    const token = typeof safetyAckGetRecordToken === "function" ? safetyAckGetRecordToken(rows) : "";
    const panel = document.getElementById("jsaPostSaveQrPanel");

    if (!savedRecord || !savedRecord.id || !rows.length || !hasManualOrExternal || !token || !panel || typeof safetyAckQrUrl !== "function") {
        return false;
    }

    const pendingCount = rows.filter((row) => typeof safetyAckIsAcknowledged === "function" ? !safetyAckIsAcknowledged(row) : !row.acknowledged_at).length;
    const qrUrl = safetyAckQrUrl("jsa", savedRecord.id, token);

    panel.hidden = false;
    panel.innerHTML = `
        <h2>Crew QR Sign-On</h2>
        <p>This JSA was saved. Have subcontractors or manually-entered crew scan this QR code now to acknowledge the JSA.</p>
        <p><strong>${escapeJsaHtml(String(pendingCount))}</strong> pending acknowledgement${pendingCount === 1 ? "" : "s"}.</p>
        <div id="jsaPostSaveQrWrap" class="qr-wrap"></div>
        <div class="actions">
            <button type="button" onclick="window.location.href='todays-inspections.html?recordType=reports'">Today's Reports</button>
            <button type="button" class="secondary" onclick="closeJsaPostSaveQr()">Close QR</button>
        </div>
    `;

    if (typeof safetyAckRenderQr === "function") {
        safetyAckRenderQr(document.getElementById("jsaPostSaveQrWrap"), qrUrl);
    }

    panel.scrollIntoView({ behavior: "smooth", block: "start" });
    return true;
}

function closeJsaPostSaveQr() {
    const panel = document.getElementById("jsaPostSaveQrPanel");

    if (panel) {
        panel.hidden = true;
        panel.innerHTML = "";
    }
}

function handleInspectionSave(type) {
    if (typeof saveInspection !== "function") {
        alert("The inspection save file did not load. Upload inspection-records.js to the same folder as this page, then refresh.");
        return;
    }

    syncCrewSignOffField();
    saveInspection(type);
}

async function signOut() {
    await signOutJgc(inspectionSupabaseClient);
}

renderManualCrewMembers();
loadApprovedCrewWorkers();
</script>

</body>
</html>
