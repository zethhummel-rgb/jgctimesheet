<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JGC Job Safety Analysis</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #8f9691;
    margin: 0;
    padding: 20px;
    color: #1f2a24;
}

.logo-wrap {
    max-width: 347px;
    margin: 0 auto 8px;
    text-align: center;
}

.logo-wrap img {
    width: 100%;
    max-width: 347px;
    height: auto;
    display: block;
    margin: 0 auto;
}

.container {
    max-width: 1200px;
    margin: auto;
    background: #fbfcf9;
    padding: 20px;
    border-radius: 8px;
    border-top: 4px solid #3f7d4d;
    box-shadow: 0 3px 10px rgba(0,0,0,.18);
}

h1 {
    text-align: center;
    margin-bottom: 5px;
    color: #2f6f3c;
}

.subtitle {
    text-align: center;
    font-weight: bold;
    margin-bottom: 20px;
}

.user-bar {
    max-width: 1200px;
    margin: 0 auto 12px;
    color: #ffffff;
    text-align: center;
    font-size: 13px;
    font-weight: bold;
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 15px;
}

.field {
    display: flex;
    flex-direction: column;
}

label {
    font-weight: bold;
    margin-bottom: 4px;
}

input[type=text],
input[type=date],
textarea {
    padding: 8px;
    border: 1px solid #b8c2b2;
    border-radius: 5px;
    background: #f7f9f4;
    box-sizing: border-box;
}

input:focus,
textarea:focus {
    border-color: #3f7d4d;
    outline: 2px solid #d9ead5;
}

.checklist {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 8px;
    margin: 20px 0;
}

.checklist label {
    font-weight: normal;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
    background: #ffffff;
}

table th,
table td {
    border: 1px solid #c5cec1;
    padding: 6px;
    vertical-align: top;
}

table th {
    background: #dfe9da;
    color: #1f3d28;
}

table textarea {
    width: 100%;
    min-height: 60px;
    resize: vertical;
    border: none;
    background: #ffffff;
}

button {
    padding: 10px 15px;
    border: none;
    background: #3f7d4d;
    color: white;
    cursor: pointer;
    border-radius: 5px;
    font-weight: bold;
}

button:hover {
    background: #315f3c;
}

.secondary {
    background: #5f6a62;
}

.secondary:hover {
    background: #48514a;
}

.danger {
    background: #9a3f3f;
}

.danger:hover {
    background: #7e3030;
}

.actions {
    margin-top: 15px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.signoff {
    margin-top: 20px;
}

.signoff textarea {
    width: 100%;
    min-height: 100px;
}

@media(max-width: 768px) {
    body {
        padding: 10px;
    }

    .logo-wrap {
        max-width: 260px;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .actions {
        display: grid;
        grid-template-columns: 1fr;
    }

    button {
        width: 100%;
        min-height: 42px;
    }

    table {
        min-width: 760px;
    }

    .table-wrap {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
    }
}

@media print {
    body {
        background: #ffffff;
        padding: 0;
    }

    .logo-wrap,
    .user-bar,
    .actions,
    .delete-column,
    .delete-cell {
        display: none;
    }

    .container {
        box-shadow: none;
        border: none;
        max-width: none;
    }
}
</style>
</head>

<body>

<div class="logo-wrap">
    <img src="logo.png" alt="John Gordon Construction">
</div>

<div id="currentUser" class="user-bar"></div>

<div class="container">

<h1>John Gordon Construction</h1>
<div class="subtitle">Job Safety Analysis Form - Must be Filled Out Daily</div>

<div class="grid">
    <div class="field">
        <label>Contractor</label>
        <input type="text" value="John Gordon Construction">
    </div>

    <div class="field">
        <label>Project / Job</label>
        <input type="text">
    </div>

    <div class="field">
        <label>Location</label>
        <input type="text">
    </div>

    <div class="field">
        <label>Date</label>
        <input type="date">
    </div>

    <div class="field">
        <label>Contractor Supervisor</label>
        <input type="text">
    </div>

    <div class="field">
        <label>Reviewed By</label>
        <input type="text">
    </div>

    <div class="field">
        <label>Page</label>
        <input type="text">
    </div>

    <div class="field">
        <label>Of</label>
        <input type="text">
    </div>
</div>

<div class="checklist">
    <label><input type="checkbox"> Lockout / Tag Out</label>
    <label><input type="checkbox"> Hot Work</label>
    <label><input type="checkbox"> Confined Space</label>
    <label><input type="checkbox"> Elevated Work</label>
    <label><input type="checkbox"> Excavation</label>
    <label><input type="checkbox"> Crane / Hoisting / Rigging</label>
    <label><input type="checkbox"> Other</label>
    <label><input type="checkbox"> Other</label>
</div>

<div class="signoff">
    <label>Crew Sign Off (Print Names)</label>
    <textarea></textarea>
</div>

<div class="table-wrap">
    <table id="jsaTable">
        <thead>
            <tr>
                <th>Sequence of Basic Job Steps</th>
                <th>Potential Hazards</th>
                <th>Required Action or Procedure</th>
                <th class="delete-column">Delete</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr>
                <td><textarea></textarea></td>
                <td><textarea></textarea></td>
                <td><textarea></textarea></td>
                <td class="delete-cell"><button class="danger" onclick="removeRow(this)">X</button></td>
            </tr>
        </tbody>
    </table>
</div>

<div class="actions">
    <button onclick="addRow()">Add Row</button>
    <button onclick="window.print()">Print / Save PDF</button>
    <button class="secondary" onclick="window.location.href='inspections.html'">Inspections</button>
    <button class="secondary" onclick="window.location.href='home.html'">Home</button>
    <button class="secondary" onclick="signOut()">Sign Out</button>
</div>

</div>

<script>
const currentWorker = localStorage.getItem("currentWorker");
const currentWorkerDisplay = localStorage.getItem("currentWorkerDisplay") || currentWorker;

if (!currentWorker) {
    window.location.href = "index.html";
}

document.getElementById("currentUser").innerText = "Signed in as: " + currentWorkerDisplay;

function addRow() {
    const row = `
    <tr>
        <td><textarea></textarea></td>
        <td><textarea></textarea></td>
        <td><textarea></textarea></td>
        <td class="delete-cell"><button class="danger" onclick="removeRow(this)">X</button></td>
    </tr>`;

    document.getElementById("tableBody").insertAdjacentHTML("beforeend", row);
}

function removeRow(button) {
    button.closest("tr").remove();
}

function signOut() {
    localStorage.removeItem("currentWorker");
    localStorage.removeItem("currentWorkerDisplay");
    window.location.href = "index.html";
}
</script>

</body>
</html>
