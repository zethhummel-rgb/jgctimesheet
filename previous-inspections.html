<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Previous Inspections</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #8f9691;
    margin: 0;
    padding: 20px;
    color: #1f2a24;
}

.logo-wrap {
    max-width: 347px;
    margin: 0 auto 8px;
    text-align: center;
}

.logo-wrap img {
    width: 100%;
    max-width: 347px;
    height: auto;
    display: block;
    margin: 0 auto;
}

.user-bar {
    max-width: 1200px;
    margin: 0 auto 12px;
    color: #ffffff;
    text-align: center;
    font-size: 13px;
    font-weight: bold;
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
}

.container {
    max-width: 1200px;
    margin: auto;
    background: #fbfcf9;
    padding: 20px;
    border-radius: 8px;
    border-top: 4px solid #3f7d4d;
    box-shadow: 0 3px 10px rgba(0,0,0,.18);
}

h1 {
    margin: 0 0 6px;
    text-align: center;
    color: #2f6f3c;
}

.subtitle {
    text-align: center;
    font-weight: bold;
    margin-bottom: 18px;
}

.table-wrap {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    min-width: 760px;
    border-collapse: collapse;
    background: white;
}

th,
td {
    border: 1px solid #c6cec5;
    padding: 8px;
    text-align: left;
    vertical-align: top;
}

th {
    background: #e6ece6;
}

.empty {
    padding: 18px;
    background: white;
    border: 1px solid #c6cec5;
    text-align: center;
}

.actions {
    margin-top: 20px;
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

button {
    background: #0b5e3b;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 15px;
}

button:hover {
    background: #08452b;
}

.secondary {
    background: #47534b;
}

.secondary:hover {
    background: #354039;
}

.delete-button {
    background: #b42318;
}

.delete-button:hover {
    background: #8f1d14;
}

.download-button {
    background: #2f6f3c;
}

.download-button:hover {
    background: #245832;
}

.email-button {
    background: #0b5e3b;
}

.email-button:hover {
    background: #08452b;
}

@media (max-width: 768px) {
    body {
        padding: 12px;
    }

    .container {
        padding: 14px;
    }

    table {
        font-size: 13px;
    }

    .actions button {
        width: 100%;
    }
}
</style>
</head>

<body>
<div class="logo-wrap">
    <img src="logo.png" alt="John Gordon Construction logo">
</div>

<div class="user-bar" id="userBar"></div>

<div class="container">
    <h1>Previous Inspections</h1>
    <div class="subtitle">Completed inspections from the last 2 months</div>

    <div id="inspectionList" class="empty">Loading inspections...</div>

    <div class="actions">
        <button class="secondary" onclick="window.location.href='inspections.html'">Inspections</button>
        <button class="secondary" onclick="window.location.href='home.html'">Home</button>
        <button class="secondary" onclick="signOut()">Sign Out</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="inspection-records.js?v=3"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script>
const worker = getCurrentWorker();
let inspectionRecords = [];

if (!worker.key) {
    window.location.href = "index.html";
}

document.getElementById("userBar").textContent = worker.display ? "Signed in as: " + worker.display : "";

function formatDate(value) {
    if (!value) {
        return "";
    }

    const date = new Date(value);
    if (Number.isNaN(date.getTime())) {
        return value;
    }

    return date.toLocaleDateString();
}

function escapeHtml(value) {
    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function buildDetails(record) {
    const fields = record.form_data && Array.isArray(record.form_data.fields)
        ? record.form_data.fields
        : [];

    return fields
        .filter((field) => field.value)
        .slice(0, 5)
        .map((field) => `${escapeHtml(field.label)}: ${escapeHtml(field.value)}`)
        .join("<br>");
}

async function loadInspections() {
    const list = document.getElementById("inspectionList");
    const twoMonthsAgo = new Date();
    twoMonthsAgo.setMonth(twoMonthsAgo.getMonth() - 2);

    if (!inspectionSupabaseClient) {
        list.className = "empty";
        list.textContent = "Supabase is not available right now.";
        return;
    }

    const { data, error } = await inspectionSupabaseClient
        .from("inspection_records")
        .select("*")
        .gte("created_at", twoMonthsAgo.toISOString())
        .order("created_at", { ascending: false });

    if (error) {
        list.className = "empty";
        list.textContent = "Could not load previous inspections.";
        return;
    }

    if (!data || data.length === 0) {
        list.className = "empty";
        list.textContent = "No inspections have been saved in the last 2 months.";
        return;
    }

    inspectionRecords = data;
    list.className = "table-wrap";
    list.innerHTML = `
        <table>
            <thead>
                <tr>
                    <th>Saved</th>
                    <th>Inspection Date</th>
                    <th>Inspection</th>
                    <th>Completed By</th>
                    <th>Details</th>
                    <th>PDF</th>
                    <th>Email</th>
                    <th>Delete</th>
                </tr>
            </thead>
            <tbody>
                ${data.map((record) => `
                    <tr>
                        <td>${escapeHtml(formatDate(record.created_at))}</td>
                        <td>${escapeHtml(formatDate(record.inspection_date))}</td>
                        <td>${escapeHtml(record.inspection_type)}</td>
                        <td>${escapeHtml(record.worker_display_name || record.worker_name)}</td>
                        <td>${buildDetails(record)}</td>
                        <td><button class="download-button" onclick="downloadInspectionPdf('${escapeHtml(record.id)}')">Download PDF</button></td>
                        <td><button class="email-button" onclick="emailSavedInspection('${escapeHtml(record.id)}')">Email</button></td>
                        <td><button class="delete-button" onclick="deleteInspection('${escapeHtml(record.id)}')">Delete</button></td>
                    </tr>
                `).join("")}
            </tbody>
        </table>
    `;
}

function addPdfLine(doc, text, x, y, maxWidth) {
    const lines = doc.splitTextToSize(String(text || ""), maxWidth);
    const pageHeight = doc.internal.pageSize.getHeight();

    lines.forEach((line) => {
        if (y > pageHeight - 18) {
            doc.addPage();
            y = 18;
        }

        doc.text(line, x, y);
        y += 6;
    });

    return y;
}

function safeFileName(value) {
    return String(value || "inspection")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "");
}

function downloadInspectionPdf(id) {
    const record = inspectionRecords.find((item) => item.id === id);

    if (!record) {
        alert("This inspection could not be found.");
        return;
    }

    if (!window.jspdf || !window.jspdf.jsPDF) {
        alert("PDF download is not available right now.");
        return;
    }

    const doc = new window.jspdf.jsPDF({ unit: "mm", format: "letter" });
    const pageWidth = doc.internal.pageSize.getWidth();
    const margin = 14;
    const maxWidth = pageWidth - margin * 2;
    const fields = record.form_data && Array.isArray(record.form_data.fields)
        ? record.form_data.fields
        : [];
    const rows = record.form_data && Array.isArray(record.form_data.rows)
        ? record.form_data.rows
        : [];
    let y = 16;

    doc.setFont("helvetica", "bold");
    doc.setFontSize(16);
    y = addPdfLine(doc, "John Gordon Construction", margin, y, maxWidth);
    y = addPdfLine(doc, record.inspection_type || "Inspection", margin, y + 2, maxWidth);

    doc.setFont("helvetica", "normal");
    doc.setFontSize(11);
    y = addPdfLine(doc, `Saved: ${formatDate(record.created_at)}`, margin, y + 4, maxWidth);
    y = addPdfLine(doc, `Inspection Date: ${formatDate(record.inspection_date)}`, margin, y, maxWidth);
    y = addPdfLine(doc, `Completed By: ${record.worker_display_name || record.worker_name || ""}`, margin, y, maxWidth);

    if (fields.length) {
        doc.setFont("helvetica", "bold");
        y = addPdfLine(doc, "Form Details", margin, y + 6, maxWidth);
        doc.setFont("helvetica", "normal");

        fields.forEach((field) => {
            if (field.value) {
                y = addPdfLine(doc, `${field.label}: ${field.value}`, margin, y, maxWidth);
            }
        });
    }

    if (rows.length) {
        doc.setFont("helvetica", "bold");
        y = addPdfLine(doc, "Inspection Items", margin, y + 6, maxWidth);
        doc.setFont("helvetica", "normal");

        rows.forEach((row) => {
            const text = row.cells.filter(Boolean).join(" | ");
            if (text) {
                y = addPdfLine(doc, text, margin, y, maxWidth);
            }
        });
    }

    const filename = `${safeFileName(record.inspection_type)}-${record.inspection_date || "inspection"}.pdf`;
    doc.save(filename);
}

function emailSavedInspection(id) {
    const record = inspectionRecords.find((item) => item.id === id);
    emailInspectionRecord(record);
}

async function deleteInspection(id) {
    if (!confirm("Delete this inspection?")) {
        return;
    }

    const { error } = await inspectionSupabaseClient
        .from("inspection_records")
        .delete()
        .eq("id", id);

    if (error) {
        alert("This inspection could not be deleted.");
        return;
    }

    loadInspections();
}

function signOut() {
    localStorage.removeItem("currentWorker");
    localStorage.removeItem("currentWorkerDisplay");
    window.location.href = "index.html";
}

loadInspections();
</script>
</body>
</html>
