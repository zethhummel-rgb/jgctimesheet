<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="googlebot" content="noindex, nofollow, noarchive" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Previous Inspections</title>
<!-- Deploy refresh marker: previous inspections vehicle history update. -->
<link rel="stylesheet" href="jgc-design-system.css?v=8" data-jgc-design-system="8">

<body class="inspection-history-page jgc-page jgc-system-page">
<main class="inspection-page-shell jgc-page-shell jgc-page-shell--wide">
<header class="inspection-page-header jgc-page-header">

    <img src="logo.webp" alt="John Gordon Construction logo">

<div class="container jgc-panel">
    <h1 class="jgc-section-title">Previous Inspections</h1>
    <div class="subtitle">Completed inspections from the last 2 months</div>

    <div id="inspectionList" class="empty jgc-empty-state">Loading inspections...</div>
    <div id="editPanel" class="edit-panel" hidden></div>

    <div class="actions jgc-actions">
        <button class="secondary jgc-button jgc-button--secondary" id="todaysInspectionsButton" onclick="window.location.href='todays-inspections.html'">Today's Inspections</button>
        <button class="secondary jgc-button jgc-button--secondary" id="recordHomeButton" onclick="window.location.href='inspections.html'">Inspections</button>
        <button class="secondary jgc-button jgc-button--secondary" onclick="window.location.href='home.html'">Home</button>
        <button class="secondary jgc-button jgc-button--secondary" onclick="signOut()">Sign Out</button>
    </div>
</div>
</main>

<script src="vendor/supabase-js.min.js?v=1" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';"></script>
<script src="common.js?v=41"></script>
<script src="safety-acknowledgements.js?v=7"></script>
<script src="toolbox-report-actions.js?v=1"></script>
<script src="inspection-records.js?v=11"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script>
const worker = getCurrentWorker();
let inspectionRecords = [];
let safetyAcknowledgementRows = [];
const queryParams = new URLSearchParams(window.location.search);
const pageMode = queryParams.get("recordType") || queryParams.get("type") || "";
const isPermitsView = String(pageMode).toLowerCase() === "permits";
const isReportsView = String(pageMode).toLowerCase() === "reports";

function isPermitInspectionType(type) {
    return String(type || "").toLowerCase().includes("permit");
}

function isReportInspectionType(type) {
    const value = String(type || "").toLowerCase();
    return value === "jsa" || value.includes("daily site report") || value.includes("toolbox") || value.includes("incident") || value.includes("accident");
}

function filterInspectionRows(records) {
    if (isPermitsView) {
      return (records || []).filter((record) => isPermitInspectionType(record.inspection_type));
    }

    if (isReportsView) {
      return (records || []).filter((record) => isReportInspectionType(record.inspection_type));
    }

    return records || [];
}

function applyInspectionPageCopy() {
  const title = document.querySelector("h1");
  const subtitle = document.querySelector(".subtitle");
  const todaysButton = document.getElementById("todaysInspectionsButton");
  const recordHomeButton = document.getElementById("recordHomeButton");

  if (!isPermitsView && !isReportsView) {
    return;
  }

  if (isReportsView) {
    if (title) {
      title.textContent = "Previous Reports";
    }
    if (subtitle) {
      subtitle.textContent = "Completed reports from the last 2 months";
    }
    if (todaysButton) {
      todaysButton.textContent = "Today's Reports";
      todaysButton.setAttribute("onclick", "window.location.href='todays-inspections.html?recordType=reports'");
    }
    if (recordHomeButton) {
      recordHomeButton.textContent = "Reports";
      recordHomeButton.setAttribute("onclick", "window.location.href='reports.html'");
    }
    return;
  }

  if (title) {
    title.textContent = "Previous Permits";
  }
  if (subtitle) {
    subtitle.textContent = "Completed permits from the last 2 months";
  }
  if (todaysButton) {
    todaysButton.textContent = "Today's Permits";
    todaysButton.setAttribute("onclick", "window.location.href='todays-inspections.html?recordType=permits'");
  }
  if (recordHomeButton) {
    recordHomeButton.textContent = "Permits";
    recordHomeButton.setAttribute("onclick", "window.location.href='permits.html'");
  }
}

if (!worker.key) {
    window.location.href = "index.html";
}

applyInspectionPageCopy();
document.getElementById("userBar").textContent = worker.display ? "Signed in as: " + worker.display : "";

function formatDate(value) {
    if (!value) {
        return "";
    }

    if (/^\d{4}-\d{2}-\d{2}$/.test(String(value))) {
        const [year, month, day] = String(value).split("-").map(Number);
        return new Date(year, month - 1, day).toLocaleDateString();
    }

    const date = new Date(value);
    if (Number.isNaN(date.getTime())) {
        return value;
    }

    return date.toLocaleDateString();
}

function getLocalDateKey(value) {
    if (!value) {
        return "";
    }

    const stringValue = String(value);
    if (/^\d{4}-\d{2}-\d{2}$/.test(stringValue)) {
        return stringValue;
    }

    const date = value instanceof Date ? value : new Date(value);
    if (Number.isNaN(date.getTime())) {
        return "";
    }

    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
}

function isPreviousRecord(record) {
    const recordDate = getLocalDateKey(record && (record.report_date || record.inspection_date || record.created_at));
    const today = getLocalDateKey(new Date());
    return Boolean(recordDate && today && recordDate < today);
}

function escapeHtml(value) {
    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function isVehicleInspectionRecord(record) {
    return Boolean(record && record.source_table === "vehicle_inspection_records");
}

function isToolboxTalkReportRecord(record) {
    return Boolean(record && record.report_source === "toolbox_talk_reports");
}

function getToolboxReportRecord(id) {
    return inspectionRecords.find((record) => String(record.id) === String(id) && isToolboxTalkReportRecord(record));
}

function getToolboxReportAcknowledgements(id) {
    return safetyAcknowledgementRows.filter((row) => String(row.record_id || "") === String(id || ""));
}

function openPreviousToolboxReport(id) {
    if (!window.JGCToolboxReports) return;
    window.JGCToolboxReports.openReport(id, "view", "previous");
}

function printPreviousToolboxReport(id) {
    if (!window.JGCToolboxReports) return;
    window.JGCToolboxReports.printReport(getToolboxReportRecord(id), getToolboxReportAcknowledgements(id));
}

async function emailPreviousToolboxReport(id) {
    if (!window.JGCToolboxReports) return;
    await window.JGCToolboxReports.emailReport(getToolboxReportRecord(id), {
        acknowledgementRows: getToolboxReportAcknowledgements(id)
    });
}

function renderPreviousViewCell(record) {
    if (isToolboxTalkReportRecord(record)) {
        return `<button class="jgc-button" onclick="openPreviousToolboxReport('${escapeHtml(record.id)}')">View</button>`;
    }
    if (isVehicleInspectionRecord(record)) {
        return `<button class="jgc-button" onclick="viewVehicleInspectionById('${escapeHtml(record.id)}')">View</button>`;
    }
    return "-";
}

function renderPreviousPdfCell(record) {
    if (isToolboxTalkReportRecord(record)) {
        return `<button class="download-button jgc-button" onclick="printPreviousToolboxReport('${escapeHtml(record.id)}')">Download PDF</button>`;
    }
    if (record.report_source && !record.supports_inspection_actions) return "-";
    return `<button class="download-button jgc-button" onclick="downloadInspectionPdf('${escapeHtml(record.id)}')">Download PDF</button>`;
}

function renderPreviousEmailCell(record) {
    if (isToolboxTalkReportRecord(record)) {
        return `<button class="email-button jgc-button" onclick="emailPreviousToolboxReport('${escapeHtml(record.id)}')">Email</button>`;
    }
    if ((record.report_source && !record.supports_inspection_actions) || isVehicleInspectionRecord(record)) return "-";
    return `<button class="email-button jgc-button" onclick="emailSavedInspection('${escapeHtml(record.id)}')">Email</button>`;
}

function renderPreviousDeleteCell(record) {
    if (isToolboxTalkReportRecord(record)) return "-";
    if (record.report_source && !record.supports_inspection_actions) return "-";
    return `<button class="delete-button jgc-button jgc-button--danger" onclick="deleteInspection('${escapeHtml(record.id)}')">Delete</button>`;
}

function buildDetails(record) {
    if (isVehicleInspectionRecord(record)) {
        const parts = [
            record.vehicle_license_plate ? "Vehicle: " + record.vehicle_license_plate : "",
            record.trailer_1_license_plate ? "Trailer 1: " + record.trailer_1_license_plate : "",
            record.trailer_2_license_plate ? "Trailer 2: " + record.trailer_2_license_plate : "",
            record.location ? "Location: " + record.location : "",
            getVehicleInspectionStatus(record)
        ];

        return parts
            .filter(Boolean)
            .map((line) => escapeHtml(line))
            .join("<br>");
    }

    if (record.report_source) {
        return [
            record.project ? "Project: " + record.project : "",
            record.location ? "Location: " + record.location : "",
            record.summary ? "Summary: " + record.summary : ""
        ]
            .filter(Boolean)
            .map((line) => escapeHtml(line))
            .join("<br>");
    }

    const fields = record.form_data && Array.isArray(record.form_data.fields)
        ? record.form_data.fields
        : [];

    return fields
        .filter((field) => field.value)
        .slice(0, 5)
        .map((field) => `${escapeHtml(field.label)}: ${escapeHtml(field.value)}`)
        .join("<br>");
}

function normalizeVehicleInspectionRecord(record) {
    return {
        ...record,
        source_table: "vehicle_inspection_records",
        inspection_type: record.inspection_type || "Vehicle / Trailer",
        worker_display_name: record.driver_name || record.worker_display_name || record.worker_name || "",
        worker_name: record.driver_key || record.worker_name || ""
    };
}

function normalizeReportRecord(source, record) {
    if (source === "jsa") {
        return {
            ...record,
            report_source: "inspection_records",
            report_type: "JSA",
            report_date: record.inspection_date,
            completed_by: record.worker_display_name || record.worker_name || "",
            project: findFieldValue(record, /Project|Job/i),
            location: findFieldValue(record, /Location/i),
            summary: buildDetails(record),
            supports_inspection_actions: true
        };
    }

    if (source === "daily") {
        return {
            ...record,
            report_source: "daily_site_reports",
            report_type: "Daily Site Report",
            report_date: record.report_date,
            completed_by: record.worker_display_name || record.worker_name || "",
            project: record.project || "",
            location: record.location || "",
            summary: record.work_completed || record.delays || ""
        };
    }

    if (source === "toolbox") {
        return {
            ...record,
            report_source: "toolbox_talk_reports",
            report_type: "Toolbox Talk",
            report_date: record.report_date,
            completed_by: record.presenter_name || record.worker_display_name || record.worker_name || "",
            project: record.project || "",
            location: record.location || "",
            summary: record.talk_title || record.discussion_notes || "",
            supports_toolbox_actions: true
        };
    }

    if (source === "incident") {
        return {
            ...record,
            report_source: "incident_reports",
            report_type: record.incident_type || "Incident / Near Miss",
            report_date: record.report_date,
            completed_by: record.reported_by_name || record.reported_by_worker || "",
            project: record.project || "",
            location: record.location || "",
            summary: [record.severity, record.description].filter(Boolean).join(" - ")
        };
    }

    if (source === "accident") {
        return {
            ...record,
            report_source: "accident_reports",
            report_type: "Supervisor Accident Report",
            report_date: record.accident_date,
            completed_by: record.report_maker_display || record.report_maker_worker || record.created_by_name || "",
            project: "",
            location: record.site_location || "",
            summary: record.injured_worker_display || record.injured_worker || ""
        };
    }

    return {
        ...record,
        report_source: "employee_injury_reports",
        report_type: "Employee Injury Report",
        report_date: record.accident_date,
        completed_by: record.employee_display || record.employee_name || record.created_by_name || "",
        project: "",
        location: record.accident_location || "",
        summary: record.bodily_injury || record.accident_description || ""
    };
}

async function loadReportRecords(sinceIso) {
    const [jsaResult, dailyResult, toolboxResult, incidentResult, accidentResult, injuryResult] = await Promise.all([
        inspectionSupabaseClient
            .from("inspection_records")
            .select("*")
            .gte("created_at", sinceIso)
            .order("created_at", { ascending: false }),
        inspectionSupabaseClient
            .from("daily_site_reports")
            .select("*")
            .gte("created_at", sinceIso)
            .order("created_at", { ascending: false }),
        inspectionSupabaseClient
            .from("toolbox_talk_reports")
            .select("*")
            .eq("is_duplicate", false)
            .gte("created_at", sinceIso)
            .order("created_at", { ascending: false }),
        inspectionSupabaseClient
            .from("incident_reports")
            .select("*")
            .gte("created_at", sinceIso)
            .order("created_at", { ascending: false }),
        inspectionSupabaseClient
            .from("accident_reports")
            .select("*")
            .gte("created_at", sinceIso)
            .order("created_at", { ascending: false }),
        inspectionSupabaseClient
            .from("employee_injury_reports")
            .select("*")
            .gte("created_at", sinceIso)
            .order("created_at", { ascending: false })
    ]);

    const results = [jsaResult, dailyResult, toolboxResult, incidentResult, accidentResult, injuryResult];
    const firstError = results.find((result) => result.error);

    if (firstError) {
        throw firstError.error;
    }

    const records = []
        .concat((jsaResult.data || []).filter((record) => String(record.inspection_type || "").toLowerCase() === "jsa").map((record) => normalizeReportRecord("jsa", record)))
        .concat((dailyResult.data || []).map((record) => normalizeReportRecord("daily", record)))
        .concat((toolboxResult.data || []).map((record) => normalizeReportRecord("toolbox", record)))
        .concat((incidentResult.data || []).map((record) => normalizeReportRecord("incident", record)))
        .concat((accidentResult.data || []).map((record) => normalizeReportRecord("accident", record)))
        .concat((injuryResult.data || []).map((record) => normalizeReportRecord("injury", record)))
        .sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));

    safetyAcknowledgementRows = [];

    if (typeof safetyAckLoadForRecords === "function") {
        const jsaIds = records
            .filter((record) => String(record.report_type || record.inspection_type || "").toLowerCase() === "jsa")
            .map((record) => record.id);
        const toolboxIds = records
            .filter((record) => String(record.report_type || "").toLowerCase() === "toolbox talk")
            .map((record) => record.id);
        const [jsaAckRows, toolboxAckRows] = await Promise.all([
            safetyAckLoadForRecords(inspectionSupabaseClient, "jsa", jsaIds),
            safetyAckLoadForRecords(inspectionSupabaseClient, "toolbox_talk", toolboxIds)
        ]);

        safetyAcknowledgementRows = jsaAckRows.concat(toolboxAckRows);
        records.forEach((record) => {
            const recordType = String(record.report_type || record.inspection_type || "").toLowerCase() === "toolbox talk"
                ? "toolbox_talk"
                : "jsa";

            if (recordType === "jsa" && String(record.report_type || record.inspection_type || "").toLowerCase() !== "jsa") {
                return;
            }

            record.safety_acknowledgements = safetyAcknowledgementRows.filter((row) =>
                row.record_type === recordType && row.record_id === record.id
            );
        });
    }

    return records;
}

async function loadInspections() {
    const list = document.getElementById("inspectionList");
    const twoMonthsAgo = new Date();
    twoMonthsAgo.setMonth(twoMonthsAgo.getMonth() - 2);

    if (!inspectionSupabaseClient) {
        list.className = "empty jgc-empty-state";
        list.textContent = "Supabase is not available right now.";
        return;
    }

    if (isReportsView) {
        try {
            const reportRecords = (await loadReportRecords(twoMonthsAgo.toISOString())).filter(isPreviousRecord);
            if (!reportRecords.length) {
                list.className = "empty";
                list.textContent = "No reports have been saved in the last 2 months.";
                return;
            }
            renderInspectionRows(reportRecords);
        } catch (error) {
            list.className = "empty";
            list.textContent = "Could not load reports.";
        }
        return;
    }

    const [inspectionResult, vehicleResult] = await Promise.all([
        inspectionSupabaseClient
            .from("inspection_records")
            .select("*")
            .gte("created_at", twoMonthsAgo.toISOString())
            .order("created_at", { ascending: false }),
        isPermitsView
            ? Promise.resolve({ data: [], error: null })
            : inspectionSupabaseClient
                .from("vehicle_inspection_records")
                .select("*")
                .gte("created_at", twoMonthsAgo.toISOString())
                .order("created_at", { ascending: false })
    ]);

    if (inspectionResult.error) {
        list.className = "empty";
        list.textContent = "Could not load previous inspections.";
        return;
    }

    if (vehicleResult.error) {
        console.warn("Could not load previous vehicle inspections.", vehicleResult.error);
    }

    const filteredData = filterInspectionRows(inspectionResult.data || [])
        .concat((vehicleResult.data || []).map((record) => normalizeVehicleInspectionRecord(record)))
        .filter(isPreviousRecord)
        .sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));

    if (!filteredData.length) {
        list.className = "empty";
        list.textContent = isPermitsView
            ? "No permits have been saved in the last 2 months."
            : isReportsView
            ? "No reports have been saved in the last 2 months."
            : "No inspections have been saved in the last 2 months.";
        return;
    }

    renderInspectionRows(filteredData);
}

function renderInspectionRows(filteredData) {
    const list = document.getElementById("inspectionList");
    inspectionRecords = filteredData;
    list.className = "table-wrap jgc-table-wrap";
    const dateHeading = isReportsView ? "Report Date" : "Inspection Date";
    const typeHeading = isReportsView ? "Report" : "Inspection";
    list.innerHTML = `
        <table class="jgc-table">
            <thead>
                <tr>
                    <th>Saved</th>
                    <th>${dateHeading}</th>
                    <th>${typeHeading}</th>
                    <th>Completed By</th>
                    <th>Details</th>
                    <th>View</th>
                    <th>PDF</th>
                    <th>Email</th>
                    <th>Delete</th>
                </tr>
            </thead>
            <tbody>
                ${filteredData.map((record) => `
                    <tr>
                        <td>${escapeHtml(formatDate(record.created_at))}</td>
                        <td>${escapeHtml(formatDate(record.report_date || record.inspection_date))}</td>
                        <td>${escapeHtml(record.report_type || record.inspection_type)}</td>
                        <td>${escapeHtml(record.completed_by || record.worker_display_name || record.worker_name)}</td>
                        <td>${buildDetails(record)}</td>
                        <td>${renderPreviousViewCell(record)}</td>
                        <td>${renderPreviousPdfCell(record)}</td>
                        <td>${renderPreviousEmailCell(record)}</td>
                        <td>${renderPreviousDeleteCell(record)}</td>
                    </tr>
                `).join("")}
            </tbody>
        </table>
    `;
}

function addPdfLine(doc, text, x, y, maxWidth) {
    const lines = doc.splitTextToSize(String(text || ""), maxWidth);
    const pageHeight = doc.internal.pageSize.getHeight();

    lines.forEach((line) => {
        if (y > pageHeight - 18) {
            doc.addPage();
            y = 18;
        }

        doc.text(line, x, y);
        y += 6;
    });

    return y;
}

function safeFileName(value) {
    return String(value || "inspection")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "");
}

function findFieldValue(record, labelPattern) {
    const fields = record.form_data && Array.isArray(record.form_data.fields)
        ? record.form_data.fields
        : [];
    const field = fields.find((item) => labelPattern.test(item.label || ""));
    return field ? field.value : "";
}

function findCheckedLabels(record, labels) {
    const fields = record.form_data && Array.isArray(record.form_data.fields)
        ? record.form_data.fields
        : [];

    return labels.map((label) => {
        const field = fields.find((item) => (item.label || "").toLowerCase().includes(label.toLowerCase()));
        return {
            label,
            checked: field ? field.value === "Yes" : false
        };
    });
}

function getVehicleInspectionSections(record) {
    return record && record.form_data && Array.isArray(record.form_data.sections)
        ? record.form_data.sections
        : [];
}

function normalizeVehicleInspectionResultLabel(value) {
    const result = String(value || "").trim();
    const lower = result.toLowerCase();

    if (lower === "na" || lower === "n/a") {
        return "N/A";
    }

    if (lower === "pass" || lower === "p") {
        return "Pass";
    }

    if (lower === "defect" || lower === "fail" || lower === "failed" || lower === "f") {
        return "Defect";
    }

    return result;
}

function getVehicleInspectionResultClass(value) {
    const result = String(value || "").trim().toLowerCase();

    if (result === "pass" || result === "p") {
        return "pass";
    }

    if (result === "defect" || result === "fail" || result === "failed" || result === "f") {
        return "defect";
    }

    if (result === "na" || result === "n/a") {
        return "na";
    }

    return "";
}

function getVehicleInspectionStatus(record) {
    if (!record) {
        return "";
    }

    if (record.defects_found) {
        return record.major_defects_found ? "Major defects found" : "Minor defects found";
    }

    return "No defects reported";
}

function getVehicleInspectionRepairNotes(record) {
    const formData = record && record.form_data && typeof record.form_data === "object" ? record.form_data : {};
    return record && record.repair_notes ? record.repair_notes : (formData.repair_notes || "");
}

function renderVehicleInspectionMeta(record) {
    const trailer1 = record.trailer_1_license_plate || record.trailer_1_name || "";
    const trailer2 = record.trailer_2_license_plate || record.trailer_2_name || "";
    const meta = [
        ["Date", formatDate(record.inspection_date)],
        ["Driver / Inspector", record.driver_name || ""],
        ["Vehicle Plate", record.vehicle_license_plate || record.vehicle_name || ""],
        ["Location", record.location || ""]
    ];

    if (record.odometer) {
        meta.push(["Current KM", record.odometer]);
    }

    if (trailer1) {
        meta.push(["Trailer 1", trailer1]);
    }

    if (trailer2) {
        meta.push(["Trailer 2", trailer2]);
    }

    meta.push(["Status", getVehicleInspectionStatus(record)]);

    return `
        <div class="inspection-sheet-meta">
            ${meta.map(([label, value]) => `
                <div>
                    <strong>${escapeHtml(label)}</strong>
                    <span>${escapeHtml(value || "-")}</span>
                </div>
            `).join("")}
        </div>
    `;
}

function renderVehicleInspectionSections(record) {
    const sections = getVehicleInspectionSections(record);

    if (!sections.length) {
        return '<div class="inspection-sheet-note"><span>No checklist answers were saved for this vehicle inspection.</span></div>';
    }

    return sections.map((section) => {
        const items = Array.isArray(section.items) ? section.items : [];

        return `
            <h3 class="inspection-sheet-section-title">${escapeHtml(section.section || "Inspection Items")}</h3>
            <div class="inspection-sheet-table-wrap">
                <table>
                    <thead>
                        <tr><th class="inspection-number-column">#</th><th>Item</th><th class="inspection-result-column">Result</th><th class="inspection-severity-column">Severity</th><th>Description</th></tr>
                    </thead>
                    <tbody>
                        ${items.length ? items.map((item) => {
                            const result = normalizeVehicleInspectionResultLabel(item.result || "");
                            const resultClass = getVehicleInspectionResultClass(result);
                            return `
                                <tr>
                                    <td>${escapeHtml(item.code || "")}</td>
                                    <td>${escapeHtml(item.label || "")}</td>
                                    <td>${result ? `<span class="inspection-result-pill ${escapeHtml(resultClass)}">${escapeHtml(result)}</span>` : ""}</td>
                                    <td>${escapeHtml(item.severity || "")}</td>
                                    <td>${escapeHtml(item.description || "")}</td>
                                </tr>
                            `;
                        }).join("") : '<tr><td colspan="5">No items saved in this section.</td></tr>'}
                    </tbody>
                </table>
            </div>
        `;
    }).join("");
}

function drawBoxText(doc, text, x, y, width, height, options = {}) {
    if (options.fill) {
        doc.setFillColor(options.fill[0], options.fill[1], options.fill[2]);
        doc.rect(x, y, width, height, "F");
    }

    doc.rect(x, y, width, height);
    doc.setFont("helvetica", options.bold ? "bold" : "normal");
    doc.setFontSize(options.fontSize || 8);

    const lines = doc.splitTextToSize(String(text || ""), width - 4);
    doc.text(lines.slice(0, options.maxLines || 3), x + 2, y + 5);
}

function getJsaRows(record) {
    const rows = record.form_data && Array.isArray(record.form_data.rows)
        ? record.form_data.rows
        : [];

    return rows
        .map((row) => row.cells || [])
        .filter((cells) => cells.slice(0, 3).some((cell) => String(cell || "").trim()))
        .map((cells) => ({
            step: cells[0] || "",
            hazard: cells[1] || "",
            action: cells[2] || ""
        }));
}

function getJsaAcknowledgements(record) {
    if (record && Array.isArray(record.safety_acknowledgements)) {
        return record.safety_acknowledgements;
    }

    const formData = record && record.form_data && typeof record.form_data === "object"
        ? record.form_data
        : {};
    const acknowledgements = Array.isArray(formData.acknowledgements)
        ? formData.acknowledgements
        : [];

    return acknowledgements.filter((ack) =>
        ack && (ack.worker_key || ack.worker_name || ack.worker_display_name || ack.name || ack.email)
    );
}

function getAcknowledgementName(ack) {
    return ack.attendee_name || ack.worker_display_name || ack.worker_name || ack.name || ack.worker_key || ack.email || "Worker";
}

function formatAcknowledgementDate(value) {
    if (!value) {
        return "";
    }

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
        return value;
    }

    return date.toLocaleString([], {
        year: "numeric",
        month: "short",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit"
    });
}

function drawJsaAcknowledgementHeader(doc, margin, y, usable) {
    const headerFill = [230, 236, 230];
    drawBoxText(doc, "Digital JSA Acknowledgements", margin, y, usable, 9, { bold: true, fill: headerFill, maxLines: 1 });
    y += 9;
    drawBoxText(doc, "Name", margin, y, usable * 0.36, 8, { bold: true, fill: headerFill, maxLines: 1 });
    drawBoxText(doc, "Company", margin + usable * 0.36, y, usable * 0.24, 8, { bold: true, fill: headerFill, maxLines: 1 });
    drawBoxText(doc, "Acknowledged", margin + usable * 0.60, y, usable * 0.24, 8, { bold: true, fill: headerFill, maxLines: 1 });
    drawBoxText(doc, "Email", margin + usable * 0.84, y, usable * 0.16, 8, { bold: true, fill: headerFill, maxLines: 1 });
    return y + 8;
}

function drawJsaAcknowledgements(doc, record, margin, y, usable) {
    const acknowledgements = getJsaAcknowledgements(record);

    if (!acknowledgements.length) {
        return y;
    }

    if (y > 172) {
        doc.addPage();
        y = 12;
    } else {
        y += 5;
    }

    y = drawJsaAcknowledgementHeader(doc, margin, y, usable);

    acknowledgements.forEach((ack) => {
        if (y > 185) {
            doc.addPage();
            y = 12;
            y = drawJsaAcknowledgementHeader(doc, margin, y, usable);
        }

        const name = getAcknowledgementName(ack);
        const company = ack.attendee_company || ack.company || "";
        const date = formatAcknowledgementDate(ack.acknowledged_at);
        const email = ack.matched_employee_email || ack.email || "";
        const rowHeight = 9;

        drawBoxText(doc, name, margin, y, usable * 0.36, rowHeight, { fontSize: 7, maxLines: 2 });
        drawBoxText(doc, company, margin + usable * 0.36, y, usable * 0.24, rowHeight, { fontSize: 7, maxLines: 2 });
        drawBoxText(doc, date, margin + usable * 0.60, y, usable * 0.24, rowHeight, { fontSize: 7, maxLines: 2 });
        drawBoxText(doc, email, margin + usable * 0.84, y, usable * 0.16, rowHeight, { fontSize: 6, maxLines: 2 });
        y += rowHeight;
    });

    return y;
}

function downloadJsaPdf(record) {
    const doc = new window.jspdf.jsPDF({ unit: "mm", format: "letter", orientation: "landscape" });
    const pageWidth = doc.internal.pageSize.getWidth();
    const margin = 10;
    let y = 10;

    const contractor = findFieldValue(record, /^Contractor$/i) || "John Gordon Construction";

    const reviewedBy = findFieldValue(record, /Reviewed By/i);
    const page = findFieldValue(record, /^Page$/i);
    const of = findFieldValue(record, /^Of$/i);
    const crew = findFieldValue(record, /Crew Sign Off/i);
    const checklist = findCheckedLabels(record, [
        "Lockout / Tag Out",
        "Hot Work",
        "Confined Space",

        "Excavation",

    doc.setFontSize(15);

    y += 6;
    doc.setFontSize(11);
    doc.text("Must be filled out Daily", pageWidth / 2, y, { align: "center" });
    y += 7;

    const usable = pageWidth - margin * 2;
    const topW = usable / 4;
    drawBoxText(doc, `Contractor:\n${contractor}`, margin, y, topW, 16, { bold: true });
    drawBoxText(doc, `Project/Job:\n${project}`, margin + topW, y, topW, 16, { bold: true });
    drawBoxText(doc, `Location:\n${location}`, margin + topW * 2, y, topW, 16, { bold: true });
    drawBoxText(doc, `Date:\n${date}`, margin + topW * 3, y, topW, 16, { bold: true });
    y += 16;

    const checklistText = checklist.map((item) => `${item.checked ? "[X]" : "[ ]"} ${item.label}`).join("   ");
    drawBoxText(doc, checklistText, margin, y, topW * 2, 22, { fontSize: 7 });
    drawBoxText(doc, `Contractor Supervisor:\n${supervisor}`, margin + topW * 2, y, topW, 22, { bold: true });
    drawBoxText(doc, `Reviewed By:\n${reviewedBy}\nPage: ${page || ""} of ${of || ""}`, margin + topW * 3, y, topW, 22, { bold: true });
    y += 22;

    drawBoxText(doc, `Crew Sign Off: All Individuals- Print and sign\n${crew}`, margin, y, usable, 18, { bold: true });
    y += 18;

    const col1 = 78;
    const col2 = 88;
    const col3 = usable - col1 - col2;
    const headerFill = [230, 236, 230];
    drawBoxText(doc, "Sequence of Basic Job Steps", margin, y, col1, 12, { bold: true, fill: headerFill });
    drawBoxText(doc, "Potential Hazards", margin + col1, y, col2, 12, { bold: true, fill: headerFill });
    drawBoxText(doc, "Required Action or Procedure", margin + col1 + col2, y, col3, 12, { bold: true, fill: headerFill });
    y += 12;

    const rowsToDraw = jsaRows.length ? jsaRows : Array.from({ length: 7 }, () => ({ step: "", hazard: "", action: "" }));

    rowsToDraw.forEach((row) => {
        if (y > 185) {
            doc.addPage();
            y = 12;
            drawBoxText(doc, "Sequence of Basic Job Steps", margin, y, col1, 12, { bold: true, fill: headerFill });
            drawBoxText(doc, "Potential Hazards", margin + col1, y, col2, 12, { bold: true, fill: headerFill });
            drawBoxText(doc, "Required Action or Procedure", margin + col1 + col2, y, col3, 12, { bold: true, fill: headerFill });
            y += 12;
        }

        const stepLines = doc.splitTextToSize(row.step, col1 - 4).length;
        const hazardLines = doc.splitTextToSize(row.hazard, col2 - 4).length;
        const actionLines = doc.splitTextToSize(row.action, col3 - 4).length;
        const rowHeight = Math.max(16, Math.min(34, Math.max(stepLines, hazardLines, actionLines) * 5 + 6));

        drawBoxText(doc, row.step, margin, y, col1, rowHeight, { fontSize: 8, maxLines: 5 });
        drawBoxText(doc, row.hazard, margin + col1, y, col2, rowHeight, { fontSize: 8, maxLines: 5 });
        drawBoxText(doc, row.action, margin + col1 + col2, y, col3, rowHeight, { fontSize: 8, maxLines: 5 });
        y += rowHeight;
    });

    y = drawJsaAcknowledgements(doc, record, margin, y, usable);

    doc.save(`jsa-${record.inspection_date || "inspection"}.pdf`);
}

function getAerialInspectionRows(record) {
    const rows = record.form_data && Array.isArray(record.form_data.rows)
        ? record.form_data.rows
        : [];

    return rows
        .map((row) => row.cells || [])
        .filter((cells) => /^\d+$/.test(String(cells[0] || "").trim()))
        .map((cells) => ({
            number: cells[0] || "",
            item: cells[1] || "",
            result: cells.slice(2).find((cell) => String(cell || "").trim()) || ""
        }));
}

function getSafetyRows(record) {
    const rows = record.form_data && Array.isArray(record.form_data.rows)
        ? record.form_data.rows
        : [];

    return rows
        .map((row) => row.cells || [])
        .filter((cells) => cells.length === 2 && cells[0] && !/Safety Item|Confirmed/i.test(cells[0]))
        .map((cells) => ({
            item: cells[0] || "",
            checked: /checked|yes/i.test(String(cells[1] || ""))
        }));
}

function drawAerialRow(doc, number, item, result, x, y, widths, height) {
    drawBoxText(doc, number, x, y, widths[0], height, { fontSize: 7, maxLines: 2 });
    drawBoxText(doc, item, x + widths[0], y, widths[1], height, { fontSize: 7, maxLines: 4 });
    drawBoxText(doc, result, x + widths[0] + widths[1], y, widths[2], height, { fontSize: 7, maxLines: 2 });
}

function downloadAerialLiftPdf(record) {
    const doc = new window.jspdf.jsPDF({ unit: "mm", format: "letter" });

function fieldIsChecked(record, text) {
    const fields = record.form_data && Array.isArray(record.form_data.fields)
        ? record.form_data.fields
        : [];
    const needle = text.toLowerCase();
    const field = fields.find((item) => String(item.label || "").toLowerCase().includes(needle));
    return field ? field.value === "Yes" || field.value === "Selected" : false;
}

function getExactField(record, labelText) {
    const fields = record.form_data && Array.isArray(record.form_data.fields)
        ? record.form_data.fields
        : [];
    const needle = labelText.toLowerCase().trim();
    return fields.find((item) => String(item.label || "").toLowerCase().trim() === needle);
}

function hotWorkCheck(record, labelText) {
    const field = getExactField(record, labelText);
    return field ? field.value === "Yes" : false;
}

function hotWorkRadio(record, labelText, expectedValue) {
    const field = getExactField(record, labelText);
    return field ? String(field.value || "").toLowerCase() === expectedValue.toLowerCase() : false;
}

function drawPermitCheckRow(doc, item, checked, x, y, width) {
    doc.rect(x, y + 1.5, 3.5, 3.5);
    if (checked) {
        doc.setFont("helvetica", "bold");
        doc.text("X", x + 0.7, y + 4.5);
    }

    doc.setFont("helvetica", "normal");
    doc.setFontSize(7);
    return addPdfLine(doc, item, x + 5.5, y + 4.5, width - 5.5);
}

function drawPermitSection(doc, title, items, record, x, y, width) {
    doc.setFont("helvetica", "bold");
    doc.setFontSize(8);
    y = addPdfLine(doc, title, x, y, width);

    items.forEach((item) => {
        y = drawPermitCheckRow(doc, item, hotWorkCheck(record, item), x, y, width);
    });

    return y + 1;
}

        "Fire watch provided during work and 1 hour after",
        "Fire watch has extinguisher or charged hose",

        "Adjoining areas checked"
    ], record, rightX, rightY, colW);

    doc.setFont("helvetica", "normal");

    doc.text("NFPA 51B - Hot Work Permit reference format. This app-generated copy is based on the completed saved inspection record.", margin, 274);

}

function getHarnessRows(record) {
    const rows = record.form_data && Array.isArray(record.form_data.rows)
        ? record.form_data.rows
        : [];

    return rows
        .map((row) => row.cells || [])
        .filter((cells) => {
            const first = String(cells[0] || "").trim();
            const second = String(cells[1] || "").trim();
            return second && !/Possible Defect|Serial Number|Date of Inspection/i.test(first + " " + second);
        })
        .filter((cells) => /Webbing|Stitching|Buckles|Attachment|Label|Cuts|Punctures|Abrasions|Burns|Discolour|Incomplete|Pulled|Distorted|Deformation|Cracks|Corrosion|Function|Excess Wear|Illegible|Missing/i.test(cells.join(" ")))
        .map((cells) => ({
            component: cells[0] || "",
            defect: cells[1] || "",
            condition: cells[2] || "",
            result: cells[3] || ""
        }));
}

function getForkliftRows(record) {
    const rows = record.form_data && Array.isArray(record.form_data.rows)
        ? record.form_data.rows
        : [];
    const visual = [];
    const operational = [];

    rows.forEach((row) => {
        const cells = row.cells || [];
        const left = String(cells[0] || "").trim();
        const right = String(cells[4] || "").trim();

        if (/^\d+\./.test(left)) {
            visual.push({
                item: left,
                result: cells.slice(1, 4).find((cell) => String(cell || "").trim()) || ""
            });
        }

        if (/^\d+\./.test(right)) {
            operational.push({
                item: right,
                result: cells.slice(5, 8).find((cell) => String(cell || "").trim()) || ""
            });
        }
    });

    return { visual, operational };
}

function getTelehandlerRows(record) {
    const rows = record.form_data && Array.isArray(record.form_data.rows)

    return rows
        .map((row) => row.cells || [])
        .filter((cells) => cells[0])

            item: cells[0],

                { defective: cells[3], okay: cells[4] },

                { defective: cells[7], okay: cells[8] },
                { defective: cells[9], okay: cells[10] },
                { defective: cells[11], okay: cells[12] },
                { defective: cells[13], okay: cells[14] }
            ]
        }));
}

function downloadTeleHandlerPdf(record) {
    const doc = new window.jspdf.jsPDF({ unit: "mm", format: "letter", orientation: "landscape" });
    const margin = 8;
    const pageWidth = doc.internal.pageSize.getWidth();
    const usable = pageWidth - margin * 2;
    let y = 10;
    const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
    const fields = record.form_data && Array.isArray(record.form_data.fields) ? record.form_data.fields : [];
    const rows = getTelehandlerRows(record);
    const fieldValue = (label) => {
        const field = fields.find((item) => String(item.label || "").toLowerCase() === label.toLowerCase());
        return field ? field.value || "" : "";
    };

    doc.setFont("helvetica", "bold");
    doc.setFontSize(17);
    doc.text("TELEHANDLER INSPECTION AND DAILY CHECKLIST", pageWidth / 2, y, { align: "center" });
    y += 8;
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8);
    doc.text("All checks must be carried out in line with Manufacturer's Operators Manual.", pageWidth / 2, y, { align: "center" });
    y += 7;

    const leftW = 78;
    const tableX = margin + leftW + 6;
    const dayW = (usable - leftW - 6) / 7;
    ["Make and Model", "Plant or Serial No.", "Machine Hours", "Week Commencing", "Site Location"].forEach((label) => {
        drawBoxText(doc, label, margin, y, 36, 9, { bold: true, fontSize: 7 });
        drawBoxText(doc, fieldValue(label), margin + 36, y, leftW - 36, 9, { fontSize: 7 });
        y += 9;
    });

    const detailBottomY = y + 2;
    let tableY = 25;
    days.forEach((day, index) => {
        drawBoxText(doc, day, tableX + dayW * index, tableY, dayW, 8, { bold: true, fontSize: 7 });
        drawBoxText(doc, "Defective", tableX + dayW * index, tableY + 8, dayW / 2, 11, { bold: true, fontSize: 5, maxLines: 2 });
        drawBoxText(doc, "Okay", tableX + dayW * index + dayW / 2, tableY + 8, dayW / 2, 11, { bold: true, fontSize: 5, maxLines: 2 });
    });
    tableY += 19;
    const itemStartY = Math.max(tableY, detailBottomY);

    const rowH = 6.4;
    rows.forEach((row, rowIndex) => {
        const rowY = itemStartY + rowH * rowIndex;
        drawBoxText(doc, row.item, margin, rowY, leftW, rowH, { fontSize: 7, maxLines: 1 });

        row.days.forEach((value, dayIndex) => {
            const x = tableX + dayW * dayIndex;
            drawBoxText(doc, value.defective ? "X" : "", x, rowY, dayW / 2, rowH, { fontSize: 7 });
            drawBoxText(doc, value.okay ? "X" : "", x + dayW / 2, rowY, dayW / 2, rowH, { fontSize: 7 });
        });
    });

    const bottomY = itemStartY + rowH * rows.length + 8;
    drawBoxText(doc, `Operator Name:\n${fieldValue("Operator Name")}`, margin, bottomY, leftW, 13, { fontSize: 8 });

    doc.save(`tele-handler-${record.inspection_date || "inspection"}.pdf`);
}

function downloadInspectionPdf(id) {
    const record = inspectionRecords.find((item) => item.id === id);

    if (!record) {
        alert("This inspection could not be found.");
        return;
    }

    if (isVehicleInspectionRecord(record)) {
        downloadVehicleInspectionPdf(record);
        return;
    }

    if (!window.jspdf || !window.jspdf.jsPDF) {
        alert("PDF download is not available right now.");
        return;
    }

    if ((record.inspection_type || "").toLowerCase() === "jsa") {
        downloadJsaPdf(record);
        return;
    }

    if ((record.inspection_type || "").toLowerCase() === "aerial lifts") {
        downloadAerialLiftPdf(record);
        return;
    }

    if ((record.inspection_type || "").toLowerCase() === "hot work permit") {
        downloadHotWorkPermitPdf(record);
        return;
    }

    if ((record.inspection_type || "").toLowerCase() === "harness") {
        downloadHarnessPdf(record);
        return;
    }

    if ((record.inspection_type || "").toLowerCase() === "fork lift") {
        downloadForkliftPdf(record);
        return;
    }

    if ((record.inspection_type || "").toLowerCase() === "tele handler") {
        downloadTeleHandlerPdf(record);
        return;
    }

    const doc = new window.jspdf.jsPDF({ unit: "mm", format: "letter" });
    const pageWidth = doc.internal.pageSize.getWidth();
    const margin = 14;
    const maxWidth = pageWidth - margin * 2;
    const fields = record.form_data && Array.isArray(record.form_data.fields)
        ? record.form_data.fields
        : [];
    const rows = record.form_data && Array.isArray(record.form_data.rows)
        ? record.form_data.rows
        : [];
    let y = 16;

    doc.setFont("helvetica", "bold");
    doc.setFontSize(16);
    y = addPdfLine(doc, "John Gordon Construction", margin, y, maxWidth);
    y = addPdfLine(doc, record.inspection_type || "Inspection", margin, y + 2, maxWidth);

    doc.setFont("helvetica", "normal");
    doc.setFontSize(11);
    y = addPdfLine(doc, `Saved: ${formatDate(record.created_at)}`, margin, y + 4, maxWidth);
    y = addPdfLine(doc, `Inspection Date: ${formatDate(record.inspection_date)}`, margin, y, maxWidth);
    y = addPdfLine(doc, `Completed By: ${record.worker_display_name || record.worker_name || ""}`, margin, y, maxWidth);

    if (fields.length) {
        doc.setFont("helvetica", "bold");
        y = addPdfLine(doc, "Form Details", margin, y + 6, maxWidth);
        doc.setFont("helvetica", "normal");

        fields.forEach((field) => {
            if (field.value) {
                y = addPdfLine(doc, `${field.label}: ${field.value}`, margin, y, maxWidth);
            }
        });
    }

    if (rows.length) {
        doc.setFont("helvetica", "bold");
        y = addPdfLine(doc, "Inspection Items", margin, y + 6, maxWidth);
        doc.setFont("helvetica", "normal");

        rows.forEach((row) => {
            const text = row.cells.filter(Boolean).join(" | ");
            if (text) {
                y = addPdfLine(doc, text, margin, y, maxWidth);
            }
        });
    }

    const filename = `${safeFileName(record.inspection_type)}-${record.inspection_date || "inspection"}.pdf`;
    doc.save(filename);
}

function downloadVehicleInspectionPdf(record) {
    const printWindow = window.open("", "_blank");

    if (!printWindow) {
        alert("Please allow pop-ups to save this PDF.");
        return;
    }

    printWindow.document.write(renderVehicleInspectionPrintDocument(record));
    printWindow.document.close();
    printWindow.focus();
    setTimeout(() => printWindow.print(), 350);
}

function emailSavedInspection(id) {
    const record = inspectionRecords.find((item) => item.id === id);
    emailInspectionRecord(record);
}

async function deleteInspection(id) {
    if (!confirm("Delete this inspection?")) {
        return;
    }

    const record = inspectionRecords.find((item) => item.id === id);
    const tableName = isVehicleInspectionRecord(record) ? "vehicle_inspection_records" : "inspection_records";

    const { error } = await inspectionSupabaseClient
        .from(tableName)
        .delete()
        .eq("id", id);

    if (error) {
        alert("This inspection could not be deleted.");
        return;
    }

    loadInspections();
}

async function signOut() {
    await signOutJgc(inspectionSupabaseClient);
}

loadInspections();
