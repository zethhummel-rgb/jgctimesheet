<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="googlebot" content="noindex, nofollow, noarchive" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JGC Inspections</title>
<link rel="stylesheet" href="styles.css?v=2">

<style>
body {
    font-family: Arial, sans-serif;
    background: #8f9691;
    margin: 0;
    padding: 20px;
    color: #1f2a24;
}

.logo-wrap {
    max-width: 347px;
    margin: 0 auto 8px;
    text-align: center;
}

.logo-wrap img {
    width: 100%;
    max-width: 347px;
    height: auto;
    display: block;
    margin: 0 auto;
}

.user-bar {
    max-width: 1050px;
    margin: 0 auto 12px;
    color: #ffffff;
    text-align: center;
    font-size: 13px;
    font-weight: bold;
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
}

.container {
    max-width: 1050px;
    margin: auto;
    background: #fbfcf9;
    padding: 24px;
    border-radius: 8px;
    border-top: 4px solid #3f7d4d;
    box-shadow: 0 3px 10px rgba(0,0,0,.18);
}

h1 {
    text-align: center;
    margin: 0 0 6px;
    color: #2f6f3c;
}

.subtitle {
    text-align: center;
    font-weight: bold;
    margin-bottom: 22px;
}

.inspection-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 14px;
}

.inspection-card {
    min-height: 96px;
    border: 1px solid #cad6c9;
    background: #ffffff;
    color: #1f2a24;
    border-radius: 8px;
    padding: 18px;
    cursor: pointer;
    text-align: left;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
}

.inspection-card:hover {
    transform: translateY(-2px);
    border-color: #3f7d4d;
    box-shadow: 0 5px 14px rgba(0,0,0,0.14);
}

.inspection-card strong {
    display: block;
    font-size: 20px;
    color: #f5f7f3;
    margin-bottom: 8px;
}

.inspection-card span {
    color: #bac4bd;
    font-size: 14px;
    line-height: 1.35;
}

.actions {
    margin-top: 24px;
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

.small-button {
    border: none;
    background: #47534b;
    color: white;
    cursor: pointer;
    border-radius: 4px;
    padding: 10px 15px;
    font-size: 15px;
}

.small-button:hover {
    background: #354039;
}

@media (max-width: 640px) {
    body {
        padding: 12px;
    }

    .container {
        padding: 18px 14px;
    }

    .inspection-grid {
        grid-template-columns: 1fr;
    }

    .inspection-card {
        min-height: 78px;
        padding: 15px;
    }
}
</style>
</head>

<body>
<div class="logo-wrap">
    <img src="logo.png" alt="John Gordon Construction logo">
</div>

<div class="user-bar" id="userBar"></div>

<div class="container">
    <h1>Inspections</h1>
    <div class="subtitle">Choose an inspection form</div>

    <div class="inspection-grid">
        <button class="inspection-card" type="button" onclick="window.location.href='todays-inspections.html'">
            <strong>Today's Inspections</strong>
            <span>Saved inspections from the last 24 hours</span>
        </button>

        <button class="inspection-card" type="button" onclick="window.location.href='aerial-lifts.html'">
            <strong>Aerial Lifts</strong>
            <span>Pre-use inspection form</span>
        </button>

        <button class="inspection-card" type="button" onclick="window.location.href='forklift.html'">
            <strong>Fork Lift</strong>
            <span>Daily inspection form</span>
        </button>

        <button class="inspection-card" type="button" onclick="window.location.href='tele-handler.html'">
            <strong>Tele Handler</strong>
            <span>Daily checklist</span>
        </button>

        <button class="inspection-card" type="button" onclick="window.location.href='vehicle-inspection.html?mode=manual'">
            <strong>Vehicle Inspections</strong>
            <span>Daily vehicle or trailer inspection</span>
        </button>

        <button class="inspection-card" type="button" onclick="window.location.href='harness.html'">
            <strong>Harness</strong>
            <span>Inspection checklist</span>
        </button>

        <button class="inspection-card" type="button" onclick="window.location.href='previous-inspections.html'">
            <strong>Previous Inspections</strong>
            <span>Saved inspections from the last 2 months</span>
        </button>
    </div>

    <div class="actions">
        <button class="small-button" type="button" onclick="window.location.href='home.html'">Home</button>
        <button class="small-button" type="button" onclick="signOut()">Sign Out</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="common.js?v=20"></script>
<script>
const supabaseClient = createJgcSupabaseClient();

const workerName = localStorage.getItem('currentWorker');
const workerDisplay = localStorage.getItem('currentWorkerDisplay') || workerName;

if (!workerName) {
    window.location.href = 'index.html';
}

document.getElementById('userBar').textContent = workerDisplay ? 'Signed in as: ' + workerDisplay : '';

if (isJgcSubcontractorSession()) {
    document.querySelectorAll("[onclick*='previous-inspections']").forEach((button) => button.remove());
}

function comingSoon(formName) {
    alert(formName + ' form will be added next.');
}

async function signOut() {
    await signOutJgc(supabaseClient);
}
</script>
</body>
</html>
