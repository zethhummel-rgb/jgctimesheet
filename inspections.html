<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="googlebot" content="noindex, nofollow, noarchive" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JGC Inspections</title>
<link rel="stylesheet" href="jgc-design-system.css?v=8" data-jgc-design-system="8">
</head>

<body class="inspections-hub-page jgc-page jgc-system-page">
<main class="inspection-page-shell jgc-page-shell jgc-stack">
<header class="inspection-page-header jgc-page-header">
<div class="logo-wrap jgc-brand">
    <img src="logo.webp" alt="John Gordon Construction logo">
</div>

<div class="jgc-page-user" id="userBar"></div>
</header>

<section class="container jgc-panel jgc-stack">
    <h1 class="jgc-page-title">Inspections</h1>
    <div class="jgc-section-heading">Quick Links</div>

    <section class="inspection-quick-links jgc-card-grid jgc-card-grid--two" aria-label="Inspection history">
        <button class="inspection-card jgc-link-card" type="button" onclick="window.location.href='todays-inspections.html'">
            <strong>Today's Inspections</strong>
            <span>Saved inspections from the last 24 hours</span>
        </button>

        <button class="inspection-card jgc-link-card" type="button" onclick="window.location.href='previous-inspections.html'">
            <strong>Previous Inspections</strong>
            <span>Saved inspections from the last 2 months</span>
        </button>
    </section>

    <div class="jgc-section-heading">Start a New Inspection</div>

    <section class="inspection-grid jgc-card-grid" aria-label="Inspection forms">
        <button class="inspection-card jgc-link-card" type="button" onclick="window.location.href='aerial-lifts.html'">
            <strong>Aerial Lifts</strong>
            <span>Pre-use inspection form</span>
        </button>

        <button class="inspection-card jgc-link-card" type="button" onclick="window.location.href='forklift.html'">
            <strong>Fork Lift</strong>
            <span>Daily inspection form</span>
        </button>

        <button class="inspection-card jgc-link-card" type="button" onclick="window.location.href='tele-handler.html'">
            <strong>Tele Handler</strong>
            <span>Daily checklist</span>
        </button>

        <button class="inspection-card jgc-link-card" type="button" onclick="window.location.href='vehicle-inspection.html?mode=manual'">
            <strong>Vehicle Inspections</strong>
            <span>Daily vehicle or trailer inspection</span>
        </button>

        <button class="inspection-card jgc-link-card" type="button" onclick="window.location.href='harness.html'">
            <strong>Harness</strong>
            <span>Inspection checklist</span>
        </button>
    </section>

    <div class="actions jgc-actions jgc-actions--center">
        <button class="small-button jgc-button jgc-button--secondary" type="button" onclick="window.location.href='home.html'">Home</button>
        <button class="small-button jgc-button jgc-button--secondary" type="button" onclick="signOut()">Sign Out</button>
    </div>
</section>
</main>

<script src="vendor/supabase-js.min.js?v=1" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';"></script>
<script src="common.js?v=42"></script>
<script>
const supabaseClient = createJgcSupabaseClient();

const workerName = localStorage.getItem('currentWorker');
const workerDisplay = localStorage.getItem('currentWorkerDisplay') || workerName;

if (!workerName) {
    window.location.href = 'index.html';
}

document.getElementById('userBar').textContent = workerDisplay ? 'Signed in as: ' + workerDisplay : '';

if (isJgcSubcontractorSession()) {
    document.querySelectorAll("[onclick*='previous-inspections']").forEach((button) => button.remove());
}

function comingSoon(formName) {
    alert(formName + ' form will be added next.');
}

async function signOut() {
    await signOutJgc(supabaseClient);
}
</script>
</body>
</html>
