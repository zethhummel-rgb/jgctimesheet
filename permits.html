<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="googlebot" content="noindex, nofollow, noarchive" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JGC Permits</title>
<link rel="stylesheet" href="styles.css?v=3">
<style>
body {
    font-family: Arial, sans-serif;
    background: #8f9691;
    margin: 0;
    padding: 20px;
    color: #1f2a24;
}

.logo-wrap {
    max-width: 347px;
    margin: 0 auto 8px;
    text-align: center;
}

.logo-wrap img {
    width: 100%;
    max-width: 347px;
    height: auto;
    display: block;
    margin: 0 auto;
}

.user-bar {
    max-width: 1100px;
    margin: 0 auto 12px;
    color: #ffffff;
    text-align: center;
    font-size: 13px;
    font-weight: bold;
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
}

.container {
    max-width: 1100px;
    margin: auto;
    background: #fbfcf9;
    padding: 20px;
    border-radius: 8px;
    border-top: 4px solid #3f7d4d;
    box-shadow: 0 3px 10px rgba(0,0,0,.18);
}

h1 {
    text-align: center;
    color: #2f6f3c;
    margin: 0 0 6px;
}

.subtitle {
    text-align: center;
    font-weight: bold;
    margin-bottom: 18px;
    color: #1f2a24;
}

.permit-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 22px;
}

.permit-card {
    border: 1px solid #c6cec5;
    border-top: 4px solid #3f7d4d;
    background: #ffffff;
    border-radius: 8px;
    padding: 16px;
    text-align: left;
    color: #1f2a24;
    cursor: pointer;
    min-height: 150px;
    box-shadow: none;
}

.permit-card:hover {
    transform: translateY(-2px);
    border-color: #3f7d4d;
    box-shadow: 0 5px 14px rgba(0,0,0,.14);
}

.permit-card strong {
    display: block;
    margin: 0 0 8px;
    color: #0b5e3b;
    font-size: 20px;
}

.permit-card span {
    display: block;
    margin: 0;
    color: #1f2a24;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.35;
}

.actions {
    margin-top: 24px;
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

button,
.small-button {
    background: #0b5e3b;
    color: #ffffff;
    border: none;
    border-radius: 4px;
    padding: 10px 14px;
    font-weight: bold;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
}

button:hover,
.small-button:hover {
    background: #08452b;
}

.small-button {
    background: #47534b;
}

.small-button:hover {
    background: #354039;
}

@media (max-width: 800px) {
    body {
        padding: 10px;
    }

    .permit-grid {
        grid-template-columns: 1fr;
    }

    button,
    .small-button {
        width: 100%;
        box-sizing: border-box;
        text-align: center;
    }
}
</style>
<link rel="stylesheet" href="permit-design-system.css?v=1">
<link rel="stylesheet" href="employee-hub-design-system.css?v=2">
</head>
<body class="permit-directory-page jgc-page jgc-employee-hub">
<main class="permit-page-shell jgc-page-shell jgc-page-shell--wide">
<header class="permit-page-header jgc-page-header">
  <div class="logo-wrap jgc-brand"><img src="logo.webp" alt="John Gordon Construction logo"></div>
  <p class="user-bar" id="userBar"></p>
</header>
<section class="container jgc-panel">
  <h1 class="jgc-page-title">Permits</h1>
  <div class="subtitle jgc-section-title">Quick Links</div>
  <div class="permit-grid">
    <button class="permit-card jgc-card" type="button" onclick="window.location.href='todays-inspections.html?recordType=permits'">
      <strong>Today's Permits</strong>
      <span>Permits completed in the last 24 hours.</span>
    </button>
    <button class="permit-card jgc-card" type="button" onclick="window.location.href='previous-inspections.html?recordType=permits'">
      <strong>Previous Permits</strong>
      <span>Permits completed in the last 2 months.</span>
    </button>
  </div>

  <div class="subtitle jgc-section-title">Start a New Permit</div>
  <div id="permitFormsSection" class="permit-grid">
    <button class="permit-card jgc-card" type="button" onclick="window.location.href='hot-work-permit.html'"><strong>Hot Work Permit</strong><span>Welding, cutting, grinding, torch work, and fire watch requirements.</span></button>
    <button class="permit-card jgc-card" type="button" onclick="window.location.href='confined-space-permit.html'"><strong>Confined Space Permit</strong><span>Entry review, atmospheric testing, attendants, rescue plan, and authorization.</span></button>
    <button class="permit-card jgc-card" type="button" onclick="window.location.href='excavation-permit.html'"><strong>Excavation Permit</strong><span>Locate checks, soil conditions, protective systems, access, and daily approval.</span></button>
  </div>
  <div class="actions jgc-actions">
    <button class="small-button jgc-button jgc-button--secondary" type="button" onclick="window.location.href='home.html'">Home</button>
    <button class="small-button jgc-button jgc-button--secondary" type="button" onclick="signOut()">Sign Out</button>
  </div>
</section>
</main>
<script src="vendor/supabase-js.min.js?v=1" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';"></script>
<script src="common.js?v=38"></script>
<script>
const supabaseClient=createJgcSupabaseClient();
const worker=requireJgcWorker();
document.getElementById("userBar").textContent="Signed in as: "+(worker.display||worker.key);
if(isJgcSubcontractorSession(worker)){
  const grids=document.querySelectorAll(".permit-grid");
  if(grids[0]){grids[0].querySelectorAll("[onclick*='previous-inspections']").forEach((button)=>button.remove());}
}
async function signOut(){await signOutJgc(supabaseClient);}
</script>
</body>
</html>
