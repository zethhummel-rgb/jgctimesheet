<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JGC Permits</title>
<link rel="stylesheet" href="styles.css?v=2">
<style>
body{font-family:Arial,sans-serif;background:#8f9691;margin:0;padding:20px;color:#1f2a24}.logo-wrap{max-width:347px;margin:0 auto 8px;text-align:center}.logo-wrap img{width:100%;max-width:347px;height:auto;display:block;margin:0 auto}.user-bar{max-width:1050px;margin:0 auto 12px;color:#fff;text-align:center;font-size:13px;font-weight:bold;text-shadow:0 1px 2px rgba(0,0,0,.25)}.container{max-width:1050px;margin:auto;background:#fbfcf9!important;color:#1f2a24!important;padding:24px;border-radius:8px;border-top:4px solid #3f7d4d;box-shadow:0 3px 10px rgba(0,0,0,.18)}.container *{color:#1f2a24}h1{text-align:center;margin:0 0 6px;color:#2f6f3c!important}.subtitle{text-align:center;font-weight:bold;margin-bottom:22px;color:#1f2a24!important}.permit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.permit-card{min-height:120px;border:1px solid #cad6c9;background:#fff!important;color:#1f2a24!important;border-radius:8px;padding:18px;cursor:pointer;text-align:left;box-shadow:0 2px 8px rgba(0,0,0,.08)}.permit-card:hover{transform:translateY(-2px);border-color:#3f7d4d;box-shadow:0 5px 14px rgba(0,0,0,.14)}.permit-card strong{display:block;font-size:20px;color:#0b5e3b!important;margin-bottom:8px}.permit-card span{color:#26342c!important;font-size:14px;font-weight:700;line-height:1.35}.actions{margin-top:24px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.small-button{border:none;background:#47534b;color:white!important;cursor:pointer;border-radius:4px;padding:10px 15px;font-size:15px}@media(max-width:640px){body{padding:12px}.container{padding:18px 14px}.permit-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="logo-wrap"><img src="logo.png" alt="John Gordon Construction logo"></div>
<div class="user-bar" id="userBar"></div>
<div class="container">
  <h1>Permits</h1>
  <div class="subtitle">Choose a permit form</div>
  <div class="permit-grid">
    <button class="permit-card" type="button" onclick="window.location.href='hot-work-permit.html'"><strong>Hot Work Permit</strong><span>Welding, cutting, grinding, torch work, and fire watch requirements.</span></button>
    <button class="permit-card" type="button" onclick="window.location.href='confined-space-permit.html'"><strong>Confined Space Permit</strong><span>Entry review, atmospheric testing, attendants, rescue plan, and authorization.</span></button>
    <button class="permit-card" type="button" onclick="window.location.href='excavation-permit.html'"><strong>Excavation Permit</strong><span>Locate checks, soil conditions, protective systems, access, and daily approval.</span></button>
  </div>
  <div class="actions">
    <button class="small-button" type="button" onclick="window.location.href='home.html'">Home</button>
    <button class="small-button" type="button" onclick="signOut()">Sign Out</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="common.js?v=2"></script>
<script>
const supabaseClient=createJgcSupabaseClient();
const worker=requireJgcWorker();
document.getElementById("userBar").textContent="Signed in as: "+(worker.display||worker.key);
async function signOut(){await signOutJgc(supabaseClient);}
</script>
</body>
</html>
