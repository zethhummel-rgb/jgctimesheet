<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="googlebot" content="noindex, nofollow, noarchive" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JGC Permits</title>
<link rel="stylesheet" href="jgc-design-system.css?v=6" data-jgc-design-system="6">
</head>
<body class="permit-directory-page jgc-page jgc-system-page">
<main class="permit-page-shell jgc-page-shell jgc-page-shell--wide jgc-stack">
<header class="permit-page-header jgc-page-header">
  <div class="logo-wrap jgc-brand"><img src="logo.webp" alt="John Gordon Construction logo"></div>
  <p class="jgc-page-user" id="userBar"></p>
</header>
<section class="container jgc-panel jgc-stack">
  <h1 class="jgc-page-title">Permits</h1>
  <div class="jgc-section-heading">Quick Links</div>
  <div class="permit-grid jgc-card-grid jgc-card-grid--two">
    <button class="permit-card jgc-link-card" type="button" onclick="window.location.href='todays-inspections.html?recordType=permits'">
      <strong>Today's Permits</strong>
      <span>Permits completed in the last 24 hours.</span>
    </button>
    <button class="permit-card jgc-link-card" type="button" onclick="window.location.href='previous-inspections.html?recordType=permits'">
      <strong>Previous Permits</strong>
      <span>Permits completed in the last 2 months.</span>
    </button>
  </div>

  <div class="jgc-section-heading">Start a New Permit</div>
  <div id="permitFormsSection" class="permit-grid jgc-card-grid jgc-card-grid--three">
    <button class="permit-card jgc-link-card" type="button" onclick="window.location.href='hot-work-permit.html'"><strong>Hot Work Permit</strong><span>Welding, cutting, grinding, torch work, and fire watch requirements.</span></button>
    <button class="permit-card jgc-link-card" type="button" onclick="window.location.href='confined-space-permit.html'"><strong>Confined Space Permit</strong><span>Entry review, atmospheric testing, attendants, rescue plan, and authorization.</span></button>
    <button class="permit-card jgc-link-card" type="button" onclick="window.location.href='excavation-permit.html'"><strong>Excavation Permit</strong><span>Locate checks, soil conditions, protective systems, access, and daily approval.</span></button>
  </div>
  <div class="actions jgc-actions jgc-actions--center">
    <button class="small-button jgc-button jgc-button--secondary" type="button" onclick="window.location.href='home.html'">Home</button>
    <button class="small-button jgc-button jgc-button--secondary" type="button" onclick="signOut()">Sign Out</button>
  </div>
</section>
</main>
<script src="vendor/supabase-js.min.js?v=1" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';"></script>
<script src="common.js?v=39"></script>
<script>
const supabaseClient=createJgcSupabaseClient();
const worker=requireJgcWorker();
document.getElementById("userBar").textContent="Signed in as: "+(worker.display||worker.key);
if(isJgcSubcontractorSession(worker)){
  const grids=document.querySelectorAll(".permit-grid");
  if(grids[0]){grids[0].querySelectorAll("[onclick*='previous-inspections']").forEach((button)=>button.remove());}
}
async function signOut(){await signOutJgc(supabaseClient);}
</script>
</body>
</html>
