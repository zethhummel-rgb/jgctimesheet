<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="googlebot" content="noindex, nofollow, noarchive" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vacation Request</title>
<link rel="stylesheet" href="jgc-design-system.css?v=8" data-jgc-design-system="8">
<link rel="stylesheet" href="vacation-design-system.css?v=2">
</head>

<body class="vacation-page jgc-page jgc-system-page">
<main class="vacation-page-shell jgc-page-shell jgc-stack">
<header class="vacation-page-header jgc-page-header">
<div class="logo-wrap jgc-brand">
    <img src="logo.webp" alt="John Gordon Construction logo">
</div>
<h1 class="jgc-page-title">Vacation Request</h1>
<div id="currentUser" class="user-bar jgc-page-user"></div>
<div id="vacationFormSubtitle" class="vacation-form-subtitle">Submit a request for review</div>
</header>

<section class="container vacation-request-panel jgc-panel jgc-stack">
    <h2 class="jgc-section-title">Request Details</h2>

    <div class="grid jgc-form-grid">
        <div class="field jgc-field">
            <label class="jgc-label" for="employeeName">Employee Name</label>
            <input class="jgc-input" id="employeeName" type="text">
        </div>

        <div class="field jgc-field">
            <label class="jgc-label" for="requestDate">Today's Date</label>
            <input class="jgc-input" id="requestDate" type="date" readonly aria-readonly="true">
        </div>

        <div class="field jgc-field">
            <label class="jgc-label" for="startDate">First Day Off</label>
            <input class="jgc-input" id="startDate" type="date" onchange="updateTotalDays()">
        </div>

        <div class="field jgc-field">
            <label class="jgc-label" for="endDate">Last Day Off</label>
            <input class="jgc-input" id="endDate" type="date" onchange="updateTotalDays()">
        </div>

        <div class="field jgc-field">
            <label class="jgc-label" for="returnDate">Return To Work Date</label>
            <input class="jgc-input" id="returnDate" type="date">
        </div>

        <div class="field jgc-field">
            <label class="jgc-label" for="totalDays">Requested Work Days</label>
            <input class="jgc-input" id="totalDays" type="number" min="0" step="0.5">
        </div>

        <label class="field check-row full jgc-field jgc-field--full jgc-label">
            <input id="halfDayRequest" type="checkbox" onchange="toggleHalfDayRequest()">
            Half day request
        </label>

        <div id="halfDayFinishWrap" class="field field-hidden jgc-field">
            <label class="jgc-label" for="halfDayFinishTime">Finish Time</label>
            <select class="jgc-select" id="halfDayFinishTime">
                <option value="">Select Finish Time</option>
            </select>
        </div>

        <div class="field full jgc-field jgc-field--full">
            <label class="jgc-label" for="requestType">Request Type</label>
            <select class="jgc-select" id="requestType">
                <option>Vacation</option>
                <option>Unpaid Time Off</option>
                <option>Personal Day</option>
                <option>Other</option>
            </select>
        </div>

        <div class="field full jgc-field jgc-field--full">
            <label class="jgc-label" for="reason">Notes</label>
            <textarea class="jgc-textarea" id="reason" placeholder="Optional notes for this request"></textarea>
        </div>

        <div class="field full jgc-field jgc-field--full">
            <label class="jgc-label" for="employeeSignature">Employee Signature</label>
            <input class="jgc-input" id="employeeSignature" type="text" placeholder="Type your name">
        </div>
    </div>

    <div class="actions vacation-actions jgc-actions">
        <button id="vacationSubmitButton" type="button" class="jgc-button" onclick="submitVacationRequest()">Submit Vacation Request</button>
        <button id="vacationCancelEditButton" type="button" class="secondary jgc-button jgc-button--secondary" onclick="cancelVacationRequestEdit()" hidden>Cancel Edit</button>
        <button type="button" class="secondary jgc-button jgc-button--secondary" onclick="window.location.href='home.html'">Home</button>
        <button type="button" class="secondary jgc-button jgc-button--secondary" onclick="signOut()">Sign Out</button>
    </div>

    <div id="saveStatus" class="status vacation-status jgc-notice" aria-live="polite"></div>
</section>

<section class="history vacation-history-panel jgc-panel jgc-stack">
        <h2 class="jgc-section-title">My Vacation Requests</h2>
        <div id="vacationSummary" class="summary-grid"></div>

        <div class="calendar-controls jgc-toolbar">
            <button type="button" class="secondary jgc-button jgc-button--secondary" onclick="changeVacationMonth(-1)">Previous</button>
            <div id="vacationCalendarTitle" class="calendar-title"></div>
            <button type="button" class="secondary jgc-button jgc-button--secondary" onclick="changeVacationMonth(1)">Next</button>
        </div>
        <div class="vacation-calendar-scroll">
            <div id="vacationCalendar" class="calendar-grid"></div>
        </div>

        <div id="requestHistory" class="vacation-history-wrap table-wrap jgc-table-wrap">Loading vacation requests...</div>
</section>
</main>

<script src="vendor/supabase-js.min.js?v=1" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';"></script>
<script src="common.js?v=41"></script>
<script>
const VACATION_EMAIL_RECIPIENTS = [
    "zeth@johngordonconstruction.com",
    "Jeff@johngordonconstruction.com"
];
const VACATION_EMAIL_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzPILTnOSzQcCkA6y5vSLxCH6i05Y2-ZHZAk09Und0YKiXZOYMppV4fvW3G6EgqOIZi/exec";
const supabaseClient = createJgcSupabaseClient();
const worker = requireJgcWorker();
let myVacationRequests = [];
let vacationCalendarMonth = new Date();
let editingVacationRequestId = "";

function getVacationRequestToday() {
    const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "America/Toronto",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
    }).formatToParts(new Date());
    const values = {};
    parts.forEach((part) => {
        values[part.type] = part.value;
    });
    return values.year + "-" + values.month + "-" + values.day;
}

document.getElementById("currentUser").textContent = "Signed in as: " + worker.display;
document.getElementById("employeeName").value = worker.display || worker.key || "";
document.getElementById("employeeSignature").value = worker.display || "";
document.getElementById("requestDate").value = getVacationRequestToday();
fillHalfDayFinishOptions();

function getValue(id) {
    return document.getElementById(id).value.trim();
}

function getVacationEmailRecipients() {
    const recipients = VACATION_EMAIL_RECIPIENTS.slice();
    const employeeEmail = String(worker.email || localStorage.getItem("currentUserEmail") || "").trim();

    if (employeeEmail && !recipients.some((email) => email.toLowerCase() === employeeEmail.toLowerCase())) {
        recipients.push(employeeEmail);
    }

    return recipients;
}

function countWeekdays(startValue, endValue) {
    if (!startValue || !endValue) {
        return 0;
    }

    const start = new Date(startValue + "T00:00:00");
    const end = new Date(endValue + "T00:00:00");

    if (end < start) {
        return 0;
    }

    let days = 0;
    const current = new Date(start);

    while (current <= end) {
        const day = current.getDay();
        if (day !== 0 && day !== 6) {
            days += 1;
        }
        current.setDate(current.getDate() + 1);
    }

    return days;
}

function updateTotalDays() {
    if (document.getElementById("halfDayRequest").checked) {
        document.getElementById("totalDays").value = "0.5";
        const startDate = getValue("startDate");

        if (startDate) {
            document.getElementById("endDate").value = startDate;
        }

        return;
    }

    const total = countWeekdays(getValue("startDate"), getValue("endDate"));
    document.getElementById("totalDays").value = total || "";
}

function formatHalfDayTime(hour, minute) {
    const suffix = hour >= 12 ? "PM" : "AM";
    const displayHour = hour % 12 || 12;
    return displayHour + ":" + String(minute).padStart(2, "0") + " " + suffix;
}

function fillHalfDayFinishOptions() {
    const select = document.getElementById("halfDayFinishTime");

    for (let hour = 7; hour <= 18; hour++) {
        [0, 30].forEach((minute) => {
            if (hour === 18 && minute > 0) {
                return;
            }

            const value = String(hour).padStart(2, "0") + ":" + String(minute).padStart(2, "0");
            const option = document.createElement("option");
            option.value = value;
            option.textContent = formatHalfDayTime(hour, minute);
            select.appendChild(option);
        });
    }
}

function toggleHalfDayRequest() {
    const checked = document.getElementById("halfDayRequest").checked;
    const finishWrap = document.getElementById("halfDayFinishWrap");
    const startDate = getValue("startDate");

    finishWrap.classList.toggle("field-hidden", !checked);

    if (checked) {
        document.getElementById("totalDays").value = "0.5";

        if (startDate) {
            document.getElementById("endDate").value = startDate;
        }
    } else {
        document.getElementById("halfDayFinishTime").value = "";
        updateTotalDays();
    }
}

function buildVacationEmailBody(record) {
    const details = record.form_data || {};

    return [
        "Vacation Request",
        "Employee: " + record.worker_display_name,
        "Request Date: " + record.request_date,
        "",
        "First Day Off: " + record.start_date,
        "Last Day Off: " + record.end_date,
        "Return To Work Date: " + (record.return_date || ""),
        "Requested Work Days: " + record.total_days,
        "Request Type: " + record.request_type,
        "Half Day: " + (details.halfDayRequest ? "Yes" : "No"),
        "Finish Time: " + (details.halfDayFinishTimeLabel || ""),
        "",
        "Notes:",
        record.reason || "",
        "",
        "Employee Signature: " + record.employee_signature,
        "Status: " + statusLabel(record.status || "pending")
    ].join("\n");
}

function buildVacationPdfHtml(record) {
    const details = record.form_data || {};

    return `
        <!doctype html>
        <html>
        <head>
            <meta charset="UTF-8">
            <style>
                body { font-family: Arial, sans-serif; color: #1f2a24; }
                h1 { text-align: center; color: #2f6f3c; margin-bottom: 4px; }
                h2 { text-align: center; margin-top: 0; font-size: 15px; }
                table { width: 100%; border-collapse: collapse; margin-top: 18px; }
                th, td { border: 1px solid #777; padding: 8px; font-size: 12px; text-align: left; vertical-align: top; }
                th { width: 34%; background: #e6ece6; }
                .signature { height: 42px; }
            </style>
        </head>
        <body>
            <h1>John Gordon Construction</h1>
            <h2>Vacation Request Form</h2>
            <table>
                <tr><th>Employee Name</th><td>${escapeHtml(record.worker_display_name)}</td></tr>
                <tr><th>Request Date</th><td>${escapeHtml(record.request_date)}</td></tr>
                <tr><th>First Day Off</th><td>${escapeHtml(record.start_date)}</td></tr>
                <tr><th>Last Day Off</th><td>${escapeHtml(record.end_date)}</td></tr>
                <tr><th>Return To Work Date</th><td>${escapeHtml(record.return_date || "")}</td></tr>
                <tr><th>Requested Work Days</th><td>${escapeHtml(record.total_days)}</td></tr>
                <tr><th>Request Type</th><td>${escapeHtml(record.request_type)}</td></tr>
                <tr><th>Half Day</th><td>${details.halfDayRequest ? "Yes" : "No"}</td></tr>
                <tr><th>Finish Time</th><td>${escapeHtml(details.halfDayFinishTimeLabel || "")}</td></tr>
                <tr><th>Notes</th><td>${escapeHtml(record.reason || "")}</td></tr>
                <tr><th>Employee Signature</th><td class="signature">${escapeHtml(record.employee_signature)}</td></tr>
                <tr><th>Status</th><td>${escapeHtml(statusLabel(record.status || "pending"))}</td></tr>
            </table>
        </body>
        </html>
    `;
}

function setStatus(message) {
    document.getElementById("saveStatus").textContent = message || "";
}

function makeDate(value) {
    return value ? new Date(value + "T00:00:00") : null;
}

function sameOrBefore(a, b) {
    return a && b && a.getTime() <= b.getTime();
}

function statusLabel(status) {
    const value = String(status || "pending");
    return value.charAt(0).toUpperCase() + value.slice(1);
}

function getVacationWorkerAliases() {
    return Array.from(new Set([
        worker.key,
        worker.display,
        worker.email,
        localStorage.getItem("currentWorker"),
        localStorage.getItem("currentWorkerDisplay"),
        localStorage.getItem("currentUserEmail")
    ].map(normalizeWorkerName).filter(Boolean)));
}

function requestIncludesDate(request, date) {
    const start = makeDate(request.start_date);
    const end = makeDate(request.end_date);

    return sameOrBefore(start, date) && sameOrBefore(date, end);
}

function getRequestSortTime(request) {
    const date = makeDate(request.start_date);
    return date ? date.getTime() : 0;
}

function getBestRequestForDate(requests, date) {
    const matches = requests.filter((request) => requestIncludesDate(request, date));

    if (!matches.length) {
        return null;
    }

    return matches.sort((a, b) => {
        const rank = { approved: 0, pending: 1, denied: 2 };
        return (rank[a.status] ?? 3) - (rank[b.status] ?? 3);
    })[0];
}

function formatMonthTitle(date) {
    return date.toLocaleDateString("en-CA", { month: "long", year: "numeric" });
}

function changeVacationMonth(offset) {
    vacationCalendarMonth = new Date(vacationCalendarMonth.getFullYear(), vacationCalendarMonth.getMonth() + offset, 1);
    renderVacationCalendar();
}

function renderVacationSummary() {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const approvedFuture = myVacationRequests.filter((request) => request.status === "approved" && makeDate(request.end_date) >= today).length;
    const pending = myVacationRequests.filter((request) => request.status === "pending").length;
    const past = myVacationRequests.filter((request) => makeDate(request.end_date) < today).length;

    document.getElementById("vacationSummary").innerHTML = `
        <div class="summary-box jgc-card"><strong>${approvedFuture}</strong>Approved Upcoming</div>
        <div class="summary-box jgc-card"><strong>${pending}</strong>Pending</div>
        <div class="summary-box jgc-card"><strong>${past}</strong>Past Requests</div>
    `;
}

function renderVacationCalendar() {
    const calendar = document.getElementById("vacationCalendar");
    const title = document.getElementById("vacationCalendarTitle");
    const year = vacationCalendarMonth.getFullYear();
    const month = vacationCalendarMonth.getMonth();
    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    let html = dayNames.map((day) => `<div class="calendar-head">${day}</div>`).join("");

    title.textContent = formatMonthTitle(firstDay);

    for (let i = 0; i < firstDay.getDay(); i++) {
        html += '<div class="calendar-day"></div>';
    }

    for (let day = 1; day <= lastDay.getDate(); day++) {
        const date = new Date(year, month, day);
        const match = getBestRequestForDate(myVacationRequests, date);
        const statusClass = match ? match.status : "";
        const pastClass = date < today ? "past" : "";
        const label = match ? statusLabel(match.status) : "";

        html += `
            <div class="calendar-day ${statusClass} ${pastClass}">
                <div class="day-number">${day}</div>
                <div class="day-label">${escapeHtml(label)}</div>
            </div>
        `;
    }

    calendar.innerHTML = html;
}

function formatVacationDateCell(request) {
    const details = request.form_data || {};
    const halfDayText = details.halfDayRequest
        ? '<br>Half Day' + (details.halfDayFinishTimeLabel ? ': until ' + escapeHtml(details.halfDayFinishTimeLabel) : '')
        : '';

    return `
        ${escapeHtml(request.start_date)} to ${escapeHtml(request.end_date)}
        ${request.return_date ? '<br>Return: ' + escapeHtml(request.return_date) : ""}
        ${halfDayText}
    `;
}

function renderVacationHistory() {
    const history = document.getElementById("requestHistory");
    renderVacationSummary();
    renderVacationCalendar();

    if (!myVacationRequests.length) {
        history.innerHTML = '<div class="empty-history-message jgc-empty-state">No vacation requests submitted yet.</div>';
        return;
    }

    const sorted = myVacationRequests.slice().sort((a, b) => getRequestSortTime(b) - getRequestSortTime(a));
    history.innerHTML = `
        <table class="vacation-history-table jgc-table">
            <thead>
                <tr>
                    <th>Dates</th>
                    <th>Days</th>
                    <th>Type</th>
                    <th>Status</th>
                    <th>Admin Note</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                ${sorted.map((request) => `
                    <tr>
                        <td data-label="Dates">
                            ${formatVacationDateCell(request)}
                        </td>
                        <td data-label="Days">${Number(request.total_days || 0).toFixed(1)}</td>
                        <td data-label="Type">${escapeHtml(request.request_type)}</td>
                        <td data-label="Status"><span class="status-pill ${escapeHtml(request.status)} jgc-badge ${request.status === "approved" ? "jgc-badge--success" : request.status === "denied" ? "jgc-badge--danger" : "jgc-badge--warning"}">${escapeHtml(statusLabel(request.status))}</span></td>
                        <td data-label="Admin Note">${escapeHtml(request.admin_note || "")}</td>
                        <td data-label="Actions">
                            <div class="actions vacation-history-actions jgc-table-actions">
                                ${request.status === "approved" ? `<button type="button" class="secondary jgc-button jgc-button--secondary" onclick="startVacationRequestEdit('${escapeHtml(request.id)}')">Edit Approved Dates</button>` : ""}
                                <button type="button" class="delete-button jgc-button jgc-button--danger" onclick="deleteVacationRequest('${escapeHtml(request.id)}')">Delete</button>
                            </div>
                        </td>
                    </tr>
                `).join("")}
            </tbody>
        </table>
    `;
}

function resetVacationRequestForm() {
    editingVacationRequestId = "";
    document.getElementById("startDate").value = "";
    document.getElementById("endDate").value = "";
    document.getElementById("returnDate").value = "";
    document.getElementById("totalDays").value = "";
    document.getElementById("halfDayRequest").checked = false;
    document.getElementById("halfDayFinishTime").value = "";
    document.getElementById("halfDayFinishWrap").classList.add("field-hidden");
    document.getElementById("requestType").value = "Vacation";
    document.getElementById("reason").value = "";
    document.getElementById("employeeName").disabled = false;
    document.getElementById("halfDayRequest").disabled = false;
    document.getElementById("halfDayFinishTime").disabled = false;
    document.getElementById("requestType").disabled = false;
    document.getElementById("reason").disabled = false;
    document.getElementById("employeeSignature").disabled = false;
    document.getElementById("totalDays").readOnly = false;
    document.getElementById("vacationSubmitButton").textContent = "Submit Vacation Request";
    document.getElementById("vacationCancelEditButton").hidden = true;
    document.getElementById("vacationFormSubtitle").textContent = "Submit a request for review";
}

function startVacationRequestEdit(id) {
    const request = myVacationRequests.find((item) => item.id === id);

    if (!request || request.status !== "approved") {
        alert("Only an approved vacation request can be edited here.");
        return;
    }

    const details = request.form_data || {};
    editingVacationRequestId = request.id;
    document.getElementById("startDate").value = request.start_date || "";
    document.getElementById("endDate").value = request.end_date || "";
    document.getElementById("returnDate").value = request.return_date || "";
    document.getElementById("totalDays").value = request.total_days || "";
    document.getElementById("halfDayRequest").checked = Boolean(details.halfDayRequest);
    document.getElementById("halfDayFinishTime").value = details.halfDayFinishTime || "";
    document.getElementById("halfDayFinishWrap").classList.toggle("field-hidden", !details.halfDayRequest);
    document.getElementById("requestType").value = request.request_type || "Vacation";
    document.getElementById("reason").value = request.reason || "";
    document.getElementById("employeeSignature").value = request.employee_signature || worker.display || "";
    document.getElementById("employeeName").disabled = true;
    document.getElementById("halfDayRequest").disabled = true;
    document.getElementById("halfDayFinishTime").disabled = true;
    document.getElementById("requestType").disabled = true;
    document.getElementById("reason").disabled = true;
    document.getElementById("employeeSignature").disabled = true;
    document.getElementById("totalDays").readOnly = true;
    document.getElementById("vacationSubmitButton").textContent = "Save Approved Vacation Changes";
    document.getElementById("vacationCancelEditButton").hidden = false;
    document.getElementById("vacationFormSubtitle").textContent = "Editing approved vacation dates. Timesheet vacation rows will update automatically.";
    document.querySelector(".vacation-page .container").scrollIntoView({ behavior: "smooth", block: "start" });
}

function cancelVacationRequestEdit() {
    resetVacationRequestForm();
    setStatus("Vacation edit cancelled.");
}

async function deleteVacationRequest(id) {
    const request = myVacationRequests.find((item) => item.id === id);

    if (!request) {
        alert("This vacation request could not be found.");
        return;
    }

    const confirmed = confirm("Delete this vacation request?");

    if (!confirmed) {
        return;
    }

    if (request.google_event_id && typeof syncJgcScheduleEventToGoogle === "function") {
        await syncJgcScheduleEventToGoogle(supabaseClient, buildEmployeeVacationGoogleEvent(request), "delete");
    }

    const { error } = await supabaseClient
        .from("vacation_requests")
        .delete()
        .eq("id", id)
        .in("worker_name", getVacationWorkerAliases());

    if (error) {
        alert("This vacation request could not be deleted. " + (error.message || ""));
        return;
    }

    myVacationRequests = myVacationRequests.filter((item) => item.id !== id);
    if (editingVacationRequestId === id) {
        resetVacationRequestForm();
    }
    renderVacationHistory();
}

async function loadMyVacationRequests() {
    const history = document.getElementById("requestHistory");

    if (!supabaseClient) {
        history.textContent = "Supabase is not available right now.";
        return;
    }

    const aliases = getVacationWorkerAliases();
    const queries = aliases.map((alias) =>
        supabaseClient
            .from("vacation_requests")
            .select("*")
            .eq("worker_name", alias)
            .order("start_date", { ascending: false })
    );
    queries.push(
        supabaseClient
            .from("vacation_requests")
            .select("*")
            .eq("worker_display_name", worker.display || worker.key || "")
            .order("start_date", { ascending: false })
    );

    const results = await Promise.all(queries);
    const error = results.find((result) => result.error)?.error;

    if (error) {
        history.textContent = "Vacation requests could not be loaded.";
        return;
    }

    const byId = {};
    results.forEach((result) => {
        (result.data || []).forEach((request) => {
            byId[request.id] = request;
        });
    });

    myVacationRequests = Object.values(byId);
    renderVacationHistory();
}

async function emailVacationRequest(record, subjectPrefix) {
    const recipients = getVacationEmailRecipients();
    const to = recipients.join(",");
    const subject = (subjectPrefix || "Vacation Request") + " - " + record.worker_display_name + " - " + record.start_date;

    if (!VACATION_EMAIL_SCRIPT_URL) {
        window.location.href = "mailto:" + recipients.map((email) => encodeURIComponent(email)).join(",") +
            "?subject=" + encodeURIComponent(subject) +
            "&body=" + encodeURIComponent(record.email_body);
        return;
    }

    await fetch(VACATION_EMAIL_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
            "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify({
            to,
            recipients,
            subject,
            body: record.email_body,
            text: record.email_body,
            pdfHtml: buildVacationPdfHtml(record),
            pdfFileName: "vacation-request-" + record.worker_name.replace(/[^a-z0-9]+/g, "-") + "-" + record.start_date + ".pdf"
        })
    });
}

function buildEmployeeVacationGoogleEvent(request) {
    const workerName = request.worker_display_name || request.worker_name || worker.display || "Employee";
    const description = [
        "Type: Approved Vacation" + (request.request_type ? " - " + request.request_type : ""),
        "Employee: " + workerName,
        request.total_days ? "Total Days: " + request.total_days : "",
        request.reason ? "Reason / Notes: " + request.reason : "",
        "",
        "Updated from JGC Portal.",
        "Portal Vacation Request ID: " + request.id
    ].filter(Boolean).join("\n");

    return {
        ...request,
        google_sync_table: "vacation_requests",
        all_day: true,
        event_type: "vacation",
        event_date: request.start_date,
        end_date: request.end_date || request.start_date,
        start_time: "07:00",
        end_time: "07:30",
        title: "Vacation - " + workerName,
        job_name: "Vacation",
        job_number: "",
        location: "",
        notes: request.reason || "",
        description,
        employee_names: [workerName],
        employee_emails: [worker.email || localStorage.getItem("currentUserEmail") || ""].filter(Boolean)
    };
}

async function submitVacationRequest() {
    const employeeName = getValue("employeeName");
    const requestDate = getVacationRequestToday();
    document.getElementById("requestDate").value = requestDate;
    const startDate = getValue("startDate");
    const endDate = getValue("endDate");
    const totalDays = Number(getValue("totalDays"));
    const employeeSignature = getValue("employeeSignature");
    const halfDayRequest = document.getElementById("halfDayRequest").checked;
    const halfDayFinishTime = getValue("halfDayFinishTime");
    const halfDayFinishTimeLabel = halfDayFinishTime
        ? document.getElementById("halfDayFinishTime").selectedOptions[0].textContent
        : "";

    if (!employeeName || !requestDate || !startDate || !endDate || !totalDays || !employeeSignature) {
        alert("Please fill in employee name, request date, dates off, requested work days, and signature.");
        return;
    }

    if (halfDayRequest && !halfDayFinishTime) {
        alert("Please choose a finish time for the half day request.");
        return;
    }

    if (new Date(endDate + "T00:00:00") < new Date(startDate + "T00:00:00")) {
        alert("Last Day Off cannot be before First Day Off.");
        return;
    }

    const record = {
        worker_name: normalizeWorkerName(worker.key),
        worker_display_name: employeeName,
        request_date: requestDate,
        start_date: startDate,
        end_date: endDate,
        return_date: getValue("returnDate") || null,
        total_days: totalDays,
        request_type: getValue("requestType"),
        reason: getValue("reason"),
        employee_signature: employeeSignature,
        status: editingVacationRequestId ? "approved" : "pending",
        form_data: {
            employeeName,
            requestDate,
            startDate,
            endDate,
            returnDate: getValue("returnDate"),
            totalDays,
            requestType: getValue("requestType"),
            halfDayRequest,
            halfDayFinishTime,
            halfDayFinishTimeLabel,
            reason: getValue("reason"),
            employeeSignature
        }
    };
    record.email_body = buildVacationEmailBody(record);

    setStatus("Saving vacation request...");

    if (editingVacationRequestId) {
        const requestId = editingVacationRequestId;
        const { data: updateResult, error: updateError } = await supabaseClient.rpc("update_approved_vacation_request_dates", {
            p_request_id: requestId,
            p_start_date: startDate,
            p_end_date: endDate,
            p_return_date: record.return_date
        });

        if (updateError) {
            setStatus("");
            alert("This approved vacation could not be updated. " + (updateError.message || ""));
            return;
        }

        const updatedRequest = updateResult && updateResult.request ? updateResult.request : null;

        if (!updatedRequest) {
            setStatus("");
            alert("The vacation dates were saved, but the updated request could not be reloaded. Refresh and check the dates.");
            return;
        }

        updatedRequest.email_body = buildVacationEmailBody(updatedRequest);
        myVacationRequests = myVacationRequests.map((item) => item.id === requestId ? updatedRequest : item);

        if (typeof syncJgcScheduleEventToGoogle === "function") {
            await syncJgcScheduleEventToGoogle(supabaseClient, buildEmployeeVacationGoogleEvent(updatedRequest), "upsert");
        }

        if (typeof createJgcPortalNotifications === "function") {
            const adminRecipients = typeof getJgcAdminNotificationRecipients === "function"
                ? await getJgcAdminNotificationRecipients(supabaseClient)
                : [{ role: "admin" }];
            await createJgcPortalNotifications(supabaseClient, "vacation_request", [{ role: "supervisor" }].concat(adminRecipients), {
                title: "Approved vacation dates updated",
                message: employeeName + " changed approved vacation dates to " + updatedRequest.start_date + " through " + updatedRequest.end_date + ". Timesheet vacation rows were reconciled automatically.",
                link_url: "admin.html?tab=vacation",
                source_table: "vacation_requests",
                source_id: requestId,
                dedupe_key_prefix: "vacation_request_edit:" + requestId + ":" + Date.now(),
                created_by_name: employeeName,
                metadata: {
                    worker_name: updatedRequest.worker_name,
                    worker_display_name: employeeName,
                    start_date: updatedRequest.start_date,
                    end_date: updatedRequest.end_date,
                    total_days: updatedRequest.total_days,
                    request_type: updatedRequest.request_type
                }
            });
        }

        setStatus("Sending updated vacation confirmation...");

        try {
            await emailVacationRequest(updatedRequest, "Approved Vacation Updated");
            alert("Approved vacation dates and timesheet vacation rows were updated.");
        } catch (error) {
            alert("The vacation dates and timesheets were updated, but the email could not be sent.");
        }

        resetVacationRequestForm();
        setStatus("Approved vacation dates updated.");
        renderVacationHistory();
        return;
    }

    const { data: savedRequest, error } = await supabaseClient
        .from("vacation_requests")
        .insert(record)
        .select("id")
        .single();

    if (error) {
        setStatus("");
        alert("This vacation request could not be saved. " + (error.message || ""));
        return;
    }

    if (typeof createJgcPortalNotifications === "function") {
        const adminRecipients = typeof getJgcAdminNotificationRecipients === "function"
            ? await getJgcAdminNotificationRecipients(supabaseClient)
            : [{ role: "admin" }];
        const notificationRecipients = [{ role: "supervisor" }].concat(adminRecipients);

        await createJgcPortalNotifications(supabaseClient, "vacation_request", notificationRecipients, {
            title: "Vacation request submitted",
            message: employeeName + " requested " + totalDays.toFixed(1) + " day" + (totalDays === 1 ? "" : "s") + " off from " + startDate + " to " + endDate + ".",
            link_url: "admin.html?tab=vacation",
            source_table: "vacation_requests",
            source_id: savedRequest && savedRequest.id ? savedRequest.id : "",
            dedupe_key_prefix: "vacation_request:" + (savedRequest && savedRequest.id ? savedRequest.id : [worker.key, startDate, endDate].join(":")),
            created_by_name: employeeName,
            metadata: {
                worker_name: record.worker_name,
                worker_display_name: employeeName,
                start_date: startDate,
                end_date: endDate,
                total_days: totalDays,
                request_type: record.request_type
            }
        });
    }

    setStatus("Sending vacation request email...");

    try {
        await emailVacationRequest(record);
        alert("Vacation request submitted and emailed.");
    } catch (error) {
        alert("Vacation request was saved, but the email could not be sent.");
    }

    resetVacationRequestForm();
    setStatus("Vacation request submitted.");
    loadMyVacationRequests();
}

async function signOut() {
    await signOutJgc(supabaseClient);
}

loadMyVacationRequests();
</script>
