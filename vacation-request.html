<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="googlebot" content="noindex, nofollow, noarchive" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vacation Request</title>
<link rel="stylesheet" href="styles.css?v=2">

<style>
body {
    font-family: Arial, sans-serif;
    background: #8f9691;
    margin: 0;
    padding: 20px;
    color: #1f2a24;
}

.logo-wrap {
    max-width: 347px;
    margin: 0 auto 8px;
    text-align: center;
}

.logo-wrap img {
    width: 100%;
    max-width: 347px;
    height: auto;
    display: block;
    margin: 0 auto;
}

.user-bar {
    max-width: 760px;
    margin: 0 auto 12px;
    color: #ffffff;
    text-align: center;
    font-size: 13px;
    font-weight: bold;
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
}

.container {
    max-width: 760px;
    margin: auto;
    background: #fbfcf9;
    padding: 20px;
    border-radius: 8px;
    border-top: 4px solid #3f7d4d;
    box-shadow: 0 3px 10px rgba(0,0,0,.18);
}

h1 {
    text-align: center;
    color: #2f6f3c;
    margin: 0 0 6px;
}

.subtitle {
    text-align: center;
    font-weight: bold;
    margin-bottom: 18px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.full {
    grid-column: 1 / -1;
}

.check-row {
    flex-direction: row;
    align-items: center;
    gap: 8px;
}

.check-row input {
    width: auto;
}

.field-hidden {
    display: none;
}

label {
    font-weight: bold;
    font-size: 13px;
}

input,
select,
textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 9px;
    border: 1px solid #bcc7bc;
    border-radius: 4px;
    font-size: 15px;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

.actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 18px;
}

button {
    background: #0b5e3b;
    color: white;
    border: none;
    padding: 11px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #08452b;
}

.secondary {
    background: #47534b;
}

.secondary:hover {
    background: #354039;
}

.delete-button {
    background: #b42318;
}

.delete-button:hover {
    background: #8f1d14;
}

.status {
    margin-top: 12px;
    min-height: 20px;
    font-weight: bold;
    color: #2f6f3c;
}

.history {
    margin-top: 22px;
    border-top: 1px solid #d6ddd4;
    padding-top: 18px;
    color: #1f2a24;
}

.summary-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 12px;
}

.summary-box {
    background: #ffffff;
    border: 1px solid #c6cec5;
    border-radius: 6px;
    padding: 10px;
    text-align: center;
    color: #1f2a24;
}

.summary-box strong {
    display: block;
    font-size: 20px;
    color: #0b5e3b;
}

.summary-box {
    font-weight: 500;
}

.empty-history-message {
    color: #f4fff6;
    font-weight: bold;
    margin-top: 12px;
}

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: #ffffff;
    color: #1f2a24;
}

th,
td {
    border: 1px solid #c6cec5;
    padding: 7px;
    text-align: left;
    vertical-align: top;
    font-size: 13px;
    color: #1f2a24;
}

th {
    background: #e6ece6;
    color: #1f2a24;
}

.calendar-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin: 16px 0 8px;
}

.calendar-controls button {
    width: auto;
}

.calendar-title {
    font-weight: bold;
    color: #2f6f3c;
    text-align: center;
}

.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    border: 1px solid #c6cec5;
    background: #ffffff;
    color: #1f2a24;
}

.calendar-head,
.calendar-day {
    min-height: 58px;
    border: 1px solid #d6ddd4;
    padding: 5px;
    box-sizing: border-box;
    font-size: 12px;
    color: #1f2a24;
}

.calendar-head {
    min-height: auto;
    background: #e6ece6;
    font-weight: bold;
    text-align: center;
}

.calendar-day.past {
    background: #f1f1f1;
    color: #7a827c;
}

.calendar-day.approved {
    background: #dcefe1;
    border-color: #6ca678;
    color: #1f2a24;
}

.calendar-day.pending {
    background: #fff3cd;
    border-color: #d8b44b;
    color: #1f2a24;
}

.calendar-day.denied {
    background: #f8d7da;
    border-color: #d98a92;
    color: #1f2a24;
}

.day-number {
    font-weight: bold;
    margin-bottom: 4px;
}

.day-label {
    font-size: 11px;
    line-height: 1.2;
}

.status-pill {
    display: inline-block;
    padding: 3px 7px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: bold;
    background: #e6ece6;
    color: #1f2a24;
}

.status-pill.approved {
    background: #dcefe1;
    color: #245832;
}

.status-pill.pending {
    background: #fff3cd;
    color: #7a5b00;
}

.status-pill.denied {
    background: #f8d7da;
    color: #8f1d14;
}

@media (max-width: 720px) {
    body {
        padding: 10px;
    }

    .container {
        padding: 14px;
    }

    .logo-wrap {
        max-width: 260px;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .summary-grid {
        grid-template-columns: 1fr;
    }

    .calendar-day {
        min-height: 48px;
        font-size: 11px;
        padding: 4px;
    }

    button {
        width: 100%;
    }
}
</style>
</head>

<body>
<div class="logo-wrap">
    <img src="logo.png" alt="John Gordon Construction logo">
</div>

<div id="currentUser" class="user-bar"></div>

<div class="container">
    <h1>Vacation Request</h1>
    <div class="subtitle">Submit a request for review</div>

    <div class="grid">
        <div class="field">
            <label for="employeeName">Employee Name</label>
            <input id="employeeName" type="text">
        </div>

        <div class="field">
            <label for="requestDate">Request Date</label>
            <input id="requestDate" type="date">
        </div>

        <div class="field">
            <label for="startDate">First Day Off</label>
            <input id="startDate" type="date" onchange="updateTotalDays()">
        </div>

        <div class="field">
            <label for="endDate">Last Day Off</label>
            <input id="endDate" type="date" onchange="updateTotalDays()">
        </div>

        <div class="field">
            <label for="returnDate">Return To Work Date</label>
            <input id="returnDate" type="date">
        </div>

        <div class="field">
            <label for="totalDays">Requested Work Days</label>
            <input id="totalDays" type="number" min="0" step="0.5">
        </div>

        <label class="field check-row full">
            <input id="halfDayRequest" type="checkbox" onchange="toggleHalfDayRequest()">
            Half day request
        </label>

        <div id="halfDayFinishWrap" class="field field-hidden">
            <label for="halfDayFinishTime">Finish Time</label>
            <select id="halfDayFinishTime">
                <option value="">Select Finish Time</option>
            </select>
        </div>

        <div class="field full">
            <label for="requestType">Request Type</label>
            <select id="requestType">
                <option>Vacation</option>
                <option>Unpaid Time Off</option>
                <option>Personal Day</option>
                <option>Other</option>
            </select>
        </div>

        <div class="field full">
            <label for="reason">Notes</label>
            <textarea id="reason" placeholder="Optional notes for this request"></textarea>
        </div>

        <div class="field full">
            <label for="employeeSignature">Employee Signature</label>
            <input id="employeeSignature" type="text" placeholder="Type your name">
        </div>
    </div>

    <div class="actions">
        <button type="button" onclick="submitVacationRequest()">Submit Vacation Request</button>
        <button type="button" class="secondary" onclick="window.location.href='home.html'">Home</button>
        <button type="button" class="secondary" onclick="signOut()">Sign Out</button>
    </div>

    <div id="saveStatus" class="status"></div>

    <div class="history">
        <h2>My Vacation Requests</h2>
        <div id="vacationSummary" class="summary-grid"></div>

        <div class="calendar-controls">
            <button type="button" class="secondary" onclick="changeVacationMonth(-1)">Previous</button>
            <div id="vacationCalendarTitle" class="calendar-title"></div>
            <button type="button" class="secondary" onclick="changeVacationMonth(1)">Next</button>
        </div>
        <div id="vacationCalendar" class="calendar-grid"></div>

        <div id="requestHistory" class="table-wrap" style="margin-top:14px;">Loading vacation requests...</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="common.js?v=8"></script>
<script>
const VACATION_EMAIL_RECIPIENTS = [
    "zeth@johngordonconstruction.com",
    "Jeff@johngordonconstruction.com"
];
const VACATION_EMAIL_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzPILTnOSzQcCkA6y5vSLxCH6i05Y2-ZHZAk09Und0YKiXZOYMppV4fvW3G6EgqOIZi/exec";
const supabaseClient = createJgcSupabaseClient();
const worker = requireJgcWorker();
let myVacationRequests = [];
let vacationCalendarMonth = new Date();

document.getElementById("currentUser").textContent = "Signed in as: " + worker.display;
document.getElementById("employeeName").value = worker.display || worker.key || "";
document.getElementById("employeeSignature").value = worker.display || "";
document.getElementById("requestDate").value = new Date().toISOString().slice(0, 10);
fillHalfDayFinishOptions();

function getValue(id) {
    return document.getElementById(id).value.trim();
}

function getVacationEmailRecipients() {
    const recipients = VACATION_EMAIL_RECIPIENTS.slice();
    const employeeEmail = String(worker.email || localStorage.getItem("currentUserEmail") || "").trim();

    if (employeeEmail && !recipients.some((email) => email.toLowerCase() === employeeEmail.toLowerCase())) {
        recipients.push(employeeEmail);
    }

    return recipients;
}

function countWeekdays(startValue, endValue) {
    if (!startValue || !endValue) {
        return 0;
    }

    const start = new Date(startValue + "T00:00:00");
    const end = new Date(endValue + "T00:00:00");

    if (end < start) {
        return 0;
    }

    let days = 0;
    const current = new Date(start);

    while (current <= end) {
        const day = current.getDay();
        if (day !== 0 && day !== 6) {
            days += 1;
        }
        current.setDate(current.getDate() + 1);
    }

    return days;
}

function updateTotalDays() {
    if (document.getElementById("halfDayRequest").checked) {
        document.getElementById("totalDays").value = "0.5";
        const startDate = getValue("startDate");

        if (startDate) {
            document.getElementById("endDate").value = startDate;
        }

        return;
    }

    const total = countWeekdays(getValue("startDate"), getValue("endDate"));
    document.getElementById("totalDays").value = total || "";
}

function formatHalfDayTime(hour, minute) {
    const suffix = hour >= 12 ? "PM" : "AM";
    const displayHour = hour % 12 || 12;
    return displayHour + ":" + String(minute).padStart(2, "0") + " " + suffix;
}

function fillHalfDayFinishOptions() {
    const select = document.getElementById("halfDayFinishTime");

    for (let hour = 7; hour <= 18; hour++) {
        [0, 30].forEach((minute) => {
            if (hour === 18 && minute > 0) {
                return;
            }

            const value = String(hour).padStart(2, "0") + ":" + String(minute).padStart(2, "0");
            const option = document.createElement("option");
            option.value = value;
            option.textContent = formatHalfDayTime(hour, minute);
            select.appendChild(option);
        });
    }
}

function toggleHalfDayRequest() {
    const checked = document.getElementById("halfDayRequest").checked;
    const finishWrap = document.getElementById("halfDayFinishWrap");
    const startDate = getValue("startDate");

    finishWrap.classList.toggle("field-hidden", !checked);

    if (checked) {
        document.getElementById("totalDays").value = "0.5";

        if (startDate) {
            document.getElementById("endDate").value = startDate;
        }
    } else {
        document.getElementById("halfDayFinishTime").value = "";
        updateTotalDays();
    }
}

function buildVacationEmailBody(record) {
    const details = record.form_data || {};

    return [
        "Vacation Request",
        "Employee: " + record.worker_display_name,
        "Request Date: " + record.request_date,
        "",
        "First Day Off: " + record.start_date,
        "Last Day Off: " + record.end_date,
        "Return To Work Date: " + (record.return_date || ""),
        "Requested Work Days: " + record.total_days,
        "Request Type: " + record.request_type,
        "Half Day: " + (details.halfDayRequest ? "Yes" : "No"),
        "Finish Time: " + (details.halfDayFinishTimeLabel || ""),
        "",
        "Notes:",
        record.reason || "",
        "",
        "Employee Signature: " + record.employee_signature,
        "Status: Pending"
    ].join("\n");
}

function buildVacationPdfHtml(record) {
    const details = record.form_data || {};

    return `
        <!doctype html>
        <html>
        <head>
            <meta charset="UTF-8">
            <style>
                body { font-family: Arial, sans-serif; color: #1f2a24; }
                h1 { text-align: center; color: #2f6f3c; margin-bottom: 4px; }
                h2 { text-align: center; margin-top: 0; font-size: 15px; }
                table { width: 100%; border-collapse: collapse; margin-top: 18px; }
                th, td { border: 1px solid #777; padding: 8px; font-size: 12px; text-align: left; vertical-align: top; }
                th { width: 34%; background: #e6ece6; }
                .signature { height: 42px; }
            </style>
        </head>
        <body>
            <h1>John Gordon Construction</h1>
            <h2>Vacation Request Form</h2>
            <table>
                <tr><th>Employee Name</th><td>${escapeHtml(record.worker_display_name)}</td></tr>
                <tr><th>Request Date</th><td>${escapeHtml(record.request_date)}</td></tr>
                <tr><th>First Day Off</th><td>${escapeHtml(record.start_date)}</td></tr>
                <tr><th>Last Day Off</th><td>${escapeHtml(record.end_date)}</td></tr>
                <tr><th>Return To Work Date</th><td>${escapeHtml(record.return_date || "")}</td></tr>
                <tr><th>Requested Work Days</th><td>${escapeHtml(record.total_days)}</td></tr>
                <tr><th>Request Type</th><td>${escapeHtml(record.request_type)}</td></tr>
                <tr><th>Half Day</th><td>${details.halfDayRequest ? "Yes" : "No"}</td></tr>
                <tr><th>Finish Time</th><td>${escapeHtml(details.halfDayFinishTimeLabel || "")}</td></tr>
                <tr><th>Notes</th><td>${escapeHtml(record.reason || "")}</td></tr>
                <tr><th>Employee Signature</th><td class="signature">${escapeHtml(record.employee_signature)}</td></tr>
                <tr><th>Status</th><td>Pending</td></tr>
            </table>
        </body>
        </html>
    `;
}

function setStatus(message) {
    document.getElementById("saveStatus").textContent = message || "";
}

function makeDate(value) {
    return value ? new Date(value + "T00:00:00") : null;
}

function sameOrBefore(a, b) {
    return a && b && a.getTime() <= b.getTime();
}

function statusLabel(status) {
    const value = String(status || "pending");
    return value.charAt(0).toUpperCase() + value.slice(1);
}

function getVacationWorkerAliases() {
    return Array.from(new Set([
        worker.key,
        worker.display,
        worker.email,
        localStorage.getItem("currentWorker"),
        localStorage.getItem("currentWorkerDisplay"),
        localStorage.getItem("currentUserEmail")
    ].map(normalizeWorkerName).filter(Boolean)));
}

function requestIncludesDate(request, date) {
    const start = makeDate(request.start_date);
    const end = makeDate(request.end_date);

    return sameOrBefore(start, date) && sameOrBefore(date, end);
}

function getRequestSortTime(request) {
    const date = makeDate(request.start_date);
    return date ? date.getTime() : 0;
}

function getBestRequestForDate(requests, date) {
    const matches = requests.filter((request) => requestIncludesDate(request, date));

    if (!matches.length) {
        return null;
    }

    return matches.sort((a, b) => {
        const rank = { approved: 0, pending: 1, denied: 2 };
        return (rank[a.status] ?? 3) - (rank[b.status] ?? 3);
    })[0];
}

function formatMonthTitle(date) {
    return date.toLocaleDateString("en-CA", { month: "long", year: "numeric" });
}

function changeVacationMonth(offset) {
    vacationCalendarMonth = new Date(vacationCalendarMonth.getFullYear(), vacationCalendarMonth.getMonth() + offset, 1);
    renderVacationCalendar();
}

function renderVacationSummary() {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const approvedFuture = myVacationRequests.filter((request) => request.status === "approved" && makeDate(request.end_date) >= today).length;
    const pending = myVacationRequests.filter((request) => request.status === "pending").length;
    const past = myVacationRequests.filter((request) => makeDate(request.end_date) < today).length;

    document.getElementById("vacationSummary").innerHTML = `
        <div class="summary-box"><strong>${approvedFuture}</strong>Approved Upcoming</div>
        <div class="summary-box"><strong>${pending}</strong>Pending</div>
        <div class="summary-box"><strong>${past}</strong>Past Requests</div>
    `;
}

function renderVacationCalendar() {
    const calendar = document.getElementById("vacationCalendar");
    const title = document.getElementById("vacationCalendarTitle");
    const year = vacationCalendarMonth.getFullYear();
    const month = vacationCalendarMonth.getMonth();
    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    let html = dayNames.map((day) => `<div class="calendar-head">${day}</div>`).join("");

    title.textContent = formatMonthTitle(firstDay);

    for (let i = 0; i < firstDay.getDay(); i++) {
        html += '<div class="calendar-day"></div>';
    }

    for (let day = 1; day <= lastDay.getDate(); day++) {
        const date = new Date(year, month, day);
        const match = getBestRequestForDate(myVacationRequests, date);
        const statusClass = match ? match.status : "";
        const pastClass = date < today ? "past" : "";
        const label = match ? statusLabel(match.status) : "";

        html += `
            <div class="calendar-day ${statusClass} ${pastClass}">
                <div class="day-number">${day}</div>
                <div class="day-label">${escapeHtml(label)}</div>
            </div>
        `;
    }

    calendar.innerHTML = html;
}

function formatVacationDateCell(request) {
    const details = request.form_data || {};
    const halfDayText = details.halfDayRequest
        ? '<br>Half Day' + (details.halfDayFinishTimeLabel ? ': until ' + escapeHtml(details.halfDayFinishTimeLabel) : '')
        : '';

    return `
        ${escapeHtml(request.start_date)} to ${escapeHtml(request.end_date)}
        ${request.return_date ? '<br>Return: ' + escapeHtml(request.return_date) : ""}
        ${halfDayText}
    `;
}

function renderVacationHistory() {
    const history = document.getElementById("requestHistory");
    renderVacationSummary();
    renderVacationCalendar();

    if (!myVacationRequests.length) {
        history.innerHTML = '<div class="empty-history-message">No vacation requests submitted yet.</div>';
        return;
    }

    const sorted = myVacationRequests.slice().sort((a, b) => getRequestSortTime(b) - getRequestSortTime(a));
    history.innerHTML = `
        <table>
            <thead>
                <tr>
                    <th>Dates</th>
                    <th>Days</th>
                    <th>Type</th>
                    <th>Status</th>
                    <th>Admin Note</th>
                    <th>Delete</th>
                </tr>
            </thead>
            <tbody>
                ${sorted.map((request) => `
                    <tr>
                        <td>
                            ${formatVacationDateCell(request)}
                        </td>
                        <td>${Number(request.total_days || 0).toFixed(1)}</td>
                        <td>${escapeHtml(request.request_type)}</td>
                        <td><span class="status-pill ${escapeHtml(request.status)}">${escapeHtml(statusLabel(request.status))}</span></td>
                        <td>${escapeHtml(request.admin_note || "")}</td>
                        <td><button type="button" class="delete-button" onclick="deleteVacationRequest('${escapeHtml(request.id)}')">Delete</button></td>
                    </tr>
                `).join("")}
            </tbody>
        </table>
    `;
}

async function deleteVacationRequest(id) {
    const request = myVacationRequests.find((item) => item.id === id);

    if (!request) {
        alert("This vacation request could not be found.");
        return;
    }

    const confirmed = confirm("Delete this vacation request?");

    if (!confirmed) {
        return;
    }

    const { error } = await supabaseClient
        .from("vacation_requests")
        .delete()
        .eq("id", id)
        .in("worker_name", getVacationWorkerAliases());

    if (error) {
        alert("This vacation request could not be deleted. " + (error.message || ""));
        return;
    }

    myVacationRequests = myVacationRequests.filter((item) => item.id !== id);
    renderVacationHistory();
}

async function loadMyVacationRequests() {
    const history = document.getElementById("requestHistory");

    if (!supabaseClient) {
        history.textContent = "Supabase is not available right now.";
        return;
    }

    const aliases = getVacationWorkerAliases();
    const queries = aliases.map((alias) =>
        supabaseClient
            .from("vacation_requests")
            .select("*")
            .eq("worker_name", alias)
            .order("start_date", { ascending: false })
    );
    queries.push(
        supabaseClient
            .from("vacation_requests")
            .select("*")
            .eq("worker_display_name", worker.display || worker.key || "")
            .order("start_date", { ascending: false })
    );

    const results = await Promise.all(queries);
    const error = results.find((result) => result.error)?.error;

    if (error) {
        history.textContent = "Vacation requests could not be loaded.";
        return;
    }

    const byId = {};
    results.forEach((result) => {
        (result.data || []).forEach((request) => {
            byId[request.id] = request;
        });
    });

    myVacationRequests = Object.values(byId);
    renderVacationHistory();
}

async function emailVacationRequest(record) {
    const recipients = getVacationEmailRecipients();
    const to = recipients.join(",");

    if (!VACATION_EMAIL_SCRIPT_URL) {
        window.location.href = "mailto:" + recipients.map((email) => encodeURIComponent(email)).join(",") +
            "?subject=" + encodeURIComponent("Vacation Request - " + record.worker_display_name) +
            "&body=" + encodeURIComponent(record.email_body);
        return;
    }

    await fetch(VACATION_EMAIL_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
            "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify({
            to,
            recipients,
            subject: "Vacation Request - " + record.worker_display_name + " - " + record.start_date,
            body: record.email_body,
            text: record.email_body,
            pdfHtml: buildVacationPdfHtml(record),
            pdfFileName: "vacation-request-" + record.worker_name.replace(/[^a-z0-9]+/g, "-") + "-" + record.start_date + ".pdf"
        })
    });
}

async function submitVacationRequest() {
    const employeeName = getValue("employeeName");
    const requestDate = getValue("requestDate");
    const startDate = getValue("startDate");
    const endDate = getValue("endDate");
    const totalDays = Number(getValue("totalDays"));
    const employeeSignature = getValue("employeeSignature");
    const halfDayRequest = document.getElementById("halfDayRequest").checked;
    const halfDayFinishTime = getValue("halfDayFinishTime");
    const halfDayFinishTimeLabel = halfDayFinishTime
        ? document.getElementById("halfDayFinishTime").selectedOptions[0].textContent
        : "";

    if (!employeeName || !requestDate || !startDate || !endDate || !totalDays || !employeeSignature) {
        alert("Please fill in employee name, request date, dates off, requested work days, and signature.");
        return;
    }

    if (halfDayRequest && !halfDayFinishTime) {
        alert("Please choose a finish time for the half day request.");
        return;
    }

    if (new Date(endDate + "T00:00:00") < new Date(startDate + "T00:00:00")) {
        alert("Last Day Off cannot be before First Day Off.");
        return;
    }

    const record = {
        worker_name: normalizeWorkerName(worker.key),
        worker_display_name: employeeName,
        request_date: requestDate,
        start_date: startDate,
        end_date: endDate,
        return_date: getValue("returnDate") || null,
        total_days: totalDays,
        request_type: getValue("requestType"),
        reason: getValue("reason"),
        employee_signature: employeeSignature,
        status: "pending",
        form_data: {
            employeeName,
            requestDate,
            startDate,
            endDate,
            returnDate: getValue("returnDate"),
            totalDays,
            requestType: getValue("requestType"),
            halfDayRequest,
            halfDayFinishTime,
            halfDayFinishTimeLabel,
            reason: getValue("reason"),
            employeeSignature
        }
    };
    record.email_body = buildVacationEmailBody(record);

    setStatus("Saving vacation request...");

    const { error } = await supabaseClient
        .from("vacation_requests")
        .insert(record);

    if (error) {
        setStatus("");
        alert("This vacation request could not be saved. " + (error.message || ""));
        return;
    }

    setStatus("Sending vacation request email...");

    try {
        await emailVacationRequest(record);
        alert("Vacation request submitted and emailed.");
    } catch (error) {
        alert("Vacation request was saved, but the email could not be sent.");
    }

    document.getElementById("startDate").value = "";
    document.getElementById("endDate").value = "";
    document.getElementById("returnDate").value = "";
    document.getElementById("totalDays").value = "";
    document.getElementById("halfDayRequest").checked = false;
    document.getElementById("halfDayFinishTime").value = "";
    document.getElementById("halfDayFinishWrap").classList.add("field-hidden");
    document.getElementById("reason").value = "";
    setStatus("Vacation request submitted.");
    loadMyVacationRequests();
}

async function signOut() {
    await signOutJgc(supabaseClient);
}

loadMyVacationRequests();
</script>
