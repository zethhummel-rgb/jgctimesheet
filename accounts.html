<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="googlebot" content="noindex, nofollow, noarchive" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JGC Accounts</title>
  <link rel="stylesheet" href="styles.css?v=3">

<style>
body {
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #062817 0, #020b08 58%);
    margin: 0;
    padding: 0 20px 20px;
    color: #f4fff6;
}

.logo-wrap {
    max-width: 347px;
    margin: 0 auto 8px;
    text-align: center;
}

.logo-wrap img {
    width: 100%;
    max-width: 347px;
    height: auto;
    display: block;
    margin: 0 auto;
}

h1 {
    text-align: center;
    color: #ffffff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    margin: 0 0 8px;
}

.user-bar {
    max-width: 1100px;
    margin: 0 auto 12px;
    color: #ffffff;
    text-align: center;
    font-size: 13px;
    font-weight: bold;
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
}

.actions {
    max-width: 1100px;
    margin: 0 auto 12px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.tabs {
    position: sticky;
    top: 66px;
    z-index: 120;
    width: min(1500px, calc(100vw - 40px));
    max-width: 1500px;
    margin: 0 auto 12px;
    padding: 7px 10px;
    display: flex;
    flex-wrap: nowrap;
    justify-content: center;
    gap: 5px;
    overflow-x: auto;
    background: rgba(6, 20, 17, 0.98);
    border-top: 1px solid rgba(57, 200, 72, 0.25);
    border-bottom: 1px solid rgba(57, 200, 72, 0.25);
    box-shadow: 0 10px 24px rgba(0,0,0,0.18);
    scrollbar-width: none;
}

.tabs::-webkit-scrollbar {
    display: none;
}

.tab-button {
    flex: 0 0 auto;
    background: #20382a;
    color: #ffffff;
    border: 1px solid rgba(63, 125, 77, 0.6);
    border-radius: 999px;
    min-width: 86px;
    padding: 8px 13px;
    font-size: 12px;
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: 0;
    text-align: center;
    white-space: nowrap;
}

.tab-button.active {
    background: #37d650;
    color: #061411;
}

.tab-button {
    flex: 0 0 auto !important;
    width: auto !important;
    min-width: 86px !important;
    min-height: 0 !important;
    padding: 8px 13px !important;
    border: 1px solid rgba(63, 125, 77, 0.6) !important;
    border-radius: 999px !important;
    background: #20382a !important;
    color: #ffffff !important;
    font-size: 12px !important;
    font-weight: 700 !important;
    line-height: 1.1 !important;
    letter-spacing: 0 !important;
    text-align: center !important;
    white-space: nowrap !important;
}

.tab-button.active {
    background: #37d650 !important;
    color: #061411 !important;
}

.panel {
    max-width: 1100px;
    margin: 0 auto;
    background: #fbfcf9;
    border-radius: 8px;
    border-top: 4px solid #3f7d4d;
    box-shadow: 0 3px 10px rgba(0,0,0,0.18);
    padding: 16px;
}

.filters {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 10px;
    margin-bottom: 12px;
}

label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 4px;
}

input,
select,
textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 8px;
    border: 1px solid #bcc7bc;
    border-radius: 4px;
}

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    min-width: 840px;
    border-collapse: collapse;
    background: #ffffff;
}

th,
td {
    border: 1px solid #c6cec5;
    padding: 7px;
    text-align: left;
    vertical-align: top;
    font-size: 13px;
}

th {
    background: #e6ece6;
}

.status {
    display: inline-block;
    border-radius: 999px;
    padding: 3px 8px;
    font-weight: bold;
    font-size: 12px;
}

.pending {
    background: #fff2c2;
    color: #684d00;
}

.approved {
    background: #dcefdc;
    color: #1d5b28;
}

.inactive {
    background: #f4d3d3;
    color: #7b1f1f;
}

.status.po-create-allowed,
.status.po-create-blocked {
    min-width: 104px;
    padding: 6px 10px;
    border: 1px solid transparent;
    border-radius: 6px;
    color: #ffffff !important;
    font-size: 12px;
    font-weight: 700;
    line-height: 1.15;
    text-align: center;
    white-space: nowrap;
}

.status.po-create-allowed {
    background: #177b3b !important;
    border-color: #66d885;
}

.status.po-create-blocked {
    background: #b42318 !important;
    border-color: #ff9a91;
}

button {
    background: #0b5e3b;
    color: white;
    border: none;
    padding: 9px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #08452b;
}

.secondary {
    background: #47534b;
}

.secondary:hover {
    background: #354039;
}

.danger {
    background: #8b2e2e;
}

.danger:hover {
    background: #692222;
}

.row-actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

.small {
    font-size: 13px;
    color: #58635c;
}

@media (max-width: 720px) {
    body {
        padding: 10px;
    }

    .tabs {
        top: 58px;
        z-index: 25;
        width: auto;
        max-width: none;
        margin: 0 -10px 12px;
        padding: 8px 10px;
        gap: 3px;
        flex-wrap: nowrap;
        justify-content: flex-start;
        overflow-x: auto;
        background: rgba(6, 20, 17, 0.98);
        border-top: 1px solid rgba(57, 200, 72, 0.25);
        border-bottom: 1px solid rgba(57, 200, 72, 0.25);
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
        display: none;
    }

    .tabs button,
    .tabs .tab-button {
        flex: 0 0 auto;
        width: auto;
        min-width: max-content;
        padding: 9px 12px !important;
        border-radius: 999px;
        font-size: 13px !important;
    }

    button {
        width: 100%;
    }

    .row-actions {
        min-width: 150px;
    }
}
</style>
</head>

<body>
<div class="tabs">
    <button type="button" class="tab-button" onclick="window.location.href='admin.html?tab=summary'">Summary</button>
    <button type="button" class="tab-button" onclick="window.location.href='admin.html?tab=jobDashboard'">Job Dashboard</button>
    <button type="button" class="tab-button" onclick="window.location.href='admin.html?tab=timesheets'">Timesheets</button>
    <button type="button" class="tab-button" onclick="window.location.href='admin.html?tab=inspections'">Inspections</button>
    <button type="button" class="tab-button" onclick="window.location.href='admin.html?tab=vacation'">Vacation Requests</button>
    <button type="button" class="tab-button" onclick="window.location.href='admin.html?tab=tasks'">Tasks</button>
    <button type="button" class="tab-button" onclick="window.location.href='admin.html?tab=reports'">Reports</button>
    <button type="button" class="tab-button" onclick="window.location.href='admin.html?tab=workOrders'">Work Orders</button>
    <button type="button" class="tab-button" onclick="window.location.href='purchase-orders-admin.html'">Purchase Orders</button>
    <button type="button" class="tab-button active" onclick="window.location.href='admin.html?tab=adminTools'">Admin Tools</button>
</div>

<div class="logo-wrap">
    <img src="logo.webp" alt="John Gordon Construction logo">
</div>

<h1>Accounts</h1>
<div id="currentUser" class="user-bar"></div>

<div class="actions">
    <button type="button" onclick="loadAccounts()">Refresh Accounts</button>
    <button class="secondary" type="button" onclick="window.location.href='purchase-orders-admin.html'">Purchase Order Admin</button>
    <button class="secondary" type="button" onclick="window.location.href='admin.html?tab=adminTools'">Back to Admin Tools</button>
    <button class="secondary" type="button" onclick="signOut()">Sign Out</button>
</div>

<div class="panel">
    <div class="filters">
        <div>
            <label>Search</label>
            <input id="searchInput" oninput="renderAccounts()" placeholder="Name or email">
        </div>
        <div>
            <label>Status</label>
            <select id="statusFilter" onchange="renderAccounts()">
                <option value="">All</option>
                <option value="pending">Pending</option>
                <option value="approved">Approved</option>
                <option value="inactive">Inactive</option>
            </select>
        </div>
    </div>
    <div id="accountsList" class="small">Loading accounts...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="this.onerror=null;this.src='vendor/supabase-js.min.js?v=1';"></script>
  <script src="common.js?v=23"></script>
<script>
const supabaseClient = createJgcSupabaseClient();
const worker = requireJgcWorker();
const currentWorker = normalizeWorkerName(worker.key);
const currentWorkerDisplay = worker.display;
const currentUserRole = worker.role;
let accounts = [];
let currentUserId = "";
let accountsLoadStarted = false;

if (!isAdminWorker(currentWorker, currentUserRole)) {
    alert("Accounts is only available to authorized users.");
    window.location.href = "home.html";
}

document.getElementById("currentUser").textContent = "Signed in as: " + currentWorkerDisplay;

function formatDate(value) {
    return formatDisplayDate(value);
}

function renderAccounts() {
    const list = document.getElementById("accountsList");
    const search = document.getElementById("searchInput").value.trim().toLowerCase();
    const status = document.getElementById("statusFilter").value;

    const filtered = accounts.filter((account) => {
        const text = `${account.display_name || ""} ${account.email || ""} ${account.worker_key || ""}`.toLowerCase();
        return (!search || text.includes(search)) && (!status || account.account_status === status);
    });

    if (!filtered.length) {
        list.textContent = "No accounts found.";
        return;
    }

    list.innerHTML = `
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th>Account Type</th>
                        <th>Digital PO</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    ${filtered.map((account) => {
                        const isSelf = account.id === currentUserId;
                        const statusClass = account.account_status || "pending";
                        return `
                            <tr>
                                <td>${escapeHtml(account.display_name)}</td>
                                <td>${escapeHtml(account.email)}</td>
                                <td><span class="status ${escapeHtml(statusClass)}">${escapeHtml(statusClass)}</span></td>
                                <td>${escapeHtml(getAccountTypeLabel(account.role))}</td>
                                <td><span class="status ${account.can_create_digital_pos ? "po-create-allowed" : "po-create-blocked"}">${account.can_create_digital_pos ? "PO Allowed" : "PO Not Allowed"}</span></td>
                                <td>${escapeHtml(formatDate(account.created_at))}</td>
                                <td>
                                    <div class="row-actions">
                                        ${account.account_status !== "approved" ? `<button type="button" onclick="approveAccount('${account.id}')">Approve</button>` : ""}
                                        ${account.account_status === "inactive" ? `<button type="button" onclick="reactivateAccount('${account.id}')">Reactivate</button>` : ""}
                                        ${account.account_status !== "inactive" && !isSelf ? `<button type="button" class="danger" onclick="deactivateAccount('${account.id}')">Deactivate</button>` : ""}
                                        ${account.account_status === "approved" ? `<button type="button" class="secondary" onclick="setDigitalPoPermission('${account.id}', ${account.can_create_digital_pos ? "false" : "true"})">${account.can_create_digital_pos ? "Remove PO Creation" : "Allow PO Creation"}</button>` : ""}
                                        ${renderAccountTypeActions(account, isSelf)}
                                    </div>
                                </td>
                            </tr>
                        `;
                    }).join("")}
                </tbody>
            </table>
        </div>
    `;
}

function getAccountTypeLabel(role) {
    const normalizedRole = String(role || "worker").toLowerCase();
    const labels = {
        admin: "Admin",
        supervisor: "Supervisor",
        worker: "Employee"
    };
    return labels[normalizedRole] || "Employee";
}

function renderAccountTypeActions(account, isSelf) {
    const role = String(account.role || "worker").toLowerCase();

    if (isSelf && role === "admin") {
        return '<span class="small">Your admin account</span>';
    }

    const actions = [];

    if (role !== "worker") {
        actions.push(`<button type="button" class="secondary" onclick="setRole('${account.id}', 'worker')">Make Employee</button>`);
    }

    if (role !== "supervisor") {
        actions.push(`<button type="button" class="secondary" onclick="setRole('${account.id}', 'supervisor')">Make Supervisor</button>`);
    }

    if (role !== "admin") {
        actions.push(`<button type="button" class="secondary" onclick="setRole('${account.id}', 'admin')">Make Admin</button>`);
    }

    return actions.join("");
}

async function loadAccounts() {
    if (!supabaseClient) {
        document.getElementById("accountsList").textContent = "Supabase is not available.";
        return;
    }

    const list = document.getElementById("accountsList");
    list.textContent = "Loading accounts...";

    const sessionResult = await supabaseClient.auth.getSession();
    currentUserId = sessionResult.data.session && sessionResult.data.session.user
        ? sessionResult.data.session.user.id
        : "";

    if (!currentUserId) {
        const userResult = await supabaseClient.auth.getUser();
        currentUserId = userResult.data.user ? userResult.data.user.id : "";
    }

    if (!currentUserId) {
        list.textContent = "Accounts could not be loaded. Please sign in again.";
        return;
    }

    const { data, error } = await supabaseClient
        .from("profiles")
        .select("id,email,display_name,worker_key,role,account_status,can_create_digital_pos,created_at,approved_at,deactivated_at")
        .order("created_at", { ascending: false });

    if (error) {
        list.textContent = "Accounts could not be loaded: " + (error.message || "Make sure your account has admin approval.");
        return;
    }

    accounts = data || [];

    if (!accounts.length) {
        list.textContent = "No accounts found. Try Refresh Accounts if this page just opened.";
        return;
    }

    renderAccounts();
}

async function updateAccount(id, values) {
    const { error } = await supabaseClient
        .from("profiles")
        .update(values)
        .eq("id", id);

    if (error) {
        if (String(error.message || "").includes("profiles_role_check")) {
            alert("Supabase needs the updated account type rule before Supervisor can be saved. Run supabase-fix-profiles-role-check.sql in the SQL Editor, then try again.");
            return false;
        }

        alert(error.message || "Account could not be updated.");
        return false;
    }

    await loadAccounts();
    return true;
}

async function approveAccount(id) {
    const updated = await updateAccount(id, {
        account_status: "approved",
        approved_at: new Date().toISOString(),
        approved_by: currentUserId,
        deactivated_at: null
    });

    if (updated && typeof clearJgcPendingAccountNotifications === "function") {
        await clearJgcPendingAccountNotifications(supabaseClient, id);
        await loadJgcNotifications();
    }
}

async function reactivateAccount(id) {
    await approveAccount(id);
}

async function deactivateAccount(id) {
    const account = accounts.find((item) => item.id === id);
    const name = account ? account.display_name || account.email : "this account";

    if (!confirm("Deactivate " + name + "? This removes app access but keeps their saved records.")) {
        return;
    }

    const updated = await updateAccount(id, {
        account_status: "inactive",
        deactivated_at: new Date().toISOString(),
        can_create_digital_pos: false
    });

    if (updated && typeof clearJgcPendingAccountNotifications === "function") {
        await clearJgcPendingAccountNotifications(supabaseClient, id);
        await loadJgcNotifications();
    }
}

async function setRole(id, role) {
    const account = accounts.find((item) => item.id === id);
    const name = account ? account.display_name || account.email : "this account";
    const currentRole = account ? String(account.role || "worker").toLowerCase() : "";
    const nextRole = String(role || "worker").toLowerCase();

    if (id === currentUserId && currentRole === "admin" && nextRole !== "admin") {
        alert("You cannot change your own admin account type from this page.");
        return;
    }

    if (!confirm("Change " + name + " to " + getAccountTypeLabel(nextRole) + "?")) {
        return;
    }

    await updateAccount(id, { role: nextRole });
}

async function setDigitalPoPermission(id, allowed) {
    const account = accounts.find((item) => item.id === id);
    const name = account ? account.display_name || account.email : "this account";

    if (account && account.account_status !== "approved") {
        alert("Approve the account before allowing Digital PO creation.");
        return;
    }

    const action = allowed ? "allow" : "remove";
    if (!confirm((allowed ? "Allow " : "Remove ") + name + (allowed ? " to create Digital POs?" : " from Digital PO creation? Existing PO history will remain."))) {
        return;
    }

    const updated = await updateAccount(id, { can_create_digital_pos: Boolean(allowed) });
    if (updated) {
        alert("Digital PO creation permission updated. " + (allowed ? "The employee can now register a PO device." : "New PO creation is disabled."));
    }
}

async function signOut() {
    await signOutJgc(supabaseClient);
}

function startAccountsPage() {
    if (accountsLoadStarted) {
        loadAccounts();
        return;
    }

    accountsLoadStarted = true;
    loadAccounts();

    setTimeout(() => {
        if (!accounts.length) {
            loadAccounts();
        }
    }, 900);
}

window.addEventListener("pageshow", startAccountsPage);
startAccountsPage();
</script>
</body>
</html>
