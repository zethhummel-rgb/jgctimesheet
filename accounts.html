<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="googlebot" content="noindex, nofollow, noarchive" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JGC Accounts</title>
  <link rel="stylesheet" href="jgc-design-system.css?v=8" data-jgc-design-system="8">
  <link rel="stylesheet" href="accounts-admin.css?v=1">
</head>

<body class="accounts-page jgc-page">
<div class="tabs jgc-admin-nav">
    <button type="button" class="tab-button" onclick="window.location.href='admin.html?tab=summary'">Summary</button>
    <button type="button" class="tab-button" onclick="window.location.href='admin.html?tab=jobDashboard'">Job Dashboard</button>
    <button type="button" class="tab-button" onclick="window.location.href='admin.html?tab=timesheets'">Timesheets</button>
    <button type="button" class="tab-button" onclick="window.location.href='admin.html?tab=safetyRecords'">Safety Records</button>
    <button type="button" class="tab-button" onclick="window.location.href='admin.html?tab=vacation'">Vacation Requests</button>
    <button type="button" class="tab-button" onclick="window.location.href='admin.html?tab=tasks'">Tasks</button>
    <button type="button" class="tab-button" onclick="window.location.href='admin.html?tab=workOrders'">Work Orders</button>
    <button type="button" class="tab-button" onclick="window.location.href='purchase-orders-admin.html'">Purchase Orders</button>
    <button type="button" class="tab-button active" onclick="window.location.href='admin.html?tab=adminTools'">Admin Tools</button>
</div>

<main class="accounts-shell jgc-page-shell">
<header class="accounts-page-header jgc-page-header">
    <div class="logo-wrap jgc-brand">
        <img src="logo.webp" alt="John Gordon Construction logo">
    </div>

    <h1>Accounts</h1>
    <div id="currentUser" class="user-bar"></div>
</header>

<div class="actions jgc-actions">
    <button class="jgc-button" type="button" onclick="loadAccounts()">Refresh Accounts</button>
    <button class="secondary jgc-button jgc-button--secondary" type="button" onclick="window.location.href='purchase-orders-admin.html'">Purchase Order Admin</button>
    <button class="secondary jgc-button jgc-button--secondary" type="button" onclick="window.location.href='admin.html?tab=adminTools'">Back to Admin Tools</button>
    <button class="secondary jgc-button jgc-button--secondary" type="button" onclick="signOut()">Sign Out</button>
</div>

<div class="panel jgc-panel">
    <div class="filters jgc-filter-grid">
        <div class="jgc-field">
            <label class="jgc-label" for="searchInput">Search</label>
            <input id="searchInput" class="jgc-input" oninput="renderAccounts()" placeholder="Name or email">
        </div>
        <div class="jgc-field">
            <label class="jgc-label" for="statusFilter">Status</label>
            <select id="statusFilter" class="jgc-select" onchange="renderAccounts()">
                <option value="">All</option>
                <option value="pending">Pending</option>
                <option value="approved">Approved</option>
                <option value="limited">Limited Access</option>
                <option value="inactive">Inactive</option>
            </select>
        </div>
    </div>
    <div id="accountsList" class="small accounts-list">Loading accounts...</div>
</div>
</main>

<script src="vendor/supabase-js.min.js?v=1" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';"></script>
  <script src="common.js?v=41"></script>
<script>
const supabaseClient = createJgcSupabaseClient();
const worker = requireJgcWorker();
const currentWorker = normalizeWorkerName(worker.key);
const currentWorkerDisplay = worker.display;
const currentUserRole = worker.role;
let accounts = [];
let currentUserId = "";
let accountsLoadStarted = false;

if (!isAdminWorker(currentWorker, currentUserRole)) {
    alert("Accounts is only available to authorized users.");
    window.location.href = "home.html";
}

document.getElementById("currentUser").textContent = "Signed in as: " + currentWorkerDisplay;

function formatDate(value) {
    return formatDisplayDate(value);
}

function renderAccountRows(accountList) {
    return accountList.map((account) => {
        const isSelf = account.id === currentUserId;
        const statusClass = account.account_status || "pending";
        const statusToneClass = statusClass === "approved"
            ? "jgc-badge--success"
            : statusClass === "inactive"
                ? "jgc-badge--danger"
                : "jgc-badge--warning";
        const statusLabel = statusClass === "limited" ? "Limited Access" : statusClass;
        return `
            <tr>
                <td>${escapeHtml(account.display_name)}</td>
                <td>${escapeHtml(account.email)}</td>
                <td><span class="status ${escapeHtml(statusClass)} jgc-badge ${statusToneClass}">${escapeHtml(statusLabel)}</span></td>
                <td>${escapeHtml(getAccountTypeLabel(account.role))}</td>
                <td><span class="status ${account.can_create_digital_pos ? "po-create-allowed" : "po-create-blocked"} jgc-badge ${account.can_create_digital_pos ? "jgc-badge--success" : "jgc-badge--danger"}">${account.can_create_digital_pos ? "PO Allowed" : "PO Not Allowed"}</span></td>
                <td>${escapeHtml(formatDate(account.created_at))}</td>
                <td>
                    <div class="row-actions jgc-table-actions">
                        ${account.account_status !== "approved" ? `<button class="jgc-button" type="button" onclick="approveAccount('${account.id}')">Reactivate</button>` : ""}
                        ${account.account_status !== "limited" && !isSelf ? `<button type="button" class="secondary jgc-button jgc-button--secondary" onclick="limitAccount('${account.id}')">Limited Access</button>` : ""}
                        ${account.account_status !== "inactive" && !isSelf ? `<button type="button" class="danger jgc-button jgc-button--danger" onclick="deactivateAccount('${account.id}')">${account.account_status === "limited" ? "Fully Deactivate" : "Deactivate"}</button>` : ""}
                        ${account.account_status === "approved" ? `<button type="button" class="secondary jgc-button jgc-button--secondary" onclick="setDigitalPoPermission('${account.id}', ${account.can_create_digital_pos ? "false" : "true"})">${account.can_create_digital_pos ? "Remove PO Creation" : "Allow PO Creation"}</button>` : ""}
                        ${renderAccountTypeActions(account, isSelf)}
                    </div>
                </td>
            </tr>
        `;
    }).join("");
}

function renderAccountsTable(accountList) {
    return `
        <div class="table-wrap jgc-table-wrap">
            <table class="accounts-table jgc-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th>Account Type</th>
                        <th>Digital PO</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    ${renderAccountRows(accountList)}
                </tbody>
            </table>
        </div>
    `;
}

function renderAccounts() {
    const list = document.getElementById("accountsList");
    const search = document.getElementById("searchInput").value.trim().toLowerCase();
    const status = document.getElementById("statusFilter").value;

    const filtered = accounts.filter((account) => {
        const text = `${account.display_name || ""} ${account.email || ""} ${account.worker_key || ""}`.toLowerCase();
        return (!search || text.includes(search)) && (!status || account.account_status === status);
    });

    if (!filtered.length) {
        list.textContent = "No accounts found.";
        return;
    }

    const currentAccounts = filtered.filter((account) => !["inactive", "limited"].includes(account.account_status));
    const pastEmployees = filtered.filter((account) => ["inactive", "limited"].includes(account.account_status));
    const openPastEmployees = ["inactive", "limited"].includes(status) || (Boolean(search) && pastEmployees.length > 0);
    const currentAccountsMarkup = currentAccounts.length
        ? renderAccountsTable(currentAccounts)
        : ["inactive", "limited"].includes(status)
            ? ""
            : '<p class="accounts-empty-note">No current accounts match this search.</p>';
    const pastEmployeesMarkup = pastEmployees.length
        ? `
            <details class="past-employees jgc-archive"${openPastEmployees ? " open" : ""}>
                <summary>
                    <span class="jgc-archive__title">Past Employees</span>
                    <span class="jgc-archive__count">${pastEmployees.length} former employees</span>
                </summary>
                <div class="past-employees-body jgc-archive__body">
                    ${renderAccountsTable(pastEmployees)}
                </div>
            </details>
        `
        : "";

    list.innerHTML = currentAccountsMarkup + pastEmployeesMarkup;
}

function getAccountTypeLabel(role) {
    const normalizedRole = String(role || "worker").toLowerCase();
    const labels = {
        admin: "Admin",
        supervisor: "Supervisor",
        worker: "Employee"
    };
    return labels[normalizedRole] || "Employee";
}

function renderAccountTypeActions(account, isSelf) {
    const role = String(account.role || "worker").toLowerCase();

    if (isSelf && role === "admin") {
        return '<span class="small">Your admin account</span>';
    }

    const actions = [];

    if (role !== "worker") {
        actions.push(`<button type="button" class="secondary jgc-button jgc-button--secondary" onclick="setRole('${account.id}', 'worker')">Make Employee</button>`);
    }

    if (role !== "supervisor") {
        actions.push(`<button type="button" class="secondary jgc-button jgc-button--secondary" onclick="setRole('${account.id}', 'supervisor')">Make Supervisor</button>`);
    }

    if (role !== "admin") {
        actions.push(`<button type="button" class="secondary jgc-button jgc-button--secondary" onclick="setRole('${account.id}', 'admin')">Make Admin</button>`);
    }

    return actions.join("");
}

async function loadAccounts() {
    if (!supabaseClient) {
        document.getElementById("accountsList").textContent = "Supabase is not available.";
        return;
    }

    const list = document.getElementById("accountsList");
    list.textContent = "Loading accounts...";

    const sessionResult = await supabaseClient.auth.getSession();
    currentUserId = sessionResult.data.session && sessionResult.data.session.user
        ? sessionResult.data.session.user.id
        : "";

    if (!currentUserId) {
        const userResult = await supabaseClient.auth.getUser();
        currentUserId = userResult.data.user ? userResult.data.user.id : "";
    }

    if (!currentUserId) {
        list.textContent = "Accounts could not be loaded. Please sign in again.";
        return;
    }

    const { data, error } = await supabaseClient
        .from("profiles")
        .select("id,email,display_name,worker_key,role,account_status,can_create_digital_pos,created_at,approved_at,deactivated_at")
        .order("created_at", { ascending: false });

    if (error) {
        list.textContent = "Accounts could not be loaded: " + (error.message || "Make sure your account has admin approval.");
        return;
    }

    accounts = data || [];

    if (!accounts.length) {
        list.textContent = "No accounts found. Try Refresh Accounts if this page just opened.";
        return;
    }

    renderAccounts();
}

async function updateAccount(id, values) {
    const { error } = await supabaseClient
        .from("profiles")
        .update(values)
        .eq("id", id);

    if (error) {
        if (String(error.message || "").includes("profiles_role_check")) {
            alert("Supabase needs the updated account type rule before Supervisor can be saved. Run supabase-fix-profiles-role-check.sql in the SQL Editor, then try again.");
            return false;
        }

        alert(error.message || "Account could not be updated.");
        return false;
    }

    await loadAccounts();
    return true;
}

async function approveAccount(id) {
    const updated = await updateAccount(id, {
        account_status: "approved",
        approved_at: new Date().toISOString(),
        approved_by: currentUserId,
        deactivated_at: null
    });

    if (updated && typeof clearJgcPendingAccountNotifications === "function") {
        await clearJgcPendingAccountNotifications(supabaseClient, id);
        await loadJgcNotifications();
    }
}

async function reactivateAccount(id) {
    await approveAccount(id);
}

async function limitAccount(id) {
    const account = accounts.find((item) => item.id === id);
    const name = account ? account.display_name || account.email : "this account";

    if (!confirm("Give " + name + " Limited Access? They will only be able to view their own certificates, submitted timesheets, inspections, and reports.")) {
        return;
    }

    const updated = await updateAccount(id, {
        account_status: "limited",
        deactivated_at: new Date().toISOString(),
        can_create_digital_pos: false
    });

    if (updated && typeof clearJgcPendingAccountNotifications === "function") {
        await clearJgcPendingAccountNotifications(supabaseClient, id);
        await loadJgcNotifications();
    }
}

async function deactivateAccount(id) {
    const account = accounts.find((item) => item.id === id);
    const name = account ? account.display_name || account.email : "this account";

    if (!confirm("Deactivate " + name + "? This removes app access but keeps their saved records.")) {
        return;
    }

    const updated = await updateAccount(id, {
        account_status: "inactive",
        deactivated_at: new Date().toISOString(),
        can_create_digital_pos: false
    });

    if (updated && typeof clearJgcPendingAccountNotifications === "function") {
        await clearJgcPendingAccountNotifications(supabaseClient, id);
        await loadJgcNotifications();
    }
}

async function setRole(id, role) {
    const account = accounts.find((item) => item.id === id);
    const name = account ? account.display_name || account.email : "this account";
    const currentRole = account ? String(account.role || "worker").toLowerCase() : "";
    const nextRole = String(role || "worker").toLowerCase();

    if (id === currentUserId && currentRole === "admin" && nextRole !== "admin") {
        alert("You cannot change your own admin account type from this page.");
        return;
    }

    if (!confirm("Change " + name + " to " + getAccountTypeLabel(nextRole) + "?")) {
        return;
    }

    await updateAccount(id, { role: nextRole });
}

async function setDigitalPoPermission(id, allowed) {
    const account = accounts.find((item) => item.id === id);
    const name = account ? account.display_name || account.email : "this account";

    if (account && account.account_status !== "approved") {
        alert("Approve the account before allowing Digital PO creation.");
        return;
    }

    const action = allowed ? "allow" : "remove";
    if (!confirm((allowed ? "Allow " : "Remove ") + name + (allowed ? " to create Digital POs?" : " from Digital PO creation? Existing PO history will remain."))) {
        return;
    }

    const updated = await updateAccount(id, { can_create_digital_pos: Boolean(allowed) });
    if (updated) {
        alert("Digital PO creation permission updated. " + (allowed ? "The employee can now register a PO device." : "New PO creation is disabled."));
    }
}

async function signOut() {
    await signOutJgc(supabaseClient);
}

function startAccountsPage() {
    if (accountsLoadStarted) {
        loadAccounts();
        return;
    }

    accountsLoadStarted = true;
    loadAccounts();

    setTimeout(() => {
        if (!accounts.length) {
            loadAccounts();
        }
    }, 900);
}

window.addEventListener("pageshow", startAccountsPage);
startAccountsPage();
</script>
</body>
</html>
