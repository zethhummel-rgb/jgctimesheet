<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JGC Accounts</title>
<link rel="stylesheet" href="styles.css?v=2">

<style>
body {
    font-family: Arial, sans-serif;
    background: #8f9691;
    margin: 0;
    padding: 20px;
    color: #1f2a24;
}

.logo-wrap {
    max-width: 347px;
    margin: 0 auto 8px;
    text-align: center;
}

.logo-wrap img {
    width: 100%;
    max-width: 347px;
    height: auto;
    display: block;
    margin: 0 auto;
}

h1 {
    text-align: center;
    color: #ffffff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    margin: 0 0 8px;
}

.user-bar {
    max-width: 1100px;
    margin: 0 auto 12px;
    color: #ffffff;
    text-align: center;
    font-size: 13px;
    font-weight: bold;
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
}

.actions {
    max-width: 1100px;
    margin: 0 auto 12px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.panel {
    max-width: 1100px;
    margin: 0 auto;
    background: #fbfcf9;
    border-radius: 8px;
    border-top: 4px solid #3f7d4d;
    box-shadow: 0 3px 10px rgba(0,0,0,0.18);
    padding: 16px;
}

.filters {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 10px;
    margin-bottom: 12px;
}

label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 4px;
}

input,
select,
textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 8px;
    border: 1px solid #bcc7bc;
    border-radius: 4px;
}

textarea {
    min-height: 110px;
    resize: vertical;
}

.announcement-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.announcement-grid .full {
    grid-column: 1 / -1;
}

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    min-width: 840px;
    border-collapse: collapse;
    background: #ffffff;
}

th,
td {
    border: 1px solid #c6cec5;
    padding: 7px;
    text-align: left;
    vertical-align: top;
    font-size: 13px;
}

th {
    background: #e6ece6;
}

.status {
    display: inline-block;
    border-radius: 999px;
    padding: 3px 8px;
    font-weight: bold;
    font-size: 12px;
}

.pending {
    background: #fff2c2;
    color: #684d00;
}

.approved {
    background: #dcefdc;
    color: #1d5b28;
}

.inactive {
    background: #f4d3d3;
    color: #7b1f1f;
}

button {
    background: #0b5e3b;
    color: white;
    border: none;
    padding: 9px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #08452b;
}

.secondary {
    background: #47534b;
}

.secondary:hover {
    background: #354039;
}

.danger {
    background: #8b2e2e;
}

.danger:hover {
    background: #692222;
}

.row-actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

.small {
    font-size: 13px;
    color: #58635c;
}

@media (max-width: 720px) {
    body {
        padding: 10px;
    }

    button {
        width: 100%;
    }

    .row-actions {
        min-width: 150px;
    }

    .announcement-grid {
        grid-template-columns: 1fr;
    }

    .announcement-grid .full {
        grid-column: auto;
    }
}
</style>
</head>

<body>
<div class="logo-wrap">
    <img src="logo.png" alt="John Gordon Construction logo">
</div>

<h1>Accounts</h1>
<div id="currentUser" class="user-bar"></div>

<div class="actions">
    <button class="secondary" type="button" onclick="window.location.href='home.html'">Home</button>
    <button class="secondary" type="button" onclick="window.location.href='admin.html'">Admin</button>
    <button class="secondary" type="button" onclick="signOut()">Sign Out</button>
</div>

<div class="panel" style="margin-bottom:14px;">
    <h2>Announcements</h2>
    <div class="announcement-grid">
        <div>
            <label>Title</label>
            <input id="announcementTitle" placeholder="Example: Safety meeting Friday">
        </div>
        <div>
            <label>Expires On (optional)</label>
            <input id="announcementExpires" type="date">
        </div>
        <div class="full">
            <label>Message</label>
            <textarea id="announcementBody" placeholder="Write the announcement here"></textarea>
        </div>
        <div class="full">
            <label>Attach PDF (optional)</label>
            <input id="announcementFile" type="file" accept="application/pdf,.pdf">
        </div>
    </div>
    <div class="row-actions" style="margin-top:10px;">
        <button type="button" onclick="publishAnnouncement()">Publish Announcement</button>
        <button class="secondary" type="button" onclick="loadAnnouncements()">Refresh Announcements</button>
    </div>
    <div id="announcementStatus" class="small" style="margin-top:10px;"></div>
    <div id="announcementsList" class="small" style="margin-top:12px;">Loading announcements...</div>
</div>

<div class="panel">
    <div class="filters">
        <div>
            <label>Search</label>
            <input id="searchInput" oninput="renderAccounts()" placeholder="Name or email">
        </div>
        <div>
            <label>Status</label>
            <select id="statusFilter" onchange="renderAccounts()">
                <option value="">All</option>
                <option value="pending">Pending</option>
                <option value="approved">Approved</option>
                <option value="inactive">Inactive</option>
            </select>
        </div>
    </div>
    <div id="accountsList" class="small">Loading accounts...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="common.js?v=2"></script>
<script>
const supabaseClient = createJgcSupabaseClient();
const worker = requireJgcWorker();
const currentWorker = normalizeWorkerName(worker.key);
const currentWorkerDisplay = worker.display;
const currentUserRole = worker.role;
let accounts = [];
let announcements = [];
let announcementUrls = {};
let currentUserId = "";
const ANNOUNCEMENT_EMAIL_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzPILTnOSzQcCkA6y5vSLxCH6i05Y2-ZHZAk09Und0YKiXZOYMppV4fvW3G6EgqOIZi/exec";

if (!isAdminWorker(currentWorker, currentUserRole)) {
    alert("Accounts is only available to authorized users.");
    window.location.href = "home.html";
}

document.getElementById("currentUser").textContent = "Signed in as: " + currentWorkerDisplay;

function formatDate(value) {
    return formatDisplayDate(value);
}

function renderAccounts() {
    const list = document.getElementById("accountsList");
    const search = document.getElementById("searchInput").value.trim().toLowerCase();
    const status = document.getElementById("statusFilter").value;

    const filtered = accounts.filter((account) => {
        const text = `${account.display_name || ""} ${account.email || ""} ${account.worker_key || ""}`.toLowerCase();
        return (!search || text.includes(search)) && (!status || account.account_status === status);
    });

    if (!filtered.length) {
        list.textContent = "No accounts found.";
        return;
    }

    list.innerHTML = `
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th>Role</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    ${filtered.map((account) => {
                        const isSelf = account.id === currentUserId;
                        const statusClass = account.account_status || "pending";
                        return `
                            <tr>
                                <td>${escapeHtml(account.display_name)}</td>
                                <td>${escapeHtml(account.email)}</td>
                                <td><span class="status ${escapeHtml(statusClass)}">${escapeHtml(statusClass)}</span></td>
                                <td>${escapeHtml(account.role || "worker")}</td>
                                <td>${escapeHtml(formatDate(account.created_at))}</td>
                                <td>
                                    <div class="row-actions">
                                        ${account.account_status !== "approved" ? `<button type="button" onclick="approveAccount('${account.id}')">Approve</button>` : ""}
                                        ${account.account_status === "inactive" ? `<button type="button" onclick="reactivateAccount('${account.id}')">Reactivate</button>` : ""}
                                        ${account.account_status !== "inactive" && !isSelf ? `<button type="button" class="danger" onclick="deactivateAccount('${account.id}')">Deactivate</button>` : ""}
                                        ${account.role !== "admin" ? `<button type="button" class="secondary" onclick="setRole('${account.id}', 'admin')">Make Admin</button>` : ""}
                                        ${account.role === "admin" && !isSelf ? `<button type="button" class="secondary" onclick="setRole('${account.id}', 'worker')">Make Worker</button>` : ""}
                                    </div>
                                </td>
                            </tr>
                        `;
                    }).join("")}
                </tbody>
            </table>
        </div>
    `;
}

function makeSafeFileName(name) {
    return String(name || "announcement.pdf")
        .trim()
        .replace(/[^a-z0-9.\-_]+/gi, "-")
        .replace(/-+/g, "-")
        .toLowerCase();
}

function setAnnouncementStatus(message) {
    document.getElementById("announcementStatus").textContent = message || "";
}

function getApprovedEmails() {
    return accounts
        .filter((account) => account.account_status === "approved" && account.email)
        .map((account) => account.email);
}

async function prepareAnnouncementUrls() {
    announcementUrls = {};

    for (const announcement of announcements) {
        if (!announcement.file_path) {
            continue;
        }

        const { data } = await supabaseClient
            .storage
            .from("announcements")
            .createSignedUrl(announcement.file_path, 604800);

        if (data && data.signedUrl) {
            announcementUrls[announcement.id] = data.signedUrl;
        }
    }
}

function renderAnnouncements() {
    const list = document.getElementById("announcementsList");

    if (!announcements.length) {
        list.textContent = "No active announcements yet.";
        return;
    }

    list.innerHTML = `
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Message</th>
                        <th>PDF</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    ${announcements.map((announcement) => `
                        <tr>
                            <td>${escapeHtml(announcement.title)}</td>
                            <td>${escapeHtml(announcement.body || "")}</td>
                            <td>${announcementUrls[announcement.id] ? '<a class="file-link" href="' + announcementUrls[announcement.id] + '" target="_blank" rel="noopener">Open PDF</a>' : "-"}</td>
                            <td>${escapeHtml(formatDate(announcement.created_at))}</td>
                            <td><button type="button" class="danger" onclick="deleteAnnouncement('${escapeHtml(announcement.id)}')">Delete</button></td>
                        </tr>
                    `).join("")}
                </tbody>
            </table>
        </div>
    `;
}

async function loadAnnouncements() {
    const { data, error } = await supabaseClient
        .from("announcements")
        .select("*")
        .eq("is_active", true)
        .order("created_at", { ascending: false });

    if (error) {
        document.getElementById("announcementsList").textContent = "Announcements could not be loaded.";
        return;
    }

    announcements = data || [];
    await prepareAnnouncementUrls();
    renderAnnouncements();
}

async function publishAnnouncement() {
    const title = document.getElementById("announcementTitle").value.trim();
    const body = document.getElementById("announcementBody").value.trim();
    const expiresValue = document.getElementById("announcementExpires").value;
    const fileInput = document.getElementById("announcementFile");
    const file = fileInput.files[0];

    if (!title || (!body && !file)) {
        alert("Add a title and either a message or a PDF.");
        return;
    }

    if (file && file.type !== "application/pdf") {
        alert("Please upload a PDF file.");
        return;
    }

    setAnnouncementStatus("Publishing announcement...");

    let filePath = null;
    let fileName = null;
    let fileType = null;
    let signedUrl = "";

    if (file) {
        filePath = "announcements/" + Date.now() + "-" + makeSafeFileName(file.name);
        fileName = file.name;
        fileType = file.type || "application/pdf";

        const { error: uploadError } = await supabaseClient
            .storage
            .from("announcements")
            .upload(filePath, file, {
                cacheControl: "3600",
                upsert: false,
                contentType: fileType
            });

        if (uploadError) {
            setAnnouncementStatus("PDF upload failed.");
            return;
        }

        const { data: signedData } = await supabaseClient
            .storage
            .from("announcements")
            .createSignedUrl(filePath, 604800);

        signedUrl = signedData && signedData.signedUrl ? signedData.signedUrl : "";
    }

    const record = {
        title,
        body,
        file_path: filePath,
        file_name: fileName,
        file_type: fileType,
        created_by: currentUserId || null,
        created_by_name: currentWorkerDisplay,
        expires_at: expiresValue ? expiresValue + "T23:59:59" : null,
        is_active: true
    };

    const { data, error } = await supabaseClient
        .from("announcements")
        .insert(record)
        .select()
        .single();

    if (error) {
        if (filePath) {
            await supabaseClient.storage.from("announcements").remove([filePath]);
        }
        setAnnouncementStatus("Announcement could not be saved.");
        return;
    }

    setAnnouncementStatus("Sending email notification...");

    try {
        await emailAnnouncement(data, signedUrl);
        setAnnouncementStatus("Announcement published and email notifications sent.");
    } catch (error) {
        setAnnouncementStatus("Announcement published, but email notification could not be sent.");
    }

    document.getElementById("announcementTitle").value = "";
    document.getElementById("announcementBody").value = "";
    document.getElementById("announcementExpires").value = "";
    fileInput.value = "";
    await loadAnnouncements();
}

async function emailAnnouncement(announcement, pdfUrl) {
    const recipients = getApprovedEmails();

    if (!recipients.length) {
        return;
    }

    const body = [
        "JGC Announcement",
        "",
        announcement.title,
        "",
        announcement.body || "",
        "",
        pdfUrl ? "PDF: " + pdfUrl : ""
    ].join("\n");

    await fetch(ANNOUNCEMENT_EMAIL_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
            "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify({
            to: recipients.join(","),
            recipients,
            subject: "JGC Announcement - " + announcement.title,
            body,
            text: body,
            pdfUrl,
            pdfFileName: announcement.file_name || ""
        })
    });
}

async function deleteAnnouncement(id) {
    const announcement = announcements.find((item) => item.id === id);

    if (!announcement) {
        alert("Announcement could not be found.");
        return;
    }

    if (!confirm("Delete this announcement?")) {
        return;
    }

    const { error } = await supabaseClient
        .from("announcements")
        .update({ is_active: false })
        .eq("id", id);

    if (error) {
        alert("Announcement could not be deleted.");
        return;
    }

    await loadAnnouncements();
}

async function loadAccounts() {
    if (!supabaseClient) {
        document.getElementById("accountsList").textContent = "Supabase is not available.";
        return;
    }

    const sessionResult = await supabaseClient.auth.getSession();
    currentUserId = sessionResult.data.session && sessionResult.data.session.user
        ? sessionResult.data.session.user.id
        : "";

    const { data, error } = await supabaseClient
        .from("profiles")
        .select("id,email,display_name,worker_key,role,account_status,created_at,approved_at,deactivated_at")
        .order("created_at", { ascending: false });

    if (error) {
        document.getElementById("accountsList").textContent = "Accounts could not be loaded. Make sure your account has admin approval.";
        return;
    }

    accounts = data || [];
    renderAccounts();
    await loadAnnouncements();
}

async function updateAccount(id, values) {
    const { error } = await supabaseClient
        .from("profiles")
        .update(values)
        .eq("id", id);

    if (error) {
        alert(error.message || "Account could not be updated.");
        return;
    }

    await loadAccounts();
}

async function approveAccount(id) {
    await updateAccount(id, {
        account_status: "approved",
        approved_at: new Date().toISOString(),
        approved_by: currentUserId,
        deactivated_at: null
    });
}

async function reactivateAccount(id) {
    await approveAccount(id);
}

async function deactivateAccount(id) {
    const account = accounts.find((item) => item.id === id);
    const name = account ? account.display_name || account.email : "this account";

    if (!confirm("Deactivate " + name + "? This removes app access but keeps their saved records.")) {
        return;
    }

    await updateAccount(id, {
        account_status: "inactive",
        deactivated_at: new Date().toISOString()
    });
}

async function setRole(id, role) {
    const account = accounts.find((item) => item.id === id);
    const name = account ? account.display_name || account.email : "this account";

    if (!confirm("Change " + name + " to " + role + "?")) {
        return;
    }

    await updateAccount(id, { role });
}

async function signOut() {
    await signOutJgc(supabaseClient);
}

loadAccounts();
</script>
</body>
</html>
