<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JGC Accounts</title>
<link rel="stylesheet" href="styles.css?v=2">

<style>
body {
    font-family: Arial, sans-serif;
    background: #8f9691;
    margin: 0;
    padding: 20px;
    color: #1f2a24;
}

.logo-wrap {
    max-width: 347px;
    margin: 0 auto 8px;
    text-align: center;
}

.logo-wrap img {
    width: 100%;
    max-width: 347px;
    height: auto;
    display: block;
    margin: 0 auto;
}

h1 {
    text-align: center;
    color: #ffffff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    margin: 0 0 8px;
}

.user-bar {
    max-width: 1100px;
    margin: 0 auto 12px;
    color: #ffffff;
    text-align: center;
    font-size: 13px;
    font-weight: bold;
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
}

.actions {
    max-width: 1100px;
    margin: 0 auto 12px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.admin-tabs {
    position: sticky;
    top: 66px;
    z-index: 120;
    max-width: none;
    margin: 0 -20px 14px;
    padding: 7px max(20px, calc((100vw - 1100px) / 2 + 20px));
    display: flex;
    flex-wrap: nowrap;
    justify-content: flex-start;
    gap: 8px;
    overflow-x: auto;
    background: rgba(6, 20, 17, 0.98);
    border-top: 1px solid rgba(57, 200, 72, 0.25);
    border-bottom: 1px solid rgba(57, 200, 72, 0.25);
    box-shadow: 0 10px 24px rgba(0,0,0,0.18);
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: rgba(57, 200, 72, 0.8) rgba(6, 20, 17, 0.98);
}

.admin-tabs button {
    flex: 0 0 auto;
    padding: 8px 10px;
    background: #20382a;
    border: 1px solid rgba(63, 125, 77, 0.45);
    color: #ffffff;
    font-size: 13px;
    border-radius: 999px;
    white-space: nowrap;
}

.admin-tabs button.active {
    background: #3f7d4d;
    color: #ffffff;
}

.panel {
    max-width: 1100px;
    margin: 0 auto;
    background: #fbfcf9;
    border-radius: 8px;
    border-top: 4px solid #3f7d4d;
    box-shadow: 0 3px 10px rgba(0,0,0,0.18);
    padding: 16px;
}

.filters {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 10px;
    margin-bottom: 12px;
}

label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 4px;
}

input,
select,
textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 8px;
    border: 1px solid #bcc7bc;
    border-radius: 4px;
}

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    min-width: 840px;
    border-collapse: collapse;
    background: #ffffff;
}

th,
td {
    border: 1px solid #c6cec5;
    padding: 7px;
    text-align: left;
    vertical-align: top;
    font-size: 13px;
}

th {
    background: #e6ece6;
}

.status {
    display: inline-block;
    border-radius: 999px;
    padding: 3px 8px;
    font-weight: bold;
    font-size: 12px;
}

.pending {
    background: #fff2c2;
    color: #684d00;
}

.approved {
    background: #dcefdc;
    color: #1d5b28;
}

.inactive {
    background: #f4d3d3;
    color: #7b1f1f;
}

button {
    background: #0b5e3b;
    color: white;
    border: none;
    padding: 9px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #08452b;
}

.secondary {
    background: #47534b;
}

.secondary:hover {
    background: #354039;
}

.danger {
    background: #8b2e2e;
}

.danger:hover {
    background: #692222;
}

.row-actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

.small {
    font-size: 13px;
    color: #58635c;
}

@media (max-width: 720px) {
    body {
        padding: 10px;
    }

    .admin-tabs {
        top: 58px;
        z-index: 20;
        max-width: none;
        margin: 0 -10px 12px;
        padding: 8px 10px;
        flex-wrap: nowrap;
        justify-content: flex-start;
        overflow-x: auto;
        background: rgba(6, 20, 17, 0.98);
        border-top: 1px solid rgba(57, 200, 72, 0.25);
        border-bottom: 1px solid rgba(57, 200, 72, 0.25);
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
    }

    .admin-tabs::-webkit-scrollbar {
        display: none;
    }

    .admin-tabs button {
        flex: 0 0 auto;
        width: auto;
        min-width: max-content;
        padding: 9px 12px;
        border-radius: 999px;
        font-size: 13px;
    }

    button {
        width: 100%;
    }

    .row-actions {
        min-width: 150px;
    }
}
</style>
</head>

<body>
<div class="logo-wrap">
    <img src="logo.png" alt="John Gordon Construction logo">
</div>

<h1>Accounts</h1>
<div id="currentUser" class="user-bar"></div>

<div class="admin-tabs">
    <button type="button" onclick="window.location.href='admin.html?tab=summary'">Summary</button>
    <button type="button" onclick="window.location.href='admin.html?tab=jobDashboard'">Job Dashboard</button>
    <button type="button" onclick="window.location.href='admin.html?tab=employeeProfile'">Employee Profile</button>
    <button type="button" onclick="window.location.href='admin.html?tab=timesheets'">Timesheets</button>
    <button type="button" onclick="window.location.href='admin.html?tab=sickDays'">Sick Days</button>
    <button type="button" onclick="window.location.href='admin.html?tab=inspections'">Inspections</button>
    <button type="button" onclick="window.location.href='admin.html?tab=certificates'">Certificates</button>
    <button type="button" onclick="window.location.href='admin.html?tab=vacation'">Vacation Requests</button>
    <button type="button" onclick="window.location.href='schedule.html'">Schedule</button>
    <button type="button" onclick="window.location.href='admin.html?tab=announcements'">Announcements</button>
    <button type="button" onclick="window.location.href='admin.html?tab=reports'">Reports</button>
    <button type="button" onclick="window.location.href='admin.html?tab=toolboxTalks'">Tool Box Talks</button>
    <button type="button" onclick="window.location.href='admin.html?tab=policies'">Policies</button>
    <button type="button" onclick="window.location.href='admin.html?tab=jobs'">Jobs Management</button>
    <button type="button" onclick="window.location.href='admin.html?tab=workOrders'">Work Orders</button>
    <button type="button" onclick="window.location.href='admin.html?tab=equipment'">Equipment / Vehicles</button>
    <button type="button" onclick="window.location.href='admin.html?tab=contacts'">Contacts</button>
    <button type="button" onclick="window.location.href='admin.html?tab=backups'">Backups</button>
    <button type="button" class="active">Accounts</button>
    <button type="button" onclick="window.location.href='admin.html'">Home</button>
</div>

<div class="actions">
    <button type="button" onclick="loadAccounts()">Refresh Accounts</button>
    <button class="secondary" type="button" onclick="window.location.href='admin.html'">Back to Admin</button>
    <button class="secondary" type="button" onclick="signOut()">Sign Out</button>
</div>

<div class="panel">
    <div class="filters">
        <div>
            <label>Search</label>
            <input id="searchInput" oninput="renderAccounts()" placeholder="Name or email">
        </div>
        <div>
            <label>Status</label>
            <select id="statusFilter" onchange="renderAccounts()">
                <option value="">All</option>
                <option value="pending">Pending</option>
                <option value="approved">Approved</option>
                <option value="inactive">Inactive</option>
            </select>
        </div>
    </div>
    <div id="accountsList" class="small">Loading accounts...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="common.js?v=2"></script>
<script>
const supabaseClient = createJgcSupabaseClient();
const worker = requireJgcWorker();
const currentWorker = normalizeWorkerName(worker.key);
const currentWorkerDisplay = worker.display;
const currentUserRole = worker.role;
let accounts = [];
let currentUserId = "";
let accountsLoadStarted = false;

if (!isAdminWorker(currentWorker, currentUserRole)) {
    alert("Accounts is only available to authorized users.");
    window.location.href = "home.html";
}

document.getElementById("currentUser").textContent = "Signed in as: " + currentWorkerDisplay;

function formatDate(value) {
    return formatDisplayDate(value);
}

function renderAccounts() {
    const list = document.getElementById("accountsList");
    const search = document.getElementById("searchInput").value.trim().toLowerCase();
    const status = document.getElementById("statusFilter").value;

    const filtered = accounts.filter((account) => {
        const text = `${account.display_name || ""} ${account.email || ""} ${account.worker_key || ""}`.toLowerCase();
        return (!search || text.includes(search)) && (!status || account.account_status === status);
    });

    if (!filtered.length) {
        list.textContent = "No accounts found.";
        return;
    }

    list.innerHTML = `
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th>Role</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    ${filtered.map((account) => {
                        const isSelf = account.id === currentUserId;
                        const statusClass = account.account_status || "pending";
                        return `
                            <tr>
                                <td>${escapeHtml(account.display_name)}</td>
                                <td>${escapeHtml(account.email)}</td>
                                <td><span class="status ${escapeHtml(statusClass)}">${escapeHtml(statusClass)}</span></td>
                                <td>${escapeHtml(account.role || "worker")}</td>
                                <td>${escapeHtml(formatDate(account.created_at))}</td>
                                <td>
                                    <div class="row-actions">
                                        ${account.account_status !== "approved" ? `<button type="button" onclick="approveAccount('${account.id}')">Approve</button>` : ""}
                                        ${account.account_status === "inactive" ? `<button type="button" onclick="reactivateAccount('${account.id}')">Reactivate</button>` : ""}
                                        ${account.account_status !== "inactive" && !isSelf ? `<button type="button" class="danger" onclick="deactivateAccount('${account.id}')">Deactivate</button>` : ""}
                                        ${account.role !== "admin" ? `<button type="button" class="secondary" onclick="setRole('${account.id}', 'admin')">Make Admin</button>` : ""}
                                        ${account.role === "admin" && !isSelf ? `<button type="button" class="secondary" onclick="setRole('${account.id}', 'worker')">Make Worker</button>` : ""}
                                    </div>
                                </td>
                            </tr>
                        `;
                    }).join("")}
                </tbody>
            </table>
        </div>
    `;
}

async function loadAccounts() {
    if (!supabaseClient) {
        document.getElementById("accountsList").textContent = "Supabase is not available.";
        return;
    }

    const list = document.getElementById("accountsList");
    list.textContent = "Loading accounts...";

    const sessionResult = await supabaseClient.auth.getSession();
    currentUserId = sessionResult.data.session && sessionResult.data.session.user
        ? sessionResult.data.session.user.id
        : "";

    if (!currentUserId) {
        const userResult = await supabaseClient.auth.getUser();
        currentUserId = userResult.data.user ? userResult.data.user.id : "";
    }

    if (!currentUserId) {
        list.textContent = "Accounts could not be loaded. Please sign in again.";
        return;
    }

    const { data, error } = await supabaseClient
        .from("profiles")
        .select("id,email,display_name,worker_key,role,account_status,created_at,approved_at,deactivated_at")
        .order("created_at", { ascending: false });

    if (error) {
        list.textContent = "Accounts could not be loaded: " + (error.message || "Make sure your account has admin approval.");
        return;
    }

    accounts = data || [];

    if (!accounts.length) {
        list.textContent = "No accounts found. Try Refresh Accounts if this page just opened.";
        return;
    }

    renderAccounts();
}

async function updateAccount(id, values) {
    const { error } = await supabaseClient
        .from("profiles")
        .update(values)
        .eq("id", id);

    if (error) {
        alert(error.message || "Account could not be updated.");
        return;
    }

    await loadAccounts();
}

async function approveAccount(id) {
    await updateAccount(id, {
        account_status: "approved",
        approved_at: new Date().toISOString(),
        approved_by: currentUserId,
        deactivated_at: null
    });
}

async function reactivateAccount(id) {
    await approveAccount(id);
}

async function deactivateAccount(id) {
    const account = accounts.find((item) => item.id === id);
    const name = account ? account.display_name || account.email : "this account";

    if (!confirm("Deactivate " + name + "? This removes app access but keeps their saved records.")) {
        return;
    }

    await updateAccount(id, {
        account_status: "inactive",
        deactivated_at: new Date().toISOString()
    });
}

async function setRole(id, role) {
    const account = accounts.find((item) => item.id === id);
    const name = account ? account.display_name || account.email : "this account";

    if (!confirm("Change " + name + " to " + role + "?")) {
        return;
    }

    await updateAccount(id, { role });
}

async function signOut() {
    await signOutJgc(supabaseClient);
}

function startAccountsPage() {
    if (accountsLoadStarted) {
        loadAccounts();
        return;
    }

    accountsLoadStarted = true;
    loadAccounts();

    setTimeout(() => {
        if (!accounts.length) {
            loadAccounts();
        }
    }, 900);
}

window.addEventListener("pageshow", startAccountsPage);
startAccountsPage();
</script>
</body>
</html>
