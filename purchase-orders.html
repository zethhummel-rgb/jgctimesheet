<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow, noarchive">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b5e3b">
  <title>JGC Portal - Purchase Orders</title>
  <link rel="manifest" href="manifest.json?v=7">
  <link rel="stylesheet" href="jgc-design-system.css?v=7" data-jgc-design-system="7">
  <link rel="stylesheet" href="purchase-orders.css?v=21">
</head>
<body class="po-page po-employee-page jgc-page jgc-system-page">
  <main class="po-shell jgc-page-shell">
    <header class="jgc-page-header">
      <div class="po-brand jgc-brand"><img src="logo.webp" alt="John Gordon Construction"></div>
      <h1 class="jgc-page-title">Purchase Orders</h1>
      <p id="poCurrentUser" class="po-user-line jgc-page-user"></p>
    </header>

    <div class="po-status-row" aria-live="polite">
      <span id="poNetworkBadge" class="po-badge jgc-badge">Checking connection</span>
      <span id="poSyncBadge" class="po-badge info jgc-badge jgc-badge--info">Loading</span>
      <span id="poRangeBadge" class="po-badge jgc-badge" hidden></span>
    </div>

    <div id="poNotice" class="po-notice jgc-notice" hidden role="status"></div>

    <section id="poDevicePanel" class="po-notice warning jgc-notice jgc-notice--warning" hidden>
      <strong id="poDeviceTitle">PO device approval required</strong>
      <div id="poDeviceMessage" class="po-device-message"></div>
      <div class="po-inline-actions po-spaced-actions jgc-inline-actions">
        <button id="poRegisterDeviceButton" class="jgc-button" type="button">
          <i data-lucide="smartphone"></i> Register This Device
        </button>
        <button id="poRefreshDeviceButton" class="secondary jgc-button jgc-button--secondary" type="button">
          <i data-lucide="refresh-cw"></i> Refresh Status
        </button>
      </div>
    </section>

    <div class="po-toolbar jgc-toolbar">
      <div class="po-toolbar-group jgc-actions">
        <button id="poNewButton" class="jgc-button" type="button">
          <i data-lucide="plus"></i> New PO
        </button>
        <button id="poSyncButton" class="secondary jgc-button jgc-button--secondary" type="button" title="Sync purchase orders">
          <i data-lucide="refresh-cw"></i> Sync
        </button>
      </div>
    </div>

    <section id="poListView" class="po-view">
      <div class="po-tabs jgc-tabs" role="tablist" aria-label="Purchase order views">
        <button class="active jgc-tab" type="button" data-po-list-tab="drafts">Drafts</button>
        <button class="secondary jgc-tab" type="button" data-po-list-tab="pending">Pending Submission</button>
        <button class="secondary jgc-tab" type="button" data-po-list-tab="submitted">Submitted</button>
        <button class="secondary jgc-tab" type="button" data-po-list-tab="cancelled">Cancelled</button>
      </div>
      <div class="po-toolbar-group jgc-actions">
        <button id="poOpenPendingButton" class="secondary jgc-button jgc-button--secondary" type="button"><i data-lucide="search"></i> Open Pending PO</button>
      </div>
      <div id="poLookupPanel" class="po-filter-row jgc-filter-grid" hidden>
        <div class="jgc-field">
          <label class="jgc-label" for="poLookupNumber">PO Number</label>
          <input id="poLookupNumber" class="jgc-input" inputmode="numeric" autocomplete="off" placeholder="PO-30000">
        </div>
        <div class="po-lookup-action">
          <button id="poLookupButton" class="jgc-button" type="button"><i data-lucide="search"></i> Open PO</button>
        </div>
      </div>
      <div class="po-filter-row jgc-filter-grid">
        <div class="jgc-field">
          <label class="jgc-label" for="poSearch">Search</label>
          <input id="poSearch" class="jgc-input" type="search" placeholder="PO, supplier, job, or employee">
        </div>
        <div class="jgc-field">
          <label class="jgc-label" for="poStatusFilter">Status</label>
          <select id="poStatusFilter" class="jgc-select">
            <option value="">All statuses</option>
            <option value="draft">Draft</option>
            <option value="assigned">Assigned</option>
            <option value="opened">Opened</option>
            <option value="submitted">Submitted</option>
            <option value="emailed">Emailed</option>
            <option value="failed">Email Failed</option>
            <option value="partially_received">Partially Received</option>
            <option value="fully_received">Fully Received</option>
            <option value="closed">Closed</option>
            <option value="cancelled">Cancelled</option>
            <option value="pending_sync">Pending Sync</option>
          </select>
        </div>
      </div>
      <div id="poList" class="po-list" aria-live="polite"></div>
    </section>

    <section id="poFormView" class="po-view" hidden>
      <div class="po-form-header jgc-toolbar">
        <div class="po-form-title">
          <h2 id="poFormHeading">Digital Purchase Order</h2>
          <div id="poNumberDisplay" class="po-number-display">Number assigned on first save</div>
        </div>
        <div class="po-inline-actions jgc-inline-actions">
          <span id="poFormStatusBadge" class="po-badge jgc-badge">Draft</span>
          <button id="poCloseFormButton" class="icon-button secondary jgc-button jgc-button--secondary jgc-button--icon" type="button" title="Close" aria-label="Close">X</button>
        </div>
      </div>

      <form id="poForm" novalidate>
        <input id="poId" type="hidden">
        <input id="poRevision" type="hidden">
        <div class="po-form-grid jgc-form-grid">
          <div class="po-field jgc-field">
            <label class="jgc-label" for="poOrderDate">Date of Order</label>
            <input id="poOrderDate" class="jgc-input" type="date" required>
          </div>
          <div class="po-field jgc-field">
            <label class="jgc-label" for="poJobSearch">Job</label>
            <div id="poJobPicker" class="po-job-picker">
              <input id="poJobSearch" class="jgc-input po-job-search" type="search" role="combobox" aria-autocomplete="list" aria-controls="poJobOptions" aria-expanded="false" autocomplete="off" placeholder="Start typing a job number or name">
              <input id="poJob" type="hidden">
              <div id="poJobOptions" class="po-job-options" role="listbox" aria-label="Matching jobs" hidden></div>
            </div>
          </div>
          <div class="po-field full po-manual-job-fields jgc-field jgc-field--full">
            <span class="po-field-label">Job not on the list?</span>
            <div class="po-form-grid jgc-form-grid">
              <div class="po-field jgc-field">
                <label class="jgc-label" for="poManualJobNumber">Manual Job Number (Optional)</label>
                <input id="poManualJobNumber" class="jgc-input" maxlength="120" placeholder="Job number (optional)">
              </div>
              <div class="po-field jgc-field">
                <label class="jgc-label" for="poManualJobName">Manual Job Name</label>
                <input id="poManualJobName" class="jgc-input" maxlength="240" placeholder="Job name">
              </div>
            </div>
          </div>
          <div class="po-field full jgc-field jgc-field--full">
            <label class="jgc-label" for="poSupplierName">To</label>
            <input id="poSupplierName" class="jgc-input" maxlength="240" placeholder="Supplier / company name" required>
          </div>
          <div class="po-field full jgc-field jgc-field--full">
            <label class="jgc-label" for="poNotes">Order Notes</label>
            <textarea id="poNotes" class="jgc-textarea" maxlength="5000" placeholder="Delivery, pickup, or order notes"></textarea>
          </div>
        </div>

        <section id="poJobNotesPanel" class="po-job-notes-panel po-section-band jgc-section" hidden>
          <button id="poJobNotesToggle" class="po-job-notes-toggle" type="button" aria-expanded="false" aria-controls="poJobNotesBody">
            <span>
              <strong>Job Notes</strong>
              <small id="poJobNotesSummary">Select a job to view its open notes.</small>
            </span>
            <i data-lucide="chevron-down" aria-hidden="true"></i>
          </button>
          <div id="poJobNotesBody" class="po-job-notes-body" hidden>
            <p id="poJobNotesStatus" class="po-job-notes-status"></p>
            <div id="poJobNotesList" class="po-job-notes-list"></div>
          </div>
        </section>

        <section class="po-section-band jgc-section">
          <div class="po-section-heading">
            <h3 class="jgc-section-title">Materials</h3>
          </div>
          <div id="poMaterialList" class="po-material-list"></div>
          <div class="po-inline-actions po-spaced-actions jgc-inline-actions">
            <button id="poAddItemButton" class="secondary jgc-button jgc-button--secondary" type="button">
              <i data-lucide="plus"></i> Add Material Row
            </button>
          </div>
        </section>

        <section class="po-section-band jgc-section">
          <div class="po-section-heading"><h3 class="jgc-section-title">Receipt</h3></div>
          <label class="jgc-label" for="poReceiptInput">Receipt Photo</label>
          <input id="poReceiptInput" class="jgc-input" type="file" accept="image/jpeg,image/png,image/webp" capture="environment">
          <div id="poReceiptPreview" class="po-receipt-preview">No receipt attached</div>
        </section>

        <div class="po-form-actions jgc-actions">
          <button id="poSaveButton" class="jgc-button" type="submit">
            <i data-lucide="save"></i> Save Draft
          </button>
          <button id="poSubmitButton" class="jgc-button" type="button">
            <i data-lucide="send"></i> Submit PO
          </button>
          <button id="poPdfButton" class="secondary jgc-button jgc-button--secondary" type="button">
            <i data-lucide="file-text"></i> View PDF
          </button>
          <button id="poCancelButton" class="danger jgc-button jgc-button--danger" type="button" hidden>
            <i data-lucide="ban"></i> Cancel PO
          </button>
        </div>
      </form>
    </section>
  </main>

  <script src="vendor/supabase-js.min.js?v=1" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';"></script>
  <script src="vendor/jspdf.umd.min.js?v=1" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js';"></script>
  <script src="vendor/lucide.min.js"></script>
  <script src="common.js?v=39"></script>
  <script src="purchase-orders-pdf.js?v=2"></script>
  <script src="purchase-orders.js?v=22"></script>
</body>
</html>
