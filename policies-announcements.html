<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="googlebot" content="noindex, nofollow, noarchive" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JGC Portal - Policies/Announcements</title>
<link rel="stylesheet" href="jgc-design-system.css?v=7" data-jgc-design-system="7">
</head>

<body class="policy-page jgc-page jgc-system-page">
<main class="page-shell policy-page-shell jgc-page-shell jgc-stack">
  <div class="top-actions jgc-topbar">
    <div class="brand jgc-brand-lockup">
      <img src="logo.webp" alt="John Gordon Construction">
      <div>
        <div class="jgc-brand-lockup__title">JGC Portal</div>
        <div class="jgc-brand-lockup__meta" id="workerName"></div>
      </div>
    </div>
    <button class="jgc-button jgc-button--secondary" type="button" onclick="window.location.href='home.html'">
      <i data-lucide="home"></i>
      Home
    </button>
  </div>

  <section class="hero-card jgc-panel jgc-hero">
    <div class="eyebrow jgc-hero__eyebrow">Company Information</div>
    <h1>JGC Policies/<wbr>Announcements</h1>
    <p>Review company policies and previous announcements in one place.</p>
  </section>

  <div class="content-grid jgc-content-grid">
    <details id="policiesDetails" class="content-card jgc-archive">
      <summary>
        <span class="jgc-archive__title">Policies</span>
        <span id="policiesLazyStatus" class="jgc-archive__count">Open to load</span>
      </summary>
      <div class="jgc-archive__body">
        <div id="policyList" class="policy-list jgc-list">
          <div class="empty-state jgc-empty-state">Policies have not been loaded yet.</div>
        </div>
      </div>
    </details>

    <details id="announcementsDetails" class="content-card jgc-archive">
      <summary>
        <span class="jgc-archive__title">Previous Announcements</span>
        <span id="announcementsLazyStatus" class="jgc-archive__count">Open to load</span>
      </summary>
      <div class="jgc-archive__body">
        <div id="announcementsStatus" class="empty-state jgc-empty-state">Announcements have not been loaded yet.</div>
        <div id="announcementsList" class="announcement-list jgc-list"></div>
      </div>
    </details>
  </div>
</main>

<script src="vendor/supabase-js.min.js?v=1" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';"></script>
<script src="vendor/lucide.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/lucide@latest';"></script>
<script src="common.js?v=39"></script>
<script>
const supabaseClient = createJgcSupabaseClient();
const worker = requireJgcWorker();
let policies = [];
let announcements = [];
let policyUrls = {};
let announcementUrls = {};
let currentUserId = "";
let policiesLoaded = false;
let policiesLoading = false;
let announcementsLoaded = false;
let announcementsLoading = false;

document.getElementById("workerName").textContent = worker.display || worker.key || "";

if (window.lucide) {
  window.lucide.createIcons();
}

document.getElementById("policiesDetails").addEventListener("toggle", function() {
  if (this.open) loadPolicies();
});
document.getElementById("announcementsDetails").addEventListener("toggle", function() {
  if (this.open) loadAnnouncements();
});

async function getCurrentUserId() {
  if (currentUserId) {
    return currentUserId;
  }

  if (!supabaseClient) {
    return "";
  }

  const sessionResult = await supabaseClient.auth.getSession();
  currentUserId = sessionResult.data.session && sessionResult.data.session.user
    ? sessionResult.data.session.user.id
    : "";

  return currentUserId;
}

async function acknowledgeAnnouncement(announcementId, source) {
  if (!supabaseClient || !announcementId) {
    return;
  }

  const userId = await getCurrentUserId();

  if (!userId) {
    return;
  }

  const { error } = await supabaseClient
    .from("announcement_acknowledgements")
    .insert({
      announcement_id: announcementId,
      worker_id: userId,
      worker_name: worker.display || worker.key || "",
      worker_email: worker.email || "",
      read_source: source || "announcement"
    });

  if (error && error.code !== "23505") {
    console.warn("Announcement acknowledgement could not be saved.", error);
  }
}

async function loadPolicies() {
  const list = document.getElementById("policyList");
  const lazyStatus = document.getElementById("policiesLazyStatus");

  if (policiesLoading || policiesLoaded) {
    return;
  }

  policiesLoading = true;
  if (lazyStatus) lazyStatus.textContent = "Loading...";

  if (!supabaseClient) {
    list.innerHTML = '<div class="empty-state jgc-empty-state">Policies could not be loaded.</div>';
    policiesLoading = false;
    if (lazyStatus) lazyStatus.textContent = "Unavailable";
    return;
  }

  const { data, error } = await supabaseClient
    .from("policies")
    .select("*")
    .eq("is_active", true)
    .order("sort_order", { ascending: true })
    .order("title", { ascending: true });

  if (error) {
    list.innerHTML = '<div class="empty-state jgc-empty-state">Policies could not be loaded.</div>';
    policiesLoading = false;
    if (lazyStatus) lazyStatus.textContent = "Retry";
    return;
  }

  policies = data || [];
  await preparePolicyUrls();
  policiesLoaded = true;
  policiesLoading = false;
  if (lazyStatus) lazyStatus.textContent = `${policies.length} polic${policies.length === 1 ? "y" : "ies"}`;
  renderPolicies();
}

async function preparePolicyUrls() {
  policyUrls = {};

  for (const policy of policies) {
    if (!policy.file_path) {
      continue;
    }

    const { data } = await supabaseClient
      .storage
      .from("policies")
      .createSignedUrl(policy.file_path, 604800);

    if (data && data.signedUrl) {
      policyUrls[policy.id] = data.signedUrl;
    }
  }
}

function renderPolicies() {
  const list = document.getElementById("policyList");

  if (!policies.length) {
    list.innerHTML = '<div class="empty-state jgc-empty-state">No policies have been added yet.</div>';
    return;
  }

  list.innerHTML = policies.map((policy) => {
    const fileLink = policyUrls[policy.id]
      ? '<a class="button-link announcement-file jgc-button" href="' + policyUrls[policy.id] + '" target="_blank" rel="noopener"><i data-lucide="file-text"></i>Open PDF</a>'
      : "";

    return `
      <article class="policy-card jgc-list-card">
        <h3>${escapeHtml(policy.title || "Policy")}</h3>
        <div class="announcement-meta jgc-meta">${escapeHtml(policy.category || "General")}</div>
        <p class="muted jgc-muted">${escapeHtml(policy.description || "")}</p>
        ${fileLink}
      </article>
    `;
  }).join("");

  if (window.lucide) {
    window.lucide.createIcons();
  }
}

async function loadAnnouncements() {
  const status = document.getElementById("announcementsStatus");
  const lazyStatus = document.getElementById("announcementsLazyStatus");

  if (announcementsLoading || announcementsLoaded) {
    return;
  }

  announcementsLoading = true;
  if (lazyStatus) lazyStatus.textContent = "Loading...";

  if (!supabaseClient) {
    status.textContent = "Announcements could not be loaded.";
    announcementsLoading = false;
    if (lazyStatus) lazyStatus.textContent = "Unavailable";
    return;
  }

  const { data, error } = await supabaseClient
    .from("announcements")
    .select("*")
    .eq("is_active", true)
    .order("created_at", { ascending: false });

  if (error) {
    status.textContent = "Announcements could not be loaded.";
    announcementsLoading = false;
    if (lazyStatus) lazyStatus.textContent = "Retry";
    return;
  }

  announcements = (data || []).filter((announcement) => {
    const targetName = normalizeWorkerName(announcement.target_worker_name);
    const targetEmail = normalizeWorkerName(announcement.target_worker_email);
    return (!targetName && !targetEmail) ||
      targetName === normalizeWorkerName(worker.key) ||
      targetEmail === normalizeWorkerName(worker.email);
  });
  await prepareAnnouncementUrls();
  announcementsLoaded = true;
  announcementsLoading = false;
  if (lazyStatus) lazyStatus.textContent = `${announcements.length} announcement${announcements.length === 1 ? "" : "s"}`;
  renderAnnouncements();
}

async function prepareAnnouncementUrls() {
  announcementUrls = {};

  for (const announcement of announcements) {
    if (!announcement.file_path) {
      continue;
    }

    const { data } = await supabaseClient
      .storage
      .from("announcements")
      .createSignedUrl(announcement.file_path, 604800);

    if (data && data.signedUrl) {
      announcementUrls[announcement.id] = data.signedUrl;
    }
  }
}

function renderAnnouncements() {
  const status = document.getElementById("announcementsStatus");
  const list = document.getElementById("announcementsList");

  if (!announcements.length) {
    status.textContent = "No announcements have been posted yet.";
    list.innerHTML = "";
    return;
  }

  status.hidden = true;
  list.innerHTML = announcements.map((announcement) => {
    const fileLink = announcementUrls[announcement.id]
      ? '<a class="button-link announcement-file jgc-button" href="' + announcementUrls[announcement.id] + '" target="_blank" rel="noopener" data-announcement-pdf="' + escapeHtml(announcement.id) + '"><i data-lucide="file-text"></i>Open PDF</a>'
      : "";

    return `
      <article class="announcement-card jgc-list-card" role="button" tabindex="0" data-announcement-read="${escapeHtml(announcement.id)}">
        <h3>${escapeHtml(announcement.title || "Announcement")}</h3>
        <div class="announcement-meta jgc-meta">${escapeHtml(formatDisplayDate(announcement.created_at))}</div>
        <p class="muted jgc-muted">${escapeHtml(announcement.body || "")}</p>
        ${fileLink}
      </article>
    `;
  }).join("");

  list.querySelectorAll("[data-announcement-read]").forEach((card) => {
    card.addEventListener("click", () => acknowledgeAnnouncement(card.dataset.announcementRead, "policies_card"));
    card.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        acknowledgeAnnouncement(card.dataset.announcementRead, "policies_card");
      }
    });
  });

  list.querySelectorAll("[data-announcement-pdf]").forEach((link) => {
    link.addEventListener("click", () => acknowledgeAnnouncement(link.dataset.announcementPdf, "policies_pdf"));
  });

  if (window.lucide) {
    window.lucide.createIcons();
  }
}
</script>
</body>
</html>
