<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="googlebot" content="noindex, nofollow, noarchive" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JGC Portal - Policies/Announcements</title>
<link rel="stylesheet" href="styles.css?v=3">
<link rel="stylesheet" href="policy-design-system.css?v=1">
<style>
:root {
  --green: #31c64a;
  --green-dark: #0b5e3b;
  --bg: #07100f;
  --panel: rgba(13, 27, 27, 0.92);
  --panel-soft: rgba(255, 255, 255, 0.06);
  --border: rgba(255, 255, 255, 0.13);
  --text: #f5f7f3;
  --muted: #bac4bd;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at top left, rgba(49, 198, 74, 0.16), transparent 34%),
    linear-gradient(135deg, #06110f, #0b1717 52%, #07100f);
  color: var(--text);
  font-family: Arial, sans-serif;
}

button,
a.button-link {
  border: 0;
  border-radius: 7px;
  background: linear-gradient(135deg, #15903f, var(--green-dark));
  color: #ffffff;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 11px 14px;
  font-weight: 800;
  text-decoration: none;
}

.page-shell {
  width: min(1120px, calc(100% - 28px));
  margin: 0 auto;
  padding: 22px 0 42px;
}

.top-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.brand img {
  width: 120px;
  height: auto;
}

.brand-text {
  color: var(--muted);
  font-size: 14px;
  font-weight: 700;
}

.hero-card,
.content-card,
.policy-card,
.announcement-card {
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--panel);
  box-shadow: 0 18px 42px rgba(0, 0, 0, 0.28);
}

.hero-card {
  padding: clamp(24px, 5vw, 44px);
  margin-bottom: 18px;
}

.eyebrow,
.section-title {
  color: var(--green);
  font-weight: 900;
  text-transform: uppercase;
}

h1 {
  margin: 8px 0 12px;
  font-size: clamp(34px, 6vw, 58px);
  line-height: 0.96;
}

h2,
h3,
p {
  margin-top: 0;
}

.hero-card p,
.muted {
  color: var(--muted);
}

.content-grid {
  display: grid;
  grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
  gap: 18px;
}

.content-card {
  padding: 20px;
}

.policy-list,
.announcement-list {
  display: grid;
  gap: 12px;
  margin-top: 14px;
}

.policy-card,
.announcement-card {
  padding: 16px;
  background: rgba(255, 255, 255, 0.045);
}

.policy-card h3,
.announcement-card h3 {
  margin-bottom: 6px;
}

.announcement-meta {
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 8px;
}

.announcement-file {
  margin-top: 12px;
}

.empty-state {
  border: 1px dashed rgba(255, 255, 255, 0.18);
  border-radius: 8px;
  color: var(--muted);
  padding: 16px;
  background: rgba(255, 255, 255, 0.035);
}

@media (max-width: 820px) {
  .top-actions {
    align-items: flex-start;
    flex-direction: column;
  }

  .content-grid {
    grid-template-columns: 1fr;
  }

  .brand img {
    width: 96px;
  }
}
</style>
</head>

<body class="policy-page jgc-page">
<main class="page-shell policy-page-shell jgc-page-shell">
  <div class="top-actions">
    <div class="brand">
      <img src="logo.webp" alt="John Gordon Construction">
      <div>
        <div class="brand-text">JGC Portal</div>
        <div class="muted" id="workerName"></div>
      </div>
    </div>
    <button type="button" onclick="window.location.href='home.html'">
      <i data-lucide="home"></i>
      Home
    </button>
  </div>

  <section class="hero-card">
    <div class="eyebrow">Company Information</div>
    <h1>JGC Policies/Announcements</h1>
    <p>Review company policies and previous announcements in one place.</p>
  </section>

  <div class="content-grid">
    <details id="policiesDetails" class="content-card jgc-archive">
      <summary>
        <span class="jgc-archive__title">Policies</span>
        <span id="policiesLazyStatus" class="jgc-archive__count">Open to load</span>
      </summary>
      <div class="jgc-archive__body">
        <div id="policyList" class="policy-list">
          <div class="empty-state">Policies have not been loaded yet.</div>
        </div>
      </div>
    </details>

    <details id="announcementsDetails" class="content-card jgc-archive">
      <summary>
        <span class="jgc-archive__title">Previous Announcements</span>
        <span id="announcementsLazyStatus" class="jgc-archive__count">Open to load</span>
      </summary>
      <div class="jgc-archive__body">
        <div id="announcementsStatus" class="empty-state">Announcements have not been loaded yet.</div>
        <div id="announcementsList" class="announcement-list"></div>
      </div>
    </details>
  </div>
</main>

<script src="vendor/supabase-js.min.js?v=1" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';"></script>
<script src="vendor/lucide.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/lucide@latest';"></script>
<script src="common.js?v=36"></script>
<script>
const supabaseClient = createJgcSupabaseClient();
const worker = requireJgcWorker();
let policies = [];
let announcements = [];
let policyUrls = {};
let announcementUrls = {};
let currentUserId = "";
let policiesLoaded = false;
let policiesLoading = false;
let announcementsLoaded = false;
let announcementsLoading = false;

document.getElementById("workerName").textContent = worker.display || worker.key || "";

if (window.lucide) {
  window.lucide.createIcons();
}

document.getElementById("policiesDetails").addEventListener("toggle", function() {
  if (this.open) loadPolicies();
});
document.getElementById("announcementsDetails").addEventListener("toggle", function() {
  if (this.open) loadAnnouncements();
});

async function getCurrentUserId() {
  if (currentUserId) {
    return currentUserId;
  }

  if (!supabaseClient) {
    return "";
  }

  const sessionResult = await supabaseClient.auth.getSession();
  currentUserId = sessionResult.data.session && sessionResult.data.session.user
    ? sessionResult.data.session.user.id
    : "";

  return currentUserId;
}

async function acknowledgeAnnouncement(announcementId, source) {
  if (!supabaseClient || !announcementId) {
    return;
  }

  const userId = await getCurrentUserId();

  if (!userId) {
    return;
  }

  const { error } = await supabaseClient
    .from("announcement_acknowledgements")
    .insert({
      announcement_id: announcementId,
      worker_id: userId,
      worker_name: worker.display || worker.key || "",
      worker_email: worker.email || "",
      read_source: source || "announcement"
    });

  if (error && error.code !== "23505") {
    console.warn("Announcement acknowledgement could not be saved.", error);
  }
}

async function loadPolicies() {
  const list = document.getElementById("policyList");
  const lazyStatus = document.getElementById("policiesLazyStatus");

  if (policiesLoading || policiesLoaded) {
    return;
  }

  policiesLoading = true;
  if (lazyStatus) lazyStatus.textContent = "Loading...";

  if (!supabaseClient) {
    list.innerHTML = '<div class="empty-state">Policies could not be loaded.</div>';
    policiesLoading = false;
    if (lazyStatus) lazyStatus.textContent = "Unavailable";
    return;
  }

  const { data, error } = await supabaseClient
    .from("policies")
    .select("*")
    .eq("is_active", true)
    .order("sort_order", { ascending: true })
    .order("title", { ascending: true });

  if (error) {
    list.innerHTML = '<div class="empty-state">Policies could not be loaded.</div>';
    policiesLoading = false;
    if (lazyStatus) lazyStatus.textContent = "Retry";
    return;
  }

  policies = data || [];
  await preparePolicyUrls();
  policiesLoaded = true;
  policiesLoading = false;
  if (lazyStatus) lazyStatus.textContent = `${policies.length} polic${policies.length === 1 ? "y" : "ies"}`;
  renderPolicies();
}

async function preparePolicyUrls() {
  policyUrls = {};

  for (const policy of policies) {
    if (!policy.file_path) {
      continue;
    }

    const { data } = await supabaseClient
      .storage
      .from("policies")
      .createSignedUrl(policy.file_path, 604800);

    if (data && data.signedUrl) {
      policyUrls[policy.id] = data.signedUrl;
    }
  }
}

function renderPolicies() {
  const list = document.getElementById("policyList");

  if (!policies.length) {
    list.innerHTML = '<div class="empty-state">No policies have been added yet.</div>';
    return;
  }

  list.innerHTML = policies.map((policy) => {
    const fileLink = policyUrls[policy.id]
      ? '<a class="button-link announcement-file" href="' + policyUrls[policy.id] + '" target="_blank" rel="noopener"><i data-lucide="file-text"></i>Open PDF</a>'
      : "";

    return `
      <article class="policy-card">
        <h3>${escapeHtml(policy.title || "Policy")}</h3>
        <div class="announcement-meta">${escapeHtml(policy.category || "General")}</div>
        <p class="muted">${escapeHtml(policy.description || "")}</p>
        ${fileLink}
      </article>
    `;
  }).join("");

  if (window.lucide) {
    window.lucide.createIcons();
  }
}

async function loadAnnouncements() {
  const status = document.getElementById("announcementsStatus");
  const lazyStatus = document.getElementById("announcementsLazyStatus");

  if (announcementsLoading || announcementsLoaded) {
    return;
  }

  announcementsLoading = true;
  if (lazyStatus) lazyStatus.textContent = "Loading...";

  if (!supabaseClient) {
    status.textContent = "Announcements could not be loaded.";
    announcementsLoading = false;
    if (lazyStatus) lazyStatus.textContent = "Unavailable";
    return;
  }

  const { data, error } = await supabaseClient
    .from("announcements")
    .select("*")
    .eq("is_active", true)
    .order("created_at", { ascending: false });

  if (error) {
    status.textContent = "Announcements could not be loaded.";
    announcementsLoading = false;
    if (lazyStatus) lazyStatus.textContent = "Retry";
    return;
  }

  announcements = (data || []).filter((announcement) => {
    const targetName = normalizeWorkerName(announcement.target_worker_name);
    const targetEmail = normalizeWorkerName(announcement.target_worker_email);
    return (!targetName && !targetEmail) ||
      targetName === normalizeWorkerName(worker.key) ||
      targetEmail === normalizeWorkerName(worker.email);
  });
  await prepareAnnouncementUrls();
  announcementsLoaded = true;
  announcementsLoading = false;
  if (lazyStatus) lazyStatus.textContent = `${announcements.length} announcement${announcements.length === 1 ? "" : "s"}`;
  renderAnnouncements();
}

async function prepareAnnouncementUrls() {
  announcementUrls = {};

  for (const announcement of announcements) {
    if (!announcement.file_path) {
      continue;
    }

    const { data } = await supabaseClient
      .storage
      .from("announcements")
      .createSignedUrl(announcement.file_path, 604800);

    if (data && data.signedUrl) {
      announcementUrls[announcement.id] = data.signedUrl;
    }
  }
}

function renderAnnouncements() {
  const status = document.getElementById("announcementsStatus");
  const list = document.getElementById("announcementsList");

  if (!announcements.length) {
    status.textContent = "No announcements have been posted yet.";
    list.innerHTML = "";
    return;
  }

  status.hidden = true;
  list.innerHTML = announcements.map((announcement) => {
    const fileLink = announcementUrls[announcement.id]
      ? '<a class="button-link announcement-file" href="' + announcementUrls[announcement.id] + '" target="_blank" rel="noopener" data-announcement-pdf="' + escapeHtml(announcement.id) + '"><i data-lucide="file-text"></i>Open PDF</a>'
      : "";

    return `
      <article class="announcement-card" role="button" tabindex="0" data-announcement-read="${escapeHtml(announcement.id)}">
        <h3>${escapeHtml(announcement.title || "Announcement")}</h3>
        <div class="announcement-meta">${escapeHtml(formatDisplayDate(announcement.created_at))}</div>
        <p class="muted">${escapeHtml(announcement.body || "")}</p>
        ${fileLink}
      </article>
    `;
  }).join("");

  list.querySelectorAll("[data-announcement-read]").forEach((card) => {
    card.addEventListener("click", () => acknowledgeAnnouncement(card.dataset.announcementRead, "policies_card"));
    card.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        acknowledgeAnnouncement(card.dataset.announcementRead, "policies_card");
      }
    });
  });

  list.querySelectorAll("[data-announcement-pdf]").forEach((link) => {
    link.addEventListener("click", () => acknowledgeAnnouncement(link.dataset.announcementPdf, "policies_pdf"));
  });

  if (window.lucide) {
    window.lucide.createIcons();
  }
}
</script>
</body>
</html>
