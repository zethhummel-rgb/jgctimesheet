<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="googlebot" content="noindex, nofollow, noarchive" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>JGC Portal - Subcontractor Access</title>
  <link rel="stylesheet" href="jgc-design-system.css?v=14" data-jgc-design-system="14">
</head>
<body class="subcontractor-page jgc-page jgc-system-page">
  <!-- Release 1001 retired the old Subcontractor Access sign-in. This page stays for old bookmarks and
       installed shortcuts; common.js clears any session that sign-in left on the device. -->
  <main class="subcontractor-shell jgc-page-shell jgc-page-shell--narrow jgc-stack">
    <div class="logo-wrap jgc-brand">
      <img src="logo.webp" alt="John Gordon Construction">
    </div>

    <section class="subcontractor-moved jgc-panel jgc-stack" aria-labelledby="subcontractorMovedTitle">
      <h1 id="subcontractorMovedTitle" class="jgc-page-title">Subcontractor sign-in has moved</h1>
      <p class="jgc-muted">Subcontractors and visitors now use the Job Board for their site. Scan the Job Board QR code posted on site to see site documents, sign onto the JSA and sign in to the site.</p>
      <p class="jgc-help-text">Can't find the QR code? Ask the JGC supervisor on site.</p>
      <div class="jgc-actions jgc-actions--stacked">
        <a class="jgc-button" href="index.html">JGC employee sign-in</a>
      </div>
    </section>
  </main>

  <script src="vendor/supabase-js.min.js?v=1" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';"></script>
  <script src="common.js?v=82"></script>
</body>
</html>
