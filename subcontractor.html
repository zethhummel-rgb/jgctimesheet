<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="googlebot" content="noindex, nofollow, noarchive" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JGC Portal - Subcontractor Access</title>
  <link rel="stylesheet" href="jgc-design-system.css?v=6" data-jgc-design-system="6">
</head>
<body class="subcontractor-page jgc-page jgc-system-page">
  <main class="page subcontractor-shell jgc-page-shell jgc-stack">
    <section class="hero subcontractor-header jgc-page-header">
      <div class="subcontractor-brand jgc-brand">
        <img src="logo.webp" alt="John Gordon Construction">
      </div>
      <h1>Subcontractor Portal</h1>
      <div id="subcontractorUser" class="jgc-page-user"></div>
      <div class="subtitle jgc-muted">Use these links to submit project paperwork or review JGC safety information.</div>
    </section>

    <section class="portal-card jgc-panel">
      <div class="quick-grid jgc-card-grid">
        <button type="button" class="quick-card jgc-link-card" onclick="window.location.href='reports.html'">
          <strong>Reports</strong>
          <span>Daily site reports, JSA, incident/near miss, accident, and injury forms.</span>
        </button>
        <button type="button" class="quick-card jgc-link-card" onclick="window.location.href='inspections.html'">
          <strong>Inspections</strong>
          <span>Equipment and safety inspections available to project partners.</span>
        </button>
        <button type="button" class="quick-card jgc-link-card" onclick="window.location.href='permits.html'">
          <strong>Permits</strong>
          <span>Hot work, confined space, and excavation permit forms.</span>
        </button>
        <button type="button" class="quick-card jgc-link-card" onclick="window.location.href='policies-announcements.html'">
          <strong>Policies</strong>
          <span>Review active JGC policies and safety announcements.</span>
        </button>
        <button type="button" class="quick-card jgc-link-card" onclick="window.location.href='contacts.html'">
          <strong>Contacts</strong>
          <span>Find current JGC contacts for coordination and questions.</span>
        </button>
      </div>
    </section>

    <div class="actions jgc-actions jgc-actions--center">
      <button type="button" class="secondary jgc-button jgc-button--secondary" onclick="signOut()">Sign Out</button>
    </div>
  </main>

  <script src="vendor/supabase-js.min.js?v=1" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';"></script>
  <script src="common.js?v=39"></script>
  <script>
    const supabaseClient = createJgcSupabaseClient();
    const worker = requireJgcWorker();

    if (!isJgcSubcontractorSession(worker)) {
      window.location.href = isAdminWorker(worker.key, worker.role, worker.email) ? "admin.html" : "home.html";
    }

    document.getElementById("subcontractorUser").textContent = [
      worker.display || "Subcontractor",
      worker.email || ""
    ].filter(Boolean).join(" | ");

    async function signOut() {
      await signOutJgc(supabaseClient);
    }
  </script>
</body>
</html>
