<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="googlebot" content="noindex, nofollow, noarchive" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Supervisor Accident Investigation</title>
<link rel="stylesheet" href="jgc-design-system.css?v=9" data-jgc-design-system="9">
<link rel="stylesheet" href="report-design-system.css?v=2">
<link rel="stylesheet" href="accident-report.css?v=2">
<link rel="stylesheet" href="safety-signature-pad.css?v=1">
<link rel="stylesheet" href="safety-report-tools.css?v=1">
</head>
<body class="report-family-page report-form-page jgc-page jgc-system-page safety-report-page">
<main class="report-page-shell jgc-page-shell jgc-page-shell--wide">
<div class="logo-wrap jgc-brand"><img src="logo.webp" alt="John Gordon Construction logo"></div>
<div id="currentUser" class="user-bar jgc-page-user"></div>
<div class="container jgc-panel">
  <h1 class="jgc-page-title">John Gordon Construction</h1>
  <h2>Supervisor's Accident Investigation</h2>
  <div class="grid jgc-form-grid">
    <div class="field full"><label for="siteLocation">Site and Location Where Accident Occurred</label><input id="siteLocation" data-jgc-project-job placeholder="Select project/job or type location manually"></div>
    <div class="field"><label for="accidentDate">Date of Accident or Illness</label><input id="accidentDate" type="date"></div>
    <div class="field"><label for="accidentTime">Time of Accident</label><input id="accidentTime" type="time"></div>
    <div class="field"><label for="injuredEmployee">Who Was Injured?</label><select id="injuredEmployee"></select></div>
    <div class="field"><label for="reportMaker">Who Is Making This Report?</label><select id="reportMaker"></select></div>
    <div class="field"><label for="jobTitle">Job Title of Employee</label><input id="jobTitle"></div>
    <div class="field"><label for="timeOnJob">How Long Has Employee Worked at Job?</label><input id="timeOnJob"></div>
    <div class="field full"><label for="injuryLocation">Where Injury or Illness Occurred</label><input id="injuryLocation"></div>
    <div class="field"><label for="propertyDamaged">What Property Was Damaged?</label><input id="propertyDamaged"></div>
    <div class="field"><label for="propertyOwner">Property Owned By</label><input id="propertyOwner"></div>
    <div class="field full"><label for="activityBeforeIncident">What Was Employee Doing When Injury/Illness Occurred?</label><textarea id="activityBeforeIncident"></textarea></div>
    <div class="field"><label for="machineOrTool">What Machine or Tool?</label><input id="machineOrTool"></div>
    <div class="field"><label for="operation">What Operation?</label><input id="operation"></div>
    <div class="field full"><label for="incidentDescription">How Did Injury/Illness Occur?</label><textarea id="incidentDescription"></textarea></div>
    <div class="field full"><label for="objectsSubstances">List All Objects and Substances Involved</label><textarea id="objectsSubstances"></textarea></div>
    <div class="field"><label for="bodyPartAffected">Part of Body Affected</label><input id="bodyPartAffected"></div>
    <div class="field"><label for="priorPhysicalDefects">Any Prior Physical Defects?</label><select id="priorPhysicalDefects"><option>No</option><option>Yes</option></select></div>
    <div class="field full"><label for="priorPhysicalDefectsDetails">If So, What?</label><input id="priorPhysicalDefectsDetails"></div>
    <div class="field full"><label for="natureExtent">Nature and Extent of Injury/Illness and Property Damage</label><textarea id="natureExtent"></textarea></div>
    <div class="field full">
      <label>Please Indicate All Which Contributed</label>
      <div class="checks" id="factorList">
        <label><input class="factor" type="checkbox" value="Improper instruction">Improper instruction</label>
        <label><input class="factor" type="checkbox" value="Failure to lockout">Failure to lockout</label>
        <label><input class="factor" type="checkbox" value="Unsafe arrangement or process">Unsafe arrangement or process</label>
        <label><input class="factor" type="checkbox" value="Lack of training or skill">Lack of training or skill</label>
        <label><input class="factor" type="checkbox" value="Unsafe position">Unsafe position</label>
        <label><input class="factor" type="checkbox" value="Poor ventilation">Poor ventilation</label>
        <label><input class="factor" type="checkbox" value="Operating without authority">Operating without authority</label>
        <label><input class="factor" type="checkbox" value="Improper dress">Improper dress</label>
        <label><input class="factor" type="checkbox" value="Improper guarding">Improper guarding</label>
        <label><input class="factor" type="checkbox" value="Horseplay">Horseplay</label>
        <label><input class="factor" type="checkbox" value="Improper protective equipment">Improper protective equipment</label>
        <label><input class="factor" type="checkbox" value="Improper maintenance">Improper maintenance</label>
        <label><input class="factor" type="checkbox" value="Physical or mental impairment">Physical or mental impairment</label>
        <label><input class="factor" type="checkbox" value="Unsafe equipment">Unsafe equipment</label>
        <label><input class="factor" type="checkbox" value="Inoperative safety device">Inoperative safety device</label>
        <label><input class="factor" type="checkbox" value="Failure to secure">Failure to secure</label>
        <label><input class="factor" type="checkbox" value="Poor housekeeping">Poor housekeeping</label>
      </div>
    </div>
    <div class="field full"><label for="otherFactor">Other Contributing Factor</label><input id="otherFactor"></div>
    <div class="field full"><label for="correctiveActionPrevent">Supervisor's Corrective Action to Ensure This Type of Accident Does Not Reoccur</label><textarea id="correctiveActionPrevent"></textarea></div>
    <div class="field"><label for="trainedPpe">Was Employee Trained in PPE / Safety Procedures?</label><select id="trainedPpe"><option></option><option>Yes</option><option>No</option></select></div>
    <div class="field"><label for="cautionedPpe">Was Employee Cautioned for Failure to Use PPE / Safety Procedures?</label><select id="cautionedPpe"><option></option><option>Yes</option><option>No</option></select></div>
    <div class="field"><label for="promptlyReported">Did Employee Promptly Report Injury/Illness?</label><select id="promptlyReported"><option></option><option>Yes</option><option>No</option></select></div>
    <div class="field"><label for="modifiedDutyAvailable">Is Modified Duty Available?</label><select id="modifiedDutyAvailable"><option></option><option>Yes</option><option>No</option></select></div>
    <div class="field full"><label for="correctiveActionTaken">Corrective Action Taken</label><textarea id="correctiveActionTaken"></textarea></div>
    <div class="field"><label for="correctiveActionTakenBy">Corrective Action Taken By</label><input id="correctiveActionTakenBy"></div>
    <div class="field"><label for="correctiveActionDate">Date of Corrective Action</label><input id="correctiveActionDate" type="date"></div>
    <div class="field"><label for="supervisorName">Supervisor's Name</label><input id="supervisorName"></div>
    <div class="field"><label>Supervisor's Signature</label><div id="supervisorSignatureBox"></div></div>
  </div>
  <div class="actions jgc-actions">
    <button type="button" class="jgc-button" id="saveAccidentReport" onclick="submitAccidentReport()">Save & Email Report</button>
    <button type="button" class="secondary" onclick="downloadAccidentPdf()">Download PDF</button>
    <button type="button" class="secondary jgc-button jgc-button--secondary" onclick="window.location.href='reports.html'">Reports</button>
    <button type="button" class="secondary jgc-button jgc-button--secondary" onclick="window.location.href='home.html'">Home</button>
    <button type="button" class="secondary jgc-button jgc-button--secondary" onclick="signOut()">Sign Out</button>
  </div>
  <div id="saveStatus" class="status jgc-notice" aria-live="polite"></div>
</div>
</main>
<script src="vendor/supabase-js.min.js?v=1" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';"></script>
  <script src="common.js?v=54"></script>
<script src="vendor/jspdf.umd.min.js?v=1"></script>
<script src="safety-signature-pad.js?v=1"></script>
<script src="safety-report-tools.js?v=1"></script>
<script src="accident-report.js?v=1"></script>
</body></html>
