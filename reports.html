<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="googlebot" content="noindex, nofollow, noarchive" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports</title>
<link rel="stylesheet" href="styles.css?v=3">
<link rel="stylesheet" href="report-design-system.css?v=1">

<style>
body {
    font-family: Arial, sans-serif;
    background: #8f9691;
    margin: 0;
    padding: 20px;
    color: #1f2a24;
}

.logo-wrap {
    max-width: 347px;
    margin: 0 auto 8px;
    text-align: center;
}

.logo-wrap img {
    width: 100%;
    max-width: 347px;
    height: auto;
    display: block;
    margin: 0 auto;
}

.user-bar {
    max-width: 1100px;
    margin: 0 auto 12px;
    color: #ffffff;
    text-align: center;
    font-size: 13px;
    font-weight: bold;
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
}

.container {
    max-width: 1100px;
    margin: auto;
    background: #fbfcf9;
    padding: 20px;
    border-radius: 8px;
    border-top: 4px solid #3f7d4d;
    box-shadow: 0 3px 10px rgba(0,0,0,.18);
}

h1 {
    text-align: center;
    color: #2f6f3c;
    margin: 0 0 6px;
}

.subtitle {
    text-align: center;
    font-weight: bold;
    margin-bottom: 18px;
}

.reports-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 22px;
}

.report-card {
    border: 1px solid #c6cec5;
    border-top: 4px solid #3f7d4d;
    background: #ffffff;
    border-radius: 8px;
    padding: 16px;
    text-align: left;
    color: #1f2a24;
    cursor: pointer;
    min-height: 150px;
}

.report-card h2 {
    margin: 0 0 8px;
    color: #0b5e3b;
}

.report-card p {
    margin: 0;
    line-height: 1.35;
}

.report-card.pending {
    cursor: default;
    opacity: 0.82;
}

.toolbox-panel {
    margin-top: 16px;
    border-top: 1px solid #d6ddd4;
    padding-top: 18px;
}

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: #ffffff;
}

th,
td {
    border: 1px solid #c6cec5;
    padding: 8px;
    text-align: left;
    vertical-align: top;
    font-size: 13px;
}

th {
    background: #e6ece6;
}

button,
.file-link {
    background: #0b5e3b;
    color: #ffffff;
    border: none;
    border-radius: 4px;
    padding: 10px 14px;
    font-weight: bold;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
}

button:hover,
.file-link:hover {
    background: #08452b;
}

.secondary {
    background: #47534b;
}

.secondary:hover {
    background: #354039;
}

.status {
    min-height: 20px;
    margin-top: 10px;
    font-weight: bold;
    color: #2f6f3c;
}

.small {
    font-size: 12px;
    color: #47534b;
}

@media (max-width: 800px) {
    body {
        padding: 10px;
    }

    .reports-grid {
        grid-template-columns: 1fr;
    }

    button,
    .file-link {
        width: 100%;
        box-sizing: border-box;
        text-align: center;
    }
}
</style>
</head>

<body class="report-family-page report-directory-page jgc-page">
<main class="report-page-shell jgc-page-shell jgc-page-shell--wide">
<div class="logo-wrap jgc-brand">
    <img src="logo.webp" alt="John Gordon Construction logo">
</div>

<div id="currentUser" class="user-bar jgc-page-user"></div>

<div class="container jgc-panel">
    <h1 class="jgc-page-title">Reports</h1>
    <div class="subtitle">Quick Links</div>

    <section class="reports-grid jgc-card-grid">
        <button type="button" class="report-card jgc-card" onclick="window.location.href='todays-inspections.html?recordType=reports'">
            <h2>Today's Reports</h2>
            <p>View reports submitted in the last 24 hours, with edit, email, and delete options.</p>
        </button>

        <button type="button" class="report-card jgc-card" onclick="window.location.href='previous-inspections.html?recordType=reports'">
            <h2>Previous Reports</h2>
            <p>Review reports completed in the last 2 months and keep compliance history on hand.</p>
        </button>
    </section>

    <div class="subtitle">Start a New Report</div>

    <section class="reports-grid jgc-card-grid">

        <button type="button" class="report-card jgc-card" onclick="window.location.href='daily-site-report.html'">
            <h2>Daily Site Reports</h2>
            <p>Project notes, weather, crew, deliveries, visitors, delays, photos, PDF and email.</p>
        </button>

            <button type="button" class="report-card jgc-card" onclick="window.location.href='jsa.html?v=361'">
            <h2>JSA</h2>
            <p>Job Safety Analysis form for reviewing work steps, hazards, controls, and crew sign-off.</p>
        </button>

        <button type="button" class="report-card jgc-card" onclick="window.location.href='toolbox-talks.html'">
            <h2>Toolbox Talks</h2>
            <p>Select a toolbox talk PDF, complete the report, and collect crew acknowledgements.</p>
        </button>

        <button type="button" class="report-card jgc-card" onclick="window.location.href='incident-report.html'">
            <h2>Near Miss Reporting</h2>
            <p>Report near misses, injuries, property damage, environmental incidents, and photos.</p>
        </button>

        <button type="button" class="report-card jgc-card" onclick="window.location.href='accident-report.html'">
            <h2>Accident Report</h2>
            <p>Supervisor accident investigation with employee dropdowns, corrective action, PDF and email.</p>
        </button>

        <button type="button" class="report-card jgc-card" onclick="window.location.href='employee-injury-report.html'">
            <h2>Employee Injury Report</h2>
            <p>Employee injury statement with supervisor, witnesses, prevention notes, PDF and email.</p>
        </button>
    </section>

    <div class="actions jgc-actions">
        <button type="button" class="secondary jgc-button jgc-button--secondary" onclick="window.location.href='home.html'">Home</button>
        <button type="button" class="secondary jgc-button jgc-button--secondary" onclick="signOut()">Sign Out</button>
    </div>

</div>
</main>

<script src="vendor/supabase-js.min.js?v=1" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';"></script>
<script src="common.js?v=29"></script>
<script>
const supabaseClient = createJgcSupabaseClient();
const worker = requireJgcWorker();
const currentWorker = normalizeWorkerName(worker.key);
const currentWorkerDisplay = worker.display || worker.key;
document.getElementById("currentUser").textContent = "Signed in as: " + currentWorkerDisplay;

if (isJgcSubcontractorSession(worker)) {
    const grids = document.querySelectorAll(".reports-grid");
    if (grids[0]) {
        grids[0].querySelectorAll("[onclick*='previous-inspections']").forEach((button) => button.remove());
    }
}

async function signOut() {
    await signOutJgc(supabaseClient);
}
</script>
</body>
</html>
