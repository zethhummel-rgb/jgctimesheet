<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports</title>
<link rel="stylesheet" href="styles.css?v=2">

<style>
body {
    font-family: Arial, sans-serif;
    background: #8f9691;
    margin: 0;
    padding: 20px;
    color: #1f2a24;
}

.logo-wrap {
    max-width: 347px;
    margin: 0 auto 8px;
    text-align: center;
}

.logo-wrap img {
    width: 100%;
    max-width: 347px;
    height: auto;
    display: block;
    margin: 0 auto;
}

.user-bar {
    max-width: 1100px;
    margin: 0 auto 12px;
    color: #ffffff;
    text-align: center;
    font-size: 13px;
    font-weight: bold;
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
}

.container {
    max-width: 1100px;
    margin: auto;
    background: #fbfcf9;
    padding: 20px;
    border-radius: 8px;
    border-top: 4px solid #3f7d4d;
    box-shadow: 0 3px 10px rgba(0,0,0,.18);
}

h1 {
    text-align: center;
    color: #2f6f3c;
    margin: 0 0 6px;
}

.subtitle {
    text-align: center;
    font-weight: bold;
    margin-bottom: 18px;
}

.reports-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 22px;
}

.report-card {
    border: 1px solid #c6cec5;
    border-top: 4px solid #3f7d4d;
    background: #ffffff;
    border-radius: 8px;
    padding: 16px;
    text-align: left;
    color: #1f2a24;
    cursor: pointer;
    min-height: 150px;
}

.report-card h2 {
    margin: 0 0 8px;
    color: #0b5e3b;
}

.report-card p {
    margin: 0;
    line-height: 1.35;
}

.report-card.pending {
    cursor: default;
    opacity: 0.82;
}

.toolbox-panel {
    margin-top: 16px;
    border-top: 1px solid #d6ddd4;
    padding-top: 18px;
}

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: #ffffff;
}

th,
td {
    border: 1px solid #c6cec5;
    padding: 8px;
    text-align: left;
    vertical-align: top;
    font-size: 13px;
}

th {
    background: #e6ece6;
}

button,
.file-link {
    background: #0b5e3b;
    color: #ffffff;
    border: none;
    border-radius: 4px;
    padding: 10px 14px;
    font-weight: bold;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
}

button:hover,
.file-link:hover {
    background: #08452b;
}

.secondary {
    background: #47534b;
}

.secondary:hover {
    background: #354039;
}

.status {
    min-height: 20px;
    margin-top: 10px;
    font-weight: bold;
    color: #2f6f3c;
}

.small {
    font-size: 12px;
    color: #47534b;
}

@media (max-width: 800px) {
    body {
        padding: 10px;
    }

    .reports-grid {
        grid-template-columns: 1fr;
    }

    button,
    .file-link {
        width: 100%;
        box-sizing: border-box;
        text-align: center;
    }
}
</style>
</head>

<body>
<div class="logo-wrap">
    <img src="logo.png" alt="John Gordon Construction logo">
</div>

<div id="currentUser" class="user-bar"></div>

<div class="container">
    <h1>Reports</h1>
    <div class="subtitle">Daily reports, toolbox talks, and safety reporting</div>

    <section class="reports-grid">
        <button type="button" class="report-card" onclick="window.location.href='daily-site-report.html'">
            <h2>Daily Site Reports</h2>
            <p>Project notes, weather, crew, deliveries, visitors, delays, photos, PDF and email.</p>
        </button>

        <button type="button" class="report-card" onclick="window.location.href='jsa.html'">
            <h2>JSA</h2>
            <p>Job Safety Analysis form for reviewing work steps, hazards, controls, and crew sign-off.</p>
        </button>

        <button type="button" class="report-card" onclick="window.location.href='toolbox-talks.html'">
            <h2>Toolbox Talks</h2>
            <p>Select a toolbox talk PDF, complete the report, and collect crew acknowledgements.</p>
        </button>

        <div class="report-card pending">
            <h2>Near Miss Reporting</h2>
            <p>Coming next: capture near misses and safety concerns before they become incidents.</p>
        </div>
    </section>

    <div class="actions">
        <button type="button" class="secondary" onclick="window.location.href='home.html'">Home</button>
        <button type="button" class="secondary" onclick="signOut()">Sign Out</button>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="common.js?v=2"></script>
<script>
const supabaseClient = createJgcSupabaseClient();
const worker = requireJgcWorker();
const currentWorker = normalizeWorkerName(worker.key);
const currentWorkerDisplay = worker.display || worker.key;
document.getElementById("currentUser").textContent = "Signed in as: " + currentWorkerDisplay;

async function signOut() {
    await signOutJgc(supabaseClient);
}
</script>
</body>
</html>
