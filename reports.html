<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="googlebot" content="noindex, nofollow, noarchive" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports</title>
<link rel="stylesheet" href="jgc-design-system.css?v=8" data-jgc-design-system="8">
</head>

<body class="report-family-page report-directory-page jgc-page jgc-system-page">
<main class="report-page-shell jgc-page-shell jgc-page-shell--wide jgc-stack">
<header class="jgc-page-header">
    <div class="logo-wrap jgc-brand">
        <img src="logo.webp" alt="John Gordon Construction logo">
    </div>
    <div id="currentUser" class="jgc-page-user"></div>
</header>

<section class="container jgc-panel jgc-stack">
    <h1 class="jgc-page-title">Reports</h1>
    <div class="jgc-section-heading">Quick Links</div>

    <section class="reports-grid jgc-card-grid jgc-card-grid--two">
        <button type="button" class="report-card jgc-link-card" onclick="window.location.href='todays-inspections.html?recordType=reports'">
            <h2>Today's Reports</h2>
            <p>View reports submitted in the last 24 hours, with edit, email, and delete options.</p>
        </button>

        <button type="button" class="report-card jgc-link-card" onclick="window.location.href='previous-inspections.html?recordType=reports'">
            <h2>Previous Reports</h2>
            <p>Review reports completed in the last 2 months and keep compliance history on hand.</p>
        </button>
    </section>

    <div class="jgc-section-heading">Start a New Report</div>

    <section class="reports-grid jgc-card-grid jgc-card-grid--three">

        <button type="button" class="report-card jgc-link-card" onclick="window.location.href='daily-site-report.html'">
            <h2>Daily Site Reports</h2>
            <p>Project notes, weather, crew, deliveries, visitors, delays, photos, PDF and email.</p>
        </button>

            <button type="button" class="report-card jgc-link-card" onclick="window.location.href='jsa.html?v=361'">
            <h2>JSA</h2>
            <p>Job Safety Analysis form for reviewing work steps, hazards, controls, and crew sign-off.</p>
        </button>

        <button type="button" class="report-card jgc-link-card" onclick="window.location.href='toolbox-talks.html'">
            <h2>Toolbox Talks</h2>
            <p>Select a toolbox talk PDF, complete the report, and collect crew acknowledgements.</p>
        </button>

        <button type="button" class="report-card jgc-link-card" onclick="window.location.href='incident-report.html'">
            <h2>Near Miss Reporting</h2>
            <p>Report near misses, injuries, property damage, environmental incidents, and photos.</p>
        </button>

        <button type="button" class="report-card jgc-link-card" onclick="window.location.href='accident-report.html'">
            <h2>Accident Report</h2>
            <p>Supervisor accident investigation with employee dropdowns, corrective action, PDF and email.</p>
        </button>

        <button type="button" class="report-card jgc-link-card" onclick="window.location.href='employee-injury-report.html'">
            <h2>Employee Injury Report</h2>
            <p>Employee injury statement with supervisor, witnesses, prevention notes, PDF and email.</p>
        </button>
    </section>

    <details id="myDailyReportsSection" class="daily-report-history jgc-archive" ontoggle="handleMyDailyReportsToggle(this)">
        <summary><span class="jgc-archive__title">My Daily Site Reports</span><span id="myDailyReportsCount" class="jgc-archive__count"></span></summary>
        <div class="jgc-archive__body">
            <div id="myDailyReportsStatus" class="jgc-muted">Open this section to load your reports.</div>
            <div id="myDailyReportsList" class="daily-report-list jgc-record-list"></div>
        </div>
    </details>

    <div class="actions jgc-actions jgc-actions--center">
        <button type="button" class="secondary jgc-button jgc-button--secondary" onclick="window.location.href='home.html'">Home</button>
        <button type="button" class="secondary jgc-button jgc-button--secondary" onclick="signOut()">Sign Out</button>
    </div>

</section>
</main>

<script src="vendor/supabase-js.min.js?v=1" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';"></script>
<script src="common.js?v=42"></script>
<script>
const supabaseClient = createJgcSupabaseClient();
const worker = requireJgcWorker();
const currentWorker = normalizeWorkerName(worker.key);
const currentWorkerDisplay = worker.display || worker.key;
let myDailyReportsLoaded = false;
document.getElementById("currentUser").textContent = "Signed in as: " + currentWorkerDisplay;

if (isJgcSubcontractorSession(worker)) {
    const grids = document.querySelectorAll(".reports-grid");
    if (grids[0]) {
        grids[0].querySelectorAll("[onclick*='previous-inspections']").forEach((button) => button.remove());
    }
}

function formatDailyReportDate(value) {
    if (!value) {
        return "-";
    }

    const date = new Date(String(value).slice(0, 10) + "T12:00:00");
    return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleDateString();
}

function dailyReportLink(reportId, mode) {
    return `daily-site-report.html?reportId=${encodeURIComponent(reportId)}&mode=${mode}&return=reports`;
}

async function handleMyDailyReportsToggle(section) {
    if (!section.open || myDailyReportsLoaded || !supabaseClient || isJgcSubcontractorSession(worker)) {
        return;
    }

    const status = document.getElementById("myDailyReportsStatus");
    const list = document.getElementById("myDailyReportsList");
    status.textContent = "Loading your daily site reports...";

    const { data, error } = await supabaseClient
        .from("daily_site_reports")
        .select("id,report_date,project,created_at")
        .ilike("worker_name", currentWorker)
        .order("report_date", { ascending: false })
        .order("created_at", { ascending: false })
        .limit(100);

    if (error) {
        status.textContent = "Your reports could not be loaded: " + error.message;
        return;
    }

    const reports = data || [];
    myDailyReportsLoaded = true;
    document.getElementById("myDailyReportsCount").textContent = String(reports.length);

    if (!reports.length) {
        status.textContent = "You have not submitted any daily site reports yet.";
        list.innerHTML = "";
        return;
    }

    status.textContent = `${reports.length} report${reports.length === 1 ? "" : "s"}`;
    list.innerHTML = reports.map((report) => `
        <article class="daily-report-row jgc-record-row">
            <strong>${escapeHtml(formatDailyReportDate(report.report_date))}</strong>
            <span>${escapeHtml(report.project || "Project not entered")}</span>
            <div class="jgc-actions jgc-actions--compact">
                <button type="button" class="jgc-button" onclick="window.location.href='${dailyReportLink(report.id, "view")}'">View</button>
                <button type="button" class="jgc-button jgc-button--secondary" onclick="window.location.href='${dailyReportLink(report.id, "edit")}'">Edit</button>
            </div>
        </article>
    `).join("");
}

async function signOut() {
    await signOutJgc(supabaseClient);
}
</script>
</body>
</html>
