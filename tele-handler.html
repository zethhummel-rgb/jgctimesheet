<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="googlebot" content="noindex, nofollow, noarchive" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telehandler Inspection Checklist</title>
<link rel="stylesheet" href="styles.css?v=3">
<link rel="stylesheet" href="inspection-mobile.css?v=3">
<link rel="stylesheet" href="specialty-inspection-design-system.css?v=1">

<style>
body {
    font-family: Arial, sans-serif;
    background: #8f9691;
    margin: 0;
    padding: 20px;
    color: #1f2a24;
}

.logo-wrap {
    max-width: 347px;
    margin: 0 auto 8px;
    text-align: center;
}

.logo-wrap img {
    width: 100%;
    max-width: 347px;
    height: auto;
    display: block;
    margin: 0 auto;
}

.user-bar {
    max-width: 1300px;
    margin: 0 auto 12px;
    color: #ffffff;
    text-align: center;
    font-size: 13px;
    font-weight: bold;
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
}

.container {
    max-width: 1300px;
    margin: auto;
    background: #fbfcf9;
    padding: 20px;
    border-radius: 8px;
    border-top: 4px solid #3f7d4d;
    box-shadow: 0 3px 10px rgba(0,0,0,.18);
}

h1 {
    margin: 0;
    text-align: center;
    color: #2f6f3c;
}

.subtitle {
    text-align: center;
    font-weight: bold;
    margin: 8px 0 18px;
}

.details-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 16px;
}

.field {
    display: flex;
    flex-direction: column;
}

label {
    font-weight: bold;
    margin-bottom: 4px;
}

input[type=text],
input[list],
input[type=date],
textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 8px;
    border: 1px solid #bcc7bc;
    border-radius: 4px;
    font-size: 15px;
}

textarea {
    min-height: 80px;
}

.table-wrap {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    min-width: 680px;
    border-collapse: collapse;
    background: white;
}

th,
td {
    border: 1px solid #999;
    padding: 6px;
    text-align: center;
}

th {
    background: #e6ece6;
}

td.item {
    text-align: left;
    font-weight: bold;
    min-width: 250px;
}

.choice {
    width: 64px;
}

.bottom-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 14px;
}

.actions {
    margin-top: 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

button {
    background: #0b5e3b;
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 15px;
}

button:hover {
    background: #08452b;
}

.secondary {
    background: #47534b;
}

.secondary:hover {
    background: #354039;
}

@media (max-width: 768px) {
    body {
        padding: 12px;
    }

    .container {
        padding: 14px;
    }

    .details-grid,
    .bottom-grid {
        grid-template-columns: 1fr;
    }

    table {
        font-size: 13px;
    }

    th,
    td {
        padding: 5px;
    }

    .actions button {
        width: 100%;
    }
}
</style>
</head>

<body class="specialty-inspection-page jgc-page">
<div class="logo-wrap jgc-brand-region">
    <img src="logo.webp" alt="John Gordon Construction logo">
</div>

<div class="user-bar jgc-user-line" id="userBar"></div>

<div class="container jgc-page-shell jgc-page-shell--wide">
<h1>Telehandler Inspection and Daily Checklist</h1>
<div class="subtitle">All checks must be carried out in line with manufacturer's operator manual.</div>

<div class="details-grid">
    <div class="field"><label>Telehandler</label><input id="telehandlerEquipment" type="text" list="telehandlerEquipmentOptions" placeholder="Select telehandler or type rented unit" onchange="fillTelehandlerDetails()" oninput="fillTelehandlerDetails()"><datalist id="telehandlerEquipmentOptions"></datalist></div>
    <div class="field"><label>Plant or Serial No.</label><input id="telehandlerIdentification" type="text"></div>
    <div class="field"><label>Machine Hours</label><input id="telehandlerHours" type="text"></div>
    <div class="field"><label>Date</label><input type="date"></div>
    <div class="field"><label>Site Location</label><input type="text" data-jgc-project-job placeholder="Select project/job or type location manually"></div>
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>#</th>
<th>Inspection Item</th>
<th>P</th>
<th>F</th>
<th>NA</th>
</tr>
</thead>
<tbody id="telehandlerRows"></tbody>
</table>
</div>

<div class="bottom-grid">
    <div class="field"><label>Operator Name</label><input type="text"></div>
    <div class="field"><label>Signature</label><input type="text"></div>
</div>

<div class="field">
    <label>Comments</label>
    <textarea></textarea>
</div>

<div class="actions jgc-actions">
    <button class="jgc-button" onclick="handleInspectionSave('Tele Handler')">Save</button>
    <button class="secondary jgc-button jgc-button--secondary" onclick="window.location.href='inspections.html'">Inspections</button>
    <button class="secondary jgc-button jgc-button--secondary" onclick="window.location.href='home.html'">Home</button>
    <button class="secondary jgc-button jgc-button--secondary" onclick="signOut()">Sign Out</button>
</div>
<div id="inspectionSaveStatus"></div>
</div>

<script src="vendor/supabase-js.min.js?v=1" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';"></script>
<script src="common.js?v=36"></script>
<script src="safety-acknowledgements.js?v=7"></script>
<script src="inspection-records.js?v=11"></script>
<script src="inspection-mobile.js?v=6"></script>
<script>
const workerName = localStorage.getItem("currentWorker");
const workerDisplay = localStorage.getItem("currentWorkerDisplay") || workerName;
let telehandlerEquipmentItems = [];
const inspectionItems = [
    "Engine oil level / Leaks",
    "Fuel Level / Leaks",
    "Coolant Level / Leaks",
    "Hydraulic Oil Level / Leaks",
    "Wheels and Tires",
    "Boom Sections",
    "Carriage / Forks / Stabilisers / Attachments",
    "Bonnet / Covers / Panels",
    "Counterweight/Counterweight Bolts",
    "Cab / Seat Belt",
    "Brakes / Parking Brake",
    "Control Leavers",
    "Beacons / Mirrors / Windows / Wipers",
    "Gauges and Instrumentation",
    "Rated Capacity Plate Readable",
    "Reversing/360 Camera"
];

if (!workerName) {
    window.location.href = "index.html";
}

document.getElementById("userBar").textContent = workerDisplay ? "Signed in as: " + workerDisplay : "";

document.getElementById("telehandlerRows").innerHTML = inspectionItems.map((item, itemIndex) => {
    const number = itemIndex + 1;
    return `
        <tr>
            <td>${number}</td>
            <td class="item">${item}</td>
            <td class="choice"><input aria-label="${item} Pass" type="radio" name="tele_${itemIndex}" value="P"></td>
            <td class="choice"><input aria-label="${item} Fail" type="radio" name="tele_${itemIndex}" value="F"></td>
            <td class="choice"><input aria-label="${item} Not Applicable" type="radio" name="tele_${itemIndex}" value="NA"></td>
        </tr>
    `;
}).join("");

function getTelehandlerDisplay(item) {
    const name = String(item.name || "").trim();
    const id = String(item.identification_number || "").trim();
    return id ? id + " - " + name : name;
}

function isTelehandlerEquipment(item) {
    const text = [
        item.name,
        item.equipment_type,
        item.identification_number,
        item.notes
    ].join(" ").toLowerCase();

    return /\b(telehandler|tele-handler|tele handler)\b/.test(text);
}

function updateTelehandlerOptions() {
    document.getElementById("telehandlerEquipmentOptions").innerHTML = telehandlerEquipmentItems
        .slice()
        .sort((a, b) => getTelehandlerDisplay(a).localeCompare(getTelehandlerDisplay(b), undefined, { numeric: true }))
        .map((item) => '<option value="' + escapeHtml(getTelehandlerDisplay(item)) + '"></option>')
        .join("");
}

function getSelectedTelehandlerEquipment() {
    const selectedValue = document.getElementById("telehandlerEquipment").value.trim().toLowerCase();
    return telehandlerEquipmentItems.find((item) => getTelehandlerDisplay(item).toLowerCase() === selectedValue) || null;
}

function fillTelehandlerDetails() {
    const match = getSelectedTelehandlerEquipment();

    if (!match) {
        return;
    }

    document.getElementById("telehandlerIdentification").value = match.identification_number || "";
    document.getElementById("telehandlerHours").value = match.current_hours !== null && match.current_hours !== undefined ? match.current_hours : "";
}

async function loadTelehandlerEquipmentOptions() {
    if (!inspectionSupabaseClient) {
        return;
    }

    const { data, error } = await inspectionSupabaseClient
        .from("equipment_vehicles")
        .select("*")
        .eq("is_active", true)
        .order("name", { ascending: true });

    if (error) {
        console.warn("Telehandler equipment could not be loaded.", error);
        return;
    }

    telehandlerEquipmentItems = (data || []).filter(isTelehandlerEquipment);
    updateTelehandlerOptions();
}

async function updateSelectedTelehandlerHours() {
    const match = getSelectedTelehandlerEquipment();

    if (!match) {
        return true;
    }

    const hoursValue = Number(document.getElementById("telehandlerHours").value);

    if (!Number.isFinite(hoursValue) || hoursValue < 0) {
        alert("Enter the current hours for this telehandler.");
        return false;
    }

    const { error } = await inspectionSupabaseClient
        .from("equipment_vehicles")
        .update({
            current_hours: hoursValue,
            updated_at: new Date().toISOString()
        })
        .eq("id", match.id);

    if (error) {
        alert("The telehandler hours could not be updated. " + (error.message || ""));
        return false;
    }

    return true;
}

async function handleInspectionSave(type) {
    if (typeof saveInspection !== "function") {
        alert("The inspection save file did not load. Upload inspection-records.js to the same folder as this page, then refresh.");
        return;
    }

    const hoursUpdated = await updateSelectedTelehandlerHours();

    if (!hoursUpdated) {
        return;
    }

    await saveInspection(type);
}

async function signOut() {
    await signOutJgc(inspectionSupabaseClient);
}

loadTelehandlerEquipmentOptions();
</script>
</body>
</html>
