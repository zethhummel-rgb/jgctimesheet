<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#f2f5f1;color:#1f2a24;font-family:Arial,sans-serif;">
    <div style="max-width:520px;margin:0 auto;padding:24px;background:#ffffff;border-top:5px solid #168a42;border-radius:8px;">
      <h2 style="margin:0 0 14px;color:#146c36;">Reset your JGC Portal password</h2>
      <p style="margin:0 0 16px;line-height:1.5;">Enter this reset code on the JGC Portal Reset Password page:</p>
      <div style="margin:0 0 18px;padding:14px;background:#eef8ee;border:1px solid #7eb58a;border-radius:6px;color:#123f22;font-size:30px;font-weight:700;letter-spacing:8px;text-align:center;">
        {{ .Token }}
      </div>
      <p style="margin:0 0 18px;line-height:1.5;">Use only the newest code if you requested more than one. Do not share this code with anyone.</p>
      <p style="margin:0 0 18px;">
        <a href="{{ .RedirectTo }}" style="display:inline-block;padding:11px 18px;background:#168a42;color:#ffffff;border-radius:5px;font-weight:700;text-decoration:none;">Open Password Reset</a>
      </p>
      <p style="margin:0;color:#59655e;font-size:13px;line-height:1.45;">If you did not request a password reset, you can safely ignore this email.</p>
    </div>
  </body>
</html>
