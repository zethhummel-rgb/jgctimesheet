<!DOCTYPE html>
<html>
<head>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="googlebot" content="noindex, nofollow, noarchive" />
  <title>Reset Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="jgc-design-system.css?v=7" data-jgc-design-system="7" />
</head>
<body class="reset-password-page jgc-page jgc-system-page">
<main class="reset-password-shell jgc-page-shell jgc-page-shell--narrow jgc-stack">
  <div class="logo-wrap jgc-brand">
    <img src="logo.webp" alt="John Gordon Construction" />
  </div>

  <section class="card reset-password-card jgc-panel jgc-stack">
    <h2 class="reset-password-title jgc-page-title">Reset Password</h2>
    <p class="reset-password-help jgc-help-text">
      Enter your email, the reset code from the email, and your new password.
    </p>
    <div class="jgc-field">
      <label class="jgc-label" for="resetEmail">Email Address</label>
      <input id="resetEmail" class="jgc-input" type="email" placeholder="name@example.com" autocomplete="email" maxlength="254" />
    </div>
    <div class="jgc-field">
      <label class="jgc-label" for="resetCode">Reset Code</label>
      <input id="resetCode" class="jgc-input reset-code-input jgc-code-input" type="text" placeholder="Enter the code from your email" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]*" maxlength="10" />
    </div>
    <div class="jgc-field">
      <label class="jgc-label" for="newPassword">New Password</label>
      <input id="newPassword" class="jgc-input" type="password" placeholder="At least 6 characters" autocomplete="new-password" maxlength="128" />
    </div>
    <div class="jgc-field">
      <label class="jgc-label" for="confirmPassword">Confirm New Password</label>
      <input id="confirmPassword" class="jgc-input" type="password" placeholder="Enter the new password again" autocomplete="new-password" maxlength="128" />
    </div>
    <div class="reset-password-actions jgc-actions jgc-actions--stacked">
      <button id="updatePasswordButton" class="jgc-button" type="button" onclick="updatePassword()">Verify Code &amp; Update Password</button>
      <button id="sendCodeButton" class="secondary jgc-button jgc-button--secondary" type="button" onclick="sendNewCode()">Send a New Code</button>
      <a class="reset-password-back jgc-text-link jgc-text-center" href="index.html">Back to Sign In</a>
    </div>
    <div id="status" class="status jgc-notice" role="status" aria-live="polite"></div>
  </section>
</main>

<script src="vendor/supabase-js.min.js?v=1" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';"></script>
<script src="common.js?v=39"></script>
<script>
const supabaseClient = createJgcSupabaseClient();
const JGC_RESET_EMAIL_STORAGE_KEY = "jgcPasswordResetEmail";

function cleanResetEmail(value) {
  return String(value || "").trim().toLowerCase();
}

function isValidResetEmail(email) {
  return email.length <= 254 && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function setResetStatus(message, type) {
  const status = document.getElementById("status");
  status.innerText = message || "";
  status.classList.toggle("jgc-notice--danger", type === "error");
  status.classList.toggle("jgc-notice--success", type === "success");
}

function setResetBusy(isBusy) {
  document.getElementById("updatePasswordButton").disabled = isBusy;
  document.getElementById("sendCodeButton").disabled = isBusy;
}

function rememberResetEmail(email) {
  try {
    sessionStorage.setItem(JGC_RESET_EMAIL_STORAGE_KEY, email);
  } catch (storageError) {
    // The email field remains available if session storage is unavailable.
  }
}

function friendlyResetError(error) {
  const message = String(error && error.message ? error.message : "").toLowerCase();
  const code = String(error && error.code ? error.code : "").toLowerCase();
  if (code.includes("otp") || message.includes("token") || message.includes("expired") || message.includes("code")) {
    return "That reset code is incorrect or has expired. Request a new code and try again.";
  }
  return "The password could not be updated. Please request a new code and try again.";
}

async function sendNewCode() {
  if (!supabaseClient) {
    setResetStatus("Password reset is unavailable right now. Please try again shortly.", "error");
    return;
  }

  const email = cleanResetEmail(document.getElementById("resetEmail").value);
  if (!isValidResetEmail(email)) {
    setResetStatus("Enter a valid email address first.", "error");
    document.getElementById("resetEmail").focus();
    return;
  }

  setResetBusy(true);
  setResetStatus("Sending a new reset code...", "");
  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
    redirectTo: getAppPageUrl("reset-password.html")
  });
  setResetBusy(false);

  if (error) {
    setResetStatus(error.message || "A new reset code could not be sent.", "error");
    return;
  }

  rememberResetEmail(email);
  document.getElementById("resetCode").value = "";
  setResetStatus("A new reset code was sent. Use only the newest code.", "success");
  document.getElementById("resetCode").focus();
}

async function updatePassword() {
  if (!supabaseClient) {
    setResetStatus("Password reset is unavailable right now. Please try again shortly.", "error");
    return;
  }

  const email = cleanResetEmail(document.getElementById("resetEmail").value);
  const code = String(document.getElementById("resetCode").value || "").replace(/\D/g, "");
  const password = document.getElementById("newPassword").value;
  const confirmation = document.getElementById("confirmPassword").value;

  if (!isValidResetEmail(email)) {
    setResetStatus("Enter a valid email address.", "error");
    document.getElementById("resetEmail").focus();
    return;
  }

  if (!/^\d{6,10}$/.test(code)) {
    setResetStatus("Enter the 6- to 10-digit code from the reset email.", "error");
    document.getElementById("resetCode").focus();
    return;
  }

  if (password.length < 6 || password.length > 128) {
    setResetStatus("Your new password must be between 6 and 128 characters.", "error");
    document.getElementById("newPassword").focus();
    return;
  }

  if (password !== confirmation) {
    setResetStatus("The two password entries do not match.", "error");
    document.getElementById("confirmPassword").focus();
    return;
  }

  setResetBusy(true);
  setResetStatus("Checking the reset code...", "");
  const { error: verificationError } = await supabaseClient.auth.verifyOtp({
    email,
    token: code,
    type: "recovery"
  });

  if (verificationError) {
    setResetBusy(false);
    setResetStatus(friendlyResetError(verificationError), "error");
    return;
  }

  setResetStatus("Updating your password...", "");
  const { error: updateError } = await supabaseClient.auth.updateUser({ password });
  if (updateError) {
    setResetBusy(false);
    setResetStatus(friendlyResetError(updateError), "error");
    return;
  }

  try {
    sessionStorage.removeItem(JGC_RESET_EMAIL_STORAGE_KEY);
    await supabaseClient.auth.signOut({ scope: "local" });
  } catch (signOutError) {
    // The password update succeeded even if local session cleanup is unavailable.
  }

  setResetStatus("Password updated successfully. Returning to sign in...", "success");
  setTimeout(function() {
    window.location.href = "index.html";
  }, 1200);
}

function initializePasswordReset() {
  const emailInput = document.getElementById("resetEmail");
  try {
    emailInput.value = sessionStorage.getItem(JGC_RESET_EMAIL_STORAGE_KEY) || "";
  } catch (storageError) {
    emailInput.value = "";
  }

  const hash = new URLSearchParams(window.location.hash.replace(/^#/, ""));
  if (hash.get("error")) {
    setResetStatus("That old reset link is no longer valid. Enter your email and request a new reset code.", "error");
    history.replaceState(null, document.title, window.location.pathname + window.location.search);
  }

  document.getElementById("resetCode").addEventListener("input", function(event) {
    event.target.value = event.target.value.replace(/\D/g, "").slice(0, 10);
  });
  document.getElementById("confirmPassword").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      updatePassword();
    }
  });

  (emailInput.value ? document.getElementById("resetCode") : emailInput).focus();
}

document.addEventListener("DOMContentLoaded", initializePasswordReset);
</script>
</body>
</html>
