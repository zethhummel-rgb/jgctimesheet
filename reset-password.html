<!DOCTYPE html>
<html>
<head>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="googlebot" content="noindex, nofollow, noarchive" />
  <title>Reset Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css?v=3" />
  <style>
    body {
      font-family: Arial;
      background: #8f9691;
      padding: 20px;
      margin: 0;
      color: #1f2a24;
    }

    .logo-wrap {
      max-width: 347px;
      margin: 0 auto 2px;
      text-align: center;
    }

    .logo-wrap img {
      width: 100%;
      max-width: 347px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .card {
      max-width: 460px;
      background: #fbfcf9;
      padding: 15px;
      margin: 0 auto 12px;
      border-radius: 8px;
      border-top: 4px solid #3f7d4d;
      box-shadow: 0 3px 10px rgba(0,0,0,0.18);
    }

    h2 {
      margin-top: 0;
      color: #2f6f3c;
    }

    input, button {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      margin-bottom: 8px;
      box-sizing: border-box;
    }

    input {
      background: #f7f9f4;
      border: 1px solid #b8c2b2;
      border-radius: 5px;
    }

    button {
      background: #3f7d4d;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      font-weight: bold;
    }

    .status {
      font-size: 13px;
      font-weight: bold;
      color: #2f6f3c;
    }
  </style>
  <link rel="stylesheet" href="reset-password-design-system.css?v=1" />
</head>
<body class="reset-password-page jgc-page">
<main class="reset-password-shell jgc-page-shell">
  <div class="logo-wrap jgc-brand">
    <img src="logo.webp" alt="John Gordon Construction" />
  </div>

  <section class="card reset-password-card jgc-panel">
    <h2 class="reset-password-title jgc-page-title">Reset Password</h2>
    <div class="jgc-field">
      <label class="jgc-label" for="newPassword">New Password</label>
      <input id="newPassword" class="jgc-input" type="password" placeholder="New password" autocomplete="new-password" />
    </div>
    <button class="jgc-button" type="button" onclick="updatePassword()">Update Password</button>
    <div id="status" class="status jgc-notice" role="status" aria-live="polite"></div>
  </section>
</main>

<script src="vendor/supabase-js.min.js?v=1" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';"></script>
<script src="common.js?v=34"></script>
<script>
const supabaseClient = createJgcSupabaseClient();

async function updatePassword() {
  const password = document.getElementById("newPassword").value;
  const status = document.getElementById("status");

  if (!password) {
    alert("Enter a new password.");
    return;
  }

  status.innerText = "Updating password...";
  const { error } = await supabaseClient.auth.updateUser({ password });

  if (error) {
    status.innerText = "";
    alert(error.message || "Password could not be updated.");
    return;
  }

  status.innerText = "Password updated. You can sign in now.";
  setTimeout(function() {
    window.location.href = "index.html";
  }, 1200);
}
</script>
</body>
</html>
