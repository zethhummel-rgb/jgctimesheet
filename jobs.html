<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="googlebot" content="noindex, nofollow, noarchive" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JGC Jobs</title>
  <link rel="stylesheet" href="jgc-design-system.css?v=7" data-jgc-design-system="7">
  <link rel="stylesheet" href="jobs-design-system.css?v=3">
</head>

<body class="jobs-page jgc-page jgc-system-page">
<main class="page jobs-page-shell jgc-page-shell jgc-stack">
  <header class="jobs-page-header jgc-page-header">
    <div class="logo-wrap jgc-brand">
      <img src="logo.webp" alt="John Gordon Construction logo">
    </div>
    <h1 class="jgc-page-title">Job Lookup</h1>
    <div id="currentUser" class="small jgc-page-user"></div>
  </header>

  <div class="top-actions jgc-actions jgc-actions--center">
    <button class="jgc-button" type="button" onclick="window.location.href='home.html'">Home</button>
    <button type="button" class="secondary jgc-button jgc-button--secondary" onclick="loadJobs()">Refresh Jobs</button>
    <button type="button" class="secondary jgc-button jgc-button--secondary" onclick="signOut()">Logout</button>
  </div>

  <section class="card jobs-lookup-panel jgc-panel jgc-stack">
    <h2 class="jgc-section-title">Jobs</h2>
    <p class="small jobs-help jgc-muted">Search job names, job numbers, or Contract / T&amp;M status. This list is read-only and comes from the admin Excel import.</p>
    <div class="jgc-field">
      <label class="jgc-label" for="jobSearch">Search Jobs</label>
      <input class="jgc-input" id="jobSearch" type="search" placeholder="Example: Cornwall, 24-001, T&amp;M" oninput="renderJobs()">
    </div>
    <div id="jobsStatus" class="small jobs-status jgc-notice" role="status" aria-live="polite">Loading jobs...</div>
    <div id="jobsList"></div>
  </section>
</main>

<script src="vendor/supabase-js.min.js?v=1" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';"></script>
<script src="common.js?v=39"></script>
<script>
const supabaseClient = createJgcSupabaseClient();
const worker = requireJgcWorker();
let jobs = [];
const initialJobSearch = new URLSearchParams(window.location.search).get("search") || "";

if (initialJobSearch) {
  document.getElementById("jobSearch").value = initialJobSearch;
}

document.getElementById("currentUser").textContent = "Signed in as: " + (worker.display || worker.key || "");

function getJobTypeLabel(value) {
  const text = String(value || "").trim();
  return text || "-";
}

function getJobDocumentHref(job) {
  const url = String(job && job.document_link || "").trim();
  return /^https?:\/\//i.test(url) ? url : "";
}

function setJobsStatus(message, isError) {
  const status = document.getElementById("jobsStatus");
  status.textContent = message || "";
  status.classList.toggle("jgc-notice--danger", Boolean(isError));
}

function renderJobs() {
  const list = document.getElementById("jobsList");
  const search = document.getElementById("jobSearch").value.trim().toLowerCase();
  const filtered = jobs.filter((job) => {
    const text = [
      job.job_number || "",
      job.job_name || "",
      job.job_type || "",
      job.document_link_label || ""
    ].join(" ").toLowerCase();

    return !search || text.includes(search);
  });

  setJobsStatus(filtered.length + " job" + (filtered.length === 1 ? "" : "s") + " shown.");

  if (!filtered.length) {
    list.innerHTML = '<div class="small jobs-empty jgc-empty-state">No jobs match that search.</div>';
    return;
  }

  list.innerHTML = `
    <div class="table-wrap jgc-table-wrap">
      <table class="jobs-table jgc-table">
        <thead>
          <tr>
            <th>Job Number</th>
            <th>Job Name</th>
            <th>Contract / T&amp;M</th>
            <th>Documents</th>
          </tr>
        </thead>
        <tbody>
          ${filtered.map((job) => `
            ${(() => {
              const href = getJobDocumentHref(job);
              const label = job.document_link_label || "Open Documents";
              return `
            <tr>
              <td data-label="Job Number"><strong>${escapeHtml(job.job_number || "")}</strong></td>
              <td data-label="Job Name">${escapeHtml(job.job_name || "")}</td>
              <td data-label="Contract / T&amp;M"><span class="pill job-type-badge jgc-badge jgc-badge--info">${escapeHtml(getJobTypeLabel(job.job_type))}</span></td>
              <td data-label="Documents">${href ? '<a class="doc-link jobs-document-link jgc-button" href="' + escapeHtml(href) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(label) + '</a>' : '<span class="small jgc-muted">No link</span>'}</td>
            </tr>
              `;
            })()}
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
}

async function loadJobs() {
  const list = document.getElementById("jobsList");
  setJobsStatus("Loading jobs...");

  const { data, error } = await supabaseClient
    .from("jobs")
    .select("id, job_number, job_name, job_type, active, updated_at, document_link, document_link_label")
    .eq("active", true)
    .order("job_number", { ascending: true });

  if (error) {
    jobs = [];
    list.innerHTML = '<div class="small jobs-empty jgc-empty-state">The job list is temporarily unavailable.</div>';
    setJobsStatus("Jobs could not be loaded.", true);
    return;
  }

  jobs = data || [];
  renderJobs();
}

async function signOut() {
  await signOutJgc(supabaseClient);
}

loadJobs();
</script>
</body>
</html>
