<!DOCTYPE html>
<html>
<head>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="googlebot" content="noindex, nofollow, noarchive" />
  <title>Certificates</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css?v=3" />
  <style>
    body {
      font-family: Arial;
      background: #8f9691;
      padding: 20px;
      margin: 0;
      color: #1f2a24;
    }

    .logo-wrap {
      max-width: 347px;
      margin: 0 auto 8px;
      text-align: center;
    }

    .logo-wrap img {
      width: 100%;
      max-width: 347px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    h2 {
      max-width: 900px;
      margin: 0 auto 8px;
      text-align: center;
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    .user-bar {
      max-width: 900px;
      margin: 0 auto 12px;
      color: #ffffff;
      text-align: center;
      font-size: 13px;
      font-weight: bold;
      text-shadow: 0 1px 2px rgba(0,0,0,0.25);
    }

    .card {
      max-width: 900px;
      background: #fbfcf9;
      padding: 15px;
      margin: 0 auto 12px;
      border-radius: 8px;
      border-top: 4px solid #3f7d4d;
      box-shadow: 0 3px 10px rgba(0,0,0,0.18);
    }

    h3 {
      margin-top: 0;
      margin-bottom: 10px;
      color: #2f6f3c;
    }

    .section-toggle {
      width: 100%;
      text-align: left;
      border: none;
      border-bottom: 1px solid #d6dfd2;
      background: transparent;
      color: #2f6f3c;
      padding: 0 0 10px 0;
      margin: 0 0 10px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .section-toggle span {
      font-size: 13px;
      color: #3f7d4d;
    }

    label {
      font-size: 13px;
      font-weight: bold;
    }

    input, button, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      margin-bottom: 8px;
      box-sizing: border-box;
    }

    input, textarea {
      background: #f7f9f4;
      border: 1px solid #b8c2b2;
      border-radius: 5px;
    }

    input:focus, textarea:focus {
      border-color: #3f7d4d;
      outline: 2px solid #d9ead5;
    }

    button {
      background: #3f7d4d;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      font-weight: bold;
    }

    button:hover {
      background: #315f3c;
    }

    .secondary {
      background: #5f6a62;
    }

    .secondary:hover {
      background: #48514a;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .actions button,
    .actions a {
      width: auto;
      margin: 0;
    }

    .file-link {
      display: inline-block;
      padding: 8px 12px;
      background: #3f7d4d;
      color: #ffffff;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }

    .table-wrap {
      overflow-x: auto;
      margin-top: 10px;
    }

    table {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
      background: #ffffff;
    }

    th, td {
      border: 1px solid #c5cec1;
      padding: 10px;
      text-align: center;
      vertical-align: middle;
    }

    th {
      background: #dfe9da;
      color: #1f3d28;
      font-weight: bold;
    }

    td:first-child,
    th:first-child {
      text-align: left;
    }

    .status {
      min-height: 18px;
      margin-top: 4px;
      font-size: 13px;
      color: #2f6f3c;
      font-weight: bold;
    }

    .small {
      font-size: 13px;
      color: #666;
    }

    .expired {
      color: #9a3f3f;
      font-weight: bold;
    }

    .expiring {
      color: #8a6500;
      font-weight: bold;
    }

    .valid {
      color: #2f6f3c;
      font-weight: bold;
    }

    @media (max-width: 720px) {
      body {
        padding: 10px;
      }

      .logo-wrap {
        max-width: 260px;
      }

      input, button, textarea {
        min-height: 42px;
        font-size: 16px;
      }

      table {
        min-width: 620px;
      }

      th, td {
        padding: 6px;
        font-size: 12px;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr;
      }

      .actions button,
      .actions a {
        width: 100%;
        box-sizing: border-box;
        text-align: center;
      }
    }

    /* Phase 7 compatibility: shared certificate semantics without changing geometry. */
    body.certificates-page.jgc-page {
      font-family: Arial;
      background: #8f9691;
      padding: 20px;
      margin: 0;
      color: #1f2a24;
    }

    .certificates-page .certificates-page-shell.jgc-page-shell {
      width: 100%;
      max-width: none;
      margin: 0;
      padding: 0;
    }

    .certificates-page .certificates-page-header.jgc-page-header {
      display: block;
      margin: 0;
      text-align: center;
    }

    .certificates-page .logo-wrap.jgc-brand {
      max-width: 347px;
      margin: 0 auto 8px;
    }

    .certificates-page .certificates-page-header.jgc-page-header h1 {
      max-width: 900px;
      margin: 0 auto 8px;
      color: #ffffff;
      font-size: 24px;
      line-height: normal;
      text-align: center;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    .certificates-page .card.jgc-panel {
      max-width: 900px;
      background: #fbfcf9;
      padding: 15px;
      margin: 0 auto 12px;
      border: 0;
      border-top: 4px solid #3f7d4d;
      border-radius: 8px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.18);
      color: #1f2a24;
    }

    .certificates-page .jgc-section-title {
      margin-top: 0;
      margin-bottom: 10px;
      color: #2f6f3c;
      font-size: 19px;
    }

    .certificates-page .jgc-field {
      display: block;
    }

    .certificates-page .jgc-label {
      margin: 0;
      color: #1f2a24;
      font-size: 13px;
      font-weight: bold;
    }

    .certificates-page .jgc-input,
    .certificates-page .jgc-textarea {
      width: 100%;
      min-height: 0;
      padding: 8px;
      margin-top: 4px;
      margin-bottom: 8px;
      background: #f7f9f4;
      border: 1px solid #b8c2b2;
      border-radius: 5px;
      color: #1f2a24;
      box-shadow: none;
    }

    .certificates-page button.jgc-button,
    .certificates-page a.jgc-button {
      width: 100%;
      min-height: 0;
      padding: 8px;
      margin-top: 4px;
      margin-bottom: 8px;
      border: 0;
      border-radius: 5px;
      background: #3f7d4d;
      color: #ffffff;
      font-weight: bold;
      box-shadow: none;
    }

    .certificates-page button.jgc-button--secondary {
      background: #5f6a62;
    }

    .certificates-page .section-toggle.jgc-button {
      display: flex;
      width: 100%;
      min-height: 0;
      padding: 0 0 10px;
      margin: 0 0 10px;
      border: 0;
      border-bottom: 1px solid #d6dfd2;
      border-radius: 0;
      background: transparent;
      color: #2f6f3c;
      font-size: 20px;
      text-align: left;
      box-shadow: none;
    }

    .certificates-page .actions.jgc-table-actions,
    .certificates-page .certificate-page-actions.jgc-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .certificates-page .actions.jgc-table-actions button,
    .certificates-page .actions.jgc-table-actions a,
    .certificates-page .certificate-page-actions.jgc-actions button {
      width: auto;
      margin: 0;
    }

    .certificates-page .table-wrap.jgc-table-wrap {
      margin-top: 10px;
      border: 0;
      border-radius: 0;
      background: transparent;
      overflow-x: auto;
    }

    .certificates-page table.jgc-table {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
      background: #ffffff;
    }

    .certificates-page table.jgc-table th,
    .certificates-page table.jgc-table td {
      border: 1px solid #c5cec1;
      padding: 10px;
      color: #1f2a24;
      background: #ffffff;
      text-align: center;
      vertical-align: middle;
    }

    .certificates-page table.jgc-table th {
      background: #dfe9da;
      color: #1f3d28;
    }

    .certificates-page table.jgc-table td:first-child,
    .certificates-page table.jgc-table th:first-child {
      text-align: left;
    }

    .certificates-page .jgc-empty-state {
      padding: 0;
      border: 0;
      background: transparent;
      color: #666;
      text-align: left;
    }

    @media (max-width: 720px) {
      body.certificates-page.jgc-page {
        padding: 10px;
      }

      .certificates-page .logo-wrap.jgc-brand {
        max-width: 260px;
      }

      .certificates-page .jgc-input,
      .certificates-page .jgc-textarea,
      .certificates-page button.jgc-button,
      .certificates-page a.jgc-button {
        min-height: 42px;
        font-size: 16px;
      }

      .certificates-page table.jgc-table {
        min-width: 620px;
      }

      .certificates-page table.jgc-table th,
      .certificates-page table.jgc-table td {
        padding: 6px;
        font-size: 12px;
      }

      .certificates-page .actions.jgc-table-actions {
        display: grid;
        grid-template-columns: 1fr;
      }

      .certificates-page .actions.jgc-table-actions button,
      .certificates-page .actions.jgc-table-actions a,
      .certificates-page .certificate-page-actions.jgc-actions button {
        width: 100%;
        box-sizing: border-box;
        text-align: center;
      }
    }
  </style>
</head>

<body class="certificates-page jgc-page">
<main class="certificates-page-shell jgc-page-shell">
<header class="certificates-page-header jgc-page-header">

<div class="logo-wrap jgc-brand">
  <img src="logo.webp" alt="John Gordon Construction" />
</div>

<h1>Certificates</h1>
<div id="currentUser" class="user-bar"></div>
</header>

<section class="card jgc-panel">
  <h3 class="jgc-section-title">My Certificates</h3>
  <button type="button" class="jgc-button" onclick="loadCertificates()">Refresh Certificates</button>
  <div id="certificatesList"></div>
</section>

<section class="card jgc-panel">
  <button id="toggleUpload" type="button" class="section-toggle jgc-button" onclick="toggleCertificateUpload()">
    Add Certificate
    <span id="uploadToggleIcon">▸</span>
  </button>

  <div id="uploadCardBody" class="upload-body">
    <div class="jgc-field">
    <label class="jgc-label" for="certificateName">Certificate Name</label>
    <input class="jgc-input" id="certificateName" placeholder="Example: Working at Heights" />
    </div>

    <div class="jgc-field">
    <label class="jgc-label" for="expiryDate">Expiry Date</label>
    <input class="jgc-input" id="expiryDate" type="date" />
    </div>

    <div class="jgc-field">
    <label class="jgc-label" for="certificateNotes">Notes</label>
    <textarea class="jgc-textarea" id="certificateNotes" rows="3" placeholder="Optional notes"></textarea>
    </div>

    <div class="jgc-field">
    <label class="jgc-label" for="certificateFile">Certificate File</label>
    <input class="jgc-input" id="certificateFile" type="file" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png" />
    </div>

    <button type="button" class="jgc-button" onclick="uploadCertificate()">Upload Certificate</button>
    <div id="certificateStatus" class="status"></div>
  </div>
</section>

<section class="card jgc-panel certificate-page-actions jgc-actions">
  <button type="button" class="jgc-button" onclick="window.location.href='home.html'">Home</button>
  <button type="button" class="secondary jgc-button jgc-button--secondary" onclick="signOut()">Sign Out</button>
</section>
</main>

<script src="vendor/supabase-js.min.js?v=1" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';"></script>
<script src="common.js?v=33"></script>
<script>
const supabaseClient = createJgcSupabaseClient();

const currentWorker = normalizeWorkerName(localStorage.getItem("currentWorker"));
const currentWorkerDisplay = localStorage.getItem("currentWorkerDisplay") || currentWorker;
let certificates = [];
let certificateUrls = {};

if (!currentWorker) {
  window.location.href = "index.html";
}

document.getElementById("currentUser").innerText = "Signed in as: " + currentWorkerDisplay;

function normalizeWorkerName(name) {
  return String(name || "").trim().toLowerCase();
}

function toggleCertificateUpload() {
  const body = document.getElementById("uploadCardBody");
  const icon = document.getElementById("uploadToggleIcon");
  if (!body || !icon) return;

  const isHidden = body.style.display === "none";
  body.style.display = isHidden ? "block" : "none";
  icon.textContent = isHidden ? "▾" : "▸";
}

function makeSafeFileName(name) {
  return String(name || "certificate")
    .trim()
    .replace(/[^a-z0-9.\-_]+/gi, "-")
    .replace(/-+/g, "-")
    .toLowerCase();
}

function getCertificateStatus(expiryDate) {
  if (!expiryDate) {
    return { text: "No Expiry", className: "valid" };
  }

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const expiry = new Date(expiryDate + "T00:00:00");
  const daysUntilExpiry = Math.ceil((expiry - today) / 1000 / 60 / 60 / 24);

  if (daysUntilExpiry < 0) {
    return { text: "Expired", className: "expired" };
  }

  if (daysUntilExpiry <= 30) {
    return { text: "Expiring Soon", className: "expiring" };
  }

  return { text: "Valid", className: "valid" };
}

async function uploadCertificate() {
  const status = document.getElementById("certificateStatus");
  const certificateName = document.getElementById("certificateName").value.trim();
  const expiryDate = document.getElementById("expiryDate").value || null;
  const notes = document.getElementById("certificateNotes").value.trim();
  const fileInput = document.getElementById("certificateFile");
  const file = fileInput.files[0];

  if (!certificateName || !file) {
    alert("Enter a certificate name and choose a file.");
    return;
  }

  if (!supabaseClient) {
    status.innerText = "Supabase is not available right now.";
    return;
  }

  status.innerText = "Uploading certificate...";

  const filePath = currentWorker + "/" + Date.now() + "-" + makeSafeFileName(file.name);
  const { error: uploadError } = await uploadJgcFile({
    client: supabaseClient,
    bucket: "certificates",
    path: filePath,
    file,
    input: fileInput,
    cacheControl: "3600",
    upsert: false,
    contentType: file.type || "application/octet-stream",
    retry: uploadCertificate
  });

  if (uploadError) {
    status.innerText = "Certificate file upload failed: " + uploadError.message;
    return;
  }

  const { error: insertError } = await supabaseClient
    .from("certificates")
    .insert({
      worker_name: currentWorker,
      certificate_name: certificateName,
      expiry_date: expiryDate,
      notes,
      file_path: filePath,
      file_name: file.name,
      file_type: file.type || "application/octet-stream"
    });

  if (insertError) {
    await supabaseClient.storage.from("certificates").remove([filePath]);
    status.innerText = "Certificate record could not be saved.";
    return;
  }

  document.getElementById("certificateName").value = "";
  document.getElementById("expiryDate").value = "";
  document.getElementById("certificateNotes").value = "";
  fileInput.value = "";
  status.innerText = "Certificate uploaded.";
  loadCertificates();
}

async function loadCertificates() {
  const list = document.getElementById("certificatesList");

  if (!supabaseClient) {
    list.innerHTML = '<div class="small jgc-empty-state">Supabase is not available right now.</div>';
    return;
  }

  list.innerHTML = '<div class="small jgc-empty-state">Loading certificates...</div>';

  const { data, error } = await supabaseClient
    .from("certificates")
    .select("*")
    .eq("worker_name", currentWorker)
    .order("expiry_date", { ascending: true, nullsFirst: false });

  if (error) {
    list.innerHTML = '<div class="small jgc-empty-state">Could not load certificates.</div>';
    return;
  }

  certificates = data || [];
  await prepareCertificateUrls();
  renderCertificates();
}

async function prepareCertificateUrls() {
  certificateUrls = {};

  for (let certificate of certificates) {
    const { data, error } = await supabaseClient
      .storage
      .from("certificates")
      .createSignedUrl(certificate.file_path, 3600);

    if (!error && data && data.signedUrl) {
      certificateUrls[certificate.id] = data.signedUrl;
    }
  }
}

function renderCertificates() {
  const list = document.getElementById("certificatesList");

  if (certificates.length === 0) {
    list.innerHTML = '<div class="small jgc-empty-state">No certificates uploaded yet.</div>';
    return;
  }

  const rows = certificates.map(function(certificate) {
    const status = getCertificateStatus(certificate.expiry_date);
    const fileUrl = certificateUrls[certificate.id] || "#";
    const fileButton = certificateUrls[certificate.id]
      ? '<a class="file-link jgc-button" href="' + fileUrl + '" target="_blank" rel="noopener">Open</a>'
      : '<button type="button" class="secondary jgc-button jgc-button--secondary" onclick="loadCertificates()">Refresh Link</button>';

    return `
      <tr>
        <td>${escapeHtml(certificate.certificate_name)}</td>
        <td>${certificate.expiry_date ? escapeHtml(certificate.expiry_date) : "-"}</td>
        <td class="${status.className}">${status.text}</td>
        <td>${escapeHtml(certificate.notes || "")}</td>
        <td>
          <div class="actions jgc-table-actions">
            ${fileButton}
          </div>
        </td>
      </tr>
    `;
  }).join("");

  list.innerHTML = `
    <div class="table-wrap jgc-table-wrap">
      <table class="jgc-table">
        <thead>
          <tr>
            <th>Certificate</th>
            <th>Expiry</th>
            <th>Status</th>
            <th>Notes</th>
            <th>File</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, function(character) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[character];
  });
}

async function signOut() {
  await signOutJgc(supabaseClient);
}

loadCertificates();
document.getElementById("uploadCardBody").style.display = "none";
</script>

</body>
</html>
