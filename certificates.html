<!DOCTYPE html>
<html>
<head>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="googlebot" content="noindex, nofollow, noarchive" />
  <title>Certificates</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="jgc-design-system.css?v=6" data-jgc-design-system="6" />
</head>

<body class="certificates-page jgc-page jgc-system-page">
<main class="certificates-page-shell jgc-page-shell jgc-stack">
<header class="certificates-page-header jgc-page-header">

<div class="logo-wrap jgc-brand">
  <img src="logo.webp" alt="John Gordon Construction" />
</div>

<h1 class="jgc-page-title">Certificates</h1>
<div id="currentUser" class="jgc-page-user"></div>
</header>

<section class="card jgc-panel jgc-stack">
  <h3 class="jgc-section-title">My Certificates</h3>
  <button type="button" class="jgc-button jgc-full-width" onclick="loadCertificates()">Refresh Certificates</button>
  <div id="certificatesList"></div>
</section>

<section class="card jgc-panel">
  <button id="toggleUpload" type="button" class="section-toggle jgc-button jgc-button--secondary jgc-disclosure-button jgc-full-width" onclick="toggleCertificateUpload()" aria-controls="uploadCardBody" aria-expanded="false">
    Add Certificate
    <span id="uploadToggleIcon">▸</span>
  </button>

  <div id="uploadCardBody" class="upload-body jgc-form-grid">
    <div class="jgc-field jgc-field--full">
    <label class="jgc-label" for="certificateName">Certificate Name</label>
    <input class="jgc-input" id="certificateName" placeholder="Example: Working at Heights" />
    </div>

    <div class="jgc-field jgc-field--full">
    <label class="jgc-label" for="expiryDate">Expiry Date</label>
    <input class="jgc-input" id="expiryDate" type="date" />
    </div>

    <div class="jgc-field jgc-field--full">
    <label class="jgc-label" for="certificateNotes">Notes</label>
    <textarea class="jgc-textarea" id="certificateNotes" rows="3" placeholder="Optional notes"></textarea>
    </div>

    <div class="jgc-field jgc-field--full">
    <label class="jgc-label" for="certificateFile">Certificate File</label>
    <input class="jgc-input" id="certificateFile" type="file" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png" />
    </div>

    <button type="button" class="jgc-button jgc-field--full" onclick="uploadCertificate()">Upload Certificate</button>
    <div id="certificateStatus" class="status jgc-notice jgc-field--full" role="status" aria-live="polite"></div>
  </div>
</section>

</main>

<script src="vendor/supabase-js.min.js?v=1" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';"></script>
<script src="common.js?v=39"></script>
<script>
const supabaseClient = createJgcSupabaseClient();

const currentWorker = normalizeWorkerName(localStorage.getItem("currentWorker"));
const currentWorkerDisplay = localStorage.getItem("currentWorkerDisplay") || currentWorker;
let certificates = [];
let certificateUrls = {};

if (!currentWorker) {
  window.location.href = "index.html";
}

document.getElementById("currentUser").innerText = "Signed in as: " + currentWorkerDisplay;

function normalizeWorkerName(name) {
  return String(name || "").trim().toLowerCase();
}

function setCertificateStatus(message, type) {
  const status = document.getElementById("certificateStatus");
  status.textContent = message || "";
  status.classList.toggle("jgc-notice--danger", type === "error");
  status.classList.toggle("jgc-notice--success", type === "success");
}

function toggleCertificateUpload() {
  const body = document.getElementById("uploadCardBody");
  const icon = document.getElementById("uploadToggleIcon");
  const toggle = document.getElementById("toggleUpload");
  if (!body || !icon || !toggle) return;

  const isHidden = body.style.display === "none";
  body.style.display = isHidden ? "" : "none";
  icon.textContent = isHidden ? "▾" : "▸";
  toggle.setAttribute("aria-expanded", String(isHidden));
}

function makeSafeFileName(name) {
  return String(name || "certificate")
    .trim()
    .replace(/[^a-z0-9.\-_]+/gi, "-")
    .replace(/-+/g, "-")
    .toLowerCase();
}

function getCertificateStatus(expiryDate) {
  if (!expiryDate) {
    return { text: "No Expiry", className: "jgc-badge--success" };
  }

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const expiry = new Date(expiryDate + "T00:00:00");
  const daysUntilExpiry = Math.ceil((expiry - today) / 1000 / 60 / 60 / 24);

  if (daysUntilExpiry < 0) {
    return { text: "Expired", className: "jgc-badge--danger" };
  }

  if (daysUntilExpiry <= 30) {
    return { text: "Expiring Soon", className: "jgc-badge--warning" };
  }

  return { text: "Valid", className: "jgc-badge--success" };
}

async function uploadCertificate() {
  const certificateName = document.getElementById("certificateName").value.trim();
  const expiryDate = document.getElementById("expiryDate").value || null;
  const notes = document.getElementById("certificateNotes").value.trim();
  const fileInput = document.getElementById("certificateFile");
  const file = fileInput.files[0];

  if (!certificateName || !file) {
    alert("Enter a certificate name and choose a file.");
    return;
  }

  if (!supabaseClient) {
    setCertificateStatus("Supabase is not available right now.", "error");
    return;
  }

  setCertificateStatus("Uploading certificate...");

  const filePath = currentWorker + "/" + Date.now() + "-" + makeSafeFileName(file.name);
  const { error: uploadError } = await uploadJgcFile({
    client: supabaseClient,
    bucket: "certificates",
    path: filePath,
    file,
    input: fileInput,
    cacheControl: "3600",
    upsert: false,
    contentType: file.type || "application/octet-stream",
    retry: uploadCertificate
  });

  if (uploadError) {
    setCertificateStatus("Certificate file upload failed: " + uploadError.message, "error");
    return;
  }

  const { error: insertError } = await supabaseClient
    .from("certificates")
    .insert({
      worker_name: currentWorker,
      certificate_name: certificateName,
      expiry_date: expiryDate,
      notes,
      file_path: filePath,
      file_name: file.name,
      file_type: file.type || "application/octet-stream"
    });

  if (insertError) {
    await supabaseClient.storage.from("certificates").remove([filePath]);
    setCertificateStatus("Certificate record could not be saved.", "error");
    return;
  }

  document.getElementById("certificateName").value = "";
  document.getElementById("expiryDate").value = "";
  document.getElementById("certificateNotes").value = "";
  fileInput.value = "";
  setCertificateStatus("Certificate uploaded.", "success");
  loadCertificates();
}

async function loadCertificates() {
  const list = document.getElementById("certificatesList");

  if (!supabaseClient) {
    list.innerHTML = '<div class="small jgc-empty-state">Supabase is not available right now.</div>';
    return;
  }

  list.innerHTML = '<div class="small jgc-empty-state">Loading certificates...</div>';

  const { data, error } = await supabaseClient
    .from("certificates")
    .select("*")
    .eq("worker_name", currentWorker)
    .order("expiry_date", { ascending: true, nullsFirst: false });

  if (error) {
    list.innerHTML = '<div class="small jgc-empty-state">Could not load certificates.</div>';
    return;
  }

  certificates = data || [];
  await prepareCertificateUrls();
  renderCertificates();
}

async function prepareCertificateUrls() {
  certificateUrls = {};

  for (let certificate of certificates) {
    const { data, error } = await supabaseClient
      .storage
      .from("certificates")
      .createSignedUrl(certificate.file_path, 3600);

    if (!error && data && data.signedUrl) {
      certificateUrls[certificate.id] = data.signedUrl;
    }
  }
}

function renderCertificates() {
  const list = document.getElementById("certificatesList");

  if (certificates.length === 0) {
    list.innerHTML = '<div class="small jgc-empty-state">No certificates uploaded yet.</div>';
    return;
  }

  const rows = certificates.map(function(certificate) {
    const status = getCertificateStatus(certificate.expiry_date);
    const fileUrl = certificateUrls[certificate.id] || "#";
    const fileButton = certificateUrls[certificate.id]
      ? '<a class="file-link jgc-button" href="' + fileUrl + '" target="_blank" rel="noopener">Open</a>'
      : '<button type="button" class="secondary jgc-button jgc-button--secondary" onclick="loadCertificates()">Refresh Link</button>';

    return `
      <tr>
        <td>${escapeHtml(certificate.certificate_name)}</td>
        <td>${certificate.expiry_date ? escapeHtml(certificate.expiry_date) : "-"}</td>
        <td><span class="jgc-badge ${status.className}">${status.text}</span></td>
        <td>${escapeHtml(certificate.notes || "")}</td>
        <td>
          <div class="actions jgc-table-actions">
            ${fileButton}
          </div>
        </td>
      </tr>
    `;
  }).join("");

  list.innerHTML = `
    <div class="table-wrap jgc-table-wrap">
      <table class="jgc-table jgc-table--wide">
        <thead>
          <tr>
            <th>Certificate</th>
            <th>Expiry</th>
            <th>Status</th>
            <th>Notes</th>
            <th>File</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, function(character) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[character];
  });
}

async function signOut() {
  await signOutJgc(supabaseClient);
}

loadCertificates();
document.getElementById("uploadCardBody").style.display = "none";
</script>

</body>
</html>
