<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="googlebot" content="noindex, nofollow, noarchive" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JGC Portal - Equipment / Vehicles</title>
<link rel="stylesheet" href="styles.css?v=3">

<style>
body {
    font-family: Arial, sans-serif;
    background: #8f9691;
    margin: 0;
    padding: 20px;
    color: #1f2a24;
}

.logo-wrap {
    max-width: 347px;
    margin: 0 auto 8px;
    text-align: center;
}

.logo-wrap img {
    width: 100%;
    max-width: 347px;
    height: auto;
    display: block;
    margin: 0 auto;
}

h1 {
    text-align: center;
    color: #ffffff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    margin: 0 0 8px;
}

.user-bar {
    max-width: 1100px;
    margin: 0 auto 12px;
    color: #ffffff;
    text-align: center;
    font-size: 13px;
    font-weight: bold;
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
}

.actions {
    max-width: 1100px;
    margin: 0 auto 12px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.panel {
    max-width: 1100px;
    margin: 0 auto;
    background: #fbfcf9;
    border-radius: 8px;
    border-top: 4px solid #3f7d4d;
    box-shadow: 0 3px 10px rgba(0,0,0,0.18);
    padding: 16px;
}

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    min-width: 760px;
    border-collapse: collapse;
    background: #ffffff;
}

th,
td {
    border: 1px solid #c6cec5;
    padding: 8px;
    text-align: left;
    vertical-align: top;
    font-size: 13px;
}

th {
    background: #e6ece6;
}

.status-pill {
    display: inline-block;
    border-radius: 999px;
    padding: 3px 8px;
    font-weight: bold;
    font-size: 12px;
}

.valid {
    background: #dcefdc;
    color: #1d5b28;
}

.expiring {
    background: #fff2c2;
    color: #684d00;
}

.expired {
    background: #f4d3d3;
    color: #7b1f1f;
}

.small {
    font-size: 13px;
    color: #58635c;
}

button {
    background: #0b5e3b;
    color: white;
    border: none;
    padding: 9px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #08452b;
}

.secondary {
    background: #47534b;
}

.secondary:hover {
    background: #354039;
}

/* Phase 9 design-system compatibility: preserve the established equipment directory. */
body.equipment-directory-page.jgc-page {
    background: #8f9691;
    padding: 20px;
    color: #1f2a24;
}

.equipment-directory-page .equipment-page-shell.jgc-page-shell {
    width: 100%;
    max-width: none;
    margin: 0;
    padding: 0 0 80px;
}

.equipment-directory-page .equipment-page-header.jgc-page-header {
    display: block;
    margin-bottom: 0;
}

.equipment-directory-page .logo-wrap.jgc-brand {
    display: block;
}

.equipment-directory-page .equipment-page-header.jgc-page-header h1 {
    color: #ffffff;
    font-size: 2em;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
}

.equipment-directory-page .actions.jgc-actions {
    align-items: center;
}

.equipment-directory-page button.jgc-button {
    min-height: 0;
    padding: 9px 12px;
    background: #0b5e3b;
    border: 0;
    border-radius: 4px;
}

.equipment-directory-page button.jgc-button--secondary {
    background: #47534b;
}

.equipment-directory-page .panel.jgc-panel {
    max-width: 1100px;
    padding: 16px;
    color: #1f2a24;
    background: #fbfcf9;
    border: 0;
    border-top: 4px solid #3f7d4d;
    border-radius: 8px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.18);
}

.equipment-directory-page #equipmentStatus.jgc-notice {
    padding: 0;
    color: #58635c;
    background: transparent;
    border-left: 0;
}

.equipment-directory-page .table-wrap.jgc-table-wrap {
    border: 0;
    border-radius: 0;
}

.equipment-directory-page table.jgc-table {
    min-width: 760px;
    color: #1f2a24;
    background: #ffffff;
}

.equipment-directory-page table.jgc-table th,
.equipment-directory-page table.jgc-table td {
    padding: 8px;
    color: #1f2a24;
    white-space: normal;
}

.equipment-directory-page table.jgc-table th {
    background: #e6ece6;
}

.equipment-directory-page .status-pill.jgc-badge {
    display: inline-block;
    border-radius: 999px;
}

.equipment-directory-page .jgc-section-title {
    color: #2f6f3c;
}

.equipment-directory-page .jgc-empty-state {
    color: #58635c;
}

@media (max-width: 720px) {
    body {
        padding: 10px;
    }

    button {
        width: 100%;
    }

    body.equipment-directory-page.jgc-page {
        padding: 10px;
    }

    .equipment-directory-page .panel.jgc-panel {
        padding: 12px;
    }
}
</style>
</head>

<body class="equipment-directory-page jgc-page">
<main class="equipment-page-shell jgc-page-shell jgc-page-shell--wide">
<header class="equipment-page-header jgc-page-header">
<div class="logo-wrap jgc-brand">
    <img src="logo.webp" alt="John Gordon Construction logo">
</div>

<h1>Equipment / Vehicles</h1>
<div id="currentUser" class="user-bar"></div>
</header>

<div class="actions jgc-actions">
    <button class="jgc-button" type="button" onclick="loadEquipment()">Refresh</button>
    <button class="secondary jgc-button jgc-button--secondary" type="button" onclick="window.location.href='home.html'">Home</button>
    <button class="secondary jgc-button jgc-button--secondary" type="button" onclick="signOut()">Sign Out</button>
</div>

<section class="panel jgc-panel">
    <div id="equipmentStatus" class="small jgc-notice" style="margin: 0 0 10px;" aria-live="polite"></div>
    <div id="equipmentList" class="small">Loading equipment and vehicles...</div>
</section>
</main>

<script src="vendor/supabase-js.min.js?v=1" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';"></script>
<script src="common.js?v=29"></script>
<script>
const supabaseClient = createJgcSupabaseClient();
const worker = requireJgcWorker();

document.getElementById("currentUser").textContent = "Signed in as: " + (worker.display || worker.key);

function formatEquipmentHours(value) {
    if (value === null || value === undefined || value === "") {
        return "-";
    }

    const number = Number(value);

    if (!Number.isFinite(number)) {
        return escapeHtml(value);
    }

    return escapeHtml(number.toFixed(1));
}

function formatEquipmentKm(value) {
    if (value === null || value === undefined || value === "") {
        return "-";
    }

    const number = Number(value);

    if (!Number.isFinite(number)) {
        return escapeHtml(value);
    }

    return escapeHtml(number.toLocaleString("en-CA", { maximumFractionDigits: 0 }));
}

function formatEquipmentWords(value) {
    if (typeof capitalizeWords === "function") {
        return capitalizeWords(value);
    }

    return String(value || "").replace(/\b\w/g, (letter) => letter.toUpperCase());
}

function getEquipmentStatus(expiryDate) {
    if (!expiryDate) {
        return { text: "No Expiry", className: "valid" };
    }

    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const expiry = new Date(expiryDate + "T00:00:00");
    const days = Math.ceil((expiry - today) / (1000 * 60 * 60 * 24));

    if (days < 0) {
        return { text: "Expired", className: "expired" };
    }

    if (days <= 30) {
        return { text: "Expiring Soon", className: "expiring" };
    }

    return { text: "Valid", className: "valid" };
}

function getEquipmentCategory(item) {
    const text = [
        item.equipment_type,
        item.name,
        item.identification_number,
        item.notes
    ].join(" ").toLowerCase();

    if (/\b(trailer|trl|float)\b/.test(text)) {
        return "Trailers";
    }

    if (/\b(equipment|forklift|lift|telehandler|tele-handler|loader|excavator|compressor|generator)\b/.test(text)) {
        return "Equipment";
    }

    if (/\b(truck|van|vehicle|pickup|car|f-?150|f-?250|f-?350|ram|silverado|sierra|plate)\b/.test(text)) {
        return "Vehicles";
    }

    return "Equipment";
}

function renderEquipmentTable(items, category) {
    if (!items.length) {
        return '<div class="small jgc-empty-state">No items in this group.</div>';
    }

    const showMeterColumn = category !== "Trailers";
    const meterHeader = category === "Vehicles" ? "Current KM" : "Current Hours";

    return `
        <div class="table-wrap jgc-table-wrap">
            <table class="jgc-table">
                <thead>
                    <tr>
                        <th>Name of Equipment / Vehicle</th>
                        <th>Type of Equip/Vehicle</th>
                        <th>Identification #</th>
                        <th>Operator</th>
                        ${showMeterColumn ? `<th>${meterHeader}</th>` : ""}
                        <th>Owned / Rental</th>
                        <th>Billable</th>
                        <th>Transportation Required</th>
                        <th>Yearly Inspection Expiry</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    ${items.map((item) => {
                        const status = getEquipmentStatus(item.yearly_inspection_expiry);
                        const meterValue = category === "Vehicles"
                            ? formatEquipmentKm(item.current_km)
                            : formatEquipmentHours(item.current_hours);
                        return `
                            <tr>
                                <td>${escapeHtml(item.name)}</td>
                                <td>${escapeHtml(item.equipment_type || "")}</td>
                                <td>${escapeHtml(item.identification_number || "")}</td>
                                <td>${escapeHtml(item.operator_name || "")}</td>
                                ${showMeterColumn ? `<td>${meterValue}</td>` : ""}
                                <td>${escapeHtml(formatEquipmentWords(item.ownership_type || "owned"))}${item.rental_supplier ? "<br><span class=\"small\">" + escapeHtml(item.rental_supplier) + "</span>" : ""}</td>
                                <td>${item.billable_equipment === false ? "No" : "Yes"}</td>
                                <td>${item.transportation_required ? "Yes" : "No"}</td>
                                <td>${item.yearly_inspection_expiry ? escapeHtml(item.yearly_inspection_expiry) : "-"}</td>
                                <td><span class="status-pill ${status.className} jgc-badge ${status.className === "expired" ? "jgc-badge--danger" : status.className === "expiring" ? "jgc-badge--warning" : "jgc-badge--success"}">${status.text}</span></td>
                            </tr>
                        `;
                    }).join("")}
                </tbody>
            </table>
        </div>
    `;
}

async function loadEquipment() {
    const list = document.getElementById("equipmentList");
    const status = document.getElementById("equipmentStatus");
    if (!list || !status) return;

    if (!supabaseClient) {
        status.textContent = "";
        list.innerHTML = '<div class="jgc-empty-state">Supabase is not available.</div>';
        return;
    }

    status.textContent = "Loading equipment and vehicles...";
    list.innerHTML = "";

    const { data, error } = await supabaseClient
        .from("equipment_vehicles")
        .select("*")
        .eq("is_active", true)
        .order("name", { ascending: true });

    if (error) {
        const details = error.message || "Unknown error";
        status.textContent = "Failed to load equipment from Supabase.";
        list.innerHTML = `
          <div class="small">
            Unable to load equipment list. <br />
            ${escapeHtml(details)}
          </div>
        `;
        return;
    }

    const items = data || [];
    status.textContent = `Showing ${items.length} active item${items.length === 1 ? "" : "s"}.`;

    if (!items.length) {
        list.innerHTML = '<div class="jgc-empty-state">No equipment or vehicles have been added yet.</div>';
        return;
    }

    const groups = ["Vehicles", "Trailers", "Equipment"].map((category) => ({
        category,
        items: items
            .filter((item) => getEquipmentCategory(item) === category)
            .sort((a, b) => String(a.name || "").localeCompare(String(b.name || "")))
    }));

    try {
        list.innerHTML = groups.map((group) => `
            <h2 class="jgc-section-title" style="margin:18px 0 8px;color:#2f6f3c;">${group.category}</h2>
            ${renderEquipmentTable(group.items, group.category)}
        `).join("");
    } catch (renderError) {
        console.error("Equipment table render failed.", renderError);
        status.textContent = "Equipment loaded, but the table could not be displayed.";
        list.innerHTML = `
            <div class="small">
                Something in the equipment list could not be displayed: ${escapeHtml(renderError.message || renderError)}
            </div>
        `;
    }
}

async function signOut() {
    await signOutJgc(supabaseClient);
}

loadEquipment();
</script>
</body>
</html>
