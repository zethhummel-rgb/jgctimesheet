<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="googlebot" content="noindex, nofollow, noarchive" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JGC Portal - Equipment / Vehicles</title>
<link rel="stylesheet" href="jgc-design-system.css?v=8" data-jgc-design-system="8">

</head>

<body class="equipment-directory-page jgc-page jgc-system-page">
<main class="equipment-page-shell jgc-page-shell jgc-page-shell--wide jgc-stack">
<header class="equipment-page-header jgc-page-header">
<div class="logo-wrap jgc-brand">
    <img src="logo.webp" alt="John Gordon Construction logo">
</div>

<h1 class="jgc-page-title">Equipment / Vehicles</h1>
<div id="currentUser" class="jgc-page-user"></div>
</header>

<div class="actions jgc-actions jgc-actions--center">
    <button class="jgc-button" type="button" onclick="openEquipmentDirectory(true)">Refresh</button>
    <button class="secondary jgc-button jgc-button--secondary" type="button" onclick="window.location.href='home.html'">Home</button>
    <button class="secondary jgc-button jgc-button--secondary" type="button" onclick="signOut()">Sign Out</button>
</div>

<section class="panel jgc-panel">
    <details id="equipmentDirectoryDetails" class="jgc-archive">
        <summary>
            <span class="jgc-archive__title">Equipment and Vehicles</span>
            <span id="equipmentLazyStatus" class="jgc-archive__count">Open to load</span>
        </summary>
        <div class="jgc-archive__body">
            <div id="equipmentStatus" class="jgc-notice" aria-live="polite"></div>
            <div id="equipmentList" class="jgc-muted">Equipment has not been loaded yet.</div>
        </div>
    </details>
</section>
</main>

<script src="vendor/supabase-js.min.js?v=1" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';"></script>
<script src="common.js?v=42"></script>
<script>
const supabaseClient = createJgcSupabaseClient();
const worker = requireJgcWorker();
let equipmentDirectoryLoaded = false;
let equipmentDirectoryLoading = false;

document.getElementById("currentUser").textContent = "Signed in as: " + (worker.display || worker.key);

function formatEquipmentHours(value) {
    if (value === null || value === undefined || value === "") {
        return "-";
    }

    const number = Number(value);

    if (!Number.isFinite(number)) {
        return escapeHtml(value);
    }

    return escapeHtml(number.toFixed(1));
}

function formatEquipmentKm(value) {
    if (value === null || value === undefined || value === "") {
        return "-";
    }

    const number = Number(value);

    if (!Number.isFinite(number)) {
        return escapeHtml(value);
    }

    return escapeHtml(number.toLocaleString("en-CA", { maximumFractionDigits: 0 }));
}

function formatEquipmentWords(value) {
    if (typeof capitalizeWords === "function") {
        return capitalizeWords(value);
    }

    return String(value || "").replace(/\b\w/g, (letter) => letter.toUpperCase());
}

function getEquipmentStatus(expiryDate) {
    if (!expiryDate) {
        return { text: "No Expiry", className: "valid" };
    }

    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const expiry = new Date(expiryDate + "T00:00:00");
    const days = Math.ceil((expiry - today) / (1000 * 60 * 60 * 24));

    if (days < 0) {
        return { text: "Expired", className: "expired" };
    }

    if (days <= 30) {
        return { text: "Expiring Soon", className: "expiring" };
    }

    return { text: "Valid", className: "valid" };
}

function getEquipmentCategory(item) {
    const text = [
        item.equipment_type,
        item.name,
        item.identification_number,
        item.notes
    ].join(" ").toLowerCase();

    if (/\b(trailer|trl|float)\b/.test(text)) {
        return "Trailers";
    }

    if (/\b(equipment|forklift|lift|telehandler|tele-handler|loader|excavator|compressor|generator)\b/.test(text)) {
        return "Equipment";
    }

    if (/\b(truck|van|vehicle|pickup|car|f-?150|f-?250|f-?350|ram|silverado|sierra|plate)\b/.test(text)) {
        return "Vehicles";
    }

    return "Equipment";
}

function renderEquipmentTable(items, category) {
    if (!items.length) {
        return '<div class="small jgc-empty-state">No items in this group.</div>';
    }

    const showMeterColumn = category !== "Trailers";
    const meterHeader = category === "Vehicles" ? "Current KM" : "Current Hours";

    return `
        <div class="table-wrap jgc-table-wrap">
            <table class="jgc-table jgc-table--wide jgc-table--mobile-cards">
                <thead>
                    <tr>
                        <th>Name of Equipment / Vehicle</th>
                        <th>Type of Equip/Vehicle</th>
                        <th>Identification #</th>
                        <th>Operator</th>
                        ${showMeterColumn ? `<th>${meterHeader}</th>` : ""}
                        <th>Owned / Rental</th>
                        <th>Billable</th>
                        <th>Transportation Required</th>
                        <th>Yearly Inspection Expiry</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    ${items.map((item) => {
                        const status = getEquipmentStatus(item.yearly_inspection_expiry);
                        const meterValue = category === "Vehicles"
                            ? formatEquipmentKm(item.current_km)
                            : formatEquipmentHours(item.current_hours);
                        return `
                            <tr>
                                <td data-label="Name">${escapeHtml(item.name)}</td>
                                <td data-label="Type">${escapeHtml(item.equipment_type || "")}</td>
                                <td data-label="Identification #">${escapeHtml(item.identification_number || "")}</td>
                                <td data-label="Operator">${escapeHtml(item.operator_name || "")}</td>
                                ${showMeterColumn ? `<td data-label="${meterHeader}">${meterValue}</td>` : ""}
                                <td data-label="Owned / Rental">${escapeHtml(formatEquipmentWords(item.ownership_type || "owned"))}${item.rental_supplier ? "<br><span class=\"small\">" + escapeHtml(item.rental_supplier) + "</span>" : ""}</td>
                                <td data-label="Billable">${item.billable_equipment === false ? "No" : "Yes"}</td>
                                <td data-label="Transportation Required">${item.transportation_required ? "Yes" : "No"}</td>
                                <td data-label="Inspection Expiry">${item.yearly_inspection_expiry ? escapeHtml(item.yearly_inspection_expiry) : "-"}</td>
                                <td data-label="Status"><span class="status-pill ${status.className} jgc-badge ${status.className === "expired" ? "jgc-badge--danger" : status.className === "expiring" ? "jgc-badge--warning" : "jgc-badge--success"}">${status.text}</span></td>
                            </tr>
                        `;
                    }).join("")}
                </tbody>
            </table>
        </div>
    `;
}

async function loadEquipment(forceRefresh) {
    const list = document.getElementById("equipmentList");
    const status = document.getElementById("equipmentStatus");
    const lazyStatus = document.getElementById("equipmentLazyStatus");
    if (!list || !status) return;

    if (equipmentDirectoryLoading || (equipmentDirectoryLoaded && !forceRefresh)) {
        return;
    }

    equipmentDirectoryLoading = true;
    if (lazyStatus) lazyStatus.textContent = "Loading...";

    if (!supabaseClient) {
        status.textContent = "";
        list.innerHTML = '<div class="jgc-empty-state">Supabase is not available.</div>';
        equipmentDirectoryLoading = false;
        if (lazyStatus) lazyStatus.textContent = "Unavailable";
        return;
    }

    status.textContent = "Loading equipment and vehicles...";
    status.classList.remove("jgc-notice--danger", "jgc-notice--success");
    list.innerHTML = "";

    const { data, error } = await supabaseClient
        .from("equipment_vehicles")
        .select("*")
        .eq("is_active", true)
        .order("name", { ascending: true });

    if (error) {
        const details = error.message || "Unknown error";
        status.textContent = "Failed to load equipment from Supabase.";
        status.classList.add("jgc-notice--danger");
        list.innerHTML = `
          <div class="jgc-notice jgc-notice--danger">
            Unable to load equipment list. <br />
            ${escapeHtml(details)}
          </div>
        `;
        equipmentDirectoryLoading = false;
        if (lazyStatus) lazyStatus.textContent = "Retry";
        return;
    }

    const items = data || [];
    equipmentDirectoryLoaded = true;
    equipmentDirectoryLoading = false;
    if (lazyStatus) lazyStatus.textContent = `${items.length} item${items.length === 1 ? "" : "s"}`;
    status.textContent = `Showing ${items.length} active item${items.length === 1 ? "" : "s"}.`;
    status.classList.add("jgc-notice--success");

    if (!items.length) {
        list.innerHTML = '<div class="jgc-empty-state">No equipment or vehicles have been added yet.</div>';
        return;
    }

    const groups = ["Vehicles", "Trailers", "Equipment"].map((category) => ({
        category,
        items: items
            .filter((item) => getEquipmentCategory(item) === category)
            .sort((a, b) => String(a.name || "").localeCompare(String(b.name || "")))
    }));

    try {
        list.innerHTML = groups.map((group) => `
            <h2 class="jgc-section-title">${group.category}</h2>
            ${renderEquipmentTable(group.items, group.category)}
        `).join("");
    } catch (renderError) {
        console.error("Equipment table render failed.", renderError);
        status.textContent = "Equipment loaded, but the table could not be displayed.";
        list.innerHTML = `
            <div class="jgc-notice jgc-notice--danger">
                Something in the equipment list could not be displayed: ${escapeHtml(renderError.message || renderError)}
            </div>
        `;
    }
}

function openEquipmentDirectory(forceRefresh) {
    const details = document.getElementById("equipmentDirectoryDetails");
    if (details) details.open = true;
    return loadEquipment(Boolean(forceRefresh));
}

async function signOut() {
    await signOutJgc(supabaseClient);
}

document.getElementById("equipmentDirectoryDetails").addEventListener("toggle", function() {
    if (this.open) loadEquipment(false);
});
</script>
</body>
</html>
