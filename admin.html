<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JGC Admin</title>
<link rel="stylesheet" href="styles.css?v=2">

<style>
body {
    font-family: Arial, sans-serif;
    background: #8f9691;
    margin: 0;
    padding: 20px;
    color: #1f2a24;
}

.logo-wrap {
    max-width: 347px;
    margin: 0 auto 8px;
    text-align: center;
}

.logo-wrap img {
    width: 100%;
    max-width: 347px;
    height: auto;
    display: block;
    margin: 0 auto;
}

h1 {
    text-align: center;
    color: #ffffff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    margin: 0 0 8px;
}

.user-bar {
    max-width: 1200px;
    margin: 0 auto 12px;
    color: #ffffff;
    text-align: center;
    font-size: 13px;
    font-weight: bold;
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
}

.card {
    max-width: 1200px;
    margin: 0 auto 14px;
    background: #fbfcf9;
    border-radius: 8px;
    border-top: 4px solid #3f7d4d;
    box-shadow: 0 3px 10px rgba(0,0,0,0.18);
    padding: 16px;
}

h2 {
    margin: 0 0 12px;
    color: #2f6f3c;
}

.filters {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
    margin-bottom: 12px;
}

label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 4px;
}

input,
select,
textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 8px;
    border: 1px solid #bcc7bc;
    border-radius: 4px;
}

textarea {
    min-height: 110px;
    resize: vertical;
}

.announcement-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.announcement-grid .full {
    grid-column: 1 / -1;
}

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    min-width: 820px;
    border-collapse: collapse;
    background: #ffffff;
}

th,
td {
    border: 1px solid #c6cec5;
    padding: 7px;
    text-align: left;
    vertical-align: top;
    font-size: 13px;
}

th {
    background: #e6ece6;
}

.small {
    font-size: 13px;
    color: #58635c;
}

.actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

button,
.file-link {
    background: #0b5e3b;
    color: white;
    border: none;
    padding: 10px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    text-decoration: none;
    display: inline-block;
}

button:hover,
.file-link:hover {
    background: #08452b;
}

.secondary {
    background: #47534b;
}

.secondary:hover {
    background: #354039;
}

.delete-button {
    background: #b42318;
}

.delete-button:hover {
    background: #8f1d14;
}

.tabs {
    max-width: 1200px;
    margin: 0 auto 12px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.tab-button {
    background: #fbfcf9;
    color: #1f2a24;
}

.tab-button.active {
    background: #3f7d4d;
    color: white;
}

.calendar-panel {
    margin-bottom: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid #d6ddd4;
}

.calendar-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
}

.calendar-controls button {
    width: auto;
}

.calendar-title {
    font-weight: bold;
    color: #2f6f3c;
    text-align: center;
}

.calendar-legend {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 8px 0;
    font-size: 12px;
    font-weight: bold;
}

.legend-item {
    padding: 4px 8px;
    border-radius: 999px;
    border: 1px solid #c6cec5;
}

.legend-item.approved {
    background: #dcefe1;
    color: #245832;
}

.legend-item.pending {
    background: #fff3cd;
    color: #7a5b00;
}

.legend-item.denied {
    background: #f8d7da;
    color: #8f1d14;
}

.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    border: 1px solid #c6cec5;
    background: #ffffff;
}

.calendar-head,
.calendar-day {
    min-height: 92px;
    border: 1px solid #d6ddd4;
    padding: 5px;
    box-sizing: border-box;
    font-size: 12px;
}

.calendar-head {
    min-height: auto;
    background: #e6ece6;
    font-weight: bold;
    text-align: center;
}

.calendar-day.past {
    background: #f1f1f1;
    color: #7a827c;
}

.day-number {
    font-weight: bold;
    margin-bottom: 4px;
}

.calendar-request {
    margin-top: 3px;
    padding: 3px 4px;
    border-radius: 4px;
    line-height: 1.2;
    font-size: 11px;
}

.calendar-request.approved {
    background: #dcefe1;
    color: #245832;
}

.calendar-request.pending {
    background: #fff3cd;
    color: #7a5b00;
}

.calendar-request.denied {
    background: #f8d7da;
    color: #8f1d14;
}

@media (max-width: 720px) {
    body {
        padding: 10px;
    }

    button,
    .file-link {
        width: 100%;
        box-sizing: border-box;
        text-align: center;
    }

    .calendar-controls {
        display: grid;
        grid-template-columns: 1fr;
    }

    .calendar-day {
        min-height: 70px;
        font-size: 11px;
        padding: 4px;
    }

    .announcement-grid {
        grid-template-columns: 1fr;
    }

    .announcement-grid .full {
        grid-column: auto;
    }
}
</style>
</head>

<body>
<div class="logo-wrap">
    <img src="logo.png" alt="John Gordon Construction logo">
</div>

<h1>Admin</h1>
<div id="currentUser" class="user-bar"></div>

<div class="tabs">
    <button id="timesheetsTab" class="tab-button active" onclick="showTab('timesheets')">Timesheets</button>
    <button id="inspectionsTab" class="tab-button" onclick="showTab('inspections')">Inspections</button>
    <button id="certificatesTab" class="tab-button" onclick="showTab('certificates')">Certificates</button>
    <button id="vacationTab" class="tab-button" onclick="showTab('vacation')">Vacation Requests</button>
    <button id="announcementsTab" class="tab-button" onclick="showTab('announcements')">Announcements</button>
    <button class="secondary" onclick="window.location.href='accounts.html'">Accounts</button>
    <button class="secondary" onclick="window.location.href='home.html'">Home</button>
    <button class="secondary" onclick="signOut()">Sign Out</button>
</div>

<div id="timesheetsSection" class="card">
    <h2>Submitted Timesheets</h2>
    <div class="filters">
        <div>
            <label>Worker</label>
            <input id="timesheetWorkerFilter" oninput="renderTimesheets()" placeholder="Filter worker">
        </div>
    </div>
    <div id="timesheetsList" class="small">Loading timesheets...</div>
</div>

<div id="inspectionsSection" class="card" hidden>
    <h2>Inspection Reports</h2>
    <div class="filters">
        <div>
            <label>Worker</label>
            <input id="inspectionWorkerFilter" oninput="renderInspections()" placeholder="Filter worker">
        </div>
        <div>
            <label>Type</label>
            <input id="inspectionTypeFilter" oninput="renderInspections()" placeholder="Filter type">
        </div>
    </div>
    <div id="inspectionsList" class="small">Loading inspections...</div>
</div>

<div id="certificatesSection" class="card" hidden>
    <h2>Certificates</h2>
    <div class="filters">
        <div>
            <label>Worker</label>
            <input id="certificateWorkerFilter" oninput="renderCertificates()" placeholder="Filter worker">
        </div>
        <div>
            <label>Status</label>
            <select id="certificateStatusFilter" onchange="renderCertificates()">
                <option value="">All</option>
                <option value="Expired">Expired</option>
                <option value="Expiring Soon">Expiring Soon</option>
                <option value="Valid">Valid</option>
                <option value="No Expiry">No Expiry</option>
            </select>
        </div>
    </div>
    <div id="certificatesList" class="small">Loading certificates...</div>
</div>

<div id="vacationSection" class="card" hidden>
    <h2>Vacation Requests</h2>
    <div class="calendar-panel">
        <div class="calendar-controls">
            <button type="button" class="secondary" onclick="changeVacationCalendarMonth(-1)">Previous</button>
            <div id="adminVacationCalendarTitle" class="calendar-title"></div>
            <button type="button" class="secondary" onclick="changeVacationCalendarMonth(1)">Next</button>
        </div>
        <div class="calendar-legend">
            <span class="legend-item approved">Approved</span>
            <span class="legend-item pending">Pending</span>
            <span class="legend-item denied">Denied</span>
        </div>
        <div id="adminVacationCalendar" class="calendar-grid"></div>
    </div>
    <div class="filters">
        <div>
            <label>Worker</label>
            <input id="vacationWorkerFilter" oninput="renderVacationRequests()" placeholder="Filter worker">
        </div>
        <div>
            <label>Status</label>
            <select id="vacationStatusFilter" onchange="renderVacationRequests()">
                <option value="">All</option>
                <option value="pending">Pending</option>
                <option value="approved">Approved</option>
                <option value="denied">Denied</option>
            </select>
        </div>
    </div>
    <div id="vacationList" class="small">Loading vacation requests...</div>
</div>

<div id="announcementsSection" class="card" hidden>
    <h2>Announcements</h2>
    <div class="announcement-grid">
        <div>
            <label>Title</label>
            <input id="announcementTitle" placeholder="Example: Safety meeting Friday">
        </div>
        <div>
            <label>Expires On (optional)</label>
            <input id="announcementExpires" type="date">
        </div>
        <div class="full">
            <label>Message</label>
            <textarea id="announcementBody" placeholder="Write the announcement here"></textarea>
        </div>
        <div class="full">
            <label>Attach PDF (optional)</label>
            <input id="announcementFile" type="file" accept="application/pdf,.pdf">
        </div>
    </div>
    <div class="actions" style="margin-top:10px;">
        <button type="button" onclick="publishAnnouncement()">Publish Announcement</button>
        <button class="secondary" type="button" onclick="loadAnnouncements()">Refresh Announcements</button>
    </div>
    <div id="announcementStatus" class="small" style="margin-top:10px;"></div>
    <div id="announcementsList" class="small" style="margin-top:12px;">Loading announcements...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="common.js?v=2"></script>
<script>
const supabaseClient = createJgcSupabaseClient();
const worker = requireJgcWorker();
const currentWorker = normalizeWorkerName(worker.key);
const currentWorkerDisplay = worker.display;
let timesheets = [];
let inspections = [];
let certificates = [];
let vacationRequests = [];
let accounts = [];
let announcements = [];
let vacationCalendarMonth = new Date();
let certificateUrls = {};
let announcementUrls = {};
let currentUserId = "";
const ANNOUNCEMENT_EMAIL_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzPILTnOSzQcCkA6y5vSLxCH6i05Y2-ZHZAk09Und0YKiXZOYMppV4fvW3G6EgqOIZi/exec";

if (!isAdminWorker(currentWorker, worker.role)) {
    alert("Admin is only available to authorized users.");
    window.location.href = "home.html";
}

document.getElementById("currentUser").textContent = "Signed in as: " + currentWorkerDisplay;

function showTab(tab) {
    ["timesheets", "inspections", "certificates", "vacation", "announcements"].forEach((name) => {
        document.getElementById(name + "Section").hidden = name !== tab;
        document.getElementById(name + "Tab").classList.toggle("active", name === tab);
    });
}

function formatDate(value) {
    return formatDisplayDate(value);
}

function getCertificateStatus(expiryDate) {
    if (!expiryDate) {
        return "No Expiry";
    }

    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const expiry = new Date(expiryDate + "T00:00:00");
    const daysUntilExpiry = Math.ceil((expiry - today) / (1000 * 60 * 60 * 24));

    if (daysUntilExpiry < 0) {
        return "Expired";
    }

    if (daysUntilExpiry <= 30) {
        return "Expiring Soon";
    }

    return "Valid";
}

async function loadAdminData() {
    if (!supabaseClient) {
        document.getElementById("timesheetsList").textContent = "Supabase is not available.";
        return;
    }

    const sessionResult = await supabaseClient.auth.getSession();
    currentUserId = sessionResult.data.session && sessionResult.data.session.user
        ? sessionResult.data.session.user.id
        : "";

    const [timesheetResult, inspectionResult, certificateResult, vacationResult, accountResult, announcementResult] = await Promise.all([
        supabaseClient.from("previous_timesheet_weeks").select("*").order("submitted_at", { ascending: false }),
        supabaseClient.from("inspection_records").select("*").order("created_at", { ascending: false }),
        supabaseClient.from("certificates").select("*").order("worker_name", { ascending: true }),
        supabaseClient.from("vacation_requests").select("*").order("created_at", { ascending: false }),
        supabaseClient.from("profiles").select("id,email,display_name,worker_key,role,account_status").order("display_name", { ascending: true }),
        supabaseClient.from("announcements").select("*").eq("is_active", true).order("created_at", { ascending: false })
    ]);

    timesheets = timesheetResult.data || [];
    inspections = inspectionResult.data || [];
    certificates = certificateResult.data || [];
    vacationRequests = vacationResult.data || [];
    accounts = accountResult.data || [];
    announcements = announcementResult.data || [];
    await prepareCertificateUrls();
    await prepareAnnouncementUrls();
    renderTimesheets();
    renderInspections();
    renderCertificates();
    renderVacationRequests();
    renderAnnouncements();
}

async function prepareCertificateUrls() {
    certificateUrls = {};

    for (const certificate of certificates) {
        const { data } = await supabaseClient
            .storage
            .from("certificates")
            .createSignedUrl(certificate.file_path, 3600);

        if (data && data.signedUrl) {
            certificateUrls[certificate.id] = data.signedUrl;
        }
    }
}

function renderTimesheets() {
    const filter = document.getElementById("timesheetWorkerFilter").value.trim().toLowerCase();
    const list = document.getElementById("timesheetsList");
    const filtered = timesheets.filter((week) => !filter || String(week.worker_name || "").includes(filter));

    if (!filtered.length) {
        list.textContent = "No submitted timesheets found.";
        return;
    }

    list.innerHTML = `
        <div class="table-wrap">
            <table>
                <thead>
                    <tr><th>Worker</th><th>Week</th><th>Total Hours</th><th>Submitted</th><th>Note</th></tr>
                </thead>
                <tbody>
                    ${filtered.map((week) => `
                        <tr>
                            <td>${escapeHtml(week.worker_name)}</td>
                            <td>${escapeHtml(week.week_label)}</td>
                            <td>${Number(week.total_hours || 0).toFixed(2)}</td>
                            <td>${escapeHtml(formatDate(week.submitted_at))}</td>
                            <td>${escapeHtml(week.note || "")}</td>
                        </tr>
                    `).join("")}
                </tbody>
            </table>
        </div>
    `;
}

function renderInspections() {
    const workerFilter = document.getElementById("inspectionWorkerFilter").value.trim().toLowerCase();
    const typeFilter = document.getElementById("inspectionTypeFilter").value.trim().toLowerCase();
    const list = document.getElementById("inspectionsList");
    const filtered = inspections.filter((inspection) => {
        const worker = String(inspection.worker_display_name || inspection.worker_name || "").toLowerCase();
        const type = String(inspection.inspection_type || "").toLowerCase();
        return (!workerFilter || worker.includes(workerFilter)) && (!typeFilter || type.includes(typeFilter));
    });

    if (!filtered.length) {
        list.textContent = "No inspection reports found.";
        return;
    }

    list.innerHTML = `
        <div class="table-wrap">
            <table>
                <thead>
                    <tr><th>Date</th><th>Type</th><th>Completed By</th><th>Saved</th></tr>
                </thead>
                <tbody>
                    ${filtered.map((inspection) => `
                        <tr>
                            <td>${escapeHtml(formatDate(inspection.inspection_date))}</td>
                            <td>${escapeHtml(inspection.inspection_type)}</td>
                            <td>${escapeHtml(inspection.worker_display_name || inspection.worker_name)}</td>
                            <td>${escapeHtml(formatDate(inspection.created_at))}</td>
                        </tr>
                    `).join("")}
                </tbody>
            </table>
        </div>
    `;
}

function renderCertificates() {
    const workerFilter = document.getElementById("certificateWorkerFilter").value.trim().toLowerCase();
    const statusFilter = document.getElementById("certificateStatusFilter").value;
    const list = document.getElementById("certificatesList");
    const filtered = certificates.filter((certificate) => {
        const worker = String(certificate.worker_name || "").toLowerCase();
        const status = getCertificateStatus(certificate.expiry_date);
        return (!workerFilter || worker.includes(workerFilter)) && (!statusFilter || status === statusFilter);
    });

    if (!filtered.length) {
        list.textContent = "No certificates found.";
        return;
    }

    list.innerHTML = `
        <div class="table-wrap">
            <table>
                <thead>
                    <tr><th>Worker</th><th>Certificate</th><th>Expiry</th><th>Status</th><th>File</th></tr>
                </thead>
                <tbody>
                    ${filtered.map((certificate) => `
                        <tr>
                            <td>${escapeHtml(certificate.worker_name)}</td>
                            <td>${escapeHtml(certificate.certificate_name)}</td>
                            <td>${certificate.expiry_date ? escapeHtml(certificate.expiry_date) : "-"}</td>
                            <td>${escapeHtml(getCertificateStatus(certificate.expiry_date))}</td>
                            <td>${certificateUrls[certificate.id] ? '<a class="file-link" href="' + certificateUrls[certificate.id] + '" target="_blank" rel="noopener">Open</a>' : "Refresh needed"}</td>
                        </tr>
                    `).join("")}
                </tbody>
            </table>
        </div>
    `;
}

function formatVacationStatus(status) {
    const value = String(status || "pending");
    return value.charAt(0).toUpperCase() + value.slice(1);
}

function makeVacationDate(value) {
    return value ? new Date(value + "T00:00:00") : null;
}

function dateIsInsideRequest(request, date) {
    const start = makeVacationDate(request.start_date);
    const end = makeVacationDate(request.end_date);

    return start && end && start.getTime() <= date.getTime() && date.getTime() <= end.getTime();
}

function formatVacationMonthTitle(date) {
    return date.toLocaleDateString("en-CA", { month: "long", year: "numeric" });
}

function changeVacationCalendarMonth(offset) {
    vacationCalendarMonth = new Date(vacationCalendarMonth.getFullYear(), vacationCalendarMonth.getMonth() + offset, 1);
    renderVacationCalendar();
}

function renderVacationCalendar() {
    const calendar = document.getElementById("adminVacationCalendar");
    const title = document.getElementById("adminVacationCalendarTitle");

    if (!calendar || !title) {
        return;
    }

    const year = vacationCalendarMonth.getFullYear();
    const month = vacationCalendarMonth.getMonth();
    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    let html = dayNames.map((day) => `<div class="calendar-head">${day}</div>`).join("");

    title.textContent = formatVacationMonthTitle(firstDay);

    for (let i = 0; i < firstDay.getDay(); i++) {
        html += '<div class="calendar-day"></div>';
    }

    for (let day = 1; day <= lastDay.getDate(); day++) {
        const date = new Date(year, month, day);
        const matches = vacationRequests
            .filter((request) => dateIsInsideRequest(request, date))
            .sort((a, b) => String(a.worker_display_name || a.worker_name || "").localeCompare(String(b.worker_display_name || b.worker_name || "")));
        const pastClass = date < today ? "past" : "";
        const requestHtml = matches.slice(0, 4).map((request) => `
            <div class="calendar-request ${escapeHtml(request.status || "pending")}">
                ${escapeHtml(request.worker_display_name || request.worker_name)}
            </div>
        `).join("");
        const moreHtml = matches.length > 4 ? `<div class="small">+${matches.length - 4} more</div>` : "";

        html += `
            <div class="calendar-day ${pastClass}">
                <div class="day-number">${day}</div>
                ${requestHtml}
                ${moreHtml}
            </div>
        `;
    }

    calendar.innerHTML = html;
}

function renderVacationRequests() {
    const workerFilter = document.getElementById("vacationWorkerFilter").value.trim().toLowerCase();
    const statusFilter = document.getElementById("vacationStatusFilter").value;
    const list = document.getElementById("vacationList");
    const filtered = vacationRequests.filter((request) => {
        const worker = String(request.worker_display_name || request.worker_name || "").toLowerCase();
        const status = String(request.status || "pending");
        return (!workerFilter || worker.includes(workerFilter)) && (!statusFilter || status === statusFilter);
    });

    if (!filtered.length) {
        renderVacationCalendar();
        list.textContent = "No vacation requests found.";
        return;
    }

    renderVacationCalendar();

    list.innerHTML = `
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Worker</th>
                        <th>Dates</th>
                        <th>Days</th>
                        <th>Type</th>
                        <th>Status</th>
                        <th>Notes</th>
                        <th>Admin Note</th>
                        <th>Actions</th>
                        <th>Delete</th>
                    </tr>
                </thead>
                <tbody>
                    ${filtered.map((request) => `
                        <tr>
                            <td>${escapeHtml(request.worker_display_name || request.worker_name)}</td>
                            <td>
                                ${escapeHtml(request.start_date)} to ${escapeHtml(request.end_date)}
                                ${request.return_date ? '<br>Return: ' + escapeHtml(request.return_date) : ""}
                            </td>
                            <td>${Number(request.total_days || 0).toFixed(1)}</td>
                            <td>${escapeHtml(request.request_type)}</td>
                            <td><b>${escapeHtml(formatVacationStatus(request.status))}</b></td>
                            <td>${escapeHtml(request.reason || "")}</td>
                            <td>
                                <textarea id="vacationNote-${request.id}" rows="3" placeholder="Optional note">${escapeHtml(request.admin_note || "")}</textarea>
                                ${request.reviewed_by ? '<div class="small">Reviewed by ' + escapeHtml(request.reviewed_by) + ' on ' + escapeHtml(formatDate(request.reviewed_at)) + '</div>' : ""}
                            </td>
                            <td>
                                <div class="actions">
                                    <button type="button" onclick="reviewVacationRequest('${escapeHtml(request.id)}', 'approved')">Approve</button>
                                    <button type="button" class="secondary" onclick="reviewVacationRequest('${escapeHtml(request.id)}', 'denied')">Deny</button>
                                </div>
                            </td>
                            <td><button type="button" class="delete-button" onclick="deleteVacationRequest('${escapeHtml(request.id)}')">Delete</button></td>
                        </tr>
                    `).join("")}
                </tbody>
            </table>
        </div>
    `;
}

function makeSafeFileName(name) {
    return String(name || "announcement.pdf")
        .trim()
        .replace(/[^a-z0-9.\-_]+/gi, "-")
        .replace(/-+/g, "-")
        .toLowerCase();
}

function setAnnouncementStatus(message) {
    document.getElementById("announcementStatus").textContent = message || "";
}

function getApprovedEmails() {
    return accounts
        .filter((account) => account.account_status === "approved" && account.email)
        .map((account) => account.email);
}

async function prepareAnnouncementUrls() {
    announcementUrls = {};

    for (const announcement of announcements) {
        if (!announcement.file_path) {
            continue;
        }

        const { data } = await supabaseClient
            .storage
            .from("announcements")
            .createSignedUrl(announcement.file_path, 604800);

        if (data && data.signedUrl) {
            announcementUrls[announcement.id] = data.signedUrl;
        }
    }
}

function renderAnnouncements() {
    const list = document.getElementById("announcementsList");

    if (!announcements.length) {
        list.textContent = "No active announcements yet.";
        return;
    }

    list.innerHTML = `
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Message</th>
                        <th>PDF</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    ${announcements.map((announcement) => `
                        <tr>
                            <td>${escapeHtml(announcement.title)}</td>
                            <td>${escapeHtml(announcement.body || "")}</td>
                            <td>${announcementUrls[announcement.id] ? '<a class="file-link" href="' + announcementUrls[announcement.id] + '" target="_blank" rel="noopener">Open PDF</a>' : "-"}</td>
                            <td>${escapeHtml(formatDate(announcement.created_at))}</td>
                            <td><button type="button" class="delete-button" onclick="deleteAnnouncement('${escapeHtml(announcement.id)}')">Delete</button></td>
                        </tr>
                    `).join("")}
                </tbody>
            </table>
        </div>
    `;
}

async function loadAnnouncements() {
    const { data, error } = await supabaseClient
        .from("announcements")
        .select("*")
        .eq("is_active", true)
        .order("created_at", { ascending: false });

    if (error) {
        document.getElementById("announcementsList").textContent = "Announcements could not be loaded.";
        return;
    }

    announcements = data || [];
    await prepareAnnouncementUrls();
    renderAnnouncements();
}

async function publishAnnouncement() {
    const title = document.getElementById("announcementTitle").value.trim();
    const body = document.getElementById("announcementBody").value.trim();
    const expiresValue = document.getElementById("announcementExpires").value;
    const fileInput = document.getElementById("announcementFile");
    const file = fileInput.files[0];

    if (!title || (!body && !file)) {
        alert("Add a title and either a message or a PDF.");
        return;
    }

    if (file && file.type !== "application/pdf") {
        alert("Please upload a PDF file.");
        return;
    }

    setAnnouncementStatus("Publishing announcement...");

    let filePath = null;
    let fileName = null;
    let fileType = null;
    let signedUrl = "";

    if (file) {
        filePath = "announcements/" + Date.now() + "-" + makeSafeFileName(file.name);
        fileName = file.name;
        fileType = file.type || "application/pdf";

        const { error: uploadError } = await supabaseClient
            .storage
            .from("announcements")
            .upload(filePath, file, {
                cacheControl: "3600",
                upsert: false,
                contentType: fileType
            });

        if (uploadError) {
            setAnnouncementStatus("PDF upload failed.");
            return;
        }

        const { data: signedData } = await supabaseClient
            .storage
            .from("announcements")
            .createSignedUrl(filePath, 604800);

        signedUrl = signedData && signedData.signedUrl ? signedData.signedUrl : "";
    }

    const record = {
        title,
        body,
        file_path: filePath,
        file_name: fileName,
        file_type: fileType,
        created_by: currentUserId || null,
        created_by_name: currentWorkerDisplay,
        expires_at: expiresValue ? expiresValue + "T23:59:59" : null,
        is_active: true
    };

    const { data, error } = await supabaseClient
        .from("announcements")
        .insert(record)
        .select()
        .single();

    if (error) {
        if (filePath) {
            await supabaseClient.storage.from("announcements").remove([filePath]);
        }
        setAnnouncementStatus("Announcement could not be saved.");
        return;
    }

    setAnnouncementStatus("Sending email notification...");

    try {
        await emailAnnouncement(data, signedUrl);
        setAnnouncementStatus("Announcement published and email notifications sent.");
    } catch (error) {
        setAnnouncementStatus("Announcement published, but email notification could not be sent.");
    }

    document.getElementById("announcementTitle").value = "";
    document.getElementById("announcementBody").value = "";
    document.getElementById("announcementExpires").value = "";
    fileInput.value = "";
    await loadAnnouncements();
}

async function emailAnnouncement(announcement, pdfUrl) {
    const recipients = getApprovedEmails();

    if (!recipients.length) {
        return;
    }

    const body = [
        "JGC Announcement",
        "",
        announcement.title,
        "",
        announcement.body || "",
        "",
        pdfUrl ? "PDF: " + pdfUrl : ""
    ].join("\n");

    await fetch(ANNOUNCEMENT_EMAIL_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
            "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify({
            to: recipients.join(","),
            recipients,
            subject: "JGC Announcement - " + announcement.title,
            body,
            text: body,
            pdfUrl,
            pdfFileName: announcement.file_name || ""
        })
    });
}

async function deleteAnnouncement(id) {
    const announcement = announcements.find((item) => item.id === id);

    if (!announcement) {
        alert("Announcement could not be found.");
        return;
    }

    if (!confirm("Delete this announcement?")) {
        return;
    }

    const { error } = await supabaseClient
        .from("announcements")
        .update({ is_active: false })
        .eq("id", id);

    if (error) {
        alert("Announcement could not be deleted.");
        return;
    }

    await loadAnnouncements();
}

async function reviewVacationRequest(id, status) {
    const request = vacationRequests.find((item) => item.id === id);

    if (!request) {
        alert("This vacation request could not be found.");
        return;
    }

    const confirmed = confirm((status === "approved" ? "Approve" : "Deny") + " this vacation request?");

    if (!confirmed) {
        return;
    }

    const noteField = document.getElementById("vacationNote-" + id);
    const adminNote = noteField ? noteField.value.trim() : "";
    const { data, error } = await supabaseClient
        .from("vacation_requests")
        .update({
            status,
            admin_note: adminNote,
            reviewed_by: currentWorkerDisplay,
            reviewed_at: new Date().toISOString(),
            updated_at: new Date().toISOString()
        })
        .eq("id", id)
        .select()
        .single();

    if (error) {
        alert("This vacation request could not be updated. " + (error.message || ""));
        return;
    }

    vacationRequests = vacationRequests.map((item) => item.id === id ? data : item);
    renderVacationCalendar();
    renderVacationRequests();
}

async function deleteVacationRequest(id) {
    const request = vacationRequests.find((item) => item.id === id);

    if (!request) {
        alert("This vacation request could not be found.");
        return;
    }

    const confirmed = confirm("Delete this vacation request for " + (request.worker_display_name || request.worker_name) + "?");

    if (!confirmed) {
        return;
    }

    const { error } = await supabaseClient
        .from("vacation_requests")
        .delete()
        .eq("id", id);

    if (error) {
        alert("This vacation request could not be deleted. " + (error.message || ""));
        return;
    }

    vacationRequests = vacationRequests.filter((item) => item.id !== id);
    renderVacationCalendar();
    renderVacationRequests();
}

async function signOut() {
    await signOutJgc(supabaseClient);
}

loadAdminData();
</script>
