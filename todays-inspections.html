<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today's Inspections</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #8f9691;
    margin: 0;
    padding: 20px;
    color: #1f2a24;
}

.logo-wrap {
    max-width: 347px;
    margin: 0 auto 8px;
    text-align: center;
}

.logo-wrap img {
    width: 100%;
    max-width: 347px;
    height: auto;
    display: block;
    margin: 0 auto;
}

.user-bar {
    max-width: 1200px;
    margin: 0 auto 12px;
    color: #ffffff;
    text-align: center;
    font-size: 13px;
    font-weight: bold;
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
}

.container {
    max-width: 1200px;
    margin: auto;
    background: #fbfcf9;
    padding: 20px;
    border-radius: 8px;
    border-top: 4px solid #3f7d4d;
    box-shadow: 0 3px 10px rgba(0,0,0,.18);
}

h1 {
    margin: 0 0 6px;
    text-align: center;
    color: #2f6f3c;
}

.subtitle {
    text-align: center;
    font-weight: bold;
    margin-bottom: 18px;
}

.table-wrap {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    min-width: 760px;
    border-collapse: collapse;
    background: white;
}

th,
td {
    border: 1px solid #c6cec5;
    padding: 8px;
    text-align: left;
    vertical-align: top;
}

th {
    background: #e6ece6;
}

.empty {
    padding: 18px;
    background: white;
    border: 1px solid #c6cec5;
    text-align: center;
}

.actions {
    margin-top: 20px;
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

button {
    background: #0b5e3b;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 15px;
}

button:hover {
    background: #08452b;
}

.secondary {
    background: #47534b;
}

.secondary:hover {
    background: #354039;
}

.delete-button {
    background: #b42318;
}

.delete-button:hover {
    background: #8f1d14;
}

.download-button {
    background: #2f6f3c;
}

.download-button:hover {
    background: #245832;
}

.email-button {
    background: #0b5e3b;
}

.email-button:hover {
    background: #08452b;
}

.edit-button {
    background: #2f6f3c;
}

.edit-button:hover {
    background: #245832;
}

.edit-panel {
    margin-top: 18px;
    padding: 14px;
    background: #ffffff;
    border: 1px solid #c6cec5;
    border-radius: 6px;
}

.edit-panel[hidden] {
    display: none;
}

.edit-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.edit-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.edit-field label {
    font-weight: bold;
}

.edit-field input,
.edit-field select,
.edit-field textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 8px;
    border: 1px solid #bcc7bc;
    border-radius: 4px;
    font-size: 14px;
}

.edit-field input:disabled {
    background: #eef2ee;
    color: #58635c;
}

.edit-rows {
    margin-top: 12px;
}

.edit-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 8px;
    padding: 8px 0;
    border-top: 1px solid #e0e5df;
}

@media (max-width: 768px) {
    body {
        padding: 12px;
    }

    .container {
        padding: 14px;
    }

    table {
        font-size: 13px;
    }

    .actions button {
        width: 100%;
    }

    .edit-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>
<div class="logo-wrap">
    <img src="logo.png" alt="John Gordon Construction logo">
</div>

<div class="user-bar" id="userBar"></div>

<div class="container">
    <h1>Today's Inspections</h1>
    <div class="subtitle">Completed inspections from the last 24 hours</div>

    <div id="inspectionList" class="empty">Loading inspections...</div>
    <div id="editPanel" class="edit-panel" hidden></div>

    <div class="actions">
        <button class="secondary" onclick="window.location.href='inspections.html'">Inspections</button>
        <button class="secondary" onclick="window.location.href='previous-inspections.html'">Previous Inspections</button>
        <button class="secondary" onclick="window.location.href='home.html'">Home</button>
        <button class="secondary" onclick="signOut()">Sign Out</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="inspection-records.js?v=3"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script>
const worker = getCurrentWorker();
let inspectionRecords = [];

if (!worker.key) {
    window.location.href = "index.html";
}

document.getElementById("userBar").textContent = worker.display ? "Signed in as: " + worker.display : "";

function formatDate(value) {
    if (!value) {
        return "";
    }

    const date = new Date(value);
    if (Number.isNaN(date.getTime())) {
        return value;
    }

    return date.toLocaleDateString();
}

function escapeHtml(value) {
    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function buildDetails(record) {
    const fields = record.form_data && Array.isArray(record.form_data.fields)
        ? record.form_data.fields
        : [];

    return fields
        .filter((field) => field.value)
        .slice(0, 5)
        .map((field) => `${escapeHtml(field.label)}: ${escapeHtml(field.value)}`)
        .join("<br>");
}

async function loadInspections() {
    const list = document.getElementById("inspectionList");
    const twentyFourHoursAgo = new Date(Date.now() - 24 * 60 * 60 * 1000);

    if (!inspectionSupabaseClient) {
        list.className = "empty";
        list.textContent = "Supabase is not available right now.";
        return;
    }

    const { data, error } = await inspectionSupabaseClient
        .from("inspection_records")
        .select("*")
        .gte("created_at", twentyFourHoursAgo.toISOString())
        .order("created_at", { ascending: false });

    if (error) {
        list.className = "empty";
        list.textContent = "Could not load previous inspections.";
        return;
    }

    if (!data || data.length === 0) {
        list.className = "empty";
        list.textContent = "No inspections have been saved in the last 24 hours.";
        return;
    }

    inspectionRecords = data;
    list.className = "table-wrap";
    list.innerHTML = `
        <table>
            <thead>
                <tr>
                    <th>Saved</th>
                    <th>Inspection Date</th>
                    <th>Inspection</th>
                    <th>Completed By</th>
                    <th>Details</th>
                    <th>Edit</th>
                    <th>PDF</th>
                    <th>Email</th>
                    <th>Delete</th>
                </tr>
            </thead>
            <tbody>
                ${data.map((record) => `
                    <tr>
                        <td>${escapeHtml(formatDate(record.created_at))}</td>
                        <td>${escapeHtml(formatDate(record.inspection_date))}</td>
                        <td>${escapeHtml(record.inspection_type)}</td>
                        <td>${escapeHtml(record.worker_display_name || record.worker_name)}</td>
                        <td>${buildDetails(record)}</td>
                        <td><button class="edit-button" onclick="editInspection('${escapeHtml(record.id)}')">Edit</button></td>
                        <td><button class="download-button" onclick="downloadInspectionPdf('${escapeHtml(record.id)}')">Save PDF</button></td>
                        <td><button class="email-button" onclick="emailSavedInspection('${escapeHtml(record.id)}')">Email</button></td>
                        <td><button class="delete-button" onclick="deleteInspection('${escapeHtml(record.id)}')">Delete</button></td>
                    </tr>
                `).join("")}
            </tbody>
        </table>
    `;
}

function buildEmailBodyFromRecord(record) {
    const fields = record.form_data && Array.isArray(record.form_data.fields)
        ? record.form_data.fields
        : [];
    const rows = record.form_data && Array.isArray(record.form_data.rows)
        ? record.form_data.rows
        : [];
    const lines = [
        record.inspection_type || "Inspection",
        `Completed by: ${record.worker_display_name || record.worker_name || ""}`,
        ""
    ];

    fields.forEach((field) => {
        if (field.value) {
            lines.push(`${field.label}: ${field.value}`);
        }
    });

    if (rows.length) {
        lines.push("", "Inspection Details:");
        rows.forEach((row) => {
            lines.push((row.cells || []).filter(Boolean).join(" | "));
        });
    }

    return lines.join("\n");
}

function getRecordFields(record) {
    return record.form_data && Array.isArray(record.form_data.fields)
        ? record.form_data.fields
        : [];
}

function getRecordRows(record) {
    return record.form_data && Array.isArray(record.form_data.rows)
        ? record.form_data.rows
        : [];
}

function getInspectionKey(record) {
    return String(record.inspection_type || "").toLowerCase();
}

function getFirstFilledCell(cells, indexes) {
    const index = indexes.find((cellIndex) => String(cells[cellIndex] || "").trim());
    return index === undefined ? "" : cells[index];
}

function buildEditSelect(label, rowIndex, cellIndexes, value, options) {
    return `
        <div class="edit-field">
            <label>${escapeHtml(label)}</label>
            <select data-result-row="${rowIndex}" data-result-cells="${cellIndexes.join(",")}">
                <option value=""></option>
                ${options.map((option) => `
                    <option value="${escapeHtml(option)}" ${value === option ? "selected" : ""}>${escapeHtml(option)}</option>
                `).join("")}
            </select>
        </div>
    `;
}

function buildEditInput(label, rowIndex, cellIndex, value) {
    return `
        <div class="edit-field">
            <label>${escapeHtml(label)}</label>
            <input data-row-index="${rowIndex}" data-cell-index="${cellIndex}" type="text" value="${escapeHtml(value)}">
        </div>
    `;
}

function buildEditableRowsHtml(record, rows) {
    const type = getInspectionKey(record);
    const editableRows = [];

    rows.forEach((row, rowIndex) => {
        const cells = row.cells || [];

        if (type === "jsa" && cells.slice(0, 3).some((cell) => String(cell || "").trim())) {
            editableRows.push(`
                <div class="edit-row">
                    ${buildEditInput("Sequence of Basic Job Steps", rowIndex, 0, cells[0] || "")}
                    ${buildEditInput("Potential Hazards", rowIndex, 1, cells[1] || "")}
                    ${buildEditInput("Required Action or Procedure", rowIndex, 2, cells[2] || "")}
                </div>
            `);
        }

        if (type === "aerial lifts" && /^\d+$/.test(String(cells[0] || "").trim())) {
            editableRows.push(`
                <div class="edit-row">
                    <div class="edit-field">
                        <label>Inspection Item</label>
                        <input type="text" value="${escapeHtml(cells[1] || "")}" disabled>
                    </div>
                    ${buildEditSelect("P/F/N/A", rowIndex, [2, 3, 4], getFirstFilledCell(cells, [2, 3, 4]), ["P", "F", "N/A"])}
                </div>
            `);
        }

        if (type === "harness" && /Webbing|Stitching|Buckles|Attachment|Label|Cuts|Punctures|Abrasions|Burns|Discolour|Incomplete|Pulled|Distorted|Deformation|Cracks|Corrosion|Function|Excess Wear|Illegible|Missing/i.test(cells.join(" "))) {
            editableRows.push(`
                <div class="edit-row">
                    <div class="edit-field">
                        <label>Component / Defect</label>
                        <input type="text" value="${escapeHtml([cells[0], cells[1]].filter(Boolean).join(" - "))}" disabled>
                    </div>
                    ${buildEditInput("Current Condition", rowIndex, 2, cells[2] || "")}
                    ${buildEditSelect("Pass / Fail", rowIndex, [3], cells[3] || "", ["PASS", "FAIL", "NA"])}
                </div>
            `);
        }

        if (type === "fork lift") {
            const controls = [];
            if (/^\d+\./.test(String(cells[0] || "").trim())) {
                controls.push(`
                    <div class="edit-field">
                        <label>Visual Item</label>
                        <input type="text" value="${escapeHtml(cells[0] || "")}" disabled>
                    </div>
                    ${buildEditSelect("Visual Result", rowIndex, [1, 2, 3], getFirstFilledCell(cells, [1, 2, 3]), ["SAT", "UNS", "N/A"])}
                `);
            }

            if (/^\d+\./.test(String(cells[4] || "").trim())) {
                controls.push(`
                    <div class="edit-field">
                        <label>Operational Item</label>
                        <input type="text" value="${escapeHtml(cells[4] || "")}" disabled>
                    </div>
                    ${buildEditSelect("Operational Result", rowIndex, [5, 6, 7], getFirstFilledCell(cells, [5, 6, 7]), ["SAT", "UNS", "N/A"])}
                `);
            }

            if (controls.length) {
                editableRows.push(`<div class="edit-row">${controls.join("")}</div>`);
            }
        }
    });

    if (!editableRows.length) {
        return "";
    }

    return `
        <div class="edit-rows">
            <h3>Inspection Answers</h3>
            ${editableRows.join("")}
        </div>
    `;
}

function editInspection(id) {
    const record = inspectionRecords.find((item) => item.id === id);
    const panel = document.getElementById("editPanel");

    if (!record) {
        alert("This inspection could not be found.");
        return;
    }

    const fields = getRecordFields(record);
    const rows = getRecordRows(record);
    const editableRowsHtml = buildEditableRowsHtml(record, rows);

    panel.hidden = false;
    panel.innerHTML = `
        <h2>Edit Inspection</h2>
        <div class="edit-grid">
            <div class="edit-field">
                <label>Inspection Date</label>
                <input id="editInspectionDate" type="date" value="${escapeHtml(record.inspection_date || "")}">
            </div>
            <div class="edit-field">
                <label>Completed By</label>
                <input id="editCompletedBy" type="text" value="${escapeHtml(record.worker_display_name || record.worker_name || "")}">
            </div>
            ${fields.map((field, index) => `
                <div class="edit-field">
                    <label>${escapeHtml(field.label)}</label>
                    <input data-field-index="${index}" type="text" value="${escapeHtml(field.value)}">
                </div>
            `).join("")}
        </div>
        ${editableRowsHtml}
        <div class="actions">
            <button onclick="saveInspectionEdit('${escapeHtml(record.id)}')">Save Changes</button>
            <button class="secondary" onclick="cancelInspectionEdit()">Cancel</button>
        </div>
    `;

    panel.scrollIntoView({ behavior: "smooth", block: "start" });
}

function cancelInspectionEdit() {
    const panel = document.getElementById("editPanel");
    panel.hidden = true;
    panel.innerHTML = "";
}

async function saveInspectionEdit(id) {
    const record = inspectionRecords.find((item) => item.id === id);

    if (!record) {
        alert("This inspection could not be found.");
        return;
    }

    const fields = getRecordFields(record).map((field) => ({ ...field }));
    const rows = getRecordRows(record).map((row) => ({
        ...row,
        cells: Array.isArray(row.cells) ? [...row.cells] : []
    }));

    document.querySelectorAll("[data-field-index]").forEach((input) => {
        fields[Number(input.dataset.fieldIndex)].value = input.value;
    });

    document.querySelectorAll("[data-row-index][data-cell-index]").forEach((input) => {
        const rowIndex = Number(input.dataset.rowIndex);
        const cellIndex = Number(input.dataset.cellIndex);
        rows[rowIndex].cells[cellIndex] = input.value;
    });

    document.querySelectorAll("[data-result-row][data-result-cells]").forEach((input) => {
        const rowIndex = Number(input.dataset.resultRow);
        const cellIndexes = input.dataset.resultCells.split(",").map(Number);
        cellIndexes.forEach((cellIndex) => {
            rows[rowIndex].cells[cellIndex] = "";
        });

        if (cellIndexes.length) {
            rows[rowIndex].cells[cellIndexes[0]] = input.value;
        }
    });

    const updatedRecord = {
        ...record,
        inspection_date: document.getElementById("editInspectionDate").value || record.inspection_date,
        worker_display_name: document.getElementById("editCompletedBy").value || record.worker_display_name,
        form_data: {
            ...(record.form_data || {}),
            fields,
            rows
        }
    };
    updatedRecord.email_body = buildEmailBodyFromRecord(updatedRecord);

    const { error } = await inspectionSupabaseClient
        .from("inspection_records")
        .update({
            inspection_date: updatedRecord.inspection_date,
            worker_display_name: updatedRecord.worker_display_name,
            form_data: updatedRecord.form_data,
            email_body: updatedRecord.email_body,
            title: `${updatedRecord.inspection_type} - ${updatedRecord.inspection_date}`
        })
        .eq("id", id);

    if (error) {
        alert("This inspection could not be updated.");
        return;
    }

    cancelInspectionEdit();
    await loadInspections();
}

function addPdfLine(doc, text, x, y, maxWidth) {
    const lines = doc.splitTextToSize(String(text || ""), maxWidth);
    const pageHeight = doc.internal.pageSize.getHeight();

    lines.forEach((line) => {
        if (y > pageHeight - 18) {
            doc.addPage();
            y = 18;
        }

        doc.text(line, x, y);
        y += 6;
    });

    return y;
}

function safeFileName(value) {
    return String(value || "inspection")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "");
}

function findFieldValue(record, labelPattern) {
    const fields = record.form_data && Array.isArray(record.form_data.fields)
        ? record.form_data.fields
        : [];
    const field = fields.find((item) => labelPattern.test(item.label || ""));
    return field ? field.value : "";
}

function findCheckedLabels(record, labels) {
    const fields = record.form_data && Array.isArray(record.form_data.fields)
        ? record.form_data.fields
        : [];

    return labels.map((label) => {
        const field = fields.find((item) => (item.label || "").toLowerCase().includes(label.toLowerCase()));
        return {
            label,
            checked: field ? field.value === "Yes" : false
        };
    });
}

function drawBoxText(doc, text, x, y, width, height, options = {}) {
    if (options.fill) {
        doc.setFillColor(options.fill[0], options.fill[1], options.fill[2]);
        doc.rect(x, y, width, height, "F");
    }

    doc.rect(x, y, width, height);
    doc.setFont("helvetica", options.bold ? "bold" : "normal");
    doc.setFontSize(options.fontSize || 8);

    const lines = doc.splitTextToSize(String(text || ""), width - 4);
    doc.text(lines.slice(0, options.maxLines || 3), x + 2, y + 5);
}

function getJsaRows(record) {
    const rows = record.form_data && Array.isArray(record.form_data.rows)
        ? record.form_data.rows
        : [];

    return rows
        .map((row) => row.cells || [])
        .filter((cells) => cells.slice(0, 3).some((cell) => String(cell || "").trim()))
        .map((cells) => ({
            step: cells[0] || "",
            hazard: cells[1] || "",
            action: cells[2] || ""
        }));
}

function downloadJsaPdf(record) {
    const doc = new window.jspdf.jsPDF({ unit: "mm", format: "letter", orientation: "landscape" });
    const pageWidth = doc.internal.pageSize.getWidth();
    const margin = 10;
    let y = 10;

    const contractor = findFieldValue(record, /^Contractor$/i) || "John Gordon Construction";
    const project = findFieldValue(record, /Project/i);
    const location = findFieldValue(record, /Location/i);
    const date = findFieldValue(record, /^Date$/i) || record.inspection_date || "";
    const supervisor = findFieldValue(record, /Contractor Supervisor/i);
    const reviewedBy = findFieldValue(record, /Reviewed By/i);
    const page = findFieldValue(record, /^Page$/i);
    const of = findFieldValue(record, /^Of$/i);
    const crew = findFieldValue(record, /Crew Sign Off/i);
    const checklist = findCheckedLabels(record, [
        "Lockout / Tag Out",
        "Hot Work",
        "Confined Space",
        "Elevated Work",
        "Excavation",
        "Crane / Hoisting / Rigging",
        "Other"
    ]);
    const jsaRows = getJsaRows(record);

    doc.setLineWidth(0.2);
    doc.setDrawColor(40, 40, 40);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(15);
    doc.text("John Gordon Construction- Job Safety Analysis Form", pageWidth / 2, y, { align: "center" });
    y += 6;
    doc.setFontSize(11);
    doc.text("Must be filled out Daily", pageWidth / 2, y, { align: "center" });
    y += 7;

    const usable = pageWidth - margin * 2;
    const topW = usable / 4;
    drawBoxText(doc, `Contractor:\n${contractor}`, margin, y, topW, 16, { bold: true });
    drawBoxText(doc, `Project/Job:\n${project}`, margin + topW, y, topW, 16, { bold: true });
    drawBoxText(doc, `Location:\n${location}`, margin + topW * 2, y, topW, 16, { bold: true });
    drawBoxText(doc, `Date:\n${date}`, margin + topW * 3, y, topW, 16, { bold: true });
    y += 16;

    const checklistText = checklist.map((item) => `${item.checked ? "[X]" : "[ ]"} ${item.label}`).join("   ");
    drawBoxText(doc, checklistText, margin, y, topW * 2, 22, { fontSize: 7 });
    drawBoxText(doc, `Contractor Supervisor:\n${supervisor}`, margin + topW * 2, y, topW, 22, { bold: true });
    drawBoxText(doc, `Reviewed By:\n${reviewedBy}\nPage: ${page || ""} of ${of || ""}`, margin + topW * 3, y, topW, 22, { bold: true });
    y += 22;

    drawBoxText(doc, `Crew Sign Off: All Individuals- Print and sign\n${crew}`, margin, y, usable, 18, { bold: true });
    y += 18;

    const col1 = 78;
    const col2 = 88;
    const col3 = usable - col1 - col2;
    const headerFill = [230, 236, 230];
    drawBoxText(doc, "Sequence of Basic Job Steps", margin, y, col1, 12, { bold: true, fill: headerFill });
    drawBoxText(doc, "Potential Hazards", margin + col1, y, col2, 12, { bold: true, fill: headerFill });
    drawBoxText(doc, "Required Action or Procedure", margin + col1 + col2, y, col3, 12, { bold: true, fill: headerFill });
    y += 12;

    const rowsToDraw = jsaRows.length ? jsaRows : Array.from({ length: 7 }, () => ({ step: "", hazard: "", action: "" }));

    rowsToDraw.forEach((row) => {
        if (y > 185) {
            doc.addPage();
            y = 12;
            drawBoxText(doc, "Sequence of Basic Job Steps", margin, y, col1, 12, { bold: true, fill: headerFill });
            drawBoxText(doc, "Potential Hazards", margin + col1, y, col2, 12, { bold: true, fill: headerFill });
            drawBoxText(doc, "Required Action or Procedure", margin + col1 + col2, y, col3, 12, { bold: true, fill: headerFill });
            y += 12;
        }

        const stepLines = doc.splitTextToSize(row.step, col1 - 4).length;
        const hazardLines = doc.splitTextToSize(row.hazard, col2 - 4).length;
        const actionLines = doc.splitTextToSize(row.action, col3 - 4).length;
        const rowHeight = Math.max(16, Math.min(34, Math.max(stepLines, hazardLines, actionLines) * 5 + 6));

        drawBoxText(doc, row.step, margin, y, col1, rowHeight, { fontSize: 8, maxLines: 5 });

function getAerialInspectionRows(record) {
    const rows = record.form_data && Array.isArray(record.form_data.rows)
        ? record.form_data.rows
        : [];

    return rows
        .map((row) => row.cells || [])
        .filter((cells) => /^\d+$/.test(String(cells[0] || "").trim()))
        .map((cells) => ({
            number: cells[0] || "",
            item: cells[1] || "",
            result: cells.slice(2).find((cell) => String(cell || "").trim()) || ""
        }));
}

function getSafetyRows(record) {
    const rows = record.form_data && Array.isArray(record.form_data.rows)
        ? record.form_data.rows
        : [];

    return rows
        .map((row) => row.cells || [])
        .filter((cells) => cells.length === 2 && cells[0] && !/Safety Item|Confirmed/i.test(cells[0]))
        .map((cells) => ({
            item: cells[0] || "",
            checked: /checked|yes/i.test(String(cells[1] || ""))
        }));
}

function fieldIsChecked(record, text) {
    const fields = record.form_data && Array.isArray(record.form_data.fields)
        ? record.form_data.fields
        : [];
    const needle = text.toLowerCase();
    const field = fields.find((item) => String(item.label || "").toLowerCase().includes(needle));
    return field ? field.value === "Yes" || field.value === "Selected" : false;
}

function getExactField(record, labelText) {
    const fields = record.form_data && Array.isArray(record.form_data.fields)
        ? record.form_data.fields
        : [];
    const needle = labelText.toLowerCase().trim();
    return fields.find((item) => String(item.label || "").toLowerCase().trim() === needle);
}

function hotWorkCheck(record, labelText) {
    const field = getExactField(record, labelText);
    return field ? field.value === "Yes" : false;
}

function hotWorkRadio(record, labelText, expectedValue) {
    const field = getExactField(record, labelText);
    return field ? String(field.value || "").toLowerCase() === expectedValue.toLowerCase() : false;
}

function getHarnessRows(record) {

        .map((row) => row.cells || [])
        .filter((cells) => {

            return second && !/Possible Defect|Serial Number|Date of Inspection/i.test(first + " " + second);

            defect: cells[1] || "",
            condition: cells[2] || "",
            result: cells[3] || ""
        }));
}

function getForkliftRows(record) {
    const rows = record.form_data && Array.isArray(record.form_data.rows)
        ? record.form_data.rows
        : [];
    const visual = [];
    const operational = [];

    rows.forEach((row) => {
        const cells = row.cells || [];
        const left = String(cells[0] || "").trim();
        const right = String(cells[4] || "").trim();

        if (/^\d+\./.test(left)) {
            visual.push({
                item: left,
                result: cells.slice(1, 4).find((cell) => String(cell || "").trim()) || ""
            });
        }

        if (/^\d+\./.test(right)) {
            operational.push({
                item: right,
                result: cells.slice(5, 8).find((cell) => String(cell || "").trim()) || ""
            });
        }
    });

    return { visual, operational };
}

    const pageWidth = doc.internal.pageSize.getWidth();
    const usable = pageWidth - margin * 2;
    let y = 10;
    const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
    const fields = record.form_data && Array.isArray(record.form_data.fields) ? record.form_data.fields : [];
    const rows = getTelehandlerRows(record);
    const fieldValue = (label) => {
        const field = fields.find((item) => String(item.label || "").toLowerCase() === label.toLowerCase());
        return field ? field.value || "" : "";
    };

    doc.setFont("helvetica", "bold");
    doc.setFontSize(17);
    doc.text("TELEHANDLER INSPECTION AND DAILY CHECKLIST", pageWidth / 2, y, { align: "center" });
    y += 8;
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8);
    doc.text("All checks must be carried out in line with Manufacturer's Operators Manual.", pageWidth / 2, y, { align: "center" });
    y += 7;

    const leftW = 78;
    const tableX = margin + leftW + 6;
    const dayW = (usable - leftW - 6) / 7;
    ["Make and Model", "Plant or Serial No.", "Machine Hours", "Week Commencing", "Site Location"].forEach((label) => {
        drawBoxText(doc, label, margin, y, 36, 9, { bold: true, fontSize: 7 });
        drawBoxText(doc, fieldValue(label), margin + 36, y, leftW - 36, 9, { fontSize: 7 });
        y += 9;
    });

    let tableY = 25;
    days.forEach((day, index) => {
        drawBoxText(doc, day, tableX + dayW * index, tableY, dayW, 8, { bold: true, fontSize: 7 });
    });
    tableY += 8;

    const rowH = 6.4;
    rows.forEach((row, rowIndex) => {
        const rowY = tableY + rowH * rowIndex;
        drawBoxText(doc, row.item, margin, rowY, leftW, rowH, { fontSize: 7, maxLines: 1 });

        row.days.forEach((value, dayIndex) => {
            const x = tableX + dayW * dayIndex;
            drawBoxText(doc, value === "Defective" ? "X" : "", x, rowY, dayW / 2, rowH, { fontSize: 7 });
            drawBoxText(doc, value === "Okay" ? "X" : "", x + dayW / 2, rowY, dayW / 2, rowH, { fontSize: 7 });
        });
    });

    const bottomY = tableY + rowH * rows.length + 8;
    drawBoxText(doc, `Operator Name:\n${fieldValue("Operator Name")}`, margin, bottomY, leftW, 13, { fontSize: 8 });
    drawBoxText(doc, `Signature:\n${fieldValue("Signature")}`, margin, bottomY + 13, leftW, 13, { fontSize: 8 });
    drawBoxText(doc, `Comments:\n${fieldValue("Comments")}`, tableX, bottomY, usable - leftW - 6, 26, { fontSize: 8, maxLines: 3 });
    doc.save(`tele-handler-${record.inspection_date || "inspection"}.pdf`);
}

function downloadInspectionPdf(id) {
    const record = inspectionRecords.find((item) => item.id === id);

    if (!record) {
        alert("This inspection could not be found.");
        return;
    }

    if (!window.jspdf || !window.jspdf.jsPDF) {
        alert("PDF download is not available right now.");
        return;
    }

    if ((record.inspection_type || "").toLowerCase() === "jsa") {
        downloadJsaPdf(record);
        return;
    }

    if ((record.inspection_type || "").toLowerCase() === "aerial lifts") {
        downloadAerialLiftPdf(record);
        return;
    }

    if ((record.inspection_type || "").toLowerCase() === "hot work permit") {
        downloadHotWorkPermitPdf(record);
        return;
    }

    if ((record.inspection_type || "").toLowerCase() === "harness") {
        downloadHarnessPdf(record);
        return;
    }

    if ((record.inspection_type || "").toLowerCase() === "fork lift") {
        downloadForkliftPdf(record);
        return;
    }

    if ((record.inspection_type || "").toLowerCase() === "tele handler") {
        downloadTeleHandlerPdf(record);
        return;
    }

    const doc = new window.jspdf.jsPDF({ unit: "mm", format: "letter" });
    const pageWidth = doc.internal.pageSize.getWidth();
    const margin = 14;
    const maxWidth = pageWidth - margin * 2;
    const fields = record.form_data && Array.isArray(record.form_data.fields)
        ? record.form_data.fields
        : [];
    const rows = record.form_data && Array.isArray(record.form_data.rows)
        ? record.form_data.rows
        : [];
    let y = 16;

    doc.setFont("helvetica", "bold");
    doc.setFontSize(16);
    y = addPdfLine(doc, "John Gordon Construction", margin, y, maxWidth);
    y = addPdfLine(doc, record.inspection_type || "Inspection", margin, y + 2, maxWidth);

    doc.setFont("helvetica", "normal");
    doc.setFontSize(11);
    y = addPdfLine(doc, `Saved: ${formatDate(record.created_at)}`, margin, y + 4, maxWidth);
    y = addPdfLine(doc, `Inspection Date: ${formatDate(record.inspection_date)}`, margin, y, maxWidth);
    y = addPdfLine(doc, `Completed By: ${record.worker_display_name || record.worker_name || ""}`, margin, y, maxWidth);

    if (fields.length) {
        doc.setFont("helvetica", "bold");
        y = addPdfLine(doc, "Form Details", margin, y + 6, maxWidth);
        doc.setFont("helvetica", "normal");

        fields.forEach((field) => {
            if (field.value) {
                y = addPdfLine(doc, `${field.label}: ${field.value}`, margin, y, maxWidth);
            }
        });
    }

    if (rows.length) {
        doc.setFont("helvetica", "bold");
        y = addPdfLine(doc, "Inspection Items", margin, y + 6, maxWidth);
        doc.setFont("helvetica", "normal");

        rows.forEach((row) => {
            const text = row.cells.filter(Boolean).join(" | ");
            if (text) {
                y = addPdfLine(doc, text, margin, y, maxWidth);
            }
        });
    }

    const filename = `${safeFileName(record.inspection_type)}-${record.inspection_date || "inspection"}.pdf`;
    doc.save(filename);
}

function emailSavedInspection(id) {
    const record = inspectionRecords.find((item) => item.id === id);
    emailInspectionRecord(record);
}

async function deleteInspection(id) {
    if (!confirm("Delete this inspection?")) {
        return;
    }

    const { error } = await inspectionSupabaseClient
        .from("inspection_records")
        .delete()
        .eq("id", id);

    if (error) {
        alert("This inspection could not be deleted.");
        return;
    }

    loadInspections();
}

function signOut() {
    localStorage.removeItem("currentWorker");
    localStorage.removeItem("currentWorkerDisplay");
    window.location.href = "index.html";
}

loadInspections();
