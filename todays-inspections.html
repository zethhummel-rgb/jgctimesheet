<script>
const worker = getCurrentWorker();
let inspectionRecords = [];
let safetyAcknowledgementRows = [];
const queryParams = new URLSearchParams(window.location.search);
const pageMode = queryParams.get("recordType") || queryParams.get("type") || "";
const isPermitsView = String(pageMode).toLowerCase() === "permits";
const isReportsView = String(pageMode).toLowerCase() === "reports";
const isVehicleView = String(pageMode).toLowerCase() === "vehicle";

function getTodayDateValue() {
    const now = new Date();
    return now.getFullYear() + "-" +
        String(now.getMonth() + 1).padStart(2, "0") + "-" +
        String(now.getDate()).padStart(2, "0");
}

function isPermitInspectionType(type) {
    return String(type || "").toLowerCase().includes("permit");
}

function isReportInspectionType(type) {
    const value = String(type || "").toLowerCase();
    return value === "jsa" || value.includes("daily site report") || value.includes("toolbox") || value.includes("incident") || value.includes("accident");
}

function filterInspectionRows(records) {
    if (isPermitsView) {
      return (records || []).filter((record) => isPermitInspectionType(record.inspection_type));
    }

    if (isReportsView) {
      return (records || []).filter((record) => isReportInspectionType(record.inspection_type));
    }

    return records || [];
}

function applyInspectionPageCopy() {
  const title = document.querySelector("h1");
  const subtitle = document.querySelector(".subtitle");
  const homeButton = document.getElementById("inspectionsHomeButton");
  const previousButton = document.getElementById("previousInspectionsButton");

  if (!isPermitsView && !isReportsView && !isVehicleView) {
    return;
  }

  if (isVehicleView) {
    if (title) {
      title.textContent = "Vehicle Inspections";
    }
    if (subtitle) {
      subtitle.textContent = "Vehicle and trailer inspections dated today";
    }
    if (homeButton) {
      homeButton.textContent = "Inspections";
      homeButton.setAttribute("onclick", "window.location.href='inspections.html'");
    }
    if (previousButton) {
      previousButton.textContent = "Previous Inspections";
      previousButton.setAttribute("onclick", "window.location.href='previous-inspections.html'");
    }
    return;
  }

  if (isReportsView) {
    if (title) {
      title.textContent = "Today's Reports";
    }
    if (subtitle) {
      subtitle.textContent = "Reports dated today";
    }
    if (homeButton) {
      homeButton.textContent = "Reports";
      homeButton.setAttribute("onclick", "window.location.href='reports.html'");
    }
    if (previousButton) {
      previousButton.textContent = "Previous Reports";
      previousButton.setAttribute("onclick", "window.location.href='previous-inspections.html?recordType=reports'");
    }
    return;
  }

  if (title) {
    title.textContent = "Today's Permits";
  }
  if (subtitle) {
    subtitle.textContent = "Permits dated today";
  }
  if (homeButton) {
    homeButton.textContent = "Permits";
    homeButton.setAttribute("onclick", "window.location.href='permits.html'");
  }
  if (previousButton) {
    previousButton.textContent = "Previous Permits";
    previousButton.setAttribute("onclick", "window.location.href='previous-inspections.html?recordType=permits'");
  }
}

if (!worker.key) {
    window.location.href = "index.html";
}

applyInspectionPageCopy();
document.getElementById("userBar").textContent = worker.display ? "Signed in as: " + worker.display : "";

if (isJgcSubcontractorSession()) {
    const previousButton = document.getElementById("previousInspectionsButton");
    if (previousButton) {
        previousButton.remove();
    }
}

function formatDate(value) {
    if (!value) {
        return "";
    }

    if (/^\d{4}-\d{2}-\d{2}$/.test(String(value))) {
        const [year, month, day] = String(value).split("-").map(Number);
        return new Date(year, month - 1, day).toLocaleDateString();
    }

    const date = new Date(value);
    if (Number.isNaN(date.getTime())) {
        return value;
    }

    return date.toLocaleDateString();
}

function escapeHtml(value) {
    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function getPortalWorkerRecord() {
    if (typeof getCurrentWorkerRecord === "function") {
        const record = getCurrentWorkerRecord();

        return {
            key: record.key || worker.key || "",
            display: record.display || worker.display || record.key || worker.key || "",
            email: record.email || localStorage.getItem("currentUserEmail") || "",
            role: record.role || localStorage.getItem("currentUserRole") || "",
            company: record.company || localStorage.getItem("jgcSubcontractorCompany") || ""
        };
    }

    return {
        key: worker.key || "",
        display: worker.display || worker.key || "",
        email: localStorage.getItem("currentUserEmail") || "",
        role: localStorage.getItem("currentUserRole") || "",
        company: localStorage.getItem("jgcSubcontractorCompany") || ""
    };
}

function normalizeAcknowledgementValue(value) {
    if (typeof normalizeWorkerName === "function") {
        return normalizeWorkerName(value);
    }

    return String(value || "").trim().toLowerCase();
}

function isJsaRecord(record) {
    return String(record && (record.report_type || record.inspection_type) || "").toLowerCase() === "jsa";
}

function isSafetyAckRecord(record) {
    const type = String(record && (record.report_type || record.inspection_type) || "").toLowerCase();
    return type === "jsa" || type === "toolbox talk";
}

function getJsaAcknowledgements(record) {
    if (record && Array.isArray(record.safety_acknowledgements)) {
        return record.safety_acknowledgements;
    }

    const formData = record && record.form_data && typeof record.form_data === "object"
        ? record.form_data
        : {};
    const acknowledgements = Array.isArray(formData.acknowledgements)
        ? formData.acknowledgements
        : [];

    return acknowledgements.filter((ack) =>
        ack && (ack.worker_key || ack.worker_name || ack.worker_display_name || ack.name || ack.email)
    );
}

function getAcknowledgementName(ack) {
    return ack.attendee_name || ack.worker_display_name || ack.worker_name || ack.name || ack.worker_key || ack.email || "Worker";
}

function formatAcknowledgementDate(value) {
    if (!value) {
        return "";
    }

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
        return value;
    }

    return date.toLocaleString([], {
        year: "numeric",
        month: "short",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit"
    });
}

function currentWorkerHasJsaAcknowledgement(record) {
    const current = getPortalWorkerRecord();

    if (typeof safetyAckRowMatchesWorker === "function" && typeof safetyAckIsAcknowledged === "function") {
        return getJsaAcknowledgements(record).some((ack) =>
            safetyAckRowMatchesWorker(ack, current) && safetyAckIsAcknowledged(ack)
        );
    }

    const aliases = [
        current.key,
        current.display,
        current.email
    ].map(normalizeAcknowledgementValue).filter(Boolean);

    return getJsaAcknowledgements(record).some((ack) => {
        const ackAliases = [
            ack.worker_key,
            ack.worker_display_name,
            ack.worker_name,
            ack.name,
            ack.email
        ].map(normalizeAcknowledgementValue).filter(Boolean);

        return ackAliases.some((alias) => aliases.includes(alias));
    });
}

function currentWorkerCanManageSafetyAcknowledgements(record) {
    return currentWorkerCanManageInspection(record);
}

function currentWorkerCanManageInspection(record) {
    const current = getPortalWorkerRecord();

    if (typeof isAdminWorker === "function" && isAdminWorker(current.key, current.role, current.email)) {
        return true;
    }

    const currentAliases = [
        current.key,
        current.display,
        current.email
    ].map(normalizeAcknowledgementValue).filter(Boolean);
    const creatorAliases = [
        record && record.worker_name,
        record && record.worker_display_name,
        record && record.submitted_by_worker,
        record && record.submitted_by_name,
        record && record.submitted_by_email,
        record && record.created_by_name,
        record && record.created_by_email,
        record && record.report_maker_worker,
        record && record.report_maker_display,
        record && record.reported_by_worker,
        record && record.reported_by_name,
        record && record.driver_name
    ].map(normalizeAcknowledgementValue).filter(Boolean);

    return creatorAliases.some((alias) => currentAliases.includes(alias));
}

function renderJsaAcknowledgementSummary(record) {
    if (!isSafetyAckRecord(record)) {
        return "";
    }

    const rows = getJsaAcknowledgements(record);
    const summary = typeof safetyAckSummary === "function"
        ? safetyAckSummary(rows)
        : { total: rows.length, acknowledged: rows.filter((row) => row.acknowledged_at).length, pending: 0, late: 0, unmatched: 0 };

    if (!summary.total) {
        return "<strong>Acknowledgements:</strong> none set";
    }

    return `<strong>Acknowledgements:</strong> ${escapeHtml(String(summary.acknowledged))}/${escapeHtml(String(summary.total))}${summary.pending ? " pending " + escapeHtml(String(summary.pending)) : ""}${summary.late ? " late " + escapeHtml(String(summary.late)) : ""}`;
}

function renderJsaAcknowledgementList(record) {
    const acknowledgements = getJsaAcknowledgements(record);

    if (!acknowledgements.length) {
        return '<div class="small">No one has signed onto this JSA yet.</div>';
    }

    return `
        <ul class="ack-list">
            ${acknowledgements.map((ack) => `
                <li>
                    ${escapeHtml(getAcknowledgementName(ack))}
                    ${ack.attendee_company || ack.company ? " - " + escapeHtml(ack.attendee_company || ack.company) : ""}
                    ${ack.acknowledgement_status ? " - " + escapeHtml(typeof safetyAckStatusLabel === "function" ? safetyAckStatusLabel(ack) : ack.acknowledgement_status) : ""}
                    ${ack.acknowledged_at ? " - " + escapeHtml(formatAcknowledgementDate(ack.acknowledged_at)) : ""}
                </li>
            `).join("")}
        </ul>
    `;
}

function getJsaAcknowledgementLines(record) {
    return getJsaAcknowledgements(record).map((ack) => {
        const parts = [
            getAcknowledgementName(ack),
            ack.attendee_company || ack.company || "",
            typeof safetyAckStatusLabel === "function" ? safetyAckStatusLabel(ack) : ack.acknowledgement_status || "",
            typeof safetyAckMethodLabel === "function" ? safetyAckMethodLabel(ack) : ack.acknowledgement_method || "",
            formatAcknowledgementDate(ack.acknowledged_at)
        ].filter(Boolean);

        return parts.join(" - ");
    });
}

function renderJsaSignOnCell(record) {
    if (!isSafetyAckRecord(record)) {
        return "-";
    }

    return `<button class="sign-on-button jgc-button" type="button" onclick="openJsaSignOn('${escapeHtml(record.id)}')">View</button>`;
}

function renderInspectionViewCell(record) {
    if (isToolboxTalkReportRecord(record)) {
        return `<button class="sign-on-button jgc-button" type="button" onclick="openToolboxReport('${escapeHtml(record.id)}', 'view')">View</button>`;
    }

    if (record.report_source && !record.supports_inspection_actions) {
        return "-";
    }

    if (isSafetyAckRecord(record)) {
        return renderJsaSignOnCell(record);
    }

    return `<button class="sign-on-button jgc-button" type="button" onclick="viewInspection('${escapeHtml(record.id)}')">View</button>`;
}

function isToolboxTalkReportRecord(record) {
    return Boolean(record && record.report_source === "toolbox_talk_reports");
}

function getToolboxReportRecord(id) {
    return inspectionRecords.find((record) => String(record.id) === String(id) && isToolboxTalkReportRecord(record));
}

function getToolboxReportAcknowledgements(id) {
    return safetyAcknowledgementRows.filter((row) => String(row.record_id || "") === String(id || ""));
}

function openToolboxReport(id, mode) {
    if (!window.JGCToolboxReports) {
        alert("The toolbox report viewer is not available. Refresh and try again.");
        return;
    }

    const record = getToolboxReportRecord(id);
    if (mode === "edit" && (!record || !currentWorkerCanManageInspection(record))) {
        alert("Only the creator or an admin can edit this report.");
        return;
    }

    window.JGCToolboxReports.openReport(id, mode, "today");
}

function printToolboxReport(id) {
    if (!window.JGCToolboxReports) return;
    window.JGCToolboxReports.printReport(getToolboxReportRecord(id), getToolboxReportAcknowledgements(id));
}

async function emailToolboxReportFromList(id) {
    if (!window.JGCToolboxReports) return;
    await window.JGCToolboxReports.emailReport(getToolboxReportRecord(id), {
        acknowledgementRows: getToolboxReportAcknowledgements(id)
    });
}

function renderInspectionEditCell(record) {
    if (!currentWorkerCanManageInspection(record)) return "-";
    if (isToolboxTalkReportRecord(record)) {
        return `<button class="edit-button jgc-button" onclick="openToolboxReport('${escapeHtml(record.id)}', 'edit')">Edit</button>`;
    }
    if ((record.report_source && !record.supports_inspection_actions) || isVehicleInspectionRecord(record)) return "-";
    return `<button class="edit-button jgc-button" onclick="editInspection('${escapeHtml(record.id)}')">Edit</button>`;
}

function renderInspectionPdfCell(record) {
    if (isToolboxTalkReportRecord(record)) {
        return `<button class="download-button jgc-button" onclick="printToolboxReport('${escapeHtml(record.id)}')">Save PDF</button>`;
    }
    if (record.report_source && !record.supports_inspection_actions) return "-";
    return `<button class="download-button jgc-button" onclick="downloadInspectionPdf('${escapeHtml(record.id)}')">Save PDF</button>`;
}

function renderInspectionEmailCell(record) {
    if (isToolboxTalkReportRecord(record)) {
        return `<button class="email-button jgc-button" onclick="emailToolboxReportFromList('${escapeHtml(record.id)}')">Email</button>`;
    }
    if ((record.report_source && !record.supports_inspection_actions) || isVehicleInspectionRecord(record)) return "-";
    return `<button class="email-button jgc-button" onclick="emailSavedInspection('${escapeHtml(record.id)}')">Email</button>`;
}

function renderInspectionDeleteCell(record) {
    if (!currentWorkerCanManageInspection(record)) return "-";
    if (isToolboxTalkReportRecord(record)) return "-";
    if ((record.report_source && !record.supports_inspection_actions) || isVehicleInspectionRecord(record)) return "-";
    return `<button class="delete-button jgc-button jgc-button--danger" onclick="deleteInspection('${escapeHtml(record.id)}')">Delete</button>`;
}

function isVehicleInspectionRecord(record) {
    return Boolean(record && record.vehicle_inspection_source);
}

function buildFieldSummaryText(record) {
    const fields = record.form_data && Array.isArray(record.form_data.fields)
        ? record.form_data.fields
        : [];

    return fields
        .filter((field) => field.value)
        .slice(0, 5)
        .map((field) => `${field.label}: ${field.value}`)
        .join(" | ");
}

function buildDetails(record) {
    if (isVehicleInspectionRecord(record)) {
        const lines = [
            record.vehicle_license_plate || record.vehicle_name ? "Vehicle: " + (record.vehicle_license_plate || record.vehicle_name) : "",
            record.trailer_1_license_plate ? "Trailer 1: " + record.trailer_1_license_plate : "",
            record.trailer_2_license_plate ? "Trailer 2: " + record.trailer_2_license_plate : "",
            record.location ? "Location: " + record.location : "",
            record.defects_found ? (record.major_defects_found ? "Major defects found" : "Minor defects found") : "No defects reported"
        ].filter(Boolean).map((line) => escapeHtml(line));
        return lines.join("<br>");
    }

    if (record.report_source) {
        const lines = [
            record.project ? "Project: " + record.project : "",
            record.location ? "Location: " + record.location : "",
            record.summary ? "Summary: " + record.summary : ""
        ]
            .filter(Boolean)
            .map((line) => escapeHtml(line))
            .concat(renderJsaAcknowledgementSummary(record))
            .filter(Boolean);

        return lines.join("<br>");
    }

    const lines = buildFieldSummaryText(record)
        .split(" | ")
        .filter(Boolean)
        .map((line) => escapeHtml(line));

    if (isJsaRecord(record)) {
        lines.push(renderJsaAcknowledgementSummary(record));
    }

    return lines.join("<br>");
}

function normalizeVehicleInspectionRecord(record) {
    return {
        ...record,
        vehicle_inspection_source: true,
        report_type: "Vehicle / Trailer",
        completed_by: record.driver_name || "",
        supports_inspection_actions: false
    };
}

function normalizeReportRecord(source, record) {
    if (source === "jsa") {
        return {
            ...record,
            report_source: "inspection_records",
            report_type: "JSA",
            report_date: record.inspection_date,
            completed_by: record.worker_display_name || record.worker_name || "",
            project: findFieldValue(record, /Project|Job/i),
            location: findFieldValue(record, /Location/i),
            summary: buildFieldSummaryText(record),
            supports_inspection_actions: true
        };
    }

    if (source === "daily") {
        return {
            ...record,
            report_source: "daily_site_reports",
            report_type: "Daily Site Report",
            report_date: record.report_date,
            completed_by: record.worker_display_name || record.worker_name || "",
            project: record.project || "",
            location: record.location || "",
            summary: record.work_completed || record.delays || ""
        };
    }

    if (source === "toolbox") {
        return {
            ...record,
            report_source: "toolbox_talk_reports",
            report_type: "Toolbox Talk",
            report_date: record.report_date,
            completed_by: record.presenter_name || record.worker_display_name || record.worker_name || "",
            project: record.project || "",
            location: record.location || "",
            summary: record.talk_title || record.discussion_notes || "",
            supports_toolbox_actions: true
        };
    }

    if (source === "incident") {
        return {
            ...record,
            report_source: "incident_reports",
            report_type: record.incident_type || "Incident / Near Miss",
            report_date: record.report_date,
            completed_by: record.reported_by_name || record.reported_by_worker || "",
            project: record.project || "",
            location: record.location || "",
            summary: [record.severity, record.description].filter(Boolean).join(" - ")
        };
    }

    if (source === "accident") {
        return {
            ...record,
            report_source: "accident_reports",
            report_type: "Supervisor Accident Report",
            report_date: record.accident_date,
            completed_by: record.report_maker_display || record.report_maker_worker || record.created_by_name || "",
            project: "",
            location: record.site_location || "",
            summary: record.injured_worker_display || record.injured_worker || ""
        };
    }

    return {
        ...record,
        report_source: "employee_injury_reports",
        report_type: "Employee Injury Report",
        report_date: record.accident_date,
        completed_by: record.employee_display || record.employee_name || record.created_by_name || "",
        project: "",
        location: record.accident_location || "",
        summary: record.bodily_injury || record.accident_description || ""
    };
}

async function loadReportRecords(todayDate) {
    const [jsaResult, dailyResult, toolboxResult, incidentResult, accidentResult, injuryResult] = await Promise.all([
        inspectionSupabaseClient
            .from("inspection_records")
            .select("*")
            .eq("inspection_date", todayDate)
            .order("created_at", { ascending: false }),
        inspectionSupabaseClient
            .from("daily_site_reports")
            .select("*")
            .eq("report_date", todayDate)
            .order("created_at", { ascending: false }),
        inspectionSupabaseClient
            .from("toolbox_talk_reports")
            .select("*")
            .eq("is_duplicate", false)
            .eq("report_date", todayDate)
            .order("created_at", { ascending: false }),
        inspectionSupabaseClient
            .from("incident_reports")
            .select("*")
            .eq("report_date", todayDate)
            .order("created_at", { ascending: false }),
        inspectionSupabaseClient
            .from("accident_reports")
            .select("*")
            .eq("accident_date", todayDate)
            .order("created_at", { ascending: false }),
        inspectionSupabaseClient
            .from("employee_injury_reports")
            .select("*")
            .eq("accident_date", todayDate)
            .order("created_at", { ascending: false })
    ]);

    const results = [jsaResult, dailyResult, toolboxResult, incidentResult, accidentResult, injuryResult];
    const firstError = results.find((result) => result.error);

    if (firstError) {
        throw firstError.error;
    }

    const records = []
        .concat((jsaResult.data || []).filter((record) => String(record.inspection_type || "").toLowerCase() === "jsa").map((record) => normalizeReportRecord("jsa", record)))
        .concat((dailyResult.data || []).map((record) => normalizeReportRecord("daily", record)))
        .concat((toolboxResult.data || []).map((record) => normalizeReportRecord("toolbox", record)))
        .concat((incidentResult.data || []).map((record) => normalizeReportRecord("incident", record)))
        .concat((accidentResult.data || []).map((record) => normalizeReportRecord("accident", record)))
        .concat((injuryResult.data || []).map((record) => normalizeReportRecord("injury", record)))
        .sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));

    safetyAcknowledgementRows = [];

    if (typeof safetyAckLoadForRecords === "function") {
        const jsaIds = records
            .filter((record) => String(record.report_type || record.inspection_type || "").toLowerCase() === "jsa")
            .map((record) => record.id);
        const toolboxIds = records
            .filter((record) => String(record.report_type || "").toLowerCase() === "toolbox talk")
            .map((record) => record.id);
        const [jsaAckRows, toolboxAckRows] = await Promise.all([
            safetyAckLoadForRecords(inspectionSupabaseClient, "jsa", jsaIds),
            safetyAckLoadForRecords(inspectionSupabaseClient, "toolbox_talk", toolboxIds)
        ]);

        safetyAcknowledgementRows = jsaAckRows.concat(toolboxAckRows);
        records.forEach((record) => {
            const recordType = String(record.report_type || record.inspection_type || "").toLowerCase() === "toolbox talk"
                ? "toolbox_talk"
                : "jsa";

            if (recordType === "jsa" && String(record.report_type || record.inspection_type || "").toLowerCase() !== "jsa") {
                return;
            }

            record.safety_acknowledgements = safetyAcknowledgementRows.filter((row) =>
                row.record_type === recordType && row.record_id === record.id
            );
        });
    }

    return records;
}

async function loadInspections() {
    const list = document.getElementById("inspectionList");
    const todayDate = getTodayDateValue();

    if (!inspectionSupabaseClient) {
        list.className = "empty jgc-empty-state";
        list.textContent = "Supabase is not available right now.";
        return;
    }

    if (isReportsView) {
        try {
            const reportRecords = await loadReportRecords(todayDate);
            if (!reportRecords.length) {
                list.className = "empty";
                list.textContent = "No reports are dated today.";
                return;
            }
            renderInspectionRows(reportRecords);
        } catch (error) {
            list.className = "empty";
            list.textContent = "Could not load reports.";
        }
        return;
    }

    const [inspectionResult, vehicleInspectionResult] = await Promise.all([
        inspectionSupabaseClient
            .from("inspection_records")
            .select("*")
            .eq("inspection_date", todayDate)
            .order("created_at", { ascending: false }),
        inspectionSupabaseClient
            .from("vehicle_inspection_records")
            .select("*")
            .eq("inspection_date", todayDate)
            .order("created_at", { ascending: false })
    ]);

    if (inspectionResult.error) {
        list.className = "empty";
        list.textContent = "Could not load inspections.";
        return;
    }

    const standardRows = isVehicleView ? [] : filterInspectionRows(inspectionResult.data || []);
    const vehicleRows = (!isPermitsView && !isReportsView)
        ? (vehicleInspectionResult.error ? [] : (vehicleInspectionResult.data || []).map(normalizeVehicleInspectionRecord))
        : [];
    const filteredData = standardRows.concat(vehicleRows)
        .sort((a, b) => String(b.created_at || "").localeCompare(String(a.created_at || "")));

    if (!filteredData.length) {
        list.className = "empty";
        list.textContent = isPermitsView
            ? "No permits are dated today."
            : isReportsView
            ? "No reports are dated today."
            : isVehicleView
            ? "No vehicle inspections are dated today."
            : "No inspections are dated today.";
        return;
    }

    renderInspectionRows(filteredData);
}

function renderInspectionRows(filteredData) {
    const list = document.getElementById("inspectionList");
    inspectionRecords = filteredData;
    list.className = "table-wrap jgc-table-wrap";
    const dateHeading = isReportsView ? "Report Date" : "Inspection Date";
    const typeHeading = isReportsView ? "Report" : "Inspection";
    list.innerHTML = `
        <table class="jgc-table">
            <thead>
                <tr>
                    <th>Saved</th>
                    <th>${dateHeading}</th>
                    <th>${typeHeading}</th>
                    <th>Completed By</th>
                    <th>Details</th>
                    <th>View</th>
                    <th>Edit</th>
                    <th>PDF</th>
                    <th>Email</th>
                    <th>Delete</th>
                </tr>
            </thead>
            <tbody>
                ${filteredData.map((record) => `
                    <tr>
                        <td>${escapeHtml(formatDate(record.created_at))}</td>
                        <td>${escapeHtml(formatDate(record.report_date || record.inspection_date))}</td>
                        <td>${escapeHtml(record.report_type || record.inspection_type)}</td>
                        <td>${escapeHtml(record.completed_by || record.worker_display_name || record.worker_name)}</td>
                        <td>${buildDetails(record)}</td>
                        <td>${renderInspectionViewCell(record)}</td>
                        <td>${renderInspectionEditCell(record)}</td>
                        <td>${renderInspectionPdfCell(record)}</td>
                        <td>${renderInspectionEmailCell(record)}</td>
                        <td>${renderInspectionDeleteCell(record)}</td>
                    </tr>
                `).join("")}
            </tbody>
        </table>
    `;
}

function buildEmailBodyFromRecord(record) {
    const fields = record.form_data && Array.isArray(record.form_data.fields)
        ? record.form_data.fields
        : [];
    const rows = record.form_data && Array.isArray(record.form_data.rows)
        ? record.form_data.rows
        : [];
    const lines = [
        record.inspection_type || "Inspection",
        `Completed by: ${record.worker_display_name || record.worker_name || ""}`,
        ""
    ];

    fields.forEach((field) => {
        if (field.value) {
            lines.push(`${field.label}: ${field.value}`);
        }
    });

    if (rows.length) {
        lines.push("", "Inspection Details:");
        rows.forEach((row) => {
            lines.push((row.cells || []).filter(Boolean).join(" | "));
        });
    }

    const acknowledgementLines = getJsaAcknowledgementLines(record);

    if (acknowledgementLines.length) {
        lines.push("", "JSA Acknowledgements:");
        acknowledgementLines.forEach((line) => lines.push(line));
    }

    return lines.join("\n");
}

function getRecordFields(record) {
    return record.form_data && Array.isArray(record.form_data.fields)
        ? record.form_data.fields
        : [];
}

function getRecordRows(record) {
    return record.form_data && Array.isArray(record.form_data.rows)
        ? record.form_data.rows
        : [];
}

function getInspectionKey(record) {
    return String(record.inspection_type || "").toLowerCase();
}

function getFirstFilledCell(cells, indexes) {
    const index = indexes.find((cellIndex) => String(cells[cellIndex] || "").trim());
    return index === undefined ? "" : cells[index];
}

function buildEditSelect(label, rowIndex, cellIndexes, value, options) {

                    <option value="${escapeHtml(option)}" ${value === option ? "selected" : ""}>${escapeHtml(option)}</option>
                `).join("")}
            </select>

}

function buildEditInput(label, rowIndex, cellIndex, value) {

        <div class="edit-field">
            <label>${escapeHtml(label)}</label>
            <input data-row-index="${rowIndex}" data-cell-index="${cellIndex}" type="text" value="${escapeHtml(value)}">

function buildEditableRowsHtml(record, rows) {
    const type = getInspectionKey(record);
    const editableRows = [];

    rows.forEach((row, rowIndex) => {
        const cells = row.cells || [];

        if (type === "jsa" && cells.slice(0, 3).some((cell) => String(cell || "").trim())) {
            editableRows.push(`
                <div class="edit-row">
                    ${buildEditInput("Sequence of Basic Job Steps", rowIndex, 0, cells[0] || "")}
                    ${buildEditInput("Potential Hazards", rowIndex, 1, cells[1] || "")}
                    ${buildEditInput("Required Action or Procedure", rowIndex, 2, cells[2] || "")}
                </div>
            `);
        }

        if (type === "aerial lifts" && /^\d+$/.test(String(cells[0] || "").trim())) {
            editableRows.push(`
                <div class="edit-row">
                    <div class="edit-field">
                        <label>Inspection Item</label>
                        <input type="text" value="${escapeHtml(cells[1] || "")}" disabled>
                    </div>
                    ${buildEditSelect("P/F/N/A", rowIndex, [2, 3, 4], getFirstFilledCell(cells, [2, 3, 4]), ["P", "F", "N/A"])}
                </div>
            `);
        }

        if (type === "harness" && /Webbing|Stitching|Buckles|Attachment|Label|Cuts|Punctures|Abrasions|Burns|Discolour|Incomplete|Pulled|Distorted|Deformation|Cracks|Corrosion|Function|Excess Wear|Illegible|Missing/i.test(cells.join(" "))) {
            editableRows.push(`
                <div class="edit-row">
                    <div class="edit-field">
                        <label>Component / Defect</label>
                        <input type="text" value="${escapeHtml([cells[0], cells[1]].filter(Boolean).join(" - "))}" disabled>
                    </div>
                    ${buildEditInput("Current Condition", rowIndex, 2, cells[2] || "")}
                    ${buildEditSelect("Pass / Fail", rowIndex, [3], cells[3] || "", ["PASS", "FAIL", "NA"])}
                </div>
            `);
        }

        if (type === "fork lift") {
            const controls = [];
            if (/^\d+\./.test(String(cells[0] || "").trim())) {
                controls.push(`
                    <div class="edit-field">
                        <label>Visual Item</label>
                        <input type="text" value="${escapeHtml(cells[0] || "")}" disabled>
                    </div>
                    ${buildEditSelect("Visual Result", rowIndex, [1, 2, 3], getFirstFilledCell(cells, [1, 2, 3]), ["SAT", "UNS", "N/A"])}
                `);
            }

            if (/^\d+\./.test(String(cells[4] || "").trim())) {
                controls.push(`
                    <div class="edit-field">
                        <label>Operational Item</label>
                        <input type="text" value="${escapeHtml(cells[4] || "")}" disabled>
                    </div>
                    ${buildEditSelect("Operational Result", rowIndex, [5, 6, 7], getFirstFilledCell(cells, [5, 6, 7]), ["SAT", "UNS", "N/A"])}
                `);
            }

            if (controls.length) {
                editableRows.push(`<div class="edit-row">${controls.join("")}</div>`);
            }
        }
    });

    if (!editableRows.length) {
        return "";
    }

    return `
        <div class="edit-rows">
            <h3>Inspection Answers</h3>
            ${editableRows.join("")}
        </div>
    `;
}

function getReadableChecklistRows(record) {
    const rows = getRecordRows(record);
    const readableRows = [];

    rows.forEach((row) => {
        const cells = row.cells || [];
        const first = String(cells[0] || "").trim();

        if (/^\d+$/.test(first) && cells[1]) {
            readableRows.push({
                number: first,
                item: cells[1] || "",
                result: cells.slice(2).find((cell) => String(cell || "").trim()) || ""
            });
            return;
        }

        if (/^\d+\./.test(first)) {
            readableRows.push({
                number: first.replace(/\..*$/, ""),
                item: first,
                result: cells.slice(1, 4).find((cell) => String(cell || "").trim()) || ""
            });

            if (/^\d+\./.test(String(cells[4] || "").trim())) {
                readableRows.push({
                    number: String(cells[4] || "").replace(/\..*$/, ""),
                    item: cells[4] || "",
                    result: cells.slice(5, 8).find((cell) => String(cell || "").trim()) || ""
                });
            }
            return;
        }

        const joined = cells.filter((cell) => String(cell || "").trim()).join(" | ");
        if (joined) {
            readableRows.push({
                number: "",
                item: joined,
                result: ""
            });
        }
    });

    return readableRows;
}

function normalizeInspectionResultLabel(value) {
    const result = String(value || "").trim();

    if (result.toUpperCase() === "NA") {
        return "N/A";
    }

    return result;
}

function getRecordEquipmentLabel(record) {
    const formData = record && record.form_data && typeof record.form_data === "object"
        ? record.form_data
        : {};
    const equipment = formData.equipment && typeof formData.equipment === "object"
        ? formData.equipment
        : {};
    const parts = [
        record.equipment_identification,
        record.equipment_name,
        equipment.identification_number,
        equipment.name
    ].map((value) => String(value || "").trim()).filter(Boolean);

    return [...new Set(parts)].join(" - ");
}

        number: item.code || "",
        item: item.label || "",
        result: item.result || "",
        severity: item.severity || "",
        description: item.description || ""
    })));
}

function getVehicleInspectionSections(record) {
    return record && record.form_data && Array.isArray(record.form_data.sections)
        ? record.form_data.sections
        : [];
}

function normalizeVehicleInspectionResultLabel(value) {
    const result = String(value || "").trim();
    const lower = result.toLowerCase();

    if (lower === "na" || lower === "n/a") {
        return "N/A";
    }

    if (lower === "pass" || lower === "p") {
        return "Pass";
    }

    if (lower === "defect" || lower === "fail" || lower === "failed" || lower === "f") {
        return "Defect";
    }

    return result;
}

function getVehicleInspectionResultClass(value) {
    const result = String(value || "").trim().toLowerCase();

    if (result === "pass" || result === "p") {
        return "pass";
    }

    if (result === "defect" || result === "fail" || result === "failed" || result === "f") {
        return "defect";
    }

    if (result === "na" || result === "n/a") {
        return "na";
    }

    return "";
}

function getVehicleInspectionStatus(record) {
    if (!record) {
        return "";
    }

    if (record.defects_found) {
        return record.major_defects_found ? "Major defects found" : "Minor defects found";
    }

    return "No defects reported";
}

function getVehicleInspectionRepairNotes(record) {
    const formData = record && record.form_data && typeof record.form_data === "object" ? record.form_data : {};

function openJsaSignOn(id) {
    const record = inspectionRecords.find((item) => item.id === id);
    const panel = document.getElementById("editPanel");

    if (!record || !isSafetyAckRecord(record)) {
        alert("This safety acknowledgement record could not be found.");
        return;
    }

    const current = getPortalWorkerRecord();
    const recordLabel = record.report_type || record.inspection_type || "Safety Record";
    const recordType = String(recordLabel).toLowerCase() === "toolbox talk" ? "toolbox_talk" : "jsa";
    const ackRows = getJsaAcknowledgements(record);
    const currentAck = typeof safetyAckRowMatchesWorker === "function"
        ? ackRows.find((ack) => safetyAckRowMatchesWorker(ack, current))
        : null;
    const alreadySigned = currentAck
        ? (typeof safetyAckIsAcknowledged === "function" ? safetyAckIsAcknowledged(currentAck) : Boolean(currentAck.acknowledged_at))
        : currentWorkerHasJsaAcknowledgement(record);
    const canManageAcknowledgements = currentWorkerCanManageSafetyAcknowledgements(record);
    const shouldOfferSelfSignOn = !alreadySigned;
    const token = typeof safetyAckGetRecordToken === "function" ? safetyAckGetRecordToken(ackRows) : "";
    const qrUrl = token && typeof safetyAckQrUrl === "function"
        ? safetyAckQrUrl(recordType, record.id, token)
        : "";
    const summary = typeof safetyAckSummary === "function"
        ? safetyAckSummary(ackRows)
        : { total: ackRows.length, acknowledged: 0, pending: 0, late: 0, unmatched: 0 };

    panel.hidden = false;
    panel.innerHTML = `
        <h2>${escapeHtml(recordLabel)}</h2>
        <div class="jsa-view-context">
            <span><strong>Viewing as:</strong> ${escapeHtml(current.display || current.key)}</span>
            <span><strong>Saved:</strong> ${escapeHtml(formatDate(record.report_date || record.inspection_date))}</span>
        </div>
        <div class="ack-status">
            ${escapeHtml(String(summary.acknowledged))} acknowledged / ${escapeHtml(String(summary.total))} total
            ${summary.pending ? " - " + escapeHtml(String(summary.pending)) + " pending" : ""}
            ${summary.late ? " - " + escapeHtml(String(summary.late)) + " late" : ""}
        </div>
        ${renderSafetyRecordReadOnlyDetails(record)}
        <h3>Current Acknowledgements</h3>
        ${renderSafetyAcknowledgementManager(record)}
        ${alreadySigned ? '<div class="ack-status">You are already signed onto this safety record.</div>' : shouldOfferSelfSignOn ? `
            <div class="ack-status">${currentAck ? "After reviewing this record, choose how you want to acknowledge it." : "You were not on the original crew list. After reviewing this record, add yourself using your account or your signature."}</div>
        ` : '<div class="ack-status">Creator/admin view. Crew can sign on this device below or scan the QR code.</div>'}
        ${qrUrl ? `
            <details class="jsa-qr-details">
                <summary>Show QR Sign-On</summary>
                <div id="safetyAckQrWrap" class="small"></div>
            </details>
        ` : ""}
        <div class="actions">
            ${shouldOfferSelfSignOn ? `
                <button onclick="confirmJsaSignOn('${escapeHtml(record.id)}', 'account')">Acknowledge with Account</button>
                <button class="secondary" onclick="confirmJsaSignOn('${escapeHtml(record.id)}', 'signature')">Sign on This Device</button>
            ` : ""}
            <button class="secondary" onclick="cancelInspectionEdit()">Close</button>
        </div>
        <div id="jsaSignOnStatus" class="ack-status"></div>
    `;

    if (qrUrl && typeof safetyAckRenderQr === "function") {
        safetyAckRenderQr(document.getElementById("safetyAckQrWrap"), qrUrl);
    }

    panel.scrollIntoView({ behavior: "smooth", block: "start" });
}

function renderSafetyAcknowledgementManager(record) {
    const rows = getJsaAcknowledgements(record);
    const canManage = currentWorkerCanManageSafetyAcknowledgements(record);

    if (!rows.length) {
        return '<div class="small">No attendees were entered for this record yet. Late acknowledgements can still be added.</div>';
    }

    return `
        <div class="table-wrap">
            <table>
                <thead>
                    <tr><th>Name</th><th>Company</th><th>Status</th><th>Method</th><th>Time</th><th>Signature</th>${canManage ? "<th>Action</th>" : ""}</tr>
                </thead>
                <tbody>
                    ${rows.map((row) => {
                        const acknowledged = typeof safetyAckIsAcknowledged === "function" ? safetyAckIsAcknowledged(row) : Boolean(row.acknowledged_at);
                        return `
                            <tr>
                                <td>${escapeHtml(row.attendee_name || getAcknowledgementName(row))}</td>
                                <td>${escapeHtml(row.attendee_company || row.company || "")}</td>
                                <td>${escapeHtml(typeof safetyAckStatusLabel === "function" ? safetyAckStatusLabel(row) : row.acknowledgement_status || "Pending")}</td>
                                <td>${escapeHtml(typeof safetyAckMethodLabel === "function" ? safetyAckMethodLabel(row) : row.acknowledgement_method || "-")}</td>
                                <td>${escapeHtml(formatAcknowledgementDate(row.acknowledged_at))}</td>
                                <td>${typeof safetyAckSignatureSvg === "function" ? safetyAckSignatureSvg(row) : ""}</td>
                                ${canManage ? `<td>${acknowledged ? "-" : `<button type="button" class="secondary" onclick="signSafetyAckOnDevice('${escapeHtml(row.id)}', '${escapeHtml(record.id)}')">Sign on this device</button>`}</td>` : ""}
                            </tr>
                        `;
                    }).join("")}
                </tbody>
            </table>
        </div>
    `;
}

async function signSafetyAckOnDevice(ackId, recordId) {
    const record = inspectionRecords.find((item) => item.id === recordId);

    if (!record || !currentWorkerCanManageSafetyAcknowledgements(record)) {
        alert("Only the creator or an admin can open the shared-device signature list.");
        return;
    }

    const rows = getJsaAcknowledgements(record);
    const row = rows.find((item) => String(item.id) === String(ackId));
    const token = typeof safetyAckGetRecordToken === "function" ? safetyAckGetRecordToken(rows) : "";
    const recordType = String(record.report_type || record.inspection_type || "").toLowerCase() === "toolbox talk"
        ? "toolbox_talk"
        : "jsa";

    if (!row || !token || typeof safetyAckOpenSignature !== "function") {
        alert("This attendee could not be opened for signing.");
        return;
    }

    const result = await safetyAckOpenSignature(inspectionSupabaseClient, {
        recordType,
        recordId,
        recordLabel: record.report_type || record.inspection_type || "Safety Record",
        qrToken: token,
        acknowledgementId: row.id,
        attendeeName: row.attendee_name || getAcknowledgementName(row),
        company: row.attendee_company || row.company || "",
        email: row.matched_employee_email || row.email || "",
        source: "shared_device"
    });

    if (!result.ok) {
        if (!result.cancelled) alert(result.message || "Signature could not be saved.");
        return;
    }

    await loadInspections();
    openJsaSignOn(recordId);
}

async function confirmJsaSignOn(id, mode) {
    const status = document.getElementById("jsaSignOnStatus");
    const current = getPortalWorkerRecord();
    const record = inspectionRecords.find((item) => item.id === id);

    if (!current.key || !record) {
        window.location.href = "index.html";
        return;
    }

    if (status) {
        status.textContent = "Saving acknowledgement...";
    }

    const recordType = String(record.report_type || record.inspection_type || "").toLowerCase() === "toolbox talk"
        ? "toolbox_talk"
        : "jsa";
    if (typeof safetyAckSubmitCurrentUser !== "function") {
        alert("The acknowledgement service is not available. Refresh the page and try again.");
        return;
    }

    let result;
    if (mode === "signature") {
        if (typeof safetyAckOpenSignature !== "function") {
            alert("The signature pad is not available. Refresh the page and try again.");
            return;
        }

        result = await safetyAckOpenSignature(inspectionSupabaseClient, {
            recordType,
            recordId: record.id,
            recordLabel: record.report_type || record.inspection_type || "Safety Record",
            attendeeName: current.display || current.key,
            submitHandler: (signature) => safetyAckSubmitCurrentUser(inspectionSupabaseClient, {
                recordType,
                recordId: record.id,
                mode: "signature",
                signature
            })
        });
    } else {
        result = await safetyAckSubmitCurrentUser(inspectionSupabaseClient, {
            recordType,
            recordId: record.id,
            mode: "account"
        });
    }

    if (!result.ok) {
        if (result.cancelled) {
            if (status) status.textContent = "";
            return;
        }
        if (status) {
            status.textContent = result.message || "";
        }
        alert(result.message || "Acknowledgement could not be saved.");
        return;
    }

    if (typeof recordJgcSubcontractorActivity === "function") {
        recordJgcSubcontractorActivity(recordType === "toolbox_talk" ? "toolbox_talk_acknowledgement" : "jsa_acknowledgement");
    }

    if (status) {
        status.textContent = result.message || "Acknowledgement saved.";
    }

    await loadInspections();
    openJsaSignOn(id);
}

async function saveInspectionEdit(id) {
    const record = inspectionRecords.find((item) => item.id === id);

    if (!record) {
        alert("This inspection could not be found.");
        return;
    }

    if (!currentWorkerCanManageInspection(record)) {
        alert("Only the creator or an admin can save changes to this inspection.");
        return;
    }

    const fields = getRecordFields(record).map((field) => ({ ...field }));
    const rows = getRecordRows(record).map((row) => ({
        ...row,
        cells: Array.isArray(row.cells) ? [...row.cells] : []
    }));

    document.querySelectorAll("[data-field-index]").forEach((input) => {
        fields[Number(input.dataset.fieldIndex)].value = input.value;
    });

    document.querySelectorAll("[data-row-index][data-cell-index]").forEach((input) => {
        const rowIndex = Number(input.dataset.rowIndex);
        const cellIndex = Number(input.dataset.cellIndex);
        rows[rowIndex].cells[cellIndex] = input.value;
    });

    document.querySelectorAll("[data-result-row][data-result-cells]").forEach((input) => {
        const rowIndex = Number(input.dataset.resultRow);
        const cellIndexes = input.dataset.resultCells.split(",").map(Number);
        cellIndexes.forEach((cellIndex) => {
            rows[rowIndex].cells[cellIndex] = "";
        });

        if (cellIndexes.length) {
            rows[rowIndex].cells[cellIndexes[0]] = input.value;
        }
    });

    const updatedRecord = {
        ...record,
        inspection_date: document.getElementById("editInspectionDate").value || record.inspection_date,
        worker_display_name: document.getElementById("editCompletedBy").value || record.worker_display_name,
        form_data: {
            ...(record.form_data || {}),
            fields,
            rows
        }
    };
    updatedRecord.email_body = buildEmailBodyFromRecord(updatedRecord);

    const { error } = await inspectionSupabaseClient
        .from("inspection_records")
        .update({
            inspection_date: updatedRecord.inspection_date,
            worker_display_name: updatedRecord.worker_display_name,
            form_data: updatedRecord.form_data,
            email_body: updatedRecord.email_body,
            title: `${updatedRecord.inspection_type} - ${updatedRecord.inspection_date}`
        })
        .eq("id", id);

    if (error) {
        alert("This inspection could not be updated.");
        return;
    }

    cancelInspectionEdit();
    await loadInspections();
}

function addPdfLine(doc, text, x, y, maxWidth) {
    const lines = doc.splitTextToSize(String(text || ""), maxWidth);
    const pageHeight = doc.internal.pageSize.getHeight();

    lines.forEach((line) => {
        if (y > pageHeight - 18) {
            doc.addPage();
            y = 18;
        }

        doc.text(line, x, y);
        y += 6;
    });

    return y;
}

function safeFileName(value) {
    return String(value || "inspection")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "");
}

function findFieldValue(record, labelPattern) {
    const fields = record.form_data && Array.isArray(record.form_data.fields)
        ? record.form_data.fields
        : [];
    const field = fields.find((item) => labelPattern.test(item.label || ""));
    return field ? field.value : "";
}

function findCheckedLabels(record, labels) {
    const fields = record.form_data && Array.isArray(record.form_data.fields)
        ? record.form_data.fields
        : [];

    return labels.map((label) => {
        const field = fields.find((item) => (item.label || "").toLowerCase().includes(label.toLowerCase()));
        return {
            label,
            checked: field ? field.value === "Yes" : false
        };
    });
}

function drawBoxText(doc, text, x, y, width, height, options = {}) {
    if (options.fill) {
        doc.setFillColor(options.fill[0], options.fill[1], options.fill[2]);
        doc.rect(x, y, width, height, "F");
    }

    doc.rect(x, y, width, height);
    doc.setFont("helvetica", options.bold ? "bold" : "normal");
    doc.setFontSize(options.fontSize || 8);

    const lines = doc.splitTextToSize(String(text || ""), width - 4);
    doc.text(lines.slice(0, options.maxLines || 3), x + 2, y + 5);
}

function getJsaRows(record) {
    const rows = record.form_data && Array.isArray(record.form_data.rows)
        ? record.form_data.rows
        : [];

    return rows
        .map((row) => row.cells || [])
        .filter((cells) => cells.slice(0, 3).some((cell) => String(cell || "").trim()))
        .map((cells) => ({
            step: cells[0] || "",
            hazard: cells[1] || "",
            action: cells[2] || ""
        }));
}

function drawJsaAcknowledgementHeader(doc, margin, y, usable) {
    const headerFill = [230, 236, 230];
    drawBoxText(doc, "Digital JSA Acknowledgements", margin, y, usable, 9, { bold: true, fill: headerFill, maxLines: 1 });
    y += 9;
    drawBoxText(doc, "Name", margin, y, usable * 0.25, 8, { bold: true, fill: headerFill, maxLines: 1 });
    drawBoxText(doc, "Company", margin + usable * 0.25, y, usable * 0.17, 8, { bold: true, fill: headerFill, maxLines: 1 });
    drawBoxText(doc, "Acknowledged", margin + usable * 0.42, y, usable * 0.16, 8, { bold: true, fill: headerFill, maxLines: 1 });
    drawBoxText(doc, "Signature", margin + usable * 0.58, y, usable * 0.28, 8, { bold: true, fill: headerFill, maxLines: 1 });
    drawBoxText(doc, "Email", margin + usable * 0.86, y, usable * 0.14, 8, { bold: true, fill: headerFill, maxLines: 1 });
    return y + 8;
}

function drawJsaSignature(doc, acknowledgement, x, y, width, height) {
    const strokes = typeof safetyAckSignatureStrokes === "function" ? safetyAckSignatureStrokes(acknowledgement) : [];

    if (!strokes.length) return;

    doc.setDrawColor(20, 20, 20);
    doc.setLineWidth(0.35);
    strokes.forEach((stroke) => {
        for (let index = 1; index < stroke.length; index += 1) {
            const from = stroke[index - 1];
            const to = stroke[index];
            doc.line(
                x + 1 + from[0] * (width - 2),
                y + 1 + from[1] * (height - 4),
                x + 1 + to[0] * (width - 2),
                y + 1 + to[1] * (height - 4)
            );
        }
    });
}

function drawJsaAcknowledgements(doc, record, margin, y, usable) {
    const acknowledgements = getJsaAcknowledgements(record);

    if (!acknowledgements.length) {
        return y;
    }

    if (y > 172) {
        doc.addPage();
        y = 12;
    } else {
        y += 5;
    }

    y = drawJsaAcknowledgementHeader(doc, margin, y, usable);

    acknowledgements.forEach((ack) => {
        if (y > 185) {
            doc.addPage();
            y = 12;
            y = drawJsaAcknowledgementHeader(doc, margin, y, usable);
        }

        const name = getAcknowledgementName(ack);
        const company = ack.attendee_company || ack.company || "";
        const date = formatAcknowledgementDate(ack.acknowledged_at);
        const email = ack.matched_employee_email || ack.email || "";
        const rowHeight = 14;
        const signatureX = margin + usable * 0.58;
        const signatureWidth = usable * 0.28;

        drawBoxText(doc, name, margin, y, usable * 0.25, rowHeight, { fontSize: 7, maxLines: 2 });
        drawBoxText(doc, company, margin + usable * 0.25, y, usable * 0.17, rowHeight, { fontSize: 7, maxLines: 2 });
        drawBoxText(doc, date, margin + usable * 0.42, y, usable * 0.16, rowHeight, { fontSize: 6, maxLines: 2 });
        drawBoxText(doc, "", signatureX, y, signatureWidth, rowHeight, { fontSize: 6, maxLines: 1 });
        drawJsaSignature(doc, ack, signatureX, y, signatureWidth, rowHeight);
        drawBoxText(doc, email, margin + usable * 0.86, y, usable * 0.14, rowHeight, { fontSize: 6, maxLines: 2 });
        y += rowHeight;
    });

    return y;
}

function downloadJsaPdf(record) {
    window.JgcJsaPdf.download(record, { acknowledgements: getJsaAcknowledgements(record) });
}

function getAerialInspectionRows(record) {
    const rows = record.form_data && Array.isArray(record.form_data.rows)
        ? record.form_data.rows
        : [];

    return rows
        .map((row) => row.cells || [])
        .filter((cells) => /^\d+$/.test(String(cells[0] || "").trim()))
        .map((cells) => ({
            number: cells[0] || "",
            item: cells[1] || "",
            result: cells.slice(2).find((cell) => String(cell || "").trim()) || ""
        }));
}

function getSafetyRows(record) {
    const rows = record.form_data && Array.isArray(record.form_data.rows)
        ? record.form_data.rows
        : [];

    return rows
        .map((row) => row.cells || [])
        .filter((cells) => cells.length === 2 && cells[0] && !/Safety Item|Confirmed/i.test(cells[0]))
        .map((cells) => ({
            item: cells[0] || "",
            checked: /checked|yes/i.test(String(cells[1] || ""))
        }));
}

function drawAerialRow(doc, number, item, result, x, y, widths, height) {
    drawBoxText(doc, number, x, y, widths[0], height, { fontSize: 7, maxLines: 2 });
    drawBoxText(doc, item, x + widths[0], y, widths[1], height, { fontSize: 7, maxLines: 4 });
    drawBoxText(doc, result, x + widths[0] + widths[1], y, widths[2], height, { fontSize: 7, maxLines: 2 });
}

function downloadAerialLiftPdf(record) {
    const doc = new window.jspdf.jsPDF({ unit: "mm", format: "letter" });
    const margin = 10;
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const usable = pageWidth - margin * 2;
    let y = 10;

    const operator = findFieldValue(record, /Operator Name/i);
    const liftId = findFieldValue(record, /Lift ID/i);
    const date = findFieldValue(record, /^Date$/i) || record.inspection_date || "";

    doc.setFontSize(13);
    drawBoxText(doc, "AERIAL LIFT PRE-USE INSPECTION CHECKLIST", margin, y, usable, 12, { bold: true, fontSize: 12, fill: [230, 236, 230], maxLines: 1 });

    drawBoxText(doc, `Operator Print Name:\n${operator}`, margin, y, usable / 3, 16, { bold: true });

    drawBoxText(doc, `Unit Type: Scissor Lift / Articulating Boom / Man Lift / Other:\n${unitType}`, margin, y, usable * 2 / 3, 16, { bold: true });

    drawAerialRow(doc, "#", "Inspection Item and Description", "P/F/NA", margin, y, widths, 10);
    y += 10;

    inspectionRows.forEach((row) => {
        if (y > pageHeight - 42) {
            doc.addPage();
            y = 10;
            drawAerialRow(doc, "#", "Inspection Item and Description", "P/F/NA", margin, y, widths, 10);
            y += 10;
        }

        const lineCount = doc.splitTextToSize(row.item, widths[1] - 4).length;
        const rowHeight = Math.max(9, Math.min(20, lineCount * 4 + 5));
        drawAerialRow(doc, row.number, row.item, row.result, margin, y, widths, rowHeight);

    });

    if (y > pageHeight - 70) {
        doc.addPage();
        y = 10;
    } else {
        y += 4;
    }

    const safetyWidths = [usable - 32, 32];
    drawBoxText(doc, "Safety Precautions (Have, Look For, or be Aware of)", margin, y, safetyWidths[0], 10, { bold: true, fill: [230, 236, 230] });
    drawBoxText(doc, "Check to Confirm", margin + safetyWidths[0], y, safetyWidths[1], 10, { bold: true, fill: [230, 236, 230] });

    safetyRows.forEach((row) => {

            doc.addPage();
            y = 10;
        }

        const lineCount = doc.splitTextToSize(row.item, safetyWidths[0] - 4).length;
        const rowHeight = Math.max(9, Math.min(20, lineCount * 4 + 5));
        drawBoxText(doc, row.item, margin, y, safetyWidths[0], rowHeight, { fontSize: 7, maxLines: 4 });
        drawBoxText(doc, row.checked ? "X" : "", margin + safetyWidths[0], y, safetyWidths[1], rowHeight, { fontSize: 9, maxLines: 1 });
        y += rowHeight;
    });

    const warning = "If the Aerial lift fails any part of this inspection, remove the key and report the problem to your supervisor. Do not operate. If anything has been jerry-rigged, notify your supervisor at once.";
    drawBoxText(doc, warning, margin, y + 2, usable, 18, { bold: true, fontSize: 7, maxLines: 3 });
    doc.save(`aerial-lifts-${record.inspection_date || "inspection"}.pdf`);

function fieldIsChecked(record, text) {
    const fields = record.form_data && Array.isArray(record.form_data.fields)
        ? record.form_data.fields
        : [];
    const needle = text.toLowerCase();
    const field = fields.find((item) => String(item.label || "").toLowerCase().includes(needle));
    return field ? field.value === "Yes" || field.value === "Selected" : false;
}

function getExactField(record, labelText) {
    const fields = record.form_data && Array.isArray(record.form_data.fields)
        ? record.form_data.fields
        : [];
    const needle = labelText.toLowerCase().trim();
    return fields.find((item) => String(item.label || "").toLowerCase().trim() === needle);
}

function hotWorkCheck(record, labelText) {
    const field = getExactField(record, labelText);
    return field ? field.value === "Yes" : false;
}

function hotWorkRadio(record, labelText, expectedValue) {
    const field = getExactField(record, labelText);
    return field ? String(field.value || "").toLowerCase() === expectedValue.toLowerCase() : false;
}

function drawPermitCheckRow(doc, item, checked, x, y, width) {
    doc.rect(x, y + 1.5, 3.5, 3.5);
    if (checked) {
        doc.setFont("helvetica", "bold");
        doc.text("X", x + 0.7, y + 4.5);
    }

    doc.setFont("helvetica", "normal");
    doc.setFontSize(7);
    return addPdfLine(doc, item, x + 5.5, y + 4.5, width - 5.5);
}

function drawPermitSection(doc, title, items, record, x, y, width) {
    doc.setFont("helvetica", "bold");
    doc.setFontSize(8);
    y = addPdfLine(doc, title, x, y, width);

    items.forEach((item) => {
        y = drawPermitCheckRow(doc, item, hotWorkCheck(record, item), x, y, width);
    });

    return y + 1;
}

function getHarnessRows(record) {
    const rows = record.form_data && Array.isArray(record.form_data.rows)
        ? record.form_data.rows
        : [];

    return rows
        .map((row) => row.cells || [])
        .filter((cells) => {
            const first = String(cells[0] || "").trim();
            const second = String(cells[1] || "").trim();
            return second && !/Possible Defect|Serial Number|Date of Inspection/i.test(first + " " + second);
        })
        .filter((cells) => /Webbing|Stitching|Buckles|Attachment|Label|Cuts|Punctures|Abrasions|Burns|Discolour|Incomplete|Pulled|Distorted|Deformation|Cracks|Corrosion|Function|Excess Wear|Illegible|Missing/i.test(cells.join(" ")))
        .map((cells) => ({
            component: cells[0] || "",
            defect: cells[1] || "",
            condition: cells[2] || "",
            result: cells[3] || ""
        }));
}

function getForkliftRows(record) {
    const rows = record.form_data && Array.isArray(record.form_data.rows)
        ? record.form_data.rows
        : [];
    const visual = [];
    const operational = [];

    rows.forEach((row) => {
        const cells = row.cells || [];
        const left = String(cells[0] || "").trim();
        const right = String(cells[4] || "").trim();

        if (/^\d+\./.test(left)) {
            visual.push({
                item: left,
                result: cells.slice(1, 4).find((cell) => String(cell || "").trim()) || ""
            });
        }

        if (/^\d+\./.test(right)) {
            operational.push({
                item: right,
                result: cells.slice(5, 8).find((cell) => String(cell || "").trim()) || ""
            });
        }
    });

    return { visual, operational };
}

function getTelehandlerRows(record) {
    const rows = record.form_data && Array.isArray(record.form_data.rows)
        ? record.form_data.rows

    return rows
        .map((row) => row.cells || [])
        .filter((cells) => cells[0])

            item: cells[0],

                { defective: cells[3], okay: cells[4] },

                { defective: cells[9], okay: cells[10] },
                { defective: cells[11], okay: cells[12] },
                { defective: cells[13], okay: cells[14] }
            ]
        }));
}

function downloadTeleHandlerPdf(record) {
    const doc = new window.jspdf.jsPDF({ unit: "mm", format: "letter", orientation: "landscape" });
    const margin = 8;
    const pageWidth = doc.internal.pageSize.getWidth();
    const usable = pageWidth - margin * 2;
    let y = 10;
    const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
    const fields = record.form_data && Array.isArray(record.form_data.fields) ? record.form_data.fields : [];
    const rows = getTelehandlerRows(record);
    const fieldValue = (label) => {
        const field = fields.find((item) => String(item.label || "").toLowerCase() === label.toLowerCase());
        return field ? field.value || "" : "";
    };

    doc.setFont("helvetica", "bold");
    doc.setFontSize(17);
    doc.text("TELEHANDLER INSPECTION AND DAILY CHECKLIST", pageWidth / 2, y, { align: "center" });
    y += 8;
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8);
    doc.text("All checks must be carried out in line with Manufacturer's Operators Manual.", pageWidth / 2, y, { align: "center" });
    y += 7;

    const leftW = 78;
    const tableX = margin + leftW + 6;
    const dayW = (usable - leftW - 6) / 7;
    ["Make and Model", "Plant or Serial No.", "Machine Hours", "Week Commencing", "Site Location"].forEach((label) => {
        drawBoxText(doc, label, margin, y, 36, 9, { bold: true, fontSize: 7 });
        drawBoxText(doc, fieldValue(label), margin + 36, y, leftW - 36, 9, { fontSize: 7 });
        y += 9;
    });

    const detailBottomY = y + 2;
    let tableY = 25;
    days.forEach((day, index) => {
        drawBoxText(doc, day, tableX + dayW * index, tableY, dayW, 8, { bold: true, fontSize: 7 });
        drawBoxText(doc, "Defective", tableX + dayW * index, tableY + 8, dayW / 2, 11, { bold: true, fontSize: 5, maxLines: 2 });
        drawBoxText(doc, "Okay", tableX + dayW * index + dayW / 2, tableY + 8, dayW / 2, 11, { bold: true, fontSize: 5, maxLines: 2 });
    });
    tableY += 19;
    const itemStartY = Math.max(tableY, detailBottomY);

    const rowH = 6.4;
    rows.forEach((row, rowIndex) => {
        const rowY = itemStartY + rowH * rowIndex;
        drawBoxText(doc, row.item, margin, rowY, leftW, rowH, { fontSize: 7, maxLines: 1 });

        row.days.forEach((value, dayIndex) => {
            const x = tableX + dayW * dayIndex;
            drawBoxText(doc, value.defective ? "X" : "", x, rowY, dayW / 2, rowH, { fontSize: 7 });
            drawBoxText(doc, value.okay ? "X" : "", x + dayW / 2, rowY, dayW / 2, rowH, { fontSize: 7 });
        });
    });

    const bottomY = itemStartY + rowH * rows.length + 8;
    drawBoxText(doc, `Operator Name:\n${fieldValue("Operator Name")}`, margin, bottomY, leftW, 13, { fontSize: 8 });
    drawBoxText(doc, `Signature:\n${fieldValue("Signature")}`, margin, bottomY + 13, leftW, 13, { fontSize: 8 });
    drawBoxText(doc, `Comments:\n${fieldValue("Comments")}`, tableX, bottomY, usable - leftW - 6, 26, { fontSize: 8, maxLines: 3 });
    doc.save(`tele-handler-${record.inspection_date || "inspection"}.pdf`);
}

function downloadInspectionPdf(id) {
    const record = inspectionRecords.find((item) => item.id === id);

    if (!record) {
        alert("This inspection could not be found.");
        return;
    }

    if (isVehicleInspectionRecord(record)) {
        downloadVehicleInspectionPdf(record);
        return;
    }

    if (!window.jspdf || !window.jspdf.jsPDF) {
        alert("PDF download is not available right now.");
        return;
    }

    if ((record.inspection_type || "").toLowerCase() === "jsa") {
        downloadJsaPdf(record);
        return;
    }

    if ((record.inspection_type || "").toLowerCase() === "aerial lifts") {
        downloadAerialLiftPdf(record);
        return;
    }

    if ((record.inspection_type || "").toLowerCase() === "hot work permit") {
        downloadHotWorkPermitPdf(record);
        return;
    }

    if ((record.inspection_type || "").toLowerCase() === "harness") {
        downloadHarnessPdf(record);
        return;
    }

    if ((record.inspection_type || "").toLowerCase() === "fork lift") {
        downloadForkliftPdf(record);
        return;
    }

    if ((record.inspection_type || "").toLowerCase() === "tele handler") {
        downloadTeleHandlerPdf(record);
        return;
    }

    const doc = new window.jspdf.jsPDF({ unit: "mm", format: "letter" });
    const pageWidth = doc.internal.pageSize.getWidth();
    const margin = 14;
    const maxWidth = pageWidth - margin * 2;
    const fields = record.form_data && Array.isArray(record.form_data.fields)
        ? record.form_data.fields
        : [];
    const rows = record.form_data && Array.isArray(record.form_data.rows)
        ? record.form_data.rows
        : [];
    let y = 16;

    doc.setFont("helvetica", "bold");
    doc.setFontSize(16);
    y = addPdfLine(doc, "John Gordon Construction", margin, y, maxWidth);
    y = addPdfLine(doc, record.inspection_type || "Inspection", margin, y + 2, maxWidth);

    doc.setFont("helvetica", "normal");
    doc.setFontSize(11);
    y = addPdfLine(doc, `Saved: ${formatDate(record.created_at)}`, margin, y + 4, maxWidth);
    y = addPdfLine(doc, `Inspection Date: ${formatDate(record.inspection_date)}`, margin, y, maxWidth);
    y = addPdfLine(doc, `Completed By: ${record.worker_display_name || record.worker_name || ""}`, margin, y, maxWidth);

    if (fields.length) {
        doc.setFont("helvetica", "bold");
        y = addPdfLine(doc, "Form Details", margin, y + 6, maxWidth);
        doc.setFont("helvetica", "normal");

        fields.forEach((field) => {
            if (field.value) {
                y = addPdfLine(doc, `${field.label}: ${field.value}`, margin, y, maxWidth);
            }
        });
    }

    if (rows.length) {
        doc.setFont("helvetica", "bold");
        y = addPdfLine(doc, "Inspection Items", margin, y + 6, maxWidth);
        doc.setFont("helvetica", "normal");

        rows.forEach((row) => {
            const text = row.cells.filter(Boolean).join(" | ");
            if (text) {
                y = addPdfLine(doc, text, margin, y, maxWidth);
            }
        });
    }

    const filename = `${safeFileName(record.inspection_type)}-${record.inspection_date || "inspection"}.pdf`;
    doc.save(filename);
}

function downloadVehicleInspectionPdf(record) {
    const printWindow = window.open("", "_blank", "width=840,height=980");

    if (!printWindow) {
        alert("Popup blocked. Allow popups for this portal, then try Save PDF again.");
        return;
    }

    printWindow.document.write(renderVehicleInspectionPrintDocument(record));
    printWindow.document.close();
    printWindow.focus();
    setTimeout(() => printWindow.print(), 250);
}

function emailSavedInspection(id) {
    const record = inspectionRecords.find((item) => item.id === id);
    emailInspectionRecord(record);
}

async function deleteInspection(id) {
    const record = inspectionRecords.find((item) => item.id === id);

    if (!record || !currentWorkerCanManageInspection(record)) {
        alert("Only the creator or an admin can delete this inspection.");
        return;
    }

    if (!confirm("Delete this inspection?")) {
        return;
    }

    const { error } = await inspectionSupabaseClient
        .from("inspection_records")
        .delete()
        .eq("id", id);

    if (error) {
        alert("This inspection could not be deleted.");
        return;
    }

    loadInspections();
}

async function signOut() {
    await signOutJgc(inspectionSupabaseClient);
}

loadInspections();
