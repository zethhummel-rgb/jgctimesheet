<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="googlebot" content="noindex, nofollow, noarchive" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JGC Schedule</title>
<link rel="stylesheet" href="jgc-design-system.css?v=8" data-jgc-design-system="8">
<link rel="stylesheet" href="schedule-design-system.css?v=4">
</head>
<body class="schedule-page jgc-page jgc-system-page">
<main class="page schedule-page-shell jgc-page-shell jgc-page-shell--wide">
  <div id="adminTabs" class="admin-tabs hidden">
    <button type="button" onclick="window.location.href='admin.html?tab=summary'">Summary</button>
    <button type="button" onclick="window.location.href='admin.html?tab=jobDashboard'">Jobs</button>
    <button type="button" onclick="window.location.href='admin.html?tab=employeeProfile'">Profiles</button>
    <button type="button" onclick="window.location.href='admin.html?tab=timesheets'">Timesheets</button>
    <button type="button" onclick="window.location.href='admin.html?tab=sickDays'">Sick</button>
    <button type="button" onclick="window.location.href='admin.html?tab=safetyRecords'">Safety Records</button>
    <button type="button" onclick="window.location.href='admin.html?tab=certificates'">Certs</button>
    <button type="button" onclick="window.location.href='admin.html?tab=vacation'">Vacation</button>
    <button type="button" class="active">Schedule</button>
    <button type="button" onclick="window.location.href='admin.html?tab=announcements'">Notices</button>
    <button type="button" onclick="window.location.href='admin.html?tab=toolboxTalks'">Talks</button>
    <button type="button" onclick="window.location.href='admin.html?tab=policies'">Policies</button>
    <button type="button" onclick="window.location.href='admin.html?tab=jobs'">Job List</button>
    <button type="button" onclick="window.location.href='admin.html?tab=workOrders'">WO</button>
    <button type="button" onclick="window.location.href='purchase-orders-admin.html'">PO</button>
    <button type="button" onclick="window.location.href='admin.html?tab=equipment'">Equipment</button>
    <button type="button" onclick="window.location.href='admin.html?tab=contacts'">Contacts</button>
    <button type="button" onclick="window.location.href='admin.html?tab=backups'">Backups</button>
    <button type="button" onclick="window.location.href='accounts.html'">Accounts</button>
  </div>

  <header class="schedule-page-header jgc-page-header">
    <div class="logo-wrap jgc-brand jgc-brand-region">
      <img src="logo.webp" alt="John Gordon Construction logo">
    </div>
    <h1 class="jgc-page-title">Schedule</h1>
    <div id="currentUser" class="small schedule-user-line jgc-page-user jgc-user-line"></div>
  </header>

  <div class="top-actions jgc-actions">
    <button class="jgc-button" type="button" onclick="window.location.href='home.html'">Home</button>
    <button id="adminHomeButton" type="button" class="secondary hidden jgc-button jgc-button--secondary" onclick="window.location.href='admin.html'">Admin</button>
    <button type="button" class="secondary jgc-button jgc-button--secondary" onclick="loadScheduleData()">Refresh</button>
    <button type="button" class="secondary jgc-button jgc-button--secondary" onclick="signOut()">Logout</button>
  </div>

  <div id="scheduleStatus" class="small schedule-status jgc-notice">Loading schedule...</div>

  <div class="layout">
    <section class="card jgc-panel">
      <div class="calendar-controls jgc-actions">
        <button type="button" class="secondary jgc-button jgc-button--secondary" onclick="changeMonth(-1)">Previous</button>
        <div id="calendarTitle" class="calendar-title"></div>
        <button type="button" class="secondary jgc-button jgc-button--secondary" onclick="changeMonth(1)">Next</button>
      </div>
      <div class="legend">
        <span class="mine">My Schedule</span>
        <span class="work">Work</span>
        <span class="vehicle">Equipment / Vehicle Appointment</span>
        <span class="training">Training</span>
        <span class="general">General</span>
        <span class="vacation">Approved Vacation</span>
      </div>
      <div class="schedule-calendar-scroll">
        <div id="scheduleCalendar" class="calendar-grid"></div>
      </div>
      <div id="scheduleAgenda" class="schedule-agenda small">Loading schedule...</div>
    </section>

    <aside class="schedule-sidebar">
      <section class="card jgc-panel">
        <h2 id="selectedDateTitle">Selected Day</h2>
        <div id="selectedDateDetails" class="detail-list small">Select a day to view schedule details.</div>
      </section>

      <section id="scheduleForm" class="card schedule-form-panel jgc-panel">
        <h2>Add Schedule</h2>
        <label>Schedule Type</label>
        <select id="eventType" onchange="updateScheduleTypeFields()">
          <option value="work">Work / Job</option>
          <option value="vehicle">Equipment / Vehicle Appointment</option>
          <option value="training">Training</option>
          <option value="general">General</option>
        </select>

        <label>Date</label>
        <input id="eventDate" type="date">

        <label>Start Time</label>
        <input id="startTime" type="time">

        <label>End Time</label>
        <input id="endTime" type="time">

        <div id="jobFields">
          <label>Job</label>
          <select id="jobSelect" onchange="fillSelectedJob()"></select>

          <label id="jobNameLabel">Job Name</label>
          <input id="jobName" placeholder="Job name or location">

          <label>Job Number</label>
          <input id="jobNumber" placeholder="Optional">
        </div>

        <div id="vehicleFields" class="hidden">
          <label>Vehicle / Equipment / Trailer</label>
          <select id="vehicleSelect" onchange="fillSelectedVehicle()"></select>
          <label>Reason for Appointment</label>
          <input id="maintenanceReason" placeholder="Example: oil change, tire repair, annual service">
          <div id="vehicleOperatorHint" class="small schedule-field-hint"></div>
        </div>

        <label id="titleLabel">Title</label>
        <input id="eventTitle" placeholder="Example: Truck service, Working at Heights, Shop day">

        <label>Location</label>
        <input id="location" placeholder="Optional site/location">

        <label>Tag Employees</label>
        <div id="employeeChecks" class="employee-checks"></div>

        <label>Notes</label>
        <textarea id="notes" placeholder="Optional notes for the crew"></textarea>

        <div class="form-actions schedule-form-actions jgc-actions">
          <button id="scheduleSaveButton" class="jgc-button" type="button" onclick="saveScheduleEvent()">Save Schedule</button>
          <button type="button" class="secondary jgc-button jgc-button--secondary" onclick="clearScheduleForm()">Clear</button>
        </div>
      </section>
    </aside>
  </div>
</main>

<script src="vendor/supabase-js.min.js?v=1" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';"></script>
<script src="common.js?v=42"></script>
<script src="employee-feature-access.js?v=3"></script>
<script>
const SCHEDULE_EMAIL_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzPILTnOSzQcCkA6y5vSLxCH6i05Y2-ZHZAk09Und0YKiXZOYMppV4fvW3G6EgqOIZi/exec";
const supabaseClient = createJgcSupabaseClient();
const worker = requireJgcWorker();
const currentWorker = normalizeWorkerName(worker.key);
const currentWorkerDisplay = worker.display || worker.key;
const isAdmin = isAdminWorker(worker.key, worker.role, worker.email);

let scheduleEvents = [];
let vacationRequests = [];
let accounts = [];
let jobs = [];
let equipmentItems = [];
let calendarMonth = new Date();
let selectedDate = new Date();
let currentUserId = "";
let editingScheduleEventId = "";

document.getElementById("currentUser").textContent = "Signed in as: " + currentWorkerDisplay;
document.getElementById("adminHomeButton").classList.toggle("hidden", !isAdmin);
document.getElementById("adminTabs").classList.toggle("hidden", !isAdmin);

function setStatus(message) {
  document.getElementById("scheduleStatus").textContent = message || "";
}

async function getCurrentUserId() {
  if (currentUserId || !supabaseClient) {
    return currentUserId;
  }

  const { data } = await supabaseClient.auth.getSession();
  currentUserId = data.session && data.session.user ? data.session.user.id : "";
  return currentUserId;
}

function makeLocalDate(value) {
  const parts = String(value || "").split("-");
  return parts.length === 3 ? new Date(parts[0], parts[1] - 1, parts[2]) : new Date(value);
}

function formatDateValue(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return year + "-" + month + "-" + day;
}

function formatDisplayDate(value) {
  return makeLocalDate(value).toLocaleDateString("en-CA", {
    weekday: "long",
    month: "long",
    day: "numeric",
    year: "numeric"
  });
}

function formatTime(value) {
  if (!value) {
    return "";
  }

  const parts = String(value).slice(0, 5).split(":");
  const hour = Number(parts[0]);
  const minute = parts[1] || "00";
  const suffix = hour >= 12 ? "PM" : "AM";
  return String(hour % 12 || 12) + ":" + minute + " " + suffix;
}

function normalizeScheduleText(value) {
  return String(value || "").trim().replace(/\s+/g, " ");
}

function addMinutesToScheduleTime(value, minutes) {
  const parts = String(value || "07:00").slice(0, 5).split(":");
  const baseMinutes = (Number(parts[0]) || 0) * 60 + (Number(parts[1]) || 0) + minutes;
  const normalized = ((baseMinutes % 1440) + 1440) % 1440;
  return String(Math.floor(normalized / 60)).padStart(2, "0") + ":" + String(normalized % 60).padStart(2, "0");
}

function getScheduleTimeRange(startValue, endValue) {
  const start = String(startValue || "").slice(0, 5) || "07:00";
  const end = String(endValue || "").slice(0, 5) || addMinutesToScheduleTime(start, 30);
  return { start, end };
}

function getCurrentAliases() {
  return [
    currentWorker,
    currentWorkerDisplay,
    worker.email
  ].map(normalizeWorkerName).filter(Boolean);
}

function getApprovedAccounts() {
  return accounts;
}

function getSelectedAccounts() {
  const checked = Array.from(document.querySelectorAll("[data-employee-check]:checked"));
  return checked.map((box) => accounts.find((account) => account.id === box.value)).filter(Boolean);
}

function getCurrentAccount() {
  const aliases = getCurrentAliases();
  return accounts.find((account) => aliases.includes(normalizeWorkerName(account.worker_key)) ||
    aliases.includes(normalizeWorkerName(account.display_name)) ||
    aliases.includes(normalizeWorkerName(account.email))) || null;
}

function buildScheduleAccountsFromWorkOrderWorkers(workerRows, profileRows) {
  const profiles = profileRows || [];

  return (workerRows || [])
    .filter((workerRow) => workerRow.approved)
    .map((workerRow) => {
      const workerAliases = [
        workerRow.worker_key,
        workerRow.display_name
      ].map(normalizeWorkerName).filter(Boolean);
      const profile = profiles.find((account) =>
        (workerRow.profile_id && account.id === workerRow.profile_id) ||
        workerAliases.includes(normalizeWorkerName(account.worker_key)) ||
        workerAliases.includes(normalizeWorkerName(account.display_name)) ||
        workerAliases.includes(normalizeWorkerName(account.email))
      ) || {};

      return {
        id: workerRow.id,
        profile_id: workerRow.profile_id || profile.id || "",
        display_name: workerRow.display_name || profile.display_name || profile.worker_key || profile.email || "Employee",
        worker_key: workerRow.worker_key || profile.worker_key || normalizeWorkerName(workerRow.display_name),
        email: profile.email || "",
        role: profile.role || "worker",
        account_status: "approved"
      };
    });
}

function eventIsAssignedToCurrentWorker(event) {
  const aliases = getCurrentAliases();
  const keys = Array.isArray(event.employee_keys) ? event.employee_keys : [];
  const names = Array.isArray(event.employee_names) ? event.employee_names : [];
  const emails = Array.isArray(event.employee_emails) ? event.employee_emails : [];
  return keys.concat(names).concat(emails).some((value) => aliases.includes(normalizeWorkerName(value)));
}

function getVisibleScheduleEvents() {
  return scheduleEvents;
}

function vacationTouchesDate(request, dateValue) {
  return String(request.start_date || "") <= dateValue && dateValue <= String(request.end_date || request.start_date || "");
}

function eventTouchesDate(event, dateValue) {
  return String(event.event_date || "") === dateValue;
}

function changeMonth(offset) {
  calendarMonth = new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() + offset, 1);
  renderCalendar();
}

function selectDate(value) {
  selectedDate = makeLocalDate(value);
  document.getElementById("eventDate").value = value;
  renderCalendar();
  renderSelectedDate();
  document.getElementById("scheduleForm").scrollIntoView({ behavior: "smooth", block: "start" });
}

function renderJobOptions() {
  const select = document.getElementById("jobSelect");
  const activeJobs = jobs.filter((job) => job.active !== false).sort((a, b) => String(a.job_number || "").localeCompare(String(b.job_number || ""), undefined, { numeric: true }));

  select.innerHTML = '<option value="">Manual / no job selected</option>' + activeJobs.map((job) => {
    const number = String(job.job_number || "").trim();
    const name = String(job.job_name || "").trim();
    return '<option value="' + escapeHtml(job.id) + '">' + escapeHtml((number ? number + " - " : "") + name) + '</option>';
  }).join("");
}

function fillSelectedJob() {
  const selectedId = document.getElementById("jobSelect").value;
  const job = jobs.find((item) => item.id === selectedId);

  if (!job) {
    return;
  }

  document.getElementById("jobName").value = job.job_name || "";
  document.getElementById("jobNumber").value = job.job_number || "";
  document.getElementById("location").value = job.address || "";
}

function getScheduleEquipmentCategory(item) {
  const text = [
    item.equipment_type,
    item.name,
    item.identification_number,
    item.notes
  ].join(" ").toLowerCase();

  if (/\b(trailer|trl|float)\b/.test(text)) {
    return "trailer";
  }

  if (/\b(truck|van|vehicle|pickup|car|f-?150|f-?250|f-?350|ram|silverado|sierra|plate)\b/.test(text)) {
    return "vehicle";
  }

  return "equipment";
}

function getScheduleVehicleChoices() {
  return (equipmentItems || [])
    .slice()
    .sort((a, b) => {
      const categorySort = getScheduleEquipmentCategory(a).localeCompare(getScheduleEquipmentCategory(b));
      return categorySort || String(a.name || "").localeCompare(String(b.name || ""), undefined, { numeric: true });
    });
}

function getScheduleEquipmentLabel(item) {
  if (!item) {
    return "";
  }

  const name = String(item.name || "Equipment").trim();
  const identification = String(item.identification_number || "").trim();
  const type = String(item.equipment_type || "").trim();
  const operator = String(item.operator_name || "").trim();
  return [
    name,
    identification ? "#" + identification : "",
    type ? "(" + type + ")" : "",
    operator ? "- " + operator : ""
  ].filter(Boolean).join(" ");
}

function renderVehicleOptions() {
  const select = document.getElementById("vehicleSelect");

  if (!select) {
    return;
  }

  const choices = getScheduleVehicleChoices();
  select.innerHTML = '<option value="">Select vehicle, lift, trailer, or equipment</option>' + choices.map((item) =>
    '<option value="' + escapeHtml(item.id) + '">' + escapeHtml(getScheduleEquipmentLabel(item)) + '</option>'
  ).join("");
}

function findScheduleAccountByName(value) {
  const target = normalizeWorkerName(value);

  if (!target) {
    return null;
  }

  return accounts.find((account) => [
    account.display_name,
    account.worker_key,
    account.email
  ].map(normalizeWorkerName).filter(Boolean).includes(target)) || null;
}

function checkScheduleEmployeeAccount(account) {
  if (!account) {
    return false;
  }

  const box = Array.from(document.querySelectorAll("[data-employee-check]"))
    .find((input) => input.value === account.id);

  if (!box) {
    return false;
  }

  box.checked = true;
  return true;
}

function getSelectedVehicleItem() {
  const selectedId = document.getElementById("vehicleSelect").value;
  return equipmentItems.find((item) => item.id === selectedId) || null;
}

function fillSelectedVehicle() {
  const item = getSelectedVehicleItem();
  const hint = document.getElementById("vehicleOperatorHint");

  if (!item) {
    if (hint) {
      hint.textContent = "";
    }
    return;
  }

  const label = getScheduleEquipmentLabel(item);
  const operatorName = item.operator_name || "";
  document.getElementById("eventTitle").value = label;
  document.getElementById("location").value = item.identification_number || item.name || "";

  if (!operatorName) {
    if (hint) {
      hint.textContent = "No assigned operator is saved for this item.";
    }
    return;
  }

  const account = findScheduleAccountByName(operatorName);
  const checked = checkScheduleEmployeeAccount(account);

  if (hint) {
    hint.textContent = checked
      ? "Assigned operator tagged: " + (account.display_name || account.worker_key || account.email)
      : "Assigned operator saved as \"" + operatorName + "\", but no matching approved account was found.";
  }
}

function updateScheduleTypeFields() {
  const type = document.getElementById("eventType").value || "work";
  const isWork = type === "work";
  const isVehicle = type === "vehicle";
  const titleInput = document.getElementById("eventTitle");

  document.getElementById("jobFields").classList.toggle("hidden", !isWork);
  document.getElementById("vehicleFields").classList.toggle("hidden", !isVehicle);
  document.getElementById("titleLabel").textContent = isWork ? "Title / Attention" : "Title";
  titleInput.placeholder = type === "vehicle"
    ? "Example: Truck service, oil change, tire appointment"
    : type === "training"
      ? "Example: Working at Heights training"
      : type === "general"
        ? "Example: Shop day, meeting, appointment"
        : "Optional title or attention";
}

function renderEmployeeChecks() {
  const list = document.getElementById("employeeChecks");
  const approved = getApprovedAccounts();

  if (!approved.length) {
    list.innerHTML = '<div class="small">No approved employees found.</div>';
    return;
  }

  list.innerHTML = approved.map((account) => {
    const label = account.display_name || account.worker_key || account.email || "Employee";
    const aliases = getCurrentAliases();
    const checked = aliases.includes(normalizeWorkerName(account.worker_key)) ||
      aliases.includes(normalizeWorkerName(account.display_name)) ||
      aliases.includes(normalizeWorkerName(account.email));
    return `
      <label>
        <input type="checkbox" value="${escapeHtml(account.id)}" data-employee-check ${checked ? "checked" : ""}>
        <span>${escapeHtml(label)}</span>
      </label>
    `;
  }).join("");
}

function getEventType(event) {
  const value = String(event && event.event_type || "work").toLowerCase();
  return ["work", "vehicle", "training", "general"].includes(value) ? value : "work";
}

function getEventTypeLabel(type) {
  const labels = {
    work: "Work",
    vehicle: "Equipment / Vehicle Appointment",
    training: "Training",
    general: "General"
  };
  return labels[type] || "Schedule";
}

function getEventDisplayTitle(event) {
  return event.title || event.job_name || event.location || getEventTypeLabel(getEventType(event));
}

function getScheduleDuplicateAliases(event) {
  const names = Array.isArray(event.employee_names) ? event.employee_names : [];
  const keys = Array.isArray(event.employee_keys) ? event.employee_keys : [];
  const emails = Array.isArray(event.employee_emails) ? event.employee_emails : [];
  return names.concat(keys).concat(emails).map(normalizeWorkerName).filter(Boolean);
}

function isDuplicateScheduleEvent(record, ignoreId) {
  const duplicateAliases = getScheduleDuplicateAliases(record);
  const start = String(record.start_time || "").slice(0, 5);

  if (!duplicateAliases.length) {
    return false;
  }

  return scheduleEvents.some((event) =>
    String(event.id || "") !== String(ignoreId || "") &&
    String(event.event_date || "") === String(record.event_date || "") &&
    String(event.start_time || "").slice(0, 5) === start &&
    getScheduleDuplicateAliases(event).some((alias) => duplicateAliases.includes(alias))
  );
}

function canDeleteScheduleEvent(event) {
  return isAdmin || (currentUserId && String(event.created_by || "") === String(currentUserId));
}

function getEventsForDate(dateValue) {
  return getVisibleScheduleEvents().filter((event) => eventTouchesDate(event, dateValue));
}

function getVacationsForDate(dateValue) {
  return vacationRequests.filter((request) => vacationTouchesDate(request, dateValue));
}

function formatScheduleAgendaDayHeader(value) {
  const date = makeLocalDate(value);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const tomorrow = new Date(today);
  tomorrow.setDate(today.getDate() + 1);
  const dateValue = formatDateValue(date);
  const prefix = dateValue === formatDateValue(today)
    ? "Today"
    : dateValue === formatDateValue(tomorrow)
      ? "Tomorrow"
      : date.toLocaleDateString("en-CA", { weekday: "short" });

  return prefix + " - " + date.toLocaleDateString("en-CA", { month: "short", day: "numeric" });
}

function getScheduleVacationAgendaRange(request) {
  const start = makeLocalDate(request.start_date);
  const end = makeLocalDate(request.end_date || request.start_date);
  const startText = start.toLocaleDateString("en-CA", { month: "short", day: "numeric" });
  const endText = end.toLocaleDateString("en-CA", { month: "short", day: "numeric" });
  return startText === endText ? startText : startText + " to " + endText;
}

function buildScheduleAgendaItems() {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const todayValue = formatDateValue(today);
  const scheduleItems = getVisibleScheduleEvents()
    .filter((event) => String(event.event_date || "") >= todayValue)
    .map((event) => {
      const type = getEventType(event);
      return {
        id: event.id || "",
        source: "schedule",
        type,
        date: event.event_date,
        sortTime: event.start_time || "99:99",
        title: getEventDisplayTitle(event),
        meta: [
          getEventTypeLabel(type),
          [formatTime(event.start_time), event.end_time ? "to " + formatTime(event.end_time) : ""].filter(Boolean).join(" "),
          event.job_number ? "Job #: " + event.job_number : "",
          event.location || ""
        ].filter(Boolean).join(" | ")
      };
    });
  const vacationItems = (vacationRequests || [])
    .filter((request) => String(request.end_date || request.start_date || "") >= todayValue)
    .map((request) => {
      const startValue = String(request.start_date || "");
      const endValue = String(request.end_date || request.start_date || "");
      return {
        id: request.id || "",
        source: "vacation",
        type: "vacation",
        date: startValue < todayValue && todayValue <= endValue ? todayValue : startValue,
        sortTime: "99:99",
        title: "Vacation - " + (request.worker_display_name || request.worker_name || "Employee"),
        meta: getScheduleVacationAgendaRange(request)
      };
    });

  return scheduleItems.concat(vacationItems)
    .filter((item) => item.date)
    .sort((a, b) => {
      const dateDifference = String(a.date || "").localeCompare(String(b.date || ""));
      return dateDifference || String(a.sortTime || "").localeCompare(String(b.sortTime || ""));
    })
    .slice(0, 7);
}

function selectScheduleAgendaDate(value) {
  selectedDate = makeLocalDate(value);
  document.getElementById("eventDate").value = value;
  renderCalendar();
  renderSelectedDate();
  document.querySelector(".schedule-sidebar").scrollIntoView({ behavior: "smooth", block: "start" });
}

function renderScheduleAgenda() {
  const list = document.getElementById("scheduleAgenda");
  const items = buildScheduleAgendaItems();

  if (!items.length) {
    list.innerHTML = '<div class="admin-agenda-toolbar"><strong>Upcoming Schedule</strong></div><div class="small">No upcoming schedule items found.</div>';
    return;
  }

  const groups = items.reduce((grouped, item) => {
    grouped[item.date] = grouped[item.date] || [];
    grouped[item.date].push(item);
    return grouped;
  }, {});

  list.innerHTML = `
    <div class="admin-agenda-toolbar"><strong>Upcoming Schedule</strong></div>
    ${Object.keys(groups).map((dateValue) => `
      <div class="admin-agenda-day-group">
        <div class="admin-agenda-day-header">${escapeHtml(formatScheduleAgendaDayHeader(dateValue))}</div>
        ${groups[dateValue].map((item) => {
          const timeText = item.sortTime === "99:99" ? "All day" : formatTime(item.sortTime);
          const content = `
            <span class="admin-agenda-time">${escapeHtml(timeText)}</span>
            <span>
              <span class="admin-agenda-title">${escapeHtml(item.title)}</span>
              <span class="admin-agenda-meta">${escapeHtml(item.meta)}</span>
            </span>
          `;
          return item.source === "schedule"
            ? `<button type="button" class="admin-agenda-item ${escapeHtml(item.type)}" onclick="selectScheduleAgendaDate('${escapeHtml(item.date)}')">${content}</button>`
            : `<div class="admin-agenda-item ${escapeHtml(item.type)}">${content}</div>`;
        }).join("")}
      </div>
    `).join("")}
  `;
}

function renderCalendar() {
  const calendar = document.getElementById("scheduleCalendar");
  const title = document.getElementById("calendarTitle");
  const year = calendarMonth.getFullYear();
  const month = calendarMonth.getMonth();
  const first = new Date(year, month, 1);
  const last = new Date(year, month + 1, 0);
  const selectedValue = formatDateValue(selectedDate);
  const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  let html = days.map((day) => '<div class="calendar-head">' + day + '</div>').join("");

  title.textContent = first.toLocaleDateString("en-CA", { month: "long", year: "numeric" });

  for (let i = 0; i < first.getDay(); i++) {
    html += '<button type="button" class="day muted" tabindex="-1"></button>';
  }

  for (let day = 1; day <= last.getDate(); day++) {
    const date = new Date(year, month, day);
    const dateValue = formatDateValue(date);
    const dayEvents = getEventsForDate(dateValue);
    const dayVacations = getVacationsForDate(dateValue);
    const items = dayEvents.slice(0, 3).map((event) => {
      const type = getEventType(event);
      const syncClass = getJgcScheduleSyncClass(event) === "synced" ? "synced" : "unsynced";
      const syncLabel = getJgcScheduleSyncLabel(event);
      const timeText = event.start_time ? formatTime(event.start_time) : "";
      const label = '<span class="schedule-sync-dot ' + syncClass + '" title="' + escapeHtml(syncLabel) + '"></span>' +
        (timeText ? '<span class="schedule-event-time">' + escapeHtml(timeText) + '</span>' : "") +
        '<span class="schedule-event-title">' + escapeHtml(getEventDisplayTitle(event)) + '</span>';
      return '<div class="day-item ' + escapeHtml(type) + '">' + label + '</div>';
    }).concat(dayVacations.slice(0, 2).map((request) => {
      return '<div class="day-item vacation">' +
        '<span class="schedule-sync-dot ' + (getJgcScheduleSyncClass(request) === "synced" ? "synced" : "unsynced") + '" title="' + escapeHtml(getJgcScheduleSyncLabel(request)) + '"></span>' +
        escapeHtml(request.worker_display_name || request.worker_name || "Vacation") + '</div>';
    })).join("");
    const moreCount = Math.max(0, dayEvents.length + dayVacations.length - 5);

    html += `
      <button type="button" class="day ${selectedValue === dateValue ? "selected" : ""}" onclick="selectDate('${dateValue}')">
        <div class="day-number">${day}</div>
        <div class="day-list">${items}${moreCount ? '<div class="small">+' + moreCount + ' more</div>' : ""}</div>
      </button>
    `;
  }

  calendar.innerHTML = html;
}

function renderSelectedDate() {
  const dateValue = formatDateValue(selectedDate);
  const events = getEventsForDate(dateValue);
  const vacations = getVacationsForDate(dateValue);
  const list = document.getElementById("selectedDateDetails");

  document.getElementById("selectedDateTitle").textContent = formatDisplayDate(dateValue);

  if (!events.length && !vacations.length) {
    list.innerHTML = '<div class="small">Nothing scheduled for this day.</div>';
    return;
  }

  const eventHtml = events.map((event) => `
    <div class="detail-item">
      <div class="detail-title"><span class="chip ${escapeHtml(getEventType(event))}-chip">${escapeHtml(getEventTypeLabel(getEventType(event)))}</span> ${escapeHtml(getEventDisplayTitle(event))}</div>
      <div class="detail-meta">
        ${escapeHtml([formatTime(event.start_time), event.end_time ? "to " + formatTime(event.end_time) : ""].filter(Boolean).join(" "))}<br>
        ${event.job_number ? "Job #: " + escapeHtml(event.job_number) + "<br>" : ""}
        ${event.location ? "Location: " + escapeHtml(event.location) + "<br>" : ""}
        ${event.maintenance_reason ? "Reason: " + escapeHtml(event.maintenance_reason) + "<br>" : ""}
        ${event.employee_names && event.employee_names.length ? "Crew: " + escapeHtml(event.employee_names.join(", ")) + "<br>" : ""}
        ${event.notes ? "Notes: " + escapeHtml(event.notes) + "<br>" : ""}
      </div>
      ${renderScheduleGoogleSyncStatus(event)}
      <div class="form-actions schedule-detail-actions jgc-actions">
        <button type="button" class="secondary jgc-button jgc-button--secondary" onclick="editScheduleEvent('${escapeHtml(event.id)}')">Edit</button>
        ${canDeleteScheduleEvent(event) ? '<button type="button" class="danger jgc-button jgc-button--danger" onclick="deleteScheduleEvent(\'' + escapeHtml(event.id) + '\')">Delete</button>' : ""}
      </div>
    </div>
  `).join("");

  const vacationHtml = vacations.map((request) => `
    <div class="detail-item">
      <div class="detail-title">Vacation - ${escapeHtml(request.worker_display_name || request.worker_name || "")}</div>
      <div class="detail-meta">${escapeHtml(formatDisplayDate(request.start_date))} to ${escapeHtml(formatDisplayDate(request.end_date || request.start_date))}</div>
    </div>
  `).join("");

  list.innerHTML = eventHtml + vacationHtml;
}

function renderScheduleGoogleSyncStatus(event) {
  const statusClass = getJgcScheduleSyncClass(event);
  const label = getJgcScheduleSyncLabel(event);
  const icon = statusClass === "synced" ? "OK" : (statusClass === "failed" ? "!" : "-");
  const retry = statusClass !== "synced"
    ? '<button type="button" class="schedule-sync-retry jgc-button jgc-button--secondary" onclick="retryScheduleGoogleSync(\'' + escapeHtml(event.id) + '\')">Retry Sync</button>'
    : "";

  return '<div><span class="schedule-sync-status ' + escapeHtml(statusClass) + '">' + icon + ' ' + escapeHtml(label) + '</span>' + retry + '</div>';
}

async function retryScheduleGoogleSync(id) {
  const event = scheduleEvents.find((item) => String(item.id) === String(id));

  if (!event) {
    alert("That schedule event could not be found. Refresh the schedule and try again.");
    return;
  }

  setStatus("Retrying Google Calendar sync...");
  const result = await syncJgcScheduleEventToGoogle(supabaseClient, event, "upsert");

  if (!result.ok) {
    setStatus("Event saved, but Google Calendar sync failed.");
    alert("Event saved, but Google Calendar sync failed. " + (result.error || ""));
  } else {
    setStatus("Google Calendar sync queued.");
  }

  await loadScheduleData();
}

function clearScheduleForm() {
  editingScheduleEventId = "";
  document.getElementById("eventType").value = "work";
  document.getElementById("eventDate").value = formatDateValue(selectedDate);
  document.getElementById("startTime").value = "";
  document.getElementById("endTime").value = "";
  document.getElementById("jobSelect").value = "";
  document.getElementById("jobName").value = "";
  document.getElementById("jobNumber").value = "";
  document.getElementById("vehicleSelect").value = "";
  document.getElementById("maintenanceReason").value = "";
  document.getElementById("vehicleOperatorHint").textContent = "";
  document.getElementById("eventTitle").value = "";
  document.getElementById("location").value = "";
  document.getElementById("notes").value = "";
  document.querySelectorAll("[data-employee-check]").forEach((box) => {
    box.checked = false;
  });
  const currentAccount = getCurrentAccount();
  if (currentAccount) {
    document.querySelectorAll("[data-employee-check]").forEach((box) => {
      if (box.value === currentAccount.id) {
        box.checked = true;
      }
    });
  }
  updateScheduleTypeFields();
  const saveButton = document.getElementById("scheduleSaveButton");
  if (saveButton) {
    saveButton.textContent = "Save Schedule";
  }
}

function scheduleEventEmployeeAliases(event) {
  const keys = Array.isArray(event.employee_keys) ? event.employee_keys : [];
  const names = Array.isArray(event.employee_names) ? event.employee_names : [];
  const emails = Array.isArray(event.employee_emails) ? event.employee_emails : [];
  return keys.concat(names).concat(emails).map(normalizeWorkerName).filter(Boolean);
}

function setScheduleEmployeeChecksForEvent(event) {
  const aliases = scheduleEventEmployeeAliases(event);
  document.querySelectorAll("[data-employee-check]").forEach((box) => {
    const account = accounts.find((item) => item.id === box.value);
    const accountAliases = account ? [
      account.id,
      account.profile_id,
      account.worker_key,
      account.display_name,
      account.email
    ].map(normalizeWorkerName).filter(Boolean) : [];
    box.checked = accountAliases.some((alias) => aliases.includes(alias));
  });
}

function selectScheduleJobForEvent(event) {
  const select = document.getElementById("jobSelect");
  const job = jobs.find((item) =>
    (event.job_id && item.id === event.job_id) ||
    (event.job_number && String(item.job_number || "").trim() === String(event.job_number || "").trim()) ||
    (event.job_name && normalizeWorkerName(item.job_name) === normalizeWorkerName(event.job_name))
  );
  select.value = job ? job.id : "";
}

function selectScheduleVehicleForEvent(event) {
  const select = document.getElementById("vehicleSelect");
  const title = normalizeWorkerName(event.title || event.job_name);
  const location = normalizeWorkerName(event.location);
  const item = equipmentItems.find((equipment) =>
    (event.equipment_id && equipment.id === event.equipment_id) ||
    title && normalizeWorkerName(getScheduleEquipmentLabel(equipment)) === title ||
    title && normalizeWorkerName(equipment.name) === title ||
    location && normalizeWorkerName(equipment.identification_number) === location
  );
  select.value = item ? item.id : "";
}

function editScheduleEvent(id) {
  const event = scheduleEvents.find((item) => String(item.id) === String(id));

  if (!event) {
    alert("That schedule event could not be found. Refresh the schedule and try again.");
    return;
  }

  editingScheduleEventId = event.id;
  selectedDate = makeLocalDate(event.event_date);
  calendarMonth = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), 1);

  document.getElementById("eventType").value = getEventType(event);
  updateScheduleTypeFields();
  document.getElementById("eventDate").value = event.event_date || formatDateValue(selectedDate);
  document.getElementById("startTime").value = String(event.start_time || "").slice(0, 5);
  document.getElementById("endTime").value = String(event.end_time || "").slice(0, 5);
  document.getElementById("jobName").value = event.job_name || "";
  document.getElementById("jobNumber").value = event.job_number || "";
  document.getElementById("eventTitle").value = event.title || "";
  document.getElementById("location").value = event.location || "";
  document.getElementById("notes").value = event.notes || "";
  document.getElementById("maintenanceReason").value = event.maintenance_reason || "";
  selectScheduleJobForEvent(event);
  selectScheduleVehicleForEvent(event);
  setScheduleEmployeeChecksForEvent(event);

  const saveButton = document.getElementById("scheduleSaveButton");
  if (saveButton) {
    saveButton.textContent = "Update Schedule";
  }

  renderCalendar();
  renderSelectedDate();
  document.getElementById("scheduleForm").scrollIntoView({ behavior: "smooth", block: "start" });
  setStatus("Editing schedule item for " + formatDisplayDate(event.event_date) + ".");
}

function buildScheduleAnnouncementBody(event, account) {
  return [
    "You have been tagged on the JGC schedule.",
    "",
    "Type: " + getEventTypeLabel(getEventType(event)),
    "Date: " + formatDisplayDate(event.event_date),
    "Time: " + [formatTime(event.start_time), event.end_time ? "to " + formatTime(event.end_time) : ""].filter(Boolean).join(" "),
    "Item: " + getEventDisplayTitle(event),
    "Job: " + (event.job_name ? (event.job_number ? event.job_number + " - " : "") + event.job_name : ""),
    "Location: " + (event.location || ""),
    "Reason: " + (event.maintenance_reason || ""),
    "",
    "Notes:",
    event.notes || "",
    "",
    "Scheduled for: " + (account.display_name || account.worker_key || account.email || "")
  ].join("\n");
}

async function createScheduleAnnouncements(event, selectedAccounts) {
  const records = selectedAccounts.map((account) => ({
    title: "Scheduled: " + formatDisplayDate(event.event_date),
    body: buildScheduleAnnouncementBody(event, account),
    created_by: null,
    created_by_name: currentWorkerDisplay,
    expires_at: null,
    is_active: true,
    target_worker_name: account.worker_key || account.display_name || "",
    target_worker_email: account.email || "",
    source_type: "schedule_event",
    source_id: event.id
  }));

  if (!records.length) {
    return;
  }

  const { error } = await supabaseClient
    .from("announcements")
    .insert(records);

  if (error) {
    console.warn("Schedule announcements could not be created.", error);
  }

  if (typeof createJgcPortalNotifications === "function") {
    await createJgcPortalNotifications(supabaseClient, "schedule_update", selectedAccounts, {
      title: "Scheduled: " + formatDisplayDate(event.event_date),
      message: [formatTime(event.start_time), getEventDisplayTitle(event)].filter(Boolean).join(" - "),
      link_url: "schedule.html",
      source_table: "schedule_events",
      source_id: event.id,
      created_by_name: currentWorkerDisplay,
      metadata: {
        event_date: event.event_date || "",
        event_type: getEventType(event),
        job_number: event.job_number || "",
        job_name: event.job_name || "",
        location: event.location || ""
      }
    });
  }
}

function getScheduleNotificationEmails(selectedAccounts) {
  const adminEmails = typeof JGC_ADMIN_EMAILS !== "undefined"
    ? JGC_ADMIN_EMAILS
    : ["zeth@johngordonconstruction.com", "jeff@johngordonconstruction.com"];
  const emails = (selectedAccounts || [])
    .map((account) => account.email || "")
    .concat(worker.email || "")
    .concat(adminEmails || []);
  const seen = new Set();

  return emails
    .map((email) => String(email || "").trim())
    .filter((email) => {
      const key = email.toLowerCase();

      if (!key || seen.has(key)) {
        return false;
      }

      seen.add(key);
      return true;
    });
}

async function emailTaggedScheduleEmployees(event, selectedAccounts) {
  const recipients = getScheduleNotificationEmails(selectedAccounts);

  if (!recipients.length || !SCHEDULE_EMAIL_SCRIPT_URL) {
    return;
  }

  await fetch(SCHEDULE_EMAIL_SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify({
      to: recipients.join(","),
      subject: "JGC Schedule - " + getEventTypeLabel(getEventType(event)) + " - " + formatDisplayDate(event.event_date),
      body: buildScheduleAnnouncementBody(event, { display_name: selectedAccounts.map((account) => account.display_name || account.worker_key || account.email).join(", ") }),
      text: buildScheduleAnnouncementBody(event, { display_name: selectedAccounts.map((account) => account.display_name || account.worker_key || account.email).join(", ") }),
      pdfHtml: "<html><body><pre>" + escapeHtml(buildScheduleAnnouncementBody(event, { display_name: selectedAccounts.map((account) => account.display_name || account.worker_key || account.email).join(", ") })) + "</pre></body></html>",
      pdfFileName: "jgc-schedule-" + event.event_date + ".pdf",
      source: "schedule_event"
    })
  });
}

async function saveScheduleMaintenanceLog(event, selectedVehicle, maintenanceReason) {
  if (!selectedVehicle || !maintenanceReason || !event || !event.id) {
    return;
  }

  await supabaseClient
    .from("equipment_maintenance_logs")
    .upsert({
      equipment_id: selectedVehicle.id || null,
      schedule_event_id: event.id,
      equipment_name: getScheduleEquipmentLabel(selectedVehicle),
      maintenance_reason: maintenanceReason,
      scheduled_date: event.event_date,
      scheduled_time: event.start_time || null,
      status: "scheduled",
      notes: event.notes || ""
    }, { onConflict: "schedule_event_id" });
}

async function saveScheduleEvent() {
  let selectedAccounts = getSelectedAccounts();
  const eventDate = document.getElementById("eventDate").value;
  const eventType = document.getElementById("eventType").value || "work";
  const isWork = eventType === "work";
  const selectedVehicle = eventType === "vehicle" ? getSelectedVehicleItem() : null;
  const title = document.getElementById("eventTitle").value.trim();
  const location = document.getElementById("location").value.trim();
  const maintenanceReason = eventType === "vehicle" ? document.getElementById("maintenanceReason").value.trim() : "";
  const jobName = (isWork ? document.getElementById("jobName").value.trim() : (title || getScheduleEquipmentLabel(selectedVehicle))) ||
    title ||
    location;
  const displayName = normalizeScheduleText(title || jobName || location);
  const timeRange = getScheduleTimeRange(document.getElementById("startTime").value, document.getElementById("endTime").value);

  if (!selectedAccounts.length) {
    const currentAccount = getCurrentAccount();
    if (currentAccount) {
      selectedAccounts = [currentAccount];
    }
  }

  if (!eventDate) {
    alert("Choose a date for this schedule event.");
    return;
  }

  if (!displayName) {
    alert("Enter at least a name, job, title, or location for this schedule event.");
    return;
  }

  if (eventType === "vehicle" && !maintenanceReason) {
    alert("Enter the reason for the equipment or vehicle appointment.");
    return;
  }

  const userId = await getCurrentUserId();
  const record = {
    event_type: eventType,
    event_date: eventDate,
    start_time: timeRange.start,
    end_time: timeRange.end,
    job_id: isWork ? (document.getElementById("jobSelect").value || null) : null,
    equipment_id: selectedVehicle ? selectedVehicle.id : null,
    maintenance_reason: maintenanceReason,
    title: title || displayName,
    job_name: jobName || displayName,
    job_number: isWork ? document.getElementById("jobNumber").value.trim() : "",
    location,
    notes: document.getElementById("notes").value.trim(),
    employee_names: selectedAccounts.map((account) => account.display_name || account.worker_key || account.email || "Employee"),
    employee_keys: selectedAccounts.map((account) => account.worker_key || account.display_name || account.email || ""),
    employee_emails: selectedAccounts.map((account) => account.email || ""),
    created_by: userId || null,
    created_by_name: currentWorkerDisplay
  };

  const isEditing = Boolean(editingScheduleEventId);

  if (isDuplicateScheduleEvent(record, editingScheduleEventId)) {
    alert("That employee already has a schedule event for the same day and time.");
    return;
  }

  setStatus(isEditing ? "Updating schedule..." : "Saving schedule...");

  const query = isEditing
    ? supabaseClient
        .from("schedule_events")
        .update(record)
        .eq("id", editingScheduleEventId)
        .select()
        .single()
    : supabaseClient
        .from("schedule_events")
        .insert(record)
        .select()
        .single();
  const { data, error } = await query;

  if (error) {
    alert("Schedule could not be saved: " + (error.message || "Make sure the updated schedule setup SQL has been run."));
    setStatus("Schedule save failed: " + (error.message || "Supabase setup error."));
    return;
  }

  await saveScheduleMaintenanceLog(data, selectedVehicle, maintenanceReason);
  const syncResult = await syncJgcScheduleEventToGoogle(supabaseClient, {
    ...data,
    equipment_name: selectedVehicle ? getScheduleEquipmentLabel(selectedVehicle) : ""
  }, "upsert");

  if (!isEditing) {
    await createScheduleAnnouncements(data, selectedAccounts);
    try {
      await emailTaggedScheduleEmployees(data, selectedAccounts);
    } catch (emailError) {
      console.warn("Schedule tag email could not be sent.", emailError);
    }
  }
  selectedDate = makeLocalDate(data.event_date || eventDate);
  calendarMonth = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), 1);
  clearScheduleForm();
  await loadScheduleData();
  setStatus(syncResult.ok
    ? (isEditing ? "Schedule updated. Google Calendar sync queued." : "Schedule saved. Tagged employees were notified. Google Calendar sync queued.")
    : "Event saved, but Google Calendar sync failed.");
}

async function deleteScheduleEvent(id) {
  const event = scheduleEvents.find((item) => String(item.id) === String(id));

  if (!event || !canDeleteScheduleEvent(event) || !confirm("Delete this schedule item?")) {
    return;
  }

  await syncJgcScheduleEventToGoogle(supabaseClient, event, "delete");

  const { error } = await supabaseClient
    .from("schedule_events")
    .delete()
    .eq("id", id);

  if (error) {
    alert("Schedule item could not be deleted: " + (error.message || "You may not have permission to delete it."));
    return;
  }

  await loadScheduleData();
}

async function loadScheduleData() {
  if (!supabaseClient) {
    setStatus("Supabase is not available.");
    return;
  }

  setStatus("Loading schedule...");

  const [scheduleResult, vacationResult, workerResult, profileResult, jobsResult, equipmentResult] = await Promise.all([
    supabaseClient.from("schedule_events").select("*").order("event_date", { ascending: true }).order("start_time", { ascending: true }),
    supabaseClient.from("vacation_requests").select("id,worker_name,worker_display_name,start_date,end_date,status,google_event_id,google_sync_status,google_synced_at,google_sync_error").eq("status", "approved").order("start_date", { ascending: true }),
    JGCEmployeeFeatureAccess.loadWorkersForFeature(supabaseClient, "schedule"),
    supabaseClient.from("profiles").select("id,email,display_name,worker_key,role,account_status").order("display_name", { ascending: true }),
    supabaseClient.from("jobs").select("id,job_number,job_name,address,active").eq("active", true).order("job_number", { ascending: true }),
    supabaseClient.from("equipment_vehicles").select("*").eq("is_active", true).order("name", { ascending: true })
  ]);

  if (scheduleResult.error) {
    scheduleEvents = [];
    setStatus("Schedule could not load from Supabase: " + (scheduleResult.error.message || "Run the updated schedule setup SQL."));
  } else {
    scheduleEvents = scheduleResult.data || [];
    setStatus("Schedule loaded.");
  }

  vacationRequests = vacationResult.data || [];
  accounts = buildScheduleAccountsFromWorkOrderWorkers(workerResult.data || [], profileResult.data || []);
  jobs = jobsResult.data || [];
  equipmentItems = equipmentResult.data || [];
  renderJobOptions();
  renderVehicleOptions();
  renderEmployeeChecks();
  clearScheduleForm();
  renderCalendar();
  renderScheduleAgenda();
  renderSelectedDate();
}

async function signOut() {
  await signOutJgc(supabaseClient);
}

loadScheduleData();
</script>
