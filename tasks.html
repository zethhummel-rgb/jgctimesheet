<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="googlebot" content="noindex, nofollow, noarchive" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JGC Tasks</title>
<link rel="stylesheet" href="jgc-design-system.css?v=8" data-jgc-design-system="8">
<link rel="stylesheet" href="tasks-design-system.css?v=2">

</head>

<body class="tasks-page jgc-page jgc-system-page">
<main class="page tasks-page-shell jgc-page-shell jgc-stack">
  <header class="tasks-page-header jgc-page-header">
    <div class="logo-wrap jgc-brand">
      <img src="logo.webp" alt="John Gordon Construction logo">
    </div>
    <h1 class="jgc-page-title">Tasks</h1>
    <div id="currentUser" class="user-bar jgc-page-user"></div>
  </header>

  <div class="top-actions jgc-actions">
    <button class="jgc-button" type="button" onclick="window.location.href='home.html'">Home</button>
    <button type="button" class="secondary jgc-button jgc-button--secondary" onclick="openTaskList(true)">Refresh Tasks</button>
    <button type="button" class="secondary jgc-button jgc-button--secondary" onclick="signOut()">Logout</button>
  </div>

  <details id="taskFormDetails" class="task-form-details jgc-archive">
    <summary><span id="taskFormTitle" class="jgc-archive__title">New Task</span></summary>
    <div class="jgc-archive__body">
      <div class="small task-form-help jgc-muted">Only the title is required. Assignment, job, due date, priority, and category can all be left blank.</div>

    <div class="form-grid jgc-form-grid">
      <div class="field full jgc-field jgc-field--full">
        <label class="jgc-label" for="taskTitle">Task Title</label>
        <input class="jgc-input" id="taskTitle" maxlength="180" placeholder="Example: Fix WO name bug">
      </div>

      <div class="field jgc-field">
        <label class="jgc-label" for="taskStatus">Status</label>
        <select class="jgc-select" id="taskStatus">
          <option value="open">Open</option>
          <option value="in_progress">In Progress</option>
          <option value="complete">Complete</option>
          <option value="archived">Archived</option>
        </select>
      </div>

      <div class="field jgc-field">
        <label class="jgc-label" for="taskPriority">Priority</label>
        <select class="jgc-select" id="taskPriority">
          <option value="">No priority</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
          <option value="urgent">Urgent</option>
        </select>
      </div>

      <div class="field jgc-field">
        <label class="jgc-label" for="taskDueDate">Due Date</label>
        <input class="jgc-input" id="taskDueDate" type="date">
      </div>

      <div class="field jgc-field">
        <label class="jgc-label" for="taskCategory">Category</label>
        <select class="jgc-select" id="taskCategory">
          <option value="">No category</option>
          <option value="portal_fix">Portal Fix</option>
          <option value="field_work">Field Work</option>
          <option value="office">Office</option>
          <option value="safety">Safety</option>
          <option value="equipment">Equipment</option>
          <option value="job_follow_up">Job Follow-Up</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="field full jgc-field jgc-field--full">
        <label class="jgc-label">Assigned To</label>
        <div id="taskAssignedToList" class="assignee-checklist"></div>
        <div class="small jgc-muted">Optional. Select one or more workers, or leave blank for unassigned.</div>
      </div>

      <div class="field jgc-field">
        <label class="jgc-label" for="taskJobName">Job Name</label>
        <input class="jgc-input" id="taskJobName" list="taskJobOptions" placeholder="Optional job link" oninput="fillTaskJobFromName()">
        <datalist id="taskJobOptions"></datalist>
      </div>

      <div class="field jgc-field">
        <label class="jgc-label" for="taskJobNumber">Job Number</label>
        <input class="jgc-input" id="taskJobNumber" list="taskJobNumberOptions" placeholder="Optional job number" oninput="fillTaskJobFromNumber()">
        <datalist id="taskJobNumberOptions"></datalist>
      </div>

      <div class="field full jgc-field jgc-field--full">
        <label class="jgc-label" for="taskDescription">Notes</label>
        <textarea class="jgc-textarea" id="taskDescription" placeholder="Optional notes or details"></textarea>
      </div>
    </div>

    <div class="form-actions jgc-actions">
      <button id="taskSaveButton" class="jgc-button" type="button" onclick="saveTask()">Save Task</button>
      <button type="button" class="secondary jgc-button jgc-button--secondary" onclick="clearTaskForm()">Clear</button>
    </div>
      <div id="taskFormStatus" class="status-line jgc-notice" aria-live="polite"></div>
    </div>
  </details>

  <details id="taskListDetails" class="jgc-archive">
    <summary>
      <span class="jgc-archive__title">Task List</span>
      <span id="taskListLazyStatus" class="jgc-archive__count">Open to load</span>
    </summary>
    <div class="jgc-archive__body">
      <div class="filters jgc-tabs" id="taskFilters" role="tablist" aria-label="Task filters"></div>
      <div id="taskListStatus" class="status-line jgc-notice" aria-live="polite">Tasks have not been loaded yet.</div>
      <div id="taskList" class="task-grid"></div>
    </div>
  </details>
</main>

<script src="vendor/supabase-js.min.js?v=1" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';"></script>
<script src="common.js?v=41"></script>
<script src="employee-feature-access.js?v=3"></script>
<script>
const supabaseClient = createJgcSupabaseClient();
const worker = requireJgcWorker();
const taskPageParams = new URLSearchParams(window.location.search);
const currentWorker = normalizeWorkerName(worker.key);
const currentWorkerDisplay = worker.display || worker.key || "";
const currentWorkerEmail = normalizeWorkerName(worker.email);
const currentWorkerIsAdmin = isAdminWorker(worker.key, worker.role, worker.email);

let currentUserId = "";
let tasks = [];
let profiles = [];
let taskAssignees = [];
let jobs = [];
let activeFilter = "all";
let editingTaskId = "";
let taskFrameResizeTimer = null;
let taskFormDataLoaded = false;
let taskFormDataLoading = false;
let taskFormDataPromise = null;
let taskListLoaded = false;
let taskListLoading = false;
let taskListPromise = null;

const TASK_FILTERS = [
  { key: "all", label: "All Tasks" },
  { key: "open", label: "Open" },
  { key: "in_progress", label: "In Progress" },
  { key: "complete", label: "Complete" },
  { key: "archived", label: "Archived" },
  { key: "my", label: "My Tasks" },
  { key: "unassigned", label: "Unassigned" },
  { key: "high", label: "High Priority" },
  { key: "due_soon", label: "Due Soon" }
];

const STATUS_LABELS = {
  open: "Open",
  in_progress: "In Progress",
  complete: "Complete",
  archived: "Archived"
};

const PRIORITY_LABELS = {
  low: "Low",
  medium: "Medium",
  high: "High",
  urgent: "Urgent"
};

const CATEGORY_LABELS = {
  portal_fix: "Portal Fix",
  field_work: "Field Work",
  office: "Office",
  safety: "Safety",
  equipment: "Equipment",
  job_follow_up: "Job Follow-Up",
  other: "Other"
};

document.getElementById("currentUser").textContent = "Signed in as: " + currentWorkerDisplay;

if (taskPageParams.get("embedded") === "1") {
  document.body.classList.add("embedded-task-page");
}

function requestTaskFrameResize() {
  if (taskPageParams.get("embedded") !== "1" || window.parent === window) {
    return;
  }

  window.clearTimeout(taskFrameResizeTimer);
  taskFrameResizeTimer = window.setTimeout(function() {
    const page = document.querySelector(".page");
    const height = Math.max(
      document.body.scrollHeight,
      document.documentElement.scrollHeight,
      page ? page.scrollHeight : 0
    );

    window.parent.postMessage({
      type: "jgc-task-frame-height",
      height
    }, "*");
  }, 50);
}

function setupEmbeddedTaskFrameResize() {
  if (taskPageParams.get("embedded") !== "1" || window.parent === window) {
    return;
  }

  window.addEventListener("load", requestTaskFrameResize);
  window.addEventListener("resize", requestTaskFrameResize);
  document.addEventListener("toggle", requestTaskFrameResize, true);

  if ("ResizeObserver" in window) {
    const observer = new ResizeObserver(requestTaskFrameResize);
    observer.observe(document.body);
    const page = document.querySelector(".page");

    if (page) {
      observer.observe(page);
    }
  }

  requestTaskFrameResize();
}

setupEmbeddedTaskFrameResize();

function setTaskFormStatus(message, isError) {
  const element = document.getElementById("taskFormStatus");
  element.textContent = message || "";
  element.classList.toggle("error", Boolean(isError));
  element.classList.toggle("jgc-notice--danger", Boolean(isError));
  requestTaskFrameResize();
}

function setTaskListStatus(message, isError) {
  const element = document.getElementById("taskListStatus");
  element.textContent = message || "";
  element.classList.toggle("error", Boolean(isError));
  element.classList.toggle("jgc-notice--danger", Boolean(isError));
  requestTaskFrameResize();
}

function getProfileName(profile) {
  return profile ? (profile.display_name || profile.worker_key || profile.email || "Employee") : "";
}

function getAssigneeName(assignee) {
  return assignee ? (assignee.name || assignee.worker_key || assignee.email || "Employee") : "";
}

function isHiddenTaskAssignee(record) {
  const email = normalizeWorkerName(record && record.email);
  const names = [
    record && record.display_name,
    record && record.name,
    record && record.worker_key,
    record && record.email
  ].map(normalizeWorkerName).filter(Boolean);

  return email === "zethhummel@gmail.com" ||
    names.includes("test account") ||
    names.includes("john smith");
}

function getHiddenTaskAssigneeProfileIds(profileRows) {
  return new Set((profileRows || [])
    .filter(isHiddenTaskAssignee)
    .map((profile) => profile.id)
    .filter(Boolean));
}

function getAssigneeByValue(value) {
  return taskAssignees.find((item) => item.value === value) || null;
}

function getSelectedAssignedRecords() {
  return Array.from(document.querySelectorAll('input[name="taskAssignedTo"]:checked'))
    .map((input) => getAssigneeByValue(input.value))
    .filter(Boolean);
}

function getSelectedAssignedNames() {
  return getSelectedAssignedRecords().map(getAssigneeName).filter(Boolean);
}

function getSelectedAssignedProfileIds() {
  return getSelectedAssignedRecords()
    .map((assignee) => assignee.profileId)
    .filter(Boolean);
}

function getTaskAssignedProfileIds(task) {
  const ids = [];

  if (Array.isArray(task.assigned_to_ids)) {
    task.assigned_to_ids.forEach((id) => {
      if (id && !ids.includes(id)) {
        ids.push(id);
      }
    });
  }

  if (task.assigned_to && !ids.includes(task.assigned_to)) {
    ids.push(task.assigned_to);
  }

  return ids;
}

function getTaskAssignedNames(task) {
  const names = [];

  function addName(name) {
    const clean = String(name || "").trim();
    if (clean && !names.some((item) => normalizeWorkerName(item) === normalizeWorkerName(clean))) {
      names.push(clean);
    }
  }

  if (Array.isArray(task.assigned_to_names)) {
    task.assigned_to_names.forEach(addName);
  }

  if (task.assigned_to_name) {
    String(task.assigned_to_name)
      .split(",")
      .forEach(addName);
  }

  return names;
}

function getTaskAssignedDisplay(task) {
  const names = getTaskAssignedNames(task);
  return names.length ? names.join(", ") : "Unassigned";
}

function isTaskUnassigned(task) {
  return !getTaskAssignedProfileIds(task).length && !getTaskAssignedNames(task).length;
}

function getTaskStatusLabel(value) {
  return STATUS_LABELS[value] || "Open";
}

function getTaskPriorityLabel(value) {
  return PRIORITY_LABELS[value] || "";
}

function getTaskCategoryLabel(value) {
  return CATEGORY_LABELS[value] || "";
}

function formatTaskDate(value) {
  if (!value) {
    return "";
  }

  const pieces = String(value).split("-");
  if (pieces.length === 3) {
    const date = new Date(Number(pieces[0]), Number(pieces[1]) - 1, Number(pieces[2]));
    return date.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }

  const parsed = new Date(value);
  return Number.isNaN(parsed.getTime()) ? String(value) : parsed.toLocaleDateString();
}

function formatTaskDateTime(value) {
  if (!value) {
    return "";
  }

  const parsed = new Date(value);
  return Number.isNaN(parsed.getTime()) ? String(value) : parsed.toLocaleString();
}

function isDueSoon(task) {
  if (!task.due_date || task.status === "complete" || task.status === "archived") {
    return false;
  }

  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const due = new Date(task.due_date + "T00:00:00");
  const diffDays = Math.round((due - today) / 86400000);
  return diffDays >= 0 && diffDays <= 7;
}

function isMyTask(task) {
  const assignedIds = getTaskAssignedProfileIds(task);
  const assignedNames = getTaskAssignedNames(task).map(normalizeWorkerName);
  return (
    (currentUserId && assignedIds.includes(currentUserId)) ||
    (currentUserId && task.created_by === currentUserId) ||
    assignedNames.includes(currentWorker) ||
    assignedNames.includes(normalizeWorkerName(currentWorkerDisplay)) ||
    (task.created_by_name && normalizeWorkerName(task.created_by_name) === normalizeWorkerName(currentWorkerDisplay))
  );
}

function canChangeTask(task) {
  return currentWorkerIsAdmin || isTaskUnassigned(task) || task.created_by === currentUserId || isMyTask(task);
}

function getFilteredTasks() {
  return tasks.filter((task) => {
    if (activeFilter === "all") return task.status !== "complete" && task.status !== "archived";
    if (activeFilter === "open") return task.status === "open";
    if (activeFilter === "in_progress") return task.status === "in_progress";
    if (activeFilter === "complete") return task.status === "complete";
    if (activeFilter === "archived") return task.status === "archived";
    if (activeFilter === "my") return isMyTask(task);
    if (activeFilter === "unassigned") return isTaskUnassigned(task);
    if (activeFilter === "high") return task.priority === "high" || task.priority === "urgent";
    if (activeFilter === "due_soon") return isDueSoon(task);
    return true;
  }).sort(sortTasks);
}

function sortTasks(a, b) {
  const statusSort = { open: 0, in_progress: 1, complete: 2, archived: 3 };
  const prioritySort = { urgent: 0, high: 1, medium: 2, low: 3 };
  const aStatus = statusSort[a.status] ?? 9;
  const bStatus = statusSort[b.status] ?? 9;

  if (aStatus !== bStatus) {
    return aStatus - bStatus;
  }

  if (a.due_date || b.due_date) {
    if (!a.due_date) return 1;
    if (!b.due_date) return -1;
    if (a.due_date !== b.due_date) {
      return String(a.due_date).localeCompare(String(b.due_date));
    }
  }

  const aPriority = prioritySort[a.priority] ?? 9;
  const bPriority = prioritySort[b.priority] ?? 9;
  if (aPriority !== bPriority) {
    return aPriority - bPriority;
  }

  return new Date(b.updated_at || b.created_at || 0) - new Date(a.updated_at || a.created_at || 0);
}

function renderFilters() {
  document.getElementById("taskFilters").innerHTML = TASK_FILTERS.map((filter) => {
    const active = activeFilter === filter.key ? "active" : "";
    return '<button type="button" class="jgc-tab ' + active + '" role="tab" aria-selected="' + (active ? 'true' : 'false') + '" onclick="setTaskFilter(\'' + filter.key + '\')">' + escapeHtml(filter.label) + '</button>';
  }).join("");
}

function setTaskFilter(filter) {
  activeFilter = filter;
  renderTasks();
}

function renderTaskFormOptions() {
  const assignmentOptions = taskAssignees
    .slice()
    .sort((a, b) => getAssigneeName(a).localeCompare(getAssigneeName(b)))
    .map((assignee) => {
      const label = getAssigneeName(assignee);
      const source = assignee.source ? '<span class="assignee-source">' + escapeHtml(assignee.source) + '</span>' : "";
      return '<label class="assignee-option"><input type="checkbox" name="taskAssignedTo" value="' + escapeHtml(assignee.value) + '"><span>' + escapeHtml(label) + '</span>' + source + '</label>';
    })
    .join("");
  document.getElementById("taskAssignedToList").innerHTML = assignmentOptions || '<div class="small jgc-muted">No approved workers found.</div>';

  document.getElementById("taskJobOptions").innerHTML = jobs.map((job) => {
    const name = String(job.job_name || "").trim();
    const number = String(job.job_number || "").trim();
    const value = number && name ? number + " - " + name : (name || number);
    return '<option value="' + escapeHtml(value) + '"></option>';
  }).join("");

  document.getElementById("taskJobNumberOptions").innerHTML = jobs.map((job) =>
    '<option value="' + escapeHtml(job.job_number || "") + '">' + escapeHtml(job.job_name || "") + '</option>'
  ).join("");
  requestTaskFrameResize();
}

function mergeAssigneeSource(assignee, source) {
  const current = String(assignee.source || "").split(" / ").filter(Boolean);
  if (source && !current.includes(source)) {
    current.push(source);
  }
  assignee.source = current.join(" / ");
}

function buildTaskAssignees(profileRows, labourRows) {
  const result = [];
  const byKey = new Map();
  const hiddenProfileIds = getHiddenTaskAssigneeProfileIds(profileRows);

  function upsertAssignee(record) {
    const keys = record.keys.filter(Boolean);
    const existing = keys.map((key) => byKey.get(key)).find(Boolean);

    if (existing) {
      mergeAssigneeSource(existing, record.source);

      if (!existing.profileId && record.profileId) {
        existing.profileId = record.profileId;
        existing.value = record.profileId;
      }

      keys.forEach((key) => byKey.set(key, existing));
      return;
    }

    const assignee = {
      value: record.profileId || record.value,
      profileId: record.profileId || null,
      name: record.name,
      email: record.email || "",
      workerKey: record.workerKey || "",
      source: record.source || ""
    };

    result.push(assignee);
    keys.forEach((key) => byKey.set(key, assignee));
  }

  (profileRows || []).forEach((profile) => {
    if (hiddenProfileIds.has(profile.id) || isHiddenTaskAssignee(profile)) {
      return;
    }

    const name = getProfileName(profile);
    upsertAssignee({
      value: profile.id,
      profileId: profile.id,
      name,
      email: profile.email || "",
      workerKey: profile.worker_key || "",
      source: "Portal",
      keys: [
        "profile:" + profile.id,
        "name:" + normalizeWorkerName(name),
        profile.email ? "email:" + normalizeWorkerName(profile.email) : "",
        profile.worker_key ? "worker:" + normalizeWorkerName(profile.worker_key) : ""
      ]
    });
  });

  (labourRows || []).forEach((workerRow) => {
    if ((workerRow.profile_id && hiddenProfileIds.has(workerRow.profile_id)) || isHiddenTaskAssignee(workerRow)) {
      return;
    }

    const name = workerRow.display_name || workerRow.worker_key || "WO Worker";
    const profileId = workerRow.profile_id || null;
    upsertAssignee({
      value: "wo:" + (workerRow.id || normalizeWorkerName(name)),
      profileId,
      name,
      workerKey: workerRow.worker_key || "",
      source: "WO",
      keys: [
        profileId ? "profile:" + profileId : "",
        "name:" + normalizeWorkerName(name),
        workerRow.worker_key ? "worker:" + normalizeWorkerName(workerRow.worker_key) : ""
      ]
    });
  });

  return result;
}

function getTaskAssigneeValues(task) {
  const values = new Set();

  getTaskAssignedProfileIds(task).forEach((id) => {
    const profileMatch = taskAssignees.find((item) => item.profileId === id || item.value === id);
    if (profileMatch) {
      values.add(profileMatch.value);
    }
  });

  getTaskAssignedNames(task).forEach((name) => {
    const assignedName = normalizeWorkerName(name);
    const nameMatch = taskAssignees.find((item) => normalizeWorkerName(getAssigneeName(item)) === assignedName);
    if (nameMatch) {
      values.add(nameMatch.value);
    }
  });

  return Array.from(values);
}

function setTaskAssigneeValues(values) {
  const selectedValues = new Set(values || []);
  document.querySelectorAll('input[name="taskAssignedTo"]').forEach((input) => {
    input.checked = selectedValues.has(input.value);
  });
}

function getPrimaryAssignedProfileId(profileIds) {
  return profileIds.length ? profileIds[0] : null;
}

function getPrimaryAssignedName(names) {
  return names.length ? names[0] : null;
}

function getAssignedNameText(names) {
  return names.length ? names.join(", ") : null;
}

function normalizeTaskAfterLoad(task) {
  const profileIds = getTaskAssignedProfileIds(task);
  const names = getTaskAssignedNames(task);

  return {
    ...task,
    assigned_to_ids: profileIds,
    assigned_to_names: names
  };
}

function hasMissingTaskAssignmentColumns(error) {
  const message = String((error && error.message) || "").toLowerCase();
  return message.includes("assigned_to_ids") || message.includes("assigned_to_names");
}

async function saveTaskPayload(payload, insertPayload) {
  const query = editingTaskId
    ? supabaseClient.from("tasks").update(payload).eq("id", editingTaskId)
    : supabaseClient.from("tasks").insert(insertPayload);

  const result = await query;

  if (!result.error || !hasMissingTaskAssignmentColumns(result.error)) {
    return result;
  }

  const legacyPayload = { ...payload };
  delete legacyPayload.assigned_to_ids;
  delete legacyPayload.assigned_to_names;

  const legacyInsertPayload = { ...insertPayload };
  delete legacyInsertPayload.assigned_to_ids;
  delete legacyInsertPayload.assigned_to_names;

  return editingTaskId
    ? supabaseClient.from("tasks").update(legacyPayload).eq("id", editingTaskId)
    : supabaseClient.from("tasks").insert(legacyInsertPayload);
}

function findJobByNameInput(value) {
  const text = normalizeWorkerName(value);
  return jobs.find((job) => {
    const name = normalizeWorkerName(job.job_name);
    const number = normalizeWorkerName(job.job_number);
    const display = normalizeWorkerName((job.job_number ? job.job_number + " - " : "") + (job.job_name || ""));
    return text && (text === display || text === name || text === number);
  }) || null;
}

function fillTaskJobFromName() {
  const job = findJobByNameInput(document.getElementById("taskJobName").value);
  if (!job) {
    return;
  }

  document.getElementById("taskJobName").value = job.job_name || "";
  document.getElementById("taskJobNumber").value = job.job_number || "";
}

function fillTaskJobFromNumber() {
  const number = normalizeWorkerName(document.getElementById("taskJobNumber").value);
  const job = jobs.find((item) => normalizeWorkerName(item.job_number) === number);
  if (!job) {
    return;
  }

  document.getElementById("taskJobName").value = job.job_name || "";
}

function renderTasks() {
  renderFilters();
  const list = document.getElementById("taskList");
  const filtered = getFilteredTasks();

  setTaskListStatus(filtered.length + " task" + (filtered.length === 1 ? "" : "s") + " shown.");

  if (!filtered.length) {
    list.innerHTML = '<div class="empty-state jgc-empty-state">No tasks found for this filter.</div>';
    requestTaskFrameResize();
    return;
  }

  list.innerHTML = filtered.map(renderTaskCard).join("");
  requestTaskFrameResize();
}

function renderTaskCard(task) {
  const status = task.status || "open";
  const priority = task.priority || "";
  const category = task.category || "";
  const assignedTo = getTaskAssignedDisplay(task);
  const job = [task.job_number, task.job_name].filter(Boolean).join(" - ");
  const notes = String(task.description || "").trim();
  const canChange = canChangeTask(task);
  const canDelete = currentWorkerIsAdmin;

  return `
    <article class="task-card jgc-card ${escapeHtml(status)}">
      <div class="task-title-row">
        <div class="task-title">${escapeHtml(task.title || "Untitled Task")}</div>
        ${task.due_date ? '<span class="badge task-badge jgc-badge">' + escapeHtml(formatTaskDate(task.due_date)) + '</span>' : ""}
      </div>

      <div class="badge-row">
        <span class="badge task-badge jgc-badge ${escapeHtml(status)}">${escapeHtml(getTaskStatusLabel(status))}</span>
        ${priority ? '<span class="badge task-badge jgc-badge priority-' + escapeHtml(priority) + '">' + escapeHtml(getTaskPriorityLabel(priority)) + '</span>' : ""}
        ${category ? '<span class="badge task-badge jgc-badge">' + escapeHtml(getTaskCategoryLabel(category)) + '</span>' : ""}
        ${isDueSoon(task) ? '<span class="badge task-badge jgc-badge priority-high">Due Soon</span>' : ""}
      </div>

      <div class="task-meta">
        <div class="meta-box"><strong>Assigned To</strong>${escapeHtml(assignedTo)}</div>
        <div class="meta-box"><strong>Job</strong>${escapeHtml(job || "No job linked")}</div>
        <div class="meta-box"><strong>Created By</strong>${escapeHtml(task.created_by_name || "-")}</div>
        <div class="meta-box"><strong>Last Updated</strong>${escapeHtml(formatTaskDateTime(task.updated_at || task.created_at) || "-")}</div>
      </div>

      ${notes ? '<div class="notes-preview">' + escapeHtml(notes.length > 220 ? notes.slice(0, 220) + "..." : notes) + '</div>' : ""}

      <div class="task-actions jgc-actions">
        ${status !== "complete" && status !== "archived" && canChange ? '<button type="button" class="jgc-button" onclick="updateTaskStatus(\'' + escapeHtml(task.id) + '\', \'complete\')">Mark Complete</button>' : ""}
        ${status === "open" && canChange ? '<button type="button" class="secondary jgc-button jgc-button--secondary" onclick="updateTaskStatus(\'' + escapeHtml(task.id) + '\', \'in_progress\')">Start</button>' : ""}
        ${(status === "complete" || status === "archived" || status === "in_progress") && canChange ? '<button type="button" class="secondary jgc-button jgc-button--secondary" onclick="updateTaskStatus(\'' + escapeHtml(task.id) + '\', \'open\')">Reopen</button>' : ""}
        ${status !== "archived" && canChange ? '<button type="button" class="secondary jgc-button jgc-button--secondary" onclick="updateTaskStatus(\'' + escapeHtml(task.id) + '\', \'archived\')">Archive</button>' : ""}
        ${canChange ? '<button type="button" class="secondary jgc-button jgc-button--secondary" onclick="editTask(\'' + escapeHtml(task.id) + '\')">Edit</button>' : ""}
        ${canDelete ? '<button type="button" class="danger jgc-button jgc-button--danger" onclick="deleteTask(\'' + escapeHtml(task.id) + '\')">Delete</button>' : ""}
      </div>
    </article>
  `;
}

function clearTaskForm() {
  editingTaskId = "";
  document.getElementById("taskFormTitle").textContent = "New Task";
  document.getElementById("taskSaveButton").textContent = "Save Task";
  document.getElementById("taskTitle").value = "";
  document.getElementById("taskStatus").value = "open";
  document.getElementById("taskPriority").value = "";
  document.getElementById("taskDueDate").value = "";
  setTaskAssigneeValues([]);
  document.getElementById("taskCategory").value = "";
  document.getElementById("taskJobName").value = "";
  document.getElementById("taskJobNumber").value = "";
  document.getElementById("taskDescription").value = "";
  setTaskFormStatus("");
  requestTaskFrameResize();
}

async function editTask(id) {
  const task = tasks.find((item) => item.id === id);
  if (!task) {
    alert("Task could not be found.");
    return;
  }

  await ensureTaskFormDataLoaded();
  editingTaskId = id;
  document.getElementById("taskFormDetails").open = true;
  document.getElementById("taskFormTitle").textContent = "Edit Task";
  document.getElementById("taskSaveButton").textContent = "Update Task";
  document.getElementById("taskTitle").value = task.title || "";
  document.getElementById("taskStatus").value = task.status || "open";
  document.getElementById("taskPriority").value = task.priority || "";
  document.getElementById("taskDueDate").value = task.due_date || "";
  setTaskAssigneeValues(getTaskAssigneeValues(task));
  document.getElementById("taskCategory").value = task.category || "";
  document.getElementById("taskJobName").value = task.job_name || "";
  document.getElementById("taskJobNumber").value = task.job_number || "";
  document.getElementById("taskDescription").value = task.description || "";
  setTaskFormStatus("Editing task.");
  requestTaskFrameResize();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function saveTask() {
  await ensureTaskFormDataLoaded();
  const title = document.getElementById("taskTitle").value.trim();
  const status = document.getElementById("taskStatus").value || "open";
  const priority = document.getElementById("taskPriority").value || null;
  const dueDate = document.getElementById("taskDueDate").value || null;
  const assignedProfileIds = getSelectedAssignedProfileIds();
  const assignedNames = getSelectedAssignedNames();
  const category = document.getElementById("taskCategory").value || null;
  const jobName = document.getElementById("taskJobName").value.trim();
  const jobNumber = document.getElementById("taskJobNumber").value.trim();
  const description = document.getElementById("taskDescription").value.trim();

  if (!title) {
    setTaskFormStatus("Enter a task title.", true);
    return;
  }

  const payload = {
    title,
    description: description || null,
    status,
    priority,
    due_date: dueDate,
    assigned_to: getPrimaryAssignedProfileId(assignedProfileIds),
    assigned_to_name: getAssignedNameText(assignedNames),
    assigned_to_ids: assignedProfileIds,
    assigned_to_names: assignedNames,
    job_name: jobName || null,
    job_number: jobNumber || null,
    category,
    completed_at: status === "complete" ? new Date().toISOString() : null,
    completed_by: status === "complete" ? (currentUserId || null) : null,
    completed_by_name: status === "complete" ? currentWorkerDisplay : null
  };

  setTaskFormStatus(editingTaskId ? "Updating task..." : "Saving task...");

  const { error } = await saveTaskPayload(payload, {
    ...payload,
    created_by: currentUserId || null,
    created_by_name: currentWorkerDisplay || currentWorker
  });

  if (error) {
    setTaskFormStatus("Task could not be saved: " + error.message, true);
    return;
  }

  clearTaskForm();
  setTaskFormStatus("Task saved.");
  await loadTasks();
}

async function updateTaskStatus(id, status) {
  const task = tasks.find((item) => item.id === id);
  if (!task || !canChangeTask(task)) {
    alert("You cannot update this task.");
    return;
  }

  const payload = {
    status,
    completed_at: status === "complete" ? new Date().toISOString() : null,
    completed_by: status === "complete" ? (currentUserId || null) : null,
    completed_by_name: status === "complete" ? currentWorkerDisplay : null
  };

  const { error } = await supabaseClient
    .from("tasks")
    .update(payload)
    .eq("id", id);

  if (error) {
    alert("Task could not be updated: " + error.message);
    return;
  }

  await loadTasks();
}

async function deleteTask(id) {
  if (!currentWorkerIsAdmin) {
    alert("Only admins can delete tasks.");
    return;
  }

  const task = tasks.find((item) => item.id === id);
  const label = task ? task.title : "this task";

  if (!confirm("Delete \"" + label + "\"? This cannot be undone.")) {
    return;
  }

  const { error } = await supabaseClient
    .from("tasks")
    .delete()
    .eq("id", id);

  if (error) {
    alert("Task could not be deleted: " + error.message);
    return;
  }

  await loadTasks();
}

async function loadProfiles() {
  const [profileResult, labourResult] = await Promise.all([
    supabaseClient
      .from("profiles")
      .select("id,email,display_name,worker_key,account_status,role")
      .eq("account_status", "approved")
      .order("display_name", { ascending: true }),
    JGCEmployeeFeatureAccess.loadWorkersForFeature(supabaseClient, "tasks")
  ]);

  if (profileResult.error) {
    setTaskFormStatus("Employee list could not be loaded: " + profileResult.error.message, true);
    profiles = [];
  } else {
    profiles = profileResult.data || [];
  }

  if (labourResult.error) {
    setTaskFormStatus("WO employee list could not be loaded: " + labourResult.error.message, true);
  }

  taskAssignees = buildTaskAssignees(profiles, labourResult.data || []);
}

async function loadJobs() {
  const { data, error } = await supabaseClient
    .from("jobs")
    .select("job_number,job_name,active")
    .eq("active", true)
    .order("job_number", { ascending: true });

  if (error) {
    jobs = [];
    return;
  }

  jobs = data || [];
}

async function loadTasks() {
  if (!supabaseClient) {
    setTaskListStatus("Supabase is not available.", true);
    taskListLoading = false;
    document.getElementById("taskListLazyStatus").textContent = "Unavailable";
    return;
  }

  setTaskListStatus("Loading tasks...");

  const { data, error } = await supabaseClient
    .from("tasks")
    .select("*")
    .order("updated_at", { ascending: false });

  if (error) {
    setTaskListStatus("Tasks could not be loaded: " + error.message, true);
    tasks = [];
    taskListLoading = false;
    taskListLoaded = false;
    document.getElementById("taskListLazyStatus").textContent = "Retry";
    renderTasks();
    return;
  }

  tasks = (data || []).map(normalizeTaskAfterLoad);
  taskListLoaded = true;
  taskListLoading = false;
  document.getElementById("taskListLazyStatus").textContent = `${tasks.length} task${tasks.length === 1 ? "" : "s"}`;
  renderTasks();
}

async function ensureTaskFormDataLoaded() {
  if (taskFormDataLoaded || !supabaseClient) return;
  if (taskFormDataPromise) return taskFormDataPromise;

  taskFormDataLoading = true;
  setTaskFormStatus("Loading employee and job choices...");
  taskFormDataPromise = (async () => {
    try {
      await Promise.all([loadProfiles(), loadJobs()]);
      renderTaskFormOptions();
      taskFormDataLoaded = true;
      setTaskFormStatus("");
    } finally {
      taskFormDataLoading = false;
      taskFormDataPromise = null;
    }
  })();

  return taskFormDataPromise;
}

async function ensureTaskListLoaded(forceRefresh) {
  if (taskListLoaded && !forceRefresh) return;
  if (taskListPromise) return taskListPromise;

  taskListLoading = true;
  document.getElementById("taskListLazyStatus").textContent = "Loading...";
  taskListPromise = loadTasks().finally(() => {
    taskListLoading = false;
    taskListPromise = null;
  });
  return taskListPromise;
}

function openTaskList(forceRefresh) {
  const details = document.getElementById("taskListDetails");
  if (details) details.open = true;
  return ensureTaskListLoaded(Boolean(forceRefresh));
}

async function loadInitialData() {
  if (!supabaseClient) {
    setTaskListStatus("Supabase is not available.", true);
    return;
  }

  try {
    const userResult = await supabaseClient.auth.getUser();
    currentUserId = userResult.data && userResult.data.user ? userResult.data.user.id : "";
  } catch (err) {
    currentUserId = "";
  }

  if (taskPageParams.get("embedded") === "1") {
    await openTaskList(false);
  }
}

document.getElementById("taskFormDetails").addEventListener("toggle", function() {
  if (this.open) ensureTaskFormDataLoaded();
});
document.getElementById("taskListDetails").addEventListener("toggle", function() {
  if (this.open) ensureTaskListLoaded(false);
});
loadInitialData();
</script>
</body>
</html>
