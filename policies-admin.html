<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="googlebot" content="noindex, nofollow, noarchive" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JGC Portal - Manage Policies</title>
<link rel="stylesheet" href="jgc-design-system.css?v=8" data-jgc-design-system="8">
</head>
<body class="policy-page jgc-page jgc-system-page">
<main class="page-shell policy-page-shell jgc-page-shell jgc-stack">
  <div class="top-actions jgc-topbar">
    <div class="brand jgc-brand-lockup">
      <img src="logo.webp" alt="John Gordon Construction">
      <div>
        <h1 class="jgc-brand-lockup__title">Manage Policies</h1>
        <div class="jgc-brand-lockup__meta" id="workerName"></div>
      </div>
    </div>
    <div class="actions jgc-actions">
      <button class="jgc-button" type="button" onclick="window.location.href='policies-announcements.html'">Policies Page</button>
      <button class="secondary jgc-button jgc-button--secondary" type="button" onclick="window.location.href='admin.html'">Admin</button>
      <button class="secondary jgc-button jgc-button--secondary" type="button" onclick="window.location.href='home.html'">Home</button>
    </div>
  </div>

  <section class="card jgc-panel">
    <h2 class="jgc-section-title">Add Policy PDF</h2>
    <div class="form-grid jgc-form-grid">
      <div class="jgc-field">
        <label class="jgc-label" for="policyTitle">Policy Title</label>
        <input class="jgc-input" id="policyTitle" placeholder="Example: Fall Protection Policy">
      </div>
      <div class="jgc-field">
        <label class="jgc-label" for="policyCategory">Category</label>
        <input class="jgc-input" id="policyCategory" placeholder="Example: Safety" value="General">
      </div>
      <div class="jgc-field">
        <label class="jgc-label" for="policyOrder">Display Order</label>
        <input class="jgc-input" id="policyOrder" type="number" value="0">
      </div>
      <div class="full jgc-field jgc-field--full">
        <label class="jgc-label" for="policyDescription">Description</label>
        <textarea class="jgc-textarea" id="policyDescription" placeholder="Short description for employees"></textarea>
      </div>
      <div class="full jgc-field jgc-field--full">
        <label class="jgc-label" for="policyFile">Policy PDF</label>
        <input class="jgc-input" id="policyFile" type="file" accept="application/pdf,.pdf">
      </div>
    </div>
    <div class="actions jgc-actions">
      <button id="policySaveButton" class="jgc-button" type="button">Add Policy</button>
      <button id="policyRefreshButton" class="secondary jgc-button jgc-button--secondary" type="button">Refresh Policies</button>
    </div>
    <div id="policyStatus" class="jgc-notice" role="status" aria-live="polite"></div>
  </section>

  <section class="card jgc-panel">
    <h2 class="jgc-section-title">Current Policies</h2>
    <div id="policiesList" class="jgc-muted">Loading policies...</div>
  </section>
</main>

<script src="vendor/supabase-js.min.js?v=1" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';"></script>
<script src="common.js?v=42"></script>
<script>
const supabaseClient = createJgcSupabaseClient();
const worker = requireJgcWorker();
let policies = [];
let policyUrls = {};
let currentUserId = "";

if (!isAdminWorker(worker.key, worker.role)) {
  alert("Policy management is only available to authorized admins.");
  window.location.href = "home.html";
}

document.getElementById("workerName").textContent = "Signed in as: " + (worker.display || worker.key || "");

loadPolicies();

if (supabaseClient) {
  supabaseClient.auth.getSession().then((result) => {
    currentUserId = result.data.session && result.data.session.user
      ? result.data.session.user.id
      : "";
  });
}

document.getElementById("policySaveButton").addEventListener("click", publishPolicy);
document.getElementById("policyRefreshButton").addEventListener("click", loadPolicies);

function setPolicyStatus(message, type) {
  const status = document.getElementById("policyStatus");
  status.textContent = message || "";
  status.classList.toggle("jgc-notice--danger", type === "error");
  status.classList.toggle("jgc-notice--success", type === "success");
}

function makeSafeFileName(name) {
  return String(name || "policy.pdf")
    .trim()
    .replace(/[^a-z0-9.\-_]+/gi, "-")
    .replace(/-+/g, "-")
    .toLowerCase();
}

async function preparePolicyUrls() {
  policyUrls = {};

  for (const policy of policies) {
    if (!policy.file_path) {
      continue;
    }

    const { data } = await supabaseClient
      .storage
      .from("policies")
      .createSignedUrl(policy.file_path, 604800);

    if (data && data.signedUrl) {
      policyUrls[policy.id] = data.signedUrl;
    }
  }
}

function renderPolicies() {
  const list = document.getElementById("policiesList");

  if (!policies.length) {
    list.textContent = "No active policies yet.";
    return;
  }

  list.innerHTML = `
    <div class="table-wrap jgc-table-wrap">
      <table class="jgc-table jgc-table--wide">
        <thead>
          <tr>
            <th>Title</th>
            <th>Category</th>
            <th>Description</th>
            <th>PDF</th>
            <th>Order</th>
            <th>Created</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          ${policies.map((policy) => `
            <tr>
              <td>${escapeHtml(policy.title)}</td>
              <td>${escapeHtml(policy.category || "General")}</td>
              <td>${escapeHtml(policy.description || "")}</td>
              <td>${policyUrls[policy.id] ? '<a class="file-link jgc-button" href="' + policyUrls[policy.id] + '" target="_blank" rel="noopener">Open PDF</a>' : "-"}</td>
              <td>${Number(policy.sort_order || 0)}</td>
              <td>${escapeHtml(formatDisplayDate(policy.created_at))}</td>
              <td><button type="button" class="delete-button jgc-button jgc-button--danger" data-policy-delete="${escapeHtml(policy.id)}">Delete</button></td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;

  list.querySelectorAll("[data-policy-delete]").forEach((button) => {
    button.addEventListener("click", () => deletePolicy(button.dataset.policyDelete));
  });
}

async function loadPolicies() {
  const { data, error } = await supabaseClient
    .from("policies")
    .select("*")
    .eq("is_active", true)
    .order("sort_order", { ascending: true })
    .order("title", { ascending: true });

  if (error) {
    document.getElementById("policiesList").textContent = "Policies could not be loaded.";
    return;
  }

  policies = data || [];
  await preparePolicyUrls();
  renderPolicies();
}

async function publishPolicy() {
  const title = document.getElementById("policyTitle").value.trim();
  const description = document.getElementById("policyDescription").value.trim();
  const category = document.getElementById("policyCategory").value.trim() || "General";
  const sortOrder = Number(document.getElementById("policyOrder").value || 0);
  const fileInput = document.getElementById("policyFile");
  const file = fileInput.files[0];

  if (!title || !file) {
    alert("Add a policy title and PDF.");
    return;
  }

  if (file.type && file.type !== "application/pdf") {
    alert("Please upload a PDF file.");
    return;
  }

  setPolicyStatus("Uploading policy PDF...");

  const filePath = "policies/" + Date.now() + "-" + makeSafeFileName(file.name);
  const fileType = file.type || "application/pdf";
  const { error: uploadError } = await uploadJgcFile({
    client: supabaseClient,
    bucket: "policies",
    path: filePath,
    file,
    input: fileInput,
    cacheControl: "3600",
    upsert: false,
    contentType: fileType,
    retry: publishPolicy
  });

  if (uploadError) {
    setPolicyStatus("Policy PDF upload failed: " + uploadError.message, "error");
    return;
  }

  setPolicyStatus("Saving policy...");

  const { error } = await supabaseClient
    .from("policies")
    .insert({
      title,
      description,
      category,
      sort_order: Number.isFinite(sortOrder) ? sortOrder : 0,
      file_path: filePath,
      file_name: file.name,
      file_type: fileType,
      created_by: currentUserId || null,
      created_by_name: worker.display || worker.key
    });

  if (error) {
    await supabaseClient.storage.from("policies").remove([filePath]);
    setPolicyStatus("Policy could not be saved.", "error");
    return;
  }

  document.getElementById("policyTitle").value = "";
  document.getElementById("policyDescription").value = "";
  document.getElementById("policyCategory").value = "General";
  document.getElementById("policyOrder").value = "0";
  fileInput.value = "";
  setPolicyStatus("Policy added.", "success");
  await loadPolicies();
}

async function deletePolicy(id) {
  const policy = policies.find((item) => item.id === id);

  if (!policy) {
    alert("Policy could not be found.");
    return;
  }

  if (!confirm("Delete this policy?")) {
    return;
  }

  const { error } = await supabaseClient
    .from("policies")
    .update({
      is_active: false,
      updated_at: new Date().toISOString()
    })
    .eq("id", id);

  if (error) {
    alert("Policy could not be deleted.");
    return;
  }

  await loadPolicies();
}
</script>
</body>
</html>
