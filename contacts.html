<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="googlebot" content="noindex, nofollow, noarchive" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JGC Contacts</title>
<link rel="stylesheet" href="jgc-design-system.css?v=8">
<link rel="stylesheet" href="directory-design-system.css?v=2">
</head>

<body class="directory-page jgc-page jgc-system-page">
<main class="directory-page-shell jgc-page-shell">
<div class="logo-wrap jgc-brand-region">
    <img src="logo.webp" alt="John Gordon Construction logo">
</div>

<h1 class="jgc-page-title">Contacts</h1>
<div id="currentUser" class="user-bar jgc-user-line"></div>

<div class="actions jgc-actions">
    <button class="secondary jgc-button jgc-button--secondary" type="button" onclick="window.location.href='home.html'">Home</button>
    <button class="secondary jgc-button jgc-button--secondary" type="button" onclick="signOut()">Sign Out</button>
</div>

<div class="panel jgc-panel">
    <details id="contactsDirectoryDetails" class="jgc-archive">
        <summary>
            <span class="jgc-archive__title">Company Contacts</span>
            <span id="contactsLazyStatus" class="jgc-archive__count">Open to load</span>
        </summary>
        <div class="jgc-archive__body">
            <div id="contactsList" class="small">Contacts have not been loaded yet.</div>
        </div>
    </details>
</div>
</main>

<script src="vendor/supabase-js.min.js?v=1" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';"></script>
<script src="common.js?v=40"></script>
<script>
const supabaseClient = createJgcSupabaseClient();
const worker = requireJgcWorker();
const currentWorker = normalizeWorkerName(worker.key);
const currentWorkerDisplay = worker.display;
let contactsLoaded = false;
let contactsLoading = false;

document.getElementById("currentUser").textContent = "Signed in as: " + currentWorkerDisplay;

async function loadContacts() {
    const list = document.getElementById("contactsList");
    const lazyStatus = document.getElementById("contactsLazyStatus");

    if (contactsLoading || contactsLoaded) {
        return;
    }

    contactsLoading = true;
    if (lazyStatus) lazyStatus.textContent = "Loading...";

    if (!supabaseClient) {
        list.textContent = "Supabase is not available.";
        contactsLoading = false;
        if (lazyStatus) lazyStatus.textContent = "Unavailable";
        return;
    }

    const { data, error } = await supabaseClient
        .from("contacts")
        .select("*")
        .eq("is_active", true)
        .order("sort_order", { ascending: true })
        .order("name", { ascending: true });

    if (error) {
        list.textContent = "Contacts could not be loaded.";
        contactsLoading = false;
        if (lazyStatus) lazyStatus.textContent = "Retry";
        return;
    }

    const contacts = data || [];
    contactsLoaded = true;
    contactsLoading = false;
    if (lazyStatus) lazyStatus.textContent = `${contacts.length} contact${contacts.length === 1 ? "" : "s"}`;

    if (!contacts.length) {
        list.textContent = "No contacts have been added yet.";
        return;
    }

    list.innerHTML = `
        <div class="contacts-grid">
            ${contacts.map((contact) => `
                <article class="contact-card">
                    <h2>${escapeHtml(contact.name)}</h2>
                    ${contact.role ? '<div class="contact-role">' + escapeHtml(contact.role) + '</div>' : ""}
                    ${contact.phone ? '<div class="contact-line"><strong>Phone:</strong> <a href="tel:' + escapeHtml(contact.phone) + '">' + escapeHtml(contact.phone) + '</a></div>' : ""}
                    ${contact.email ? '<div class="contact-line"><strong>Email:</strong> <a href="mailto:' + escapeHtml(contact.email) + '">' + escapeHtml(contact.email) + '</a></div>' : ""}
                    ${contact.notes ? '<div class="contact-line small">' + escapeHtml(contact.notes) + '</div>' : ""}
                </article>
            `).join("")}
        </div>
    `;
}

async function signOut() {
    await signOutJgc(supabaseClient);
}

document.getElementById("contactsDirectoryDetails").addEventListener("toggle", function() {
    if (this.open) loadContacts();
});
</script>
</body>
</html>
