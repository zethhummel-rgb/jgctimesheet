<!DOCTYPE html>
<html>
<head>
  <title>John Gordon Construction</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css?v=1" />
  <style>
    body {
      font-family: Arial;
      background: #8f9691;
      padding: 20px;
      margin: 0;
      color: #1f2a24;
    }

    .logo-wrap {
      max-width: 347px;
      margin: 0 auto 8px;
      text-align: center;
    }

    .logo-wrap img {
      width: 100%;
      max-width: 347px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    h2 {
      max-width: 540px;
      margin: 0 auto 8px;
      text-align: center;
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    .user-bar {
      max-width: 540px;
      margin: 0 auto 12px;
      color: #ffffff;
      text-align: center;
      font-size: 13px;
      font-weight: bold;
      text-shadow: 0 1px 2px rgba(0,0,0,0.25);
    }

    .menu {
      max-width: 540px;
      margin: 0 auto;
      display: grid;
      gap: 12px;
    }

    .menu-button {
      width: 100%;
      padding: 16px;
      box-sizing: border-box;
      border: none;
      border-radius: 8px;
      background: #fbfcf9;
      color: #1f2a24;
      border-top: 4px solid #3f7d4d;
      box-shadow: 0 3px 10px rgba(0,0,0,0.18);
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      text-align: left;
    }

    .menu-button:hover {
      background: #f4f7f1;
    }

    .menu-button.disabled {
      color: #7a827c;
      border-top-color: #8b958d;
      cursor: default;
    }

    .sign-out {
      max-width: 540px;
      width: 100%;
      display: block;
      padding: 10px;
      margin: 14px auto 0;
      box-sizing: border-box;
      background: #5f6a62;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      font-weight: bold;
    }

    .sign-out:hover {
      background: #48514a;
    }

    @media (max-width: 720px) {
      body {
        padding: 10px;
      }

      .logo-wrap {
        max-width: 260px;
      }

      .menu-button {
        min-height: 56px;
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

<div class="logo-wrap">
  <img src="logo.png" alt="John Gordon Construction" />
</div>

<h2>John Gordon Construction</h2>
<div id="currentUser" class="user-bar"></div>

<div class="menu">
  <button type="button" class="menu-button" onclick="window.location.href='timesheet.html'">Time Sheets</button>
  <button type="button" class="menu-button" onclick="window.location.href='certificates.html'">Certificates</button>
  <button type="button" class="menu-button" onclick="window.location.href='inspections.html'">Inspections</button>
  <button id="adminButton" type="button" class="menu-button" onclick="window.location.href='admin.html'" hidden>Admin</button>
  <button id="accountsButton" type="button" class="menu-button" onclick="window.location.href='accounts.html'" hidden>Accounts</button>
</div>

<button type="button" class="sign-out" onclick="signOut()">Sign Out</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="common.js?v=1"></script>
<script>
const supabaseClient = createJgcSupabaseClient();
const worker = requireJgcWorker();
const currentWorker = worker.key;
const currentWorkerDisplay = worker.display;
const currentUserRole = worker.role;

document.getElementById("currentUser").innerText = "Signed in as: " + currentWorkerDisplay;

if (isAdminWorker(currentWorker, currentUserRole)) {
  document.getElementById("adminButton").hidden = false;
  document.getElementById("accountsButton").hidden = false;
}

function comingSoon(sectionName) {
  alert(sectionName + " will be added soon.");
}

async function signOut() {
  await signOutJgc(supabaseClient);
}
</script>

</body>
</html>
