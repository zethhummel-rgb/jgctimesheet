<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#0b5e3b">
<title>JGC Portal - My Write-Ups</title>
<link rel="stylesheet" href="jgc-design-system.css?v=9" data-jgc-design-system="9">
<link rel="stylesheet" href="safety-signature-pad.css?v=1">
<link rel="stylesheet" href="employee-writeups.css?v=4">
</head><body class="jgc-page jgc-system-page writeups-page">
<main class="jgc-page-shell writeups-shell">
  <header class="jgc-page-header">
    <div class="jgc-brand"><img src="logo.webp" alt="John Gordon Construction"></div>
    <h1 class="jgc-page-title">My Write-Ups</h1>
    <p class="jgc-page-user">Private · only you and JGC administrators can see these</p>
  </header>
  <p id="myWriteupsStatus" class="writeups-status" role="status" aria-live="polite">Loading…</p>
  <div id="myWriteupsList" class="writeups-list"></div>

  <section id="myWriteupDetail" class="jgc-panel writeups-panel" hidden aria-labelledby="myWriteupTitle">
    <div class="writeups-section-heading">
      <h2 id="myWriteupTitle" class="jgc-section-title" tabindex="-1">Write-up</h2>
      <button id="myWriteupBack" type="button" class="jgc-button jgc-button--secondary">Back to my write-ups</button>
    </div>
    <div id="myWriteupBody"></div>
    <section id="myWriteupAck" class="writeups-ack" hidden aria-labelledby="myWriteupAckTitle">
      <h3 id="myWriteupAckTitle">Acknowledge this write-up</h3>
      <p class="writeup-ack-statement"></p>
      <div class="jgc-field"><label class="jgc-label" for="myWriteupComment">Your comments <span class="writeups-optional">optional</span></label><textarea id="myWriteupComment" class="jgc-textarea" rows="4" maxlength="4000" placeholder="Add anything you would like on record."></textarea></div>
      <p id="myWriteupAckError" class="jgc-notice jgc-notice--danger" role="alert" hidden></p>
      <div class="jgc-actions"><button id="myWriteupSign" type="button" class="jgc-button">Sign to acknowledge</button></div>
    </section>
    <p id="myWriteupStatus" class="writeups-status" role="status" aria-live="polite"></p>
    <div class="jgc-actions"><button id="myWriteupDownload" type="button" class="jgc-button jgc-button--secondary">Download PDF</button></div>
  </section>
</main>
<script src="vendor/supabase-js.min.js?v=1"></script>
<script src="common.js?v=56"></script>
<script src="vendor/jspdf.umd.min.js?v=1"></script>
<script src="safety-signature-pad.js?v=1"></script>
<script src="employee-writeups-shared.js?v=2"></script>
<script src="employee-writeups.js?v=2"></script>
</body></html>
