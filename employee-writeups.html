<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><title>My Write-Ups — JGC</title>
<link rel="stylesheet" href="jgc-design-system.css?v=8" data-jgc-design-system="8">
<link rel="stylesheet" href="report-design-system.css?v=2">
<link rel="stylesheet" href="safety-signature-pad.css?v=1">
<link rel="stylesheet" href="employee-writeups.css?v=1">
</head><body class="report-family-page report-form-page jgc-page jgc-system-page writeups-page">
<main class="report-page-shell jgc-page-shell jgc-page-shell--wide">
<div class="logo-wrap jgc-brand"><img src="logo.webp" alt="John Gordon Construction"></div>
<section class="container jgc-panel">
<div class="writeups-heading"><div><p class="eyebrow">PRIVATE · ONLY YOU AND JGC ADMINISTRATORS CAN SEE THESE</p><h1>My Write-Ups</h1></div></div>
<p id="myWriteupsStatus" role="status" aria-live="polite">Loading…</p>
<div id="myWriteupsList" class="writeups-list"></div>
<section id="myWriteupDetail" class="writeup-detail" hidden aria-labelledby="myWriteupTitle">
  <div class="writeups-heading"><h2 id="myWriteupTitle" tabindex="-1">Write-up</h2><button id="myWriteupBack" type="button" class="writeup-btn writeup-btn--secondary">Back to my write-ups</button></div>
  <div id="myWriteupBody"></div>
  <section id="myWriteupAck" class="writeup-ack" hidden aria-labelledby="myWriteupAckTitle">
    <h3 id="myWriteupAckTitle">Acknowledge this write-up</h3>
    <p class="writeup-ack-statement"></p>
    <label for="myWriteupComment">Your comments (optional)</label>
    <textarea id="myWriteupComment" rows="4" maxlength="4000" placeholder="Add anything you would like on record."></textarea>
    <p id="myWriteupAckError" class="writeup-error" role="alert" hidden></p>
    <div class="actions jgc-actions"><button id="myWriteupSign" type="button" class="writeup-btn">Sign to acknowledge</button></div>
  </section>
  <p id="myWriteupStatus" role="status" aria-live="polite"></p>
  <div class="actions jgc-actions"><button id="myWriteupDownload" type="button" class="writeup-btn writeup-btn--secondary">Download PDF</button></div>
</section>
</section></main>
<script src="vendor/supabase-js.min.js?v=1"></script>
<script src="common.js?v=51"></script>
<script src="vendor/jspdf.umd.min.js?v=1"></script>
<script src="safety-signature-pad.js?v=1"></script>
<script src="employee-writeups-shared.js?v=1"></script>
<script src="employee-writeups.js?v=1"></script>
</body></html>
